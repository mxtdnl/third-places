<meta charset="utf-8">
<title>Third Place Lab</title>
<style>
:root {
  --bg: #1A1510;
  --bg-surface: #241C14;
  --bg-card: #2E241C;
  --bg-elevated: #382E24;
  --text: #F2DFBE;
  --text-muted: #A89878;
  --text-dim: #6A5A48;
  --border: #3A3228;

  --char-1: #5C3A96;
  --char-2: #B52838;
  --char-3: #C85218;
  --char-4: #D4A020;
  --char-5: #7A5828;
  --char-6: #B83068;
  --char-7: #CC6830;
  --char-8: #7E58A8;

  --present: #2A8A4A;
  --present-bg: rgba(42,138,74,0.15);
  --ambiguous: #D4A020;
  --ambiguous-bg: rgba(212,160,32,0.12);
  --absent: #C83838;
  --absent-bg: rgba(200,56,56,0.12);

  --domain-psych: #7E58A8;
  --domain-econ: #D4A020;
  --domain-polit: #B52838;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 20px;
  line-height: 1.5;
  overflow: hidden;
  height: 100vh;
}

#app {
  position: fixed;
  inset: 0 0 52px 0;
  overflow-y: auto;
  padding: 2rem;
  transition: opacity 0.15s ease;
}
#app.fade { opacity: 0; }

#toolbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2rem;
  background: rgba(26,21,16,0.92);
  border-top: 1px solid var(--border);
  z-index: 100;
  padding-inline: 1rem;
}

.tb-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font: 700 13px/1 inherit;
  padding: 7px 18px;
  cursor: pointer;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  transition: color 0.2s, border-color 0.2s;
}
.tb-btn:hover { color: var(--text-muted); border-color: var(--text-muted); }
.tb-btn:disabled { opacity: 0.25; pointer-events: none; }

#phase-indicator {
  color: var(--text-dim);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 600;
  min-width: 180px;
  text-align: center;
}

/* --- Shared --- */
.screen-wrap {
  max-width: 1100px;
  margin: 0 auto;
  position: relative;
}
.case-number {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 0.25rem;
}
.case-title {
  font-size: clamp(32px, 4vw, 52px);
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  line-height: 1.1;
  margin-bottom: 1.5rem;
}
.section-heading {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 1rem;
}
.question-text {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 1.25rem;
  line-height: 1.3;
}
.body-text {
  font-size: 22px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 1.5rem;
}
.prompt-text {
  font-size: 22px;
  font-style: italic;
  color: var(--text-muted);
  line-height: 1.5;
  margin-top: 1.5rem;
  padding-left: 1.25rem;
  border-left: 3px solid var(--border);
}

/* --- Vote buttons --- */
.vote-group {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}
.vote-btn {
  font: 700 20px/1 inherit;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 14px 32px;
  border: 2px solid var(--border);
  background: var(--bg-surface);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
}
.vote-btn:hover { border-color: var(--text-muted); color: var(--text); }
.vote-btn[data-val="yes"].selected { background: var(--present); border-color: var(--present); color: #fff; }
.vote-btn[data-val="no"].selected { background: var(--absent); border-color: var(--absent); color: #fff; }
.vote-btn[data-val="depends"].selected { background: var(--ambiguous); border-color: var(--ambiguous); color: #fff; }

.verdict-display {
  font-size: 16px;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 600;
  min-height: 24px;
  margin-bottom: 0.5rem;
}

/* --- SVG container --- */
.case-svg {
  margin: 0 auto 1.5rem;
  display: block;
  max-width: 600px;
  width: 100%;
}
.case-svg svg { width: 100%; height: auto; display: block; }

/* --- Investigate --- */
.inv-layout {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 2rem;
  align-items: start;
}
.inv-sidebar {
  position: sticky;
  top: 0;
}
.inv-sidebar .body-text { font-size: 18px; }
.inv-sidebar .case-svg { max-width: 100%; }

.char-panel { display: flex; flex-direction: column; gap: 4px; }

.char-row {
  border: 1px solid var(--border);
  background: var(--bg-surface);
  transition: background 0.2s, border-color 0.2s;
}
.char-row[data-status="present"]  { background: var(--present-bg);  border-color: rgba(42,138,74,0.35); }
.char-row[data-status="ambiguous"]{ background: var(--ambiguous-bg); border-color: rgba(212,160,32,0.3); }
.char-row[data-status="absent"]   { background: var(--absent-bg);   border-color: rgba(200,56,56,0.3); }

.char-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 10px 14px;
  cursor: pointer;
  user-select: none;
}
.char-dot {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}
.char-name {
  flex: 1;
  font-size: 20px;
  font-weight: 700;
  line-height: 1.25;
}
.char-expand-icon {
  font-size: 14px;
  color: var(--text-dim);
  transition: transform 0.2s;
  margin-right: 0.5rem;
}
.char-row.expanded .char-expand-icon { transform: rotate(90deg); }

.toggle-group {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}
.toggle-btn {
  width: 38px;
  height: 34px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-dim);
  font: 700 16px/1 inherit;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.toggle-btn:hover { border-color: var(--text-muted); color: var(--text); }
.toggle-btn[data-s="present"].active  { background: var(--present);  border-color: var(--present);  color: #fff; }
.toggle-btn[data-s="ambiguous"].active{ background: var(--ambiguous); border-color: var(--ambiguous); color: #fff; }
.toggle-btn[data-s="absent"].active   { background: var(--absent);   border-color: var(--absent);   color: #fff; }

.char-evidence {
  padding: 0 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.evidence-label {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.evidence-ta {
  width: 100%;
  min-height: 48px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font: inherit;
  font-size: 16px;
  padding: 8px 10px;
  resize: vertical;
  line-height: 1.4;
}
.evidence-ta:focus { outline: 1px solid var(--text-muted); border-color: var(--text-muted); }

/* --- Profile bar chart --- */
.bar-chart { margin-bottom: 2rem; }
.bar-row {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 8px;
}
.bar-label {
  width: 280px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  font-weight: 600;
  line-height: 1.2;
}
.bar-dot {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
}
.bar-track {
  flex: 1;
  height: 30px;
  background: var(--bg-surface);
  position: relative;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  width: 0;
  transition: width 0.6s ease;
}
.bar-status {
  width: 24px;
  flex-shrink: 0;
  text-align: center;
  font-size: 16px;
  color: var(--text-dim);
}
.profile-summary {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 1rem;
}
.profile-summary span { font-size: 28px; }

/* --- Case navigation --- */
.case-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1.5rem;
  margin-top: 1.5rem;
}
.case-card {
  background: var(--bg-surface);
  border: 2px solid var(--border);
  padding: 1.5rem;
  cursor: pointer;
  transition: all 0.2s;
}
.case-card:hover { border-color: var(--text-muted); transform: translateY(-2px); }
.case-card.current { border-color: var(--char-1); border-width: 3px; }
.case-card-num {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: var(--text-dim);
  margin-bottom: 0.25rem;
}
.case-card-name {
  font-size: 24px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 0.75rem;
}
.case-card-meta {
  font-size: 15px;
  color: var(--text-muted);
  display: flex;
  gap: 1.5rem;
}
.case-card-pips {
  display: flex;
  gap: 4px;
  margin-top: 0.75rem;
}
.pip {
  width: 14px;
  height: 14px;
  border: 1px solid var(--border);
  transition: background 0.2s;
}

/* --- Placeholders --- */
.placeholder-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - 120px);
  text-align: center;
  position: relative;
}
.placeholder-title {
  font-size: clamp(36px, 5vw, 64px);
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 1rem;
}
.placeholder-sub {
  font-size: 22px;
  color: var(--text-dim);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

/* --- Bauhaus geometric decorations --- */
.geo {
  position: absolute;
  pointer-events: none;
  z-index: 0;
}
.geo-circle {
  border-radius: 50%;
}

/* --- Stress Test (Part 3) --- */
.domain-section { margin-bottom: 1.5rem; }
.domain-heading {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 8px 14px;
  margin-bottom: 8px;
  border-left: 4px solid;
}
.condition-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 8px;
}
.condition-card {
  background: var(--bg-surface);
  border: 2px solid var(--border);
  padding: 12px 16px;
  cursor: pointer;
  font: 700 15px/1.3 inherit;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  transition: all 0.2s;
}
.condition-card:hover { border-color: var(--text-muted); color: var(--text); transform: translateY(-1px); }
.condition-card.selected { border-color: var(--text); color: var(--text); background: var(--bg-elevated); }
.condition-card.used { opacity: 0.3; pointer-events: none; text-decoration: line-through; }

.intervention-display {
  font-size: clamp(20px, 3vw, 28px);
  font-weight: 700;
  line-height: 1.4;
  margin: 1.5rem 0;
  padding: 1.25rem 1.5rem;
  border-left: 5px solid;
  background: var(--bg-surface);
}

.baseline-chart { margin-bottom: 2rem; }
.baseline-chart .bar-label { width: 220px; font-size: 16px; }
.baseline-chart .bar-track { height: 24px; }

.pred-panel { display: flex; flex-direction: column; gap: 6px; margin-bottom: 1.5rem; }
.pred-row {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 10px 14px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
}
.pred-label {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 17px;
  font-weight: 600;
  line-height: 1.2;
}
.pred-dot { width: 12px; height: 12px; flex-shrink: 0; }
.pred-toggles { display: flex; gap: 4px; flex-shrink: 0; }
.pred-btn {
  font: 700 12px/1 inherit;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 8px 12px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.15s;
}
.pred-btn:hover { border-color: var(--text-muted); color: var(--text); }
.pred-btn[data-p="stronger"].active { background: var(--present); border-color: var(--present); color: #fff; }
.pred-btn[data-p="unchanged"].active { background: #5A5040; border-color: #6A6050; color: #fff; }
.pred-btn[data-p="weaker"].active { background: var(--absent); border-color: var(--absent); color: #fff; }

.causal-chain {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  margin: 2rem auto;
  max-width: 700px;
}
.chain-step {
  background: var(--bg-card);
  border: 2px solid transparent;
  padding: 0;
  font: 700 17px/1.3 inherit;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  text-align: center;
  width: 100%;
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transform: translateY(10px);
  transition: max-height 0.4s ease, opacity 0.4s ease, transform 0.4s ease, padding 0.4s ease, border-color 0.4s ease;
}
.chain-step.visible { max-height: 200px; opacity: 1; transform: translateY(0); padding: 14px 24px; border-color: var(--border); }
.chain-arrow {
  font-size: 24px;
  color: var(--text-dim);
  line-height: 1;
  max-height: 0;
  padding: 0;
  opacity: 0;
  overflow: hidden;
  transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
}
.chain-arrow.visible { max-height: 40px; opacity: 1; padding: 4px 0; }

.chain-trigger-btn {
  font: 700 15px/1 inherit;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 14px 32px;
  border: 2px solid var(--text-muted);
  background: var(--bg-surface);
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s;
  margin: 1.5rem auto;
  display: block;
}
.chain-trigger-btn:hover { background: var(--bg-elevated); border-color: var(--text); }

.comparison-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  margin-top: 2rem;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.comparison-wrap.visible { opacity: 1; }
.comparison-col-heading {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 1rem;
}

.mini-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.mini-bar-label {
  width: 180px;
  flex-shrink: 0;
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  line-height: 1.2;
}
.mini-bar-dot { width: 10px; height: 10px; flex-shrink: 0; }
.mini-bar-track { flex: 1; height: 22px; background: var(--bg-surface); position: relative; overflow: hidden; }
.mini-bar-fill { height: 100%; transition: width 0.5s ease; }
.mini-bar-sym { width: 20px; flex-shrink: 0; text-align: center; font-size: 14px; color: var(--text-dim); }

.summary-grid {
  display: flex;
  gap: 1.25rem;
  overflow-x: auto;
  padding-bottom: 1rem;
}
.summary-card {
  flex: 0 0 260px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  padding: 1rem;
}
.summary-card.highlight { border-color: var(--text-muted); border-width: 2px; }
.summary-card-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 0.75rem;
  min-height: 36px;
}
.summary-mini-row {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 3px;
}
.summary-mini-dot { width: 8px; height: 8px; flex-shrink: 0; }
.summary-mini-label { font-size: 11px; font-weight: 600; width: 120px; flex-shrink: 0; line-height: 1.2; }
.summary-mini-track { flex: 1; height: 14px; background: var(--bg); overflow: hidden; }
.summary-mini-fill { height: 100%; transition: width 0.5s ease; }

.stress-action-bar {
  display: flex;
  gap: 1rem;
  margin-top: 1.5rem;
  flex-wrap: wrap;
}
.stress-action-btn {
  font: 700 14px/1 inherit;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 10px 24px;
  border: 2px solid var(--text-dim);
  background: none;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
}
.stress-action-btn:hover { border-color: var(--text-muted); color: var(--text); }

/* --- Part 4: Synthesis --- */
.vote-tally {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
}
.tally-btn {
  font: 700 20px/1 inherit;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 14px 28px;
  border: 2px solid var(--border);
  background: var(--bg-surface);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 10px;
}
.tally-btn:hover { border-color: var(--text-muted); color: var(--text); }
.tally-btn .tally-count {
  font-size: 24px;
  font-weight: 800;
  min-width: 28px;
  text-align: center;
}
.tally-btn[data-val="yes"]:hover { border-color: var(--present); }
.tally-btn[data-val="no"]:hover { border-color: var(--absent); }
.tally-btn[data-val="ambivalent"]:hover { border-color: var(--ambiguous); }

.tally-bar {
  display: flex;
  gap: 2px;
  height: 32px;
  margin-bottom: 0.5rem;
}
.tally-seg {
  height: 100%;
  transition: flex-grow 0.3s ease;
  min-width: 0;
}
.tally-labels {
  display: flex;
  gap: 1.5rem;
  font-size: 14px;
  color: var(--text-dim);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 0.5rem;
}
.tally-reset {
  font-size: 13px;
  color: var(--text-dim);
  background: none;
  border: none;
  cursor: pointer;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 600;
  padding: 4px 0;
}
.tally-reset:hover { color: var(--text-muted); }

.explain-panel {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-left: 4px solid;
  padding: 1.25rem;
  margin-bottom: 1rem;
}
.explain-domain {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 0.5rem;
}
.explain-prompt {
  font-size: 18px;
  font-style: italic;
  color: var(--text-muted);
  line-height: 1.5;
  margin-bottom: 0.75rem;
}
.explain-ta {
  width: 100%;
  min-height: 64px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font: inherit;
  font-size: 16px;
  padding: 10px 12px;
  resize: vertical;
  line-height: 1.4;
}
.explain-ta:focus { outline: 1px solid var(--text-muted); border-color: var(--text-muted); }
.explain-ta::placeholder { color: var(--text-dim); font-style: italic; }

.timer-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-dim);
  border: 1px solid var(--border);
  padding: 6px 14px;
  margin-bottom: 1.5rem;
}

.twist-box {
  background: var(--absent-bg);
  border: 2px solid var(--absent);
  padding: 1.5rem;
  margin-bottom: 2rem;
}
.twist-label {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--absent);
  margin-bottom: 0.5rem;
}
.twist-text {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.4;
}

.vote-comparison {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  margin-bottom: 2rem;
}
.vote-comp-col {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  padding: 1.25rem;
}
.vote-comp-heading {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 1rem;
}
.vote-comp-row {

function render() {

  var screenChanged = screenIndex !== lastRenderedScreen;
  lastRenderedScreen = screenIndex;
  var html = '';
  switch(s.type) {
    case 'reveal':              html = renderReveal(); break;
    case 'investigate':          html = renderInvestigate(); break;
    case 'profile':              html = renderProfile(screenChanged); break;
    case 'cases':                html = renderCases(); break;
    case 'stressIntro':          html = renderStressIntro(screenChanged); break;
    case 'stressPrediction':     html = renderStressPrediction(); break;
    case 'stressConsequences':   html = renderStressConsequences(); break;
    case 'stressSummary':        html = renderStressSummary(); break;
    case 'synthesisCase':         html = renderSynthesisCase(); break;
    case 'synthesisExplain':      html = renderSynthesisExplain(); break;
    case 'synthesisTwist':        html = renderSynthesisTwist(); break;
    case 'synthesisFinal':        html = renderSynthesisFinal(); break;
  }
  document.getElementById('app').innerHTML = html;
  if (screenChanged) document.getElementById('app').scrollTop = 0;
  updateToolbar();
  if (s.type === 'profile' && screenChanged) {
    requestAnimationFrame(function() { requestAnimationFrame(animateBars); });
  }
  if (s.type === 'stressIntro' && screenChanged) {
    requestAnimationFrame(function() { requestAnimationFrame(animateBaselineBars); });
  }
  if (s.type === 'stressSummary' && screenChanged) {
    requestAnimationFrame(function() { requestAnimationFrame(animateSummaryBars); });
  }
}

    var sym = p.status === 'present' ? '✓' : p.status === 'ambiguous' ? '?' : p.status === 'absent' ? '✗' : '—';
    var w = p.status === 'present' ? '100%' : p.status === 'ambiguous' ? '50%' : '0%';
    var barW = isFirstRender ? '0' : w;
    bars += '<div class="bar-row">'
      + '<div class="bar-label"><div class="bar-dot" style="background:' + ch.hex + '"></div>' + esc(ch.name) + '</div>'
      + '<div class="bar-track"><div class="bar-fill" data-baseline-bar="' + i + '" style="background:' + ch.hex + ';width:' + barW + '"></div></div>'
      + '<div class="bar-status">' + sym + '</div>'
      + '</div>';
  }

  var usedIds = {};
  for (var t = 0; t < caseTests.length; t++) { usedIds[caseTests[t].conditionId] = true; }

  var caseDomains = getCaseDomains(ci);
  var domains = '';
  for (var d = 0; d < caseDomains.length; d++) {
    var dom = caseDomains[d];
    var cards = '';
    for (var j = 0; j < dom.conditions.length; j++) {
      var cond = dom.conditions[j];
      var isUsed = usedIds[cond.id];
      var isSel = state.currentStressTest && state.currentStressTest.conditionId === cond.id;
      cards += '<div class="condition-card' + (isUsed ? ' used' : '') + (isSel ? ' selected' : '') + '" '
        + 'data-action="select-condition" data-cid="' + cond.id + '">'
        + esc(cond.name) + '</div>';
    }
    domains += '<div class="domain-section">'
      + '<div class="domain-heading" style="border-color:' + dom.color + ';color:' + dom.color + '">' + esc(dom.label) + '</div>'
      + '<div class="condition-grid">' + cards + '</div>'
      + '</div>';
  }

  var interventionHtml = '';
  if (state.currentStressTest) {
    var info = getCondition(state.currentStressTest.conditionId);
    interventionHtml = '<div class="intervention-display" style="border-color:' + info.domain.color + '">'
      + esc(state.currentStressTest.intervention)
      + '</div>';
  }

  var testCountLabel = caseTests.length > 0
    ? '<div style="font-size:15px;color:var(--text-dim);letter-spacing:0.1em;text-transform:uppercase;font-weight:600;margin-bottom:1rem">'
      + caseTests.length + ' stress test' + (caseTests.length > 1 ? 's' : '') + ' completed on this case</div>'
    : '';

  return '<div class="screen-wrap">'
    + geoDecor('#B52838', 350, -50, 'circle', 0.06)
    + '<div class="case-number">CASE ' + c.num + ' &mdash; ' + esc(c.name) + '</div>'
    + '<div class="case-title">Stress Test the Space</div>'
    + '<p class="body-text" style="color:var(--text-muted)">The ' + esc(c.name) + ' currently has these characteristics. Now change the conditions under which it operates.</p>'
    + testCountLabel
    + '<div class="baseline-chart bar-chart">' + bars + '</div>'
    + domains
    + interventionHtml
    + '</div>';
}

function renderStressConsequences() {

  var chainHtml = '<div class="causal-chain">';
  for (var i = 0; i < chain.length; i++) {
    var stepVis = state.chainRevealed >= (i + 1) ? ' visible' : '';
    chainHtml += '<div class="chain-step' + stepVis + '" style="border-color:' + info.domain.color + '">' + esc(chain[i]) + '</div>';
    if (i < chain.length - 1) {
      var arrowVis = state.chainRevealed >= (i + 2) ? ' visible' : '';
      chainHtml += '<div class="chain-arrow' + arrowVis + '">↓</div>';
    }
  }
  chainHtml += '</div>';

  var showBtn = state.chainRevealed < chain.length;
  var btnHtml = showBtn
    ? '<button class="chain-trigger-btn" data-action="reveal-chain">'
      + (state.chainRevealed === 0 ? 'SHOW CONSEQUENCES' : 'NEXT STEP →')

  var ci = state.activeCaseIndex;
  var caseTests = getCaseTests(ci);

function geoDecor(color, right, top, shape, opacity, w, h, rot) {

// ============================================================
// STRESS TEST HELPERS
// ============================================================

function getCaseDomains(caseIndex) {
  var caseId = CASES[caseIndex !== undefined ? caseIndex : state.activeCaseIndex].id;
  return STRESS_DOMAINS[caseId] || [];
}

function getCondition(id) {
  var domains = getCaseDomains(state.activeCaseIndex);
  for (var d = 0; d < domains.length; d++) {
    var dom = domains[d];
    for (var c = 0; c < dom.conditions.length; c++) {
      if (dom.conditions[c].id === id) {
        return { condition: dom.conditions[c], domain: dom };
      }
    }
  }
  return null;
}

function getCaseTests(caseIndex) {
  var caseId = CASES[caseIndex].id;
  var tests = [];
  for (var i = 0; i < state.stressTests.length; i++) {
    if (state.stressTests[i].caseId === caseId) tests.push(state.stressTests[i]);
  }
  return tests;
}

function statusToStrength(status) {
  if (status === 'present') return 2;
  if (status === 'ambiguous') return 1;
  return 0;
}

function strengthToStatus(strength) {
  if (strength >= 2) return 'present';
  if (strength === 1) return 'ambiguous';
  return 'absent';
}

function getEffectiveProfile(caseIndex, upToTestIndex) {
  var sc = state.cases[caseIndex];
  var profile = [];
  for (var i = 0; i < 8; i++) {
    var s = sc.characteristics[i].status;
    var strength = s ? statusToStrength(s) : 1;
    profile.push({ id: CHARS[i].id, name: CHARS[i].name, hex: CHARS[i].hex, strength: strength, status: s || 'ambiguous' });
  }

  if (upToTestIndex === -1) return profile;

  var tests = getCaseTests(caseIndex);
  var end = typeof upToTestIndex === 'number' ? upToTestIndex + 1 : tests.length;
  for (var t = 0; t < end && t < tests.length; t++) {
    for (var i = 0; i < 8; i++) {
      var pred = tests[t].predictions[CHARS[i].id];
      if (pred === 'stronger' && profile[i].strength < 2) profile[i].strength++;
      else if (pred === 'weaker' && profile[i].strength > 0) profile[i].strength--;
      profile[i].status = strengthToStatus(profile[i].strength);
    }
  }
  return profile;
}

function applyPredictions(profile, predictions) {
  var result = [];
  for (var i = 0; i < profile.length; i++) {
    var p = { id: profile[i].id, name: profile[i].name, hex: profile[i].hex, strength: profile[i].strength, status: profile[i].status };
    var pred = predictions[p.id];
    if (pred === 'stronger' && p.strength < 2) p.strength++;
    else if (pred === 'weaker' && p.strength > 0) p.strength--;
    p.status = strengthToStatus(p.strength);
    result.push(p);
  }
  return result;
}

function renderMiniChart(profile, prefix) {
  var html = '';
  for (var i = 0; i < profile.length; i++) {
    var p = profile[i];
    var sym = p.status === 'present' ? '✓' : p.status === 'ambiguous' ? '?' : '✗';
    var w = p.status === 'present' ? '100%' : p.status === 'ambiguous' ? '50%' : '0%';
    html += '<div class="mini-bar-row">'
      + '<div class="mini-bar-label"><div class="mini-bar-dot" style="background:' + p.hex + '"></div>' + esc(p.name) + '</div>'
      + '<div class="mini-bar-track"><div class="mini-bar-fill" data-mini-bar="' + prefix + '-' + i + '" data-target-w="' + w + '" style="background:' + p.hex + ';width:0"></div></div>'
      + '<div class="mini-bar-sym">' + sym + '</div>'
      + '</div>';
  }
  return html;
}

function renderSummaryMiniChart(profile, prefix) {
  var html = '';
  for (var i = 0; i < profile.length; i++) {
    var p = profile[i];
    var w = p.status === 'present' ? '100%' : p.status === 'ambiguous' ? '50%' : '0%';
    html += '<div class="summary-mini-row">'
      + '<div class="summary-mini-dot" style="background:' + p.hex + '"></div>'
      + '<div class="summary-mini-label">' + esc(p.name) + '</div>'
      + '<div class="summary-mini-track"><div class="summary-mini-fill" data-sum-bar="' + prefix + '-' + i + '" data-target-w="' + w + '" style="background:' + p.hex + ';width:0"></div></div>'
      + '</div>';
  }
  return html;
}

function finalizeStressTest() {
  if (!state.currentStressTest) return;
  var hasPreds = false;
  var preds = state.currentStressTest.predictions;
  for (var k in preds) {
    if (preds.hasOwnProperty(k) && preds[k]) { hasPreds = true; break; }
  }
  if (!hasPreds) return;

  state.stressTests.push({
    intervention: state.currentStressTest.intervention,
    conditionName: state.currentStressTest.conditionName,
    domain: state.currentStressTest.domain,
    conditionId: state.currentStressTest.conditionId,
    predictions: state.currentStressTest.predictions,
    caseId: CASES[state.activeCaseIndex].id
  });
  state.currentStressTest = null;
  state.chainRevealed = 0;
}

function findScreenByType(type) {
  for (var i = 0; i < SCREENS.length; i++) {
    if (SCREENS[i].type === type) return i;
  }
  return -1;
}

// ============================================================
// NAVIGATION
// ============================================================
function navigate(dir) {
  var next = screenIndex + dir;
  if (next < 0 || next >= SCREENS.length) return;

  var current = SCREENS[screenIndex];
  if (current.type === 'stressConsequences' && dir === 1 && state.currentStressTest) {
    finalizeStressTest();
  }

  expandedChar = -1;
  var app = document.getElementById('app');
  app.classList.add('fade');
  setTimeout(function() {
    screenIndex = next;
    render();
    app.classList.remove('fade');
  }, 150);
}

function updateToolbar() {
  var s = SCREENS[screenIndex];
  var txt = s.label;
  if (s.of > 1) txt += ' — Screen ' + s.num + ' of ' + s.of;
  document.getElementById('phase-indicator').textContent = txt;
  document.getElementById('btn-prev').disabled = screenIndex === 0;
  var nextDisabled = screenIndex === SCREENS.length - 1;
  if (s.type === 'stressIntro' && !state.currentStressTest) nextDisabled = true;
  document.getElementById('btn-next').disabled = nextDisabled;
}

// ============================================================
// EVENT HANDLING
// ============================================================
document.getElementById('app').addEventListener('click', function(e) {
  // Toggle status — check first to prevent expand triggering
  var stBtn = e.target.closest('[data-action="set-status"]');
  if (stBtn) {
    e.stopPropagation();
    var ci = parseInt(stBtn.dataset.ci);
    var s = stBtn.dataset.s;
    var sc = state.cases[state.activeCaseIndex];
    sc.characteristics[ci].status = sc.characteristics[ci].status === s ? null : s;
    updateCharRow(ci);
    return;
  }

  // Expand/collapse characteristic
  var expBtn = e.target.closest('[data-action="expand"]');
  if (expBtn) {
    var ci = parseInt(expBtn.dataset.ci);
    expandedChar = expandedChar === ci ? -1 : ci;
    render();
    return;
  }

  // Vote
  var vBtn = e.target.closest('[data-action="vote"]');
  if (vBtn) {
    var kind = vBtn.dataset.kind;
    var val = vBtn.dataset.val;
    var sc = state.cases[state.activeCaseIndex];
    if (kind === 'initial') {
      sc.initialVerdict = sc.initialVerdict === val ? null : val;
    } else {
      sc.finalVerdict = sc.finalVerdict === val ? null : val;
    }
    render();
    return;
  }

  // Case selection
  var caseCard = e.target.closest('[data-action="select-case"]');
  if (caseCard) {
    var idx = parseInt(caseCard.dataset.case);
    state.activeCaseIndex = idx;
    state.currentStressTest = null;
    state.chainRevealed = 0;
    expandedChar = -1;
    var app = document.getElementById('app');
    app.classList.add('fade');
    setTimeout(function() {
      screenIndex = 0;
      render();
      app.classList.remove('fade');
    }, 150);
    return;
  }

  // Stress test: select condition
  var condCard = e.target.closest('[data-action="select-condition"]');
  if (condCard) {
    var cid = condCard.dataset.cid;
    var info = getCondition(cid);
    if (!info) return;
    state.currentStressTest = {
      conditionId: cid,
      conditionName: info.condition.name,
      domain: info.domain.id,
      intervention: info.condition.intervention,
      predictions: {}
    };
    state.chainRevealed = 0;
    render();
    return;
  }

  // Stress test: set prediction
  var predBtnEl = e.target.closest('[data-action="set-prediction"]');
  if (predBtnEl && state.currentStressTest) {
    var ci = parseInt(predBtnEl.dataset.ci);
    var p = predBtnEl.dataset.p;
    var charId = CHARS[ci].id;
    if (state.currentStressTest.predictions[charId] === p) {
      state.currentStressTest.predictions[charId] = null;
    } else {
      state.currentStressTest.predictions[charId] = p;
    }
    // Update just the toggles without full re-render
    var row = predBtnEl.closest('.pred-row');
    if (row) {
      var btns = row.querySelectorAll('.pred-btn');
      for (var b = 0; b < btns.length; b++) {
        if (btns[b].dataset.p === state.currentStressTest.predictions[charId]) {
          btns[b].classList.add('active');
        } else {
          btns[b].classList.remove('active');
        }
      }
    }
    return;
  }

  // Stress test: reveal chain step
  var chainBtn = e.target.closest('[data-action="reveal-chain"]');
  if (chainBtn && state.currentStressTest) {
    var info = getCondition(state.currentStressTest.conditionId);
    var chain = info.condition.chain;
    state.chainRevealed++;

    var steps = document.querySelectorAll('.chain-step');
    var arrows = document.querySelectorAll('.chain-arrow');
    var idx = state.chainRevealed - 1;
    if (steps[idx]) steps[idx].classList.add('visible');
    if (idx > 0 && arrows[idx - 1]) arrows[idx - 1].classList.add('visible');

    if (state.chainRevealed >= chain.length) {
      chainBtn.style.display = 'none';
      var comp = document.querySelector('.comparison-wrap');
      if (comp) setTimeout(function() { comp.classList.add('visible'); }, 300);
      setTimeout(animateMiniBars, 500);
      // Show action bar
      var actions = document.querySelector('.stress-action-bar');
      if (actions) actions.style.display = '';
    } else {
      chainBtn.textContent = 'NEXT STEP →';
    }
    return;
  }

  // Stress test: run another
  var anotherBtn = e.target.closest('[data-action="run-another"]');
  if (anotherBtn) {
    finalizeStressTest();
    var idx = findScreenByType('stressIntro');
    var app = document.getElementById('app');
    app.classList.add('fade');
    setTimeout(function() {
      screenIndex = idx;
      render();
      app.classList.remove('fade');
    }, 150);
    return;
  }

  // Synthesis: tally vote
  var tallyBtnEl = e.target.closest('[data-action="tally"]');
  if (tallyBtnEl) {
    var kind = tallyBtnEl.dataset.kind;
    var val = tallyBtnEl.dataset.val;
    state.synthesis[kind][val]++;
    render();
    return;
  }

  // Synthesis: reset tally
  var resetBtn = e.target.closest('[data-action="reset-tally"]');
  if (resetBtn) {
    var kind = resetBtn.dataset.kind;
    state.synthesis[kind] = { yes: 0, no: 0, ambivalent: 0 };
    render();
    return;
  }
});

document.getElementById('app').addEventListener('input', function(e) {
  if (e.target.dataset.ev) {
    var ci = parseInt(e.target.dataset.ci);
    var sc = state.cases[state.activeCaseIndex];
    if (e.target.dataset.ev === 'for') {
      sc.characteristics[ci].evidenceFor = e.target.value;
    } else {
      sc.characteristics[ci].evidenceAgainst = e.target.value;
    }
  }
  if (e.target.dataset.explain) {
    state.synthesis.explanations[e.target.dataset.explain] = e.target.value;
  }
});

function updateCharRow(idx) {
  var row = document.querySelector('.char-row[data-ci="' + idx + '"]');
  if (!row) return;
  var sc = state.cases[state.activeCaseIndex];
  var s = sc.characteristics[idx].status || '';
  row.dataset.status = s;
  var btns = row.querySelectorAll('[data-action="set-status"]');
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].dataset.s === s) btns[i].classList.add('active');
    else btns[i].classList.remove('active');
  }
}

// Keyboard navigation
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); navigate(1); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); navigate(-1); }
});

// ============================================================
// INIT
// ============================================================
render();
</script>
