    };
  }

  /* ---- the debrief centrepiece: four panels, you against the textbook - */
  function panelChart(rows) {
    return function (cv) {
      var p = prep(cv), g = p.g;
      var metrics = [
        { key: 'price', label: 'price paid', dp: 2 },
        { key: 'q', label: 'pizzas sold', dp: 0 },
        { key: 'profit', label: 'profit', dp: 0 },
        { key: 'dwl', label: 'deadweight loss', dp: 0 }
      ];
      var cols = p.w < 620 ? 1 : 2;
      var rowsN = Math.ceil(4 / cols);
      var pw = p.w / cols, ph = p.h / rowsN;
      metrics.forEach(function (m, idx) {
        var ox = (idx % cols) * pw, oy = Math.floor(idx / cols) * ph;
        var maxPos = 0, maxNeg = 0;
        rows.forEach(function (r) {
          [r.you[m.key], r.text[m.key]].forEach(function (v) {
            if (v > maxPos) maxPos = v;
            if (-v > maxNeg) maxNeg = -v;
          });
        });
        maxPos = maxPos * 1.2 || 1; maxNeg = maxNeg * 1.2;
        var top = 36, bottom = ph - 44;
        var scale = (bottom - top) / (maxPos + maxNeg);
        var zero = top + maxPos * scale;
        g.save(); g.translate(ox, oy);
        g.fillStyle = ink();
        g.font = '700 13px Futura, "Century Gothic", Avenir, sans-serif';
        g.textAlign = 'left'; g.textBaseline = 'top';
        g.fillText(m.label + ', month ' + ROUNDS, 12, 6);
        g.font = '11px Futura, "Century Gothic", Avenir, sans-serif';
        g.textAlign = 'right';
        g.fillText('solid = you, outline = textbook', pw - 12, 8);
        var left = 16, slot = (pw - 28) / 4;
        g.lineWidth = 3; g.strokeStyle = ink();
        g.beginPath(); g.moveTo(left - 4, zero); g.lineTo(pw - 12, zero); g.stroke();
        rows.forEach(function (r, i) {
          var x = left + i * slot, bw = slot * 0.3;
          function bar(v, fillStyle, dx) {
            var hgt = Math.abs(v) * scale;
            var y = v >= 0 ? zero - hgt : zero;
            g.fillStyle = fillStyle;
            g.fillRect(x + dx, y, bw, hgt);
            g.strokeRect(x + dx, y, bw, hgt);
            return v >= 0 ? y : y + hgt;
          }
          var edge = bar(r.you[m.key], r.colour, 2);
          bar(r.text[m.key], paper(), 6 + bw);
          g.fillStyle = ink(); g.textAlign = 'center';
          g.font = '11px Futura, "Century Gothic", Avenir, sans-serif';
          if (r.you[m.key] >= 0) { g.textBaseline = 'bottom'; g.fillText(num(r.you[m.key], m.dp), x + 2 + bw / 2, edge - 3); }
          else { g.textBaseline = 'top'; g.fillText(num(r.you[m.key], m.dp), x + 2 + bw / 2, edge + 3); }
          g.textBaseline = 'top';
          g.fillText(r.short, x + 2 + bw, bottom + 8);
        });
        g.restore();
      });
    };
  }

  function mountChart(node, drawFn, height) {
    var cv = document.createElement('canvas');
    cv.setAttribute('data-chart', '1');
    cv.style.height = (height || 300) + 'px';
    cv.__draw = drawFn;
    node.appendChild(cv);
    queueChart(cv, drawFn);
    return cv;
  }

  /* ====================================================================
     Feedback. Pattern triggered, written from the player's own numbers.
     ==================================================================== */
  function fill(tpl, map) {
    return tpl.replace(/\{(\w+)\}/g, function (_, k) { return map[k] !== undefined ? map[k] : ''; });
  }

  function feedbackFor(e, prev) {
    var F = C.feedback[e.w], o = e.outcome, out = [];
    if (e.w === 'quadrato') {
      var qStar = e.optDecision.q;
      if (o.ask > o.price + 1e-9) {
        out.push(fill(F.askAbove, { ask: money(o.ask, 2), price: money(o.price, 2), cost: money(o.cost) }));
      } else if (o.ask < o.price - 0.005) {
        out.push(fill(F.askBelow, { ask: money(o.ask, 2), price: money(o.price, 2), left: money((o.price - o.ask) * o.sold) }));
      }
      if (Math.abs(o.q - qStar) <= 4) out.push(F.onTarget);
      else out.push(fill(o.q < qStar ? F.qLow : F.qHigh, { q: Math.round(o.q), qStar: qStar }));
      if (o.profit > 60 && o.entrants > 0) out.push(fill(F.profitEarly, { profit: money(o.profit), entrants: o.entrants }));
      else if (o.price < 14.6) out.push(fill(F.profitGone, { price: money(o.price, 2) }));
    } else if (e.w === 'cerchio') {
      var optS = e.optDecision.S;
      if (o.S > optS + 40) out.push(fill(F.brandHigh, { S: money(o.S) }));
      else if (o.S === 0) out.push(F.brandZero);
      if (o.q > 5 && o.P < o.mc + 2) out.push(fill(F.pricedLikePC, { price: money(o.P, 2), mc: money(o.mc, 2) }));
      if (prev && o.profit < prev.profit) out.push(fill(F.squeeze, { profit: money(o.profit) }));
      if (o.q > 5 && o.q < 100) out.push(fill(F.tangency, { q: Math.round(o.q), gap: Math.round(100 - o.q) }));
      if (o.q > 5 && o.P > o.mc + 2) out.push(fill(F.stillAbove, { price: money(o.P, 2), mc: money(o.mc, 2) }));
      if (o.q <= 5) out.push('you priced at ' + money(o.P, 2) + ' and sold almost nothing. demand here slopes down: ' +
        'the ' + C.model.cerchio.b + ' pizzas a month you lose for every pound you add to the price are the whole constraint.');
    } else if (e.w === 'triangolo') {
      var n = o.notes, T = C.model.triangolo;
      var has = function (x) { return n.indexOf(x) >= 0; };
      // the kink sits at the quantity the prevailing price sells, not at the
      // quantity the player happened to sell this month
      var qKink = Math.max(0, e.rs.alpha - T.beta * o.P0);
      var mrUpV = (e.rs.alpha + T.gamma * o.P0 - 2 * qKink) / (T.beta + T.gamma);
      var mrDownV = (e.rs.alpha - 2 * qKink) / T.beta;
      var mcKink = QM.mc(qKink, o.c);
      var quietProfit = o.P0 * qKink - QM.tc(qKink, o.c);
      if (has('cartel-joined') || o.cartelLive) {
        if (o.cheated) out.push(fill(F.cartelCheated, { price: money(o.p, 2), profit: money(o.profit), war: money(T.warPrice, 2), warRounds: T.warRounds }));
        else if (has('cartel-held')) out.push(fill(F.cartelHeld, { cartel: money(T.cartelPrice, 2), profit: money(o.profit), legal: money(e.opt) }));
        if (has('reported')) out.push(fill(F.cartelReported, { war: money(T.warPrice, 2) }));
        if (has('rival-leniency')) out.push(fill(F.cartelBustRival, { rival: o.bustBy, fine: money(o.fine) }));
        if (has('authority')) out.push(fill(F.cartelBustAuthority, { fine: money(o.fine) }));
      }
      if (o.mode === 'war') {
        out.push(fill(F.warRound, {
          war: money(T.warPrice, 2), best: money(e.optDecision.p, 2),
          bestProfit: money(e.opt), legal: money(quietProfit)
        }));
      }
      if (has('led-followed')) out.push(fill(F.leadFollowed, { lead: money(T.leadPrice, 2), gap: money(Math.max(0, e.opt - o.profit)) }));
      if (has('led-ignored')) out.push(F.leadIgnored);
      if (has('matched')) out.push(fill(F.cutMatched, { price: money(o.p, 2) }));
      if (has('held')) out.push(fill(F.raiseAlone, { price: money(o.p, 2), p0: money(o.P0, 2) }));
      if (has('steady')) {
        out.push(fill(F.heldKink, {
          p0: money(o.P0, 2), mrUp: money(mrUpV, 2), mrDown: money(mrDownV, 2), mc: money(mcKink, 2)
        }));
      }
      if (e.r === C.model.triangolo.cShockRound && o.mode !== 'war' && o.mode !== 'cartel') {
        out.push(fill(F.costShock, { mc: money(mcKink, 2), p0: money(o.P0, 2) }));
      }
    } else {
      var e8 = o.elasticity;
      if (Math.abs(e8) < 1) out.push(fill(F.inelastic, { price: money(o.P, 2), e: num(e8, 2) }));
      else if (Math.abs(o.P - o.competitiveP) < 2) out.push(fill(F.nearMC, { price: money(o.P, 2), pc: money(o.competitiveP, 2), gap: money(Math.max(0, e.opt - o.profit)) }));
      else if (Math.abs(o.P - e.optDecision.P) < 0.6) out.push(fill(F.atOptimum, { e: num(e8, 2) }));
      if (e.r === C.model.uno.expiryRound) {
        if (Math.abs(o.P - 32.31) < 2) out.push(fill(F.expirySlow, { oldP: money(32.31, 2), newP: money(e.optDecision.P, 2), gap: money(Math.max(0, e.opt - o.profit)) }));
        else out.push(fill(F.expiry, { newP: money(e.optDecision.P, 2), oldP: money(32.31, 2) }));
      }
      if (o.dwl > 1) out.push(fill(F.dwl, { dwl: money(o.dwl) }));
    }
    return out.filter(function (x) { return !!x; });
  }

  /* ---- the persistent comparison strip ------------------------------- */
  function stripHTML() {
    var cells = WORLDS.map(function (w) {
      var rs = rstate(w), lastE = null;
      for (var i = App.log.length - 1; i >= 0; i--) if (App.log[i].w === w) { lastE = App.log[i]; break; }
      var badge = '-', rivals = '-';
      if (lastE) {
        var o = lastE.outcome, price = QM.priceOf(lastE);
        badge = Math.abs(price - o.mc) < 0.5 ? 'P = MC' : 'P > MC';
        if (price < o.mc - 0.5) badge = 'P < MC';
      }
      if (w === 'quadrato') rivals = rs.N + ' kitchens';
      if (w === 'cerchio') rivals = Math.max(0, Math.round((C.model.cerchio.a0 - rs.a) / 4)) + ' copycats';
      if (w === 'triangolo') rivals = '2 rivals';
      if (w === 'uno') rivals = rs.patent ? 'no rival' : '1 generic';
      var tot = App.totals[w] || 0;
      return '<div class="strip-cell">' +
        '<div class="bar fill-' + COLOUR[w] + '"></div>' +
        '<div class="nm">' + LABEL[w].replace('mondo ', '') + '</div>' +
        '<div class="v' + (tot < 0 ? ' neg' : '') + '">' + money(tot) + '</div>' +
        '<div class="b">' + badge + ' &middot; ' + rivals + '</div>' +
      '</div>';
    }).join('');
    return '<div class="strip" aria-label="cumulative position in each universe">' + cells + '</div>';
  }

  function readoutHTML(w, rs, d) {

    var ex = '';
    if (w === 'uno') {
      var e = pr.e, mag = Math.abs(e);
      var band = mag > 1 ? 'elastic' : (mag === 1 ? 'unit elastic' : 'inelastic');
      var pos = QM.clamp(mag / 3, 0, 1) * 100;
      ex = '<div style="margin-top:12px"><div class="lab">elasticity of demand at this price: ' +
        (isFinite(e) ? num(e, 2) : 'no buyers') + ' (' + band + ')</div>' +
        '<div style="position:relative;height:22px;border:3px solid var(--ink);margin-top:6px">' +
          '<div style="position:absolute;left:0;top:0;bottom:0;width:33.3%;background:' + RED + '"></div>' +
          '<div style="position:absolute;left:33.3%;top:0;bottom:0;right:0;background:' + BLUE + '"></div>' +
          '<div style="position:absolute;left:' + num(pos, 1) + '%;top:-5px;bottom:-5px;width:6px;background:var(--ink);transform:translateX(-3px)"></div>' +
        '</div>' +
        '<div class="small muted" style="display:flex;justify-content:space-between"><span>inelastic</span><span>|e| = 1</span><span>elastic</span></div></div>';
    }
    if (w === 'triangolo') rows.push(['rivals will post', money(pr.rival, 2)]);
    return '<div class="readout"><div class="lab">if you commit this decision</div>' +
      '<div class="big-num' + (pr.profit < 0 ? ' neg' : '') + '">' + money(pr.profit) + ' profit</div>' +
      '<div class="small" style="margin-top:8px">' + rows.map(function (r) { return r[0] + ' ' + r[1]; }).join(' &middot; ') + '</div>' +
      ex + '</div>';
  }

  function renderRound() {
    var w = App.view, rs = rstate(w), d = decisionFor(w);
    main.innerHTML =
      '<div class="band fill-concrete" style="margin-top:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">' +
        '<b>month ' + App.round + ' of ' + ROUNDS + '</b>' +
        '<span class="small">lens charges left: ' + App.charges + ' &middot; committed: ' +
        WORLDS.filter(function (x) { return App.committed[x]; }).length + ' of 4</span>' +
      '</div>' +
      stripHTML() + tabsHTML() +
      '<div class="panel" id="panel" role="tabpanel" aria-labelledby="tab-' + w + '">' +
        '<div class="grid2">' +
          '<div>' + scene(w, rs) +
            '<div class="news" style="margin-top:14px">' + esc(newsLine(w, rs)) + '</div>' +
            '<div class="lastline">' + esc(lastLine(w)) + '</div>' +
          '</div>' +
          '<div>' +
            '<h3>' + LABEL[w] + ' &middot; ' + C.worlds[w].structure + '</h3>' +
            '<p class="small">' + esc(C.worlds[w].lever) + '</p>' +
            '<div id="controls">' + controlsHTML(w, rs, d) + '</div>' +
            '<div id="readout">' + readoutHTML(w, rs, d) + '</div>' +
            '<div class="row" style="margin-top:14px">' +
              (App.committed[w]
                ? '<button data-action="uncommit">change this decision</button><span class="tag fill-blue">committed</span>'
                : '<button class="primary" data-action="commit">commit this decision</button>') +
              (lensOn(w) ? '<span class="tag">lens spent</span>'
                : '<button data-action="lens"' + (App.charges > 0 ? '' : ' disabled') + '>economist\u2019s lens (' + App.charges + ' left)</button>') +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div id="chart-slot">' + (lensOn(w) ? '<div class="chart-wrap" id="chart-wrap"></div>' : '') + '</div>' +
      '</div>' +
      '<div class="row" style="margin-top:18px;justify-content:space-between">' +
        '<button class="primary" data-action="advance"' + (allCommitted() ? '' : ' disabled') + '>' +
          (allCommitted() ? 'advance the month' : 'commit all four to advance') + '</button>' +
        '<button class="ghost" data-action="reset">reset the game</button>' +
      '</div>';
    if (lensOn(w)) mountChart($('chart-wrap'), curveChart(w, rs, d), 360);
    wireControls(w, rs);
  }

  function refreshLive() {
    var w = App.view, rs = rstate(w), d = App.dec[w];
    $('readout').innerHTML = readoutHTML(w, rs, d);
    if (lensOn(w)) {
      var wrap = $('chart-wrap');
      if (wrap) { wrap.innerHTML = ''; mountChart(wrap, curveChart(w, rs, d), 360); }
    }
    save();
  }

  function bindPair(rangeId, numId, set) {
    var r = $(rangeId), n = $(numId);
    function handler(src) {
      return function () {
        var v = parseFloat(src.value);
        if (isNaN(v)) return;
        set(v);
        if (r && src !== r) r.value = v;
        if (n && src !== n) n.value = v;
        refreshLive();
      };
    }
    if (r) r.addEventListener('input', handler(r));
    if (n) { n.addEventListener('input', handler(n)); n.addEventListener('change', handler(n)); }
  }

  function wireControls(w, rs) {
    if (App.committed[w]) return;
    var d = App.dec[w];
    if (w === 'quadrato') {
      bindPair('q-qty', 'q-qty-n', function (v) { d.q = QM.clamp(Math.round(v), 0, C.model.quadrato.qMax); });
      bindPair(null, 'q-ask', function (v) { d.ask = QM.clamp(v, 0, 60); });
    } else if (w === 'cerchio') {
      bindPair('c-price', 'c-price-n', function (v) { d.P = QM.clamp(v, 0, 45); });
      bindPair('c-brand', 'c-brand-n', function (v) { d.S = QM.clamp(Math.round(v / C.model.cerchio.brandStep) * C.model.cerchio.brandStep, 0, C.model.cerchio.brandMax); });
    } else if (w === 'triangolo') {
      bindPair('t-price', 't-price-n', function (v) { d.p = QM.clamp(v, 0, 60); });
    } else {
      bindPair('u-price', 'u-price-n', function (v) { d.P = QM.clamp(v, 0, 60); });
    }
    void rs;
  }

  /* ---- advancing the month ------------------------------------------- */
  function advance() {
    WORLDS.forEach(function (w) {
      var rs = rstate(w), d = App.dec[w];
      var opt = QM.worlds[w].optimum(rs);
      var res = QM.worlds[w].step(rs, d, SC);
      var regret = opt.profit - res.outcome.profit;
      App.log.push({
        r: App.round, w: w, d: d, profit: res.outcome.profit, opt: opt.profit,
        optDecision: opt.decision, score: QM.scoreRound(w, regret), outcome: res.outcome, rs: rs
      });
      App.totals[w] = (App.totals[w] || 0) + res.outcome.profit;
      App.states[w] = res.nextState;
    });
    App.lastRound = App.round;
    App.round += 1;
    App.dec = {}; App.committed = {};
    App.screen = 'month';
    save(); render();
  }

  function entryFor(w, round) {
    for (var i = 0; i < App.log.length; i++) if (App.log[i].w === w && App.log[i].r === round) return App.log[i];
    return null;
  }

  function prevEntry(w, round) { return entryFor(w, round - 1); }

  function renderMonth() {
    var r = App.lastRound || (App.round - 1);
    var cards = WORLDS.map(function (w, i) {
      var e = entryFor(w, r), o = e.outcome;
      var lines = feedbackFor(e, prevEntry(w, r) ? prevEntry(w, r).outcome : null);
      var extra = '';
      if (w === 'quadrato' && o.entrants !== 0) {
        extra = o.entrants > 0 ? o.entrants + ' more kitchens open next month.' : Math.abs(o.entrants) + ' kitchens close next month.';
      }
      if (w === 'uno' && r === C.model.uno.expiryRound - 1) extra = 'news: the patent expires at the start of next month. a generic oven goes on sale.';
      if (w === 'triangolo' && o.fine > 0) extra = 'the fine is ' + money(o.fine) + ', which is ' + (C.model.triangolo.fineRate * 100) + '% of everything this universe has taken so far.';
      return '<div class="reveal' + (reduceMotion ? '' : ' anim') + '" style="animation-delay:' + (i * 0.12) + 's">' +
        '<div class="head"><h3><span class="tag fill-' + COLOUR[w] + '">' + LABEL[w].replace('mondo ', '') + '</span> ' +
        '<span class="big-num' + (e.profit < 0 ? ' neg' : '') + '">' + money(e.profit) + '</span></h3>' +
        '<span class="small">decision score ' + num(e.score, 0) + ' / 100</span></div>' +
        '<p class="small" style="margin:10px 0 0">' + esc(lines[0] || '') + '</p>' +
        (extra ? '<p class="small" style="margin:8px 0 0"><b>' + esc(extra) + '</b></p>' : '') +
      '</div>';
    }).join('');
    var done = App.round > ROUNDS;
    main.innerHTML =
      '<div class="band fill-ink" style="margin-top:14px"><h2 style="color:var(--paper)">month ' + r + ' closes</h2></div>' +
      stripHTML() + cards +
      '<div class="row" style="margin-top:18px">' +
        '<button class="primary" data-action="' + (done ? 'todiagnosis' : 'next') + '">' +
        (done ? 'the diagnosis' : 'open month ' + App.round) + '</button></div>';
  }

  /* ---- the diagnosis -------------------------------------------------- */
  function playerGame() {
    var mean = {}, overall = 0;
    WORLDS.forEach(function (w) {
      var xs = App.log.filter(function (e) { return e.w === w; });
      mean[w] = xs.reduce(function (a, e) { return a + e.score; }, 0) / Math.max(1, xs.length);
      overall += mean[w];
    });
    return { seed: App.seed, log: App.log, mean: mean, decision: overall / WORLDS.length, totals: App.totals };
  }

  function diagItems() {
    if (!App.__items) App.__items = QM.diagnosis(playerGame());
    return App.__items;
  }

  function renderDiagnosis() {
    var items = diagItems();
    var qs = items.map(function (it, i) {
      return '<div class="q"><h4>' + (i + 1) + ' of ' + items.length + '</h4>' +
        '<p style="margin:6px 0 0">' + esc(it.question) + '</p>' +
        '<div class="opts" role="radiogroup" aria-label="question ' + (i + 1) + '">' +
        it.options.map(function (op, j) {
          var cls = '';
          if (App.diagDone) cls = j === it.correct ? ' right' : (App.diag[i] === j ? ' wrong' : '');
          return '<label class="opt' + cls + '"><input type="radio" name="dq' + i + '" value="' + j + '"' +
            (App.diag[i] === j ? ' checked' : '') + (App.diagDone ? ' disabled' : '') + '>' +
            '<span>' + esc(op) + '</span></label>';
        }).join('') + '</div>' +
        (App.diagDone ? '<div class="explain">' + esc(it.explain) + '</div>' : '') +
      '</div>';
    }).join('');
    var graded = QM.gradeDiagnosis(items, App.diag);
    main.innerHTML =
      '<div class="band fill-blue" style="margin-top:14px;color:#fff"><h2 style="color:#fff">the diagnosis</h2>' +
      '<p class="small" style="color:#fff;margin:6px 0 0">eight questions, written from your own eight months. this is a quarter of your final score.</p></div>' +
      '<div style="margin-top:16px">' + qs + '</div>' +
      (App.diagDone
        ? '<div class="band fill-concrete"><b>' + graded.correct + ' of ' + graded.total + ' correct.</b></div>' +
          '<div class="row" style="margin-top:14px"><button class="primary" data-action="toresults">see the results</button></div>'
        : '<div class="row" style="margin-top:14px"><button class="primary" data-action="submitdiag">submit all eight</button></div>');
    Array.prototype.slice.call(document.querySelectorAll('input[type=radio]')).forEach(function (el) {
      el.addEventListener('change', function () {
        var i = parseInt(el.name.slice(2), 10);
        App.diag[i] = parseInt(el.value, 10);
        save();
      });
    });
  }

  /* ---- results and debrief ------------------------------------------- */
  function dwlOf(e) {
    var o = e.outcome, w = e.w, T = C.model.triangolo, d = C.model.cost.d;
    if (w === 'uno') return o.dwl;
    if (w === 'quadrato') {
      var qc = 10 * (o.price - C.model.cost.c);
      return 0.5 * Math.abs(o.price - o.mc) * Math.abs(qc - o.q);
    }
    if (w === 'cerchio') {
      var A = e.rs.aEff + C.model.cerchio.beta * Math.sqrt(o.S), b = C.model.cerchio.b;
      var qcc = (A / b - C.model.cost.c) / (1 / b + 2 * d);
      return 0.5 * Math.abs((A - o.q) / b - o.mc) * Math.abs(qcc - o.q);
    }
    var slope = o.mode === 'matched' ? T.beta : T.beta + T.gamma;
    var inter = o.mode === 'matched' ? e.rs.alpha : e.rs.alpha + T.gamma * o.rivalPrice;
    var qct = (inter / slope - o.c) / (1 / slope + 2 * d);
    return 0.5 * Math.abs(o.p - o.mc) * Math.abs(qct - o.q);
  }

  function rowFor(e) { return { price: QM.priceOf(e), q: e.outcome.q, profit: e.profit, dwl: dwlOf(e) }; }

  function ghosts() {
    if (App.__ghosts) return App.__ghosts;
    App.__ghosts = {
      textbook: QM.runGame(App.seed, QM.bots.textbook(App.seed)),
      shark: QM.runGame(App.seed, QM.bots.shark(App.seed)),
      passive: QM.runGame(App.seed, QM.bots.passive(App.seed)),
      coinflip: QM.runGame(App.seed, QM.bots.coinflip(App.seed))
    };
    return App.__ghosts;
  }

  function payload() {
    return {
      v: 1, seed: App.seed,
      dec: App.log.map(function (e) { return { r: e.r, w: e.w, d: e.d }; }),
      diag: App.diag, lens: App.charges
    };
  }

  function results() {
    var g = playerGame(), items = diagItems();
    var dg = QM.gradeDiagnosis(items, App.diag);
    var comp = QM.composite(g.decision, dg.pct, App.charges);
    return { g: g, dg: dg, comp: comp, grade: QM.grade(comp), code: QM.verificationCode(payload(), comp) };
  }

  function synthesis(g) {
    var last = {}, prices = [];
    WORLDS.forEach(function (w) { last[w] = entryFor(w, ROUNDS); prices.push({ w: w, p: QM.priceOf(last[w]) }); });
    prices.sort(function (a, b) { return a.p - b.p; });
    // a price to marginal cost gap only means market power where pizzas were sold
    var gaps = WORLDS.filter(function (w) { return last[w].outcome.q > 0; })
      .map(function (w) { return { w: w, g: QM.priceOf(last[w]) - last[w].outcome.mc }; });
    gaps.sort(function (a, b) { return b.g - a.g; });
    var total = WORLDS.reduce(function (a, w) { return a + (App.totals[w] || 0); }, 0);
    var worst = WORLDS.slice().sort(function (a, b) { return g.mean[a] - g.mean[b]; })[0];
    return [
      'same oven, same staff, same cost curve. in month ' + ROUNDS + ' your price ran from ' + money(prices[0].p, 2) +
      ' in ' + LABEL[prices[0].w] + ' to ' + money(prices[3].p, 2) + ' in ' + LABEL[prices[3].w] + ', driven entirely by market structure.',
      (gaps.length > 1
        ? 'among the universes where you sold anything, your widest gap between price and marginal cost was ' +
          money(gaps[0].g, 2) + ' in ' + LABEL[gaps[0].w] + ', and your narrowest was ' +
          money(gaps[gaps.length - 1].g, 2) + ' in ' + LABEL[gaps[gaps.length - 1].w] +
          '. that gap is market power, measured in pounds.'
        : 'you sold almost nothing in month ' + ROUNDS + ', so there is no price to marginal cost gap left to read.'),
      'across eight months the four universes returned ' + money(total) + ' between them, and your weakest reading of a market was ' +
      LABEL[worst] + ', at ' + num(g.mean[worst], 0) + ' points out of 100.'
    ];
  }

  function insights(w) {
    var out = [], seen = {};
    for (var r = ROUNDS; r >= 1 && out.length < 3; r--) {
      var e = entryFor(w, r);
      if (!e) continue;
      var lines = feedbackFor(e, prevEntry(w, r) ? prevEntry(w, r).outcome : null);
      for (var i = 0; i < lines.length && out.length < 3; i++) {
        // two months of the same feedback line differ only in their numbers
        var key = lines[i].replace(/[\d.,\u00A3-]+/g, '#').slice(0, 60);
        if (seen[key]) continue;
        seen[key] = 1; out.push(lines[i]);
      }
    }
    return out;
  }

  function renderResults() {
    var R = results(), gh = ghosts();
    var ladder = [
      { n: 'textbook', v: gh.textbook.decision, note: 'the per round optimum, cartel declined' },
      { n: 'shark', v: gh.shark.decision, note: 'joins the cartel and cheats; its luck moves with the seed' },
      { n: 'passive', v: gh.passive.decision, note: 'takes every default' },
      { n: 'coin-flip', v: gh.coinflip.decision, note: 'uniform random play' },
      { n: (App.name ? App.name : 'you'), v: R.g.decision, you: true, note: 'your decision score' }
    ].sort(function (a, b) { return b.v - a.v; });

    var rows = WORLDS.map(function (w) {
      return { world: w, short: LABEL[w].replace('mondo ', ''), colour: w === 'quadrato' ? RED : (w === 'cerchio' ? YELLOW : (w === 'triangolo' ? BLUE : ink())),
        you: rowFor(entryFor(w, ROUNDS)),
        text: rowFor(gh.textbook.log.filter(function (e) { return e.w === w && e.r === ROUNDS; })[0]) };
    });

    var dataLines = App.log.map(function (e) { return QM.dataLine(App.seed, e); }).join('\n');
    if (window.console && console.log) console.log(dataLines);

    main.innerHTML =
      '<div class="band fill-ink" style="margin-top:14px;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap">' +
        '<h2 style="color:var(--paper)">' + esc(R.grade) + '</h2>' +
        '<span class="big-num" style="color:var(--paper)">' + num(R.comp, 1) + ' / 106</span></div>' +
      '<div class="grid4" style="margin-top:14px">' +
        WORLDS.map(function (w) {
          return '<div class="strip-cell"><div class="bar fill-' + COLOUR[w] + '"></div>' +
            '<div class="nm">' + LABEL[w].replace('mondo ', '') + '</div>' +
            '<div class="v">' + num(R.g.mean[w], 0) + '</div>' +
            '<div class="b">' + money(App.totals[w] || 0) + ' banked</div></div>';
        }).join('') +
      '</div>' +
      '<div class="block" style="margin-top:14px"><b>how it adds up.</b> ' +
        'decisions ' + num(R.g.decision, 1) + ' out of 100, worth three quarters. ' +
        'diagnosis ' + R.dg.correct + ' of ' + R.dg.total + ', worth a quarter. ' +
        'lens charges unspent: ' + App.charges + ', worth a point each. ' +
        'total ' + num(R.comp, 1) + ' out of 106.' +
        (App.best && App.best.score ? ' your best on this seed before today was ' + num(App.best.score, 1) + '.' : '') + '</div>' +

      '<h3 style="margin-top:22px">the ghost leaderboard</h3>' +
      '<p class="small muted">four bots played your seed. the ladder compares decision scores only; the diagnosis and the lens bonus are yours alone.</p>' +
      '<div class="ladder">' + ladder.map(function (x, i) {
        return '<div class="rung' + (x.you ? ' you' : '') + '"><b>' + (i + 1) + '</b><span>' + esc(x.n) + ' <span class="small muted">' + esc(x.note) + '</span></span>' +
          '<b class="mono-ish">' + num(x.v, 1) + '</b></div>';
      }).join('') + '</div>' +

      '<h3 style="margin-top:22px">month ' + ROUNDS + ', four universes, one oven</h3>' +
      '<div class="chart-wrap" id="panels"></div>' +
      '<div class="block" style="margin-top:14px">' + synthesis(R.g).map(function (s) { return '<p>' + esc(s) + '</p>'; }).join('') + '</div>' +

      '<h3 style="margin-top:22px">what each universe taught you</h3>' +
      WORLDS.map(function (w) {
        return '<div class="block" style="margin-top:12px;border-left:14px solid ' +
          (w === 'quadrato' ? RED : w === 'cerchio' ? YELLOW : w === 'triangolo' ? BLUE : 'var(--ink)') + '">' +
          '<h4>' + LABEL[w] + ' &middot; ' + C.worlds[w].structure + '</h4>' +
          '<ul class="small" style="margin:8px 0 0;padding-left:18px">' +
          insights(w).map(function (l) { return '<li style="margin-bottom:6px">' + esc(l) + '</li>'; }).join('') + '</ul></div>';
      }).join('') +

      '<h3 style="margin-top:22px">five things to hold on to</h3>' +
      '<ol class="small">' + C.notes.map(function (n) { return '<li style="margin-bottom:8px">' + esc(n) + '</li>'; }).join('') + '</ol>' +

      '<h3 style="margin-top:22px">verification</h3>' +
      '<p class="small">your tutor can re-run this game from the code and the log below and get the same score.</p>' +
      '<div class="verify mono-ish">' + esc(R.code) + '</div>' +
      '<div class="row no-print" style="margin-top:12px">' +
        '<button data-action="copycode">copy the code and link</button>' +
        '<button data-action="copytext">copy as text</button>' +
        '<button data-action="export">export json</button>' +
        '<button data-action="import">import json</button>' +
        '<button data-action="print">print</button>' +
      '</div>' +
      '<details class="data" style="margin-top:16px"><summary>machine readable log</summary>' +
        '<pre class="data-lines">' + esc(dataLines) + '</pre></details>' +
      '<div class="row no-print" style="margin-top:18px">' +
        '<button class="primary" data-action="newseed">play a new seed</button>' +
        '<button class="danger" data-action="reset">reset this seed</button>' +
      '</div>' +
      '<input type="file" id="import-file" accept="application/json,.json" style="display:none">';

    mountChart($('panels'), panelChart(rows), 460);

    var best = null;
    try { best = JSON.parse(get(bestKey())); } catch (e) { best = null; }
    if (!best || R.comp > best.score) put(bestKey(), JSON.stringify({ score: R.comp, code: R.code, when: Date.now() }));

    $('import-file').addEventListener('change', importFile);
  }

  /* ====================================================================
     Copying, exporting, importing, printing
     ==================================================================== */
  function copyText(text, msg) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) { /* nothing else to try */ }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(fallback);
    } else { fallback(); }
    flash(msg || 'copied');
  }

  function flash(msg) {
    var n = document.createElement('div');
    n.textContent = msg;
    n.setAttribute('role', 'status');
    n.style.cssText = 'position:fixed;left:16px;bottom:16px;z-index:99;padding:10px 16px;border:4px solid var(--ink);' +
      'background:var(--paper);color:var(--ink);font-weight:700';
    document.body.appendChild(n);
    setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 2200);
  }

  function verifyLink() {
    var b64 = btoa(JSON.stringify(payload()));
    var base = location.href.split('?')[0].split('#')[0];
    var R = results();
    return R.code + '\n' + base + '?verify=' + encodeURIComponent(R.code) + '&log=' + encodeURIComponent(b64);
  }

  function textReport() {
    var R = results(), lines = [];
    lines.push('QUATTRO MONDI - results');
    lines.push('player: ' + (App.name || 'unnamed') + '   seed: ' + App.seed);
    lines.push('grade: ' + R.grade + '   composite: ' + num(R.comp, 1) + ' / 106');
    lines.push('decisions ' + num(R.g.decision, 1) + '/100, diagnosis ' + R.dg.correct + '/' + R.dg.total + ', lens charges unspent ' + App.charges);
    lines.push('');
    WORLDS.forEach(function (w) {
      lines.push(LABEL[w] + ' (' + C.worlds[w].structure + '): score ' + num(R.g.mean[w], 0) +
        ', banked ' + money(App.totals[w] || 0));
      insights(w).forEach(function (s) { lines.push('  - ' + s); });
      lines.push('');
    });
    lines.push('synthesis');
    synthesis(R.g).forEach(function (s) { lines.push('  ' + s); });
    lines.push('');
    lines.push('verification: ' + R.code);
    lines.push('');
    lines.push(App.log.map(function (e) { return QM.dataLine(App.seed, e); }).join('\n'));
    return lines.join('\n');
  }

  function exportJSON() {
    var blob = {
      tool: 'quattro-mondi', version: 1, exported: new Date().toISOString(),
      name: App.name, seed: App.seed, round: App.round, charges: App.charges,
      states: App.states, log: App.log, totals: App.totals, diag: App.diag,
      diagDone: App.diagDone, screen: App.screen, payload: payload()
    };
    var text = JSON.stringify(blob, null, 2);
    try {
      var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      var a = document.createElement('a');
      a.href = url; a.download = 'quattro-mondi-' + App.seed + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      flash('exported');
    } catch (e) {
      copyText(text, 'download blocked, so the json is on your clipboard');
    }
  }

  function importFile(ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = JSON.parse(rd.result);
        if (d.tool !== 'quattro-mondi') throw new Error('not a quattro mondi file');
        if (d.seed !== App.seed && !window.confirm('that file was played on seed ' + d.seed +
          '. load it and switch to that seed?')) return;
        if (d.seed !== App.seed) { location.search = '?seed=' + d.seed + '&import=1'; return; }
        ['name', 'round', 'charges', 'states', 'log', 'totals', 'diag', 'diagDone', 'screen'].forEach(function (k) {
          if (d[k] !== undefined) App[k] = d[k];
        });
        App.__items = null; App.dec = {}; App.committed = {};
        save(); render(); flash('imported');
      } catch (e) { window.alert('could not read that file: ' + e.message); }
    };
    rd.readAsText(f);
  }

  /* ====================================================================
     Actions
     ==================================================================== */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest ? ev.target.closest('[data-action]') : null;
    if (!t) return;
    var a = t.getAttribute('data-action'), w = App.view;
    if (a === 'tab') { App.view = t.getAttribute('data-world'); save(); renderRound(); return; }
    if (a === 'start' || a === 'continue') {
      var nm = $('player-name');
      if (nm) App.name = nm.value.slice(0, 40);
      App.screen = 'round'; save(); render(); return;
    }
    if (a === 'restart') { if (window.confirm('start this seed again from month 1? your current game will be lost.')) resetGame(true); return; }
    if (a === 'reset') { if (window.confirm('reset the game and clear the saved progress for seed ' + App.seed + '?')) resetGame(true); return; }
    if (a === 'newseed') { location.search = '?seed=' + (1000 + Math.floor(Math.random() * 9000)); return; }
    if (a === 'commit') { App.committed[w] = true; save(); renderRound(); return; }
    if (a === 'uncommit') { App.committed[w] = false; save(); renderRound(); return; }
    if (a === 'match') { App.dec[w].ask = rstate(w).price; save(); renderRound(); return; }
    if (a === 'lens') {
      if (App.charges <= 0 || lensOn(w)) return;
      App.charges -= 1; App.lens[lensKey(w)] = true; save(); renderRound(); return;
    }
    if (a === 'cartel') {
      var v = t.getAttribute('data-val'), T = C.model.triangolo, d = App.dec[w];
      if (v === 'decline') { d.cartel = 'decline'; d.p = rstate(w).P0; }
      if (v === 'accept') { d.cartel = 'accept'; d.p = T.cartelPrice; }
      if (v === 'cheat') { d.cartel = 'accept'; d.p = 30.90; }
      save(); renderRound(); return;
    }
    if (a === 'report') { App.dec[w].report = !App.dec[w].report; save(); renderRound(); return; }
    if (a === 'advance') { if (allCommitted()) advance(); return; }
    if (a === 'next') { App.screen = 'round'; App.view = 'quadrato'; save(); render(); return; }
    if (a === 'todiagnosis') { App.screen = 'diagnosis'; save(); render(); return; }
    if (a === 'submitdiag') {
      var items = diagItems();
      for (var i = 0; i < items.length; i++) {
        if (App.diag[i] === undefined || App.diag[i] === null) { window.alert('answer all eight first. question ' + (i + 1) + ' is still open.'); return; }
      }
      App.diagDone = true; save(); render(); return;
    }
    if (a === 'toresults') { App.screen = 'results'; save(); render(); return; }
    if (a === 'copycode') { copyText(verifyLink(), 'verification code and link copied'); return; }
    if (a === 'copytext') { copyText(textReport(), 'results copied as text'); return; }
    if (a === 'export') { exportJSON(); return; }
    if (a === 'import') { $('import-file').click(); return; }
    if (a === 'print') { window.print(); return; }
  });

  $('theme-toggle').addEventListener('click', function () {
    theme = theme === 'dark' ? 'light' : 'dark';
    put('qm.theme', theme);
    applyTheme(theme);
  });

  window.addEventListener('resize', function () {
    clearTimeout(window.__qmr);
    window.__qmr = setTimeout(redrawCharts, 180);
  });

  /* ====================================================================
     Routes: the game, the in browser test suite, and verification
     ==================================================================== */
  function renderTests() {
    main.innerHTML = '<h2 style="margin-top:18px">running the suite</h2><p>one moment.</p>';
    setTimeout(function () {
      var r = QM.selfTest({ evSeeds: 250, baseSeeds: 40 });
      main.innerHTML = '<div class="band ' + (r.failed ? 'fill-red' : 'fill-blue') + '" style="margin-top:14px;color:#fff">' +
        '<h2 style="color:#fff">' + r.passed + ' passed, ' + r.failed + ' failed</h2></div>' +
        '<div class="block" style="margin-top:14px">' + r.results.map(function (x) {
          return '<div style="padding:6px 0;border-bottom:2px solid var(--concrete)">' +
            '<b>' + (x.ok ? 'pass' : 'FAIL') + '</b> ' + esc(x.name) +
            (x.detail ? ' <span class="small muted">[' + esc(x.detail) + ']</span>' : '') + '</div>';
        }).join('') + '</div>';
      if (window.console) console.log(r.passed + ' passed, ' + r.failed + ' failed');
    }, 30);
  }

  function renderVerify(code, b64) {
    var out;
    try {
      var p = JSON.parse(atob(decodeURIComponent(b64)));
      var r = QM.replay(p);
      var match = r.code === decodeURIComponent(code);
      out = '<div class="band ' + (match ? 'fill-blue' : 'fill-red') + '" style="margin-top:14px;color:#fff">' +
        '<h2 style="color:#fff">' + (match ? 'the code checks out' : 'the code does not match') + '</h2></div>' +
        '<div class="block" style="margin-top:14px"><p>seed ' + p.seed + '</p>' +
        '<p>recomputed composite: <b>' + num(r.composite, 1) + ' / 106</b> (' + esc(r.grade) + ')</p>' +
        '<p>decision score ' + num(r.decision, 1) + ', diagnosis ' + r.diagnosis.correct + '/' + r.diagnosis.total +
        ', lens charges unspent ' + (p.lens || 0) + '</p>' +
        '<p>recomputed code: <b class="mono-ish">' + esc(r.code) + '</b><br>submitted code: <b class="mono-ish">' + esc(decodeURIComponent(code)) + '</b></p></div>' +
        '<details class="data" style="margin-top:14px"><summary>replayed log</summary><pre class="data-lines">' +
        esc(r.game.log.map(function (e) { return QM.dataLine(p.seed, e); }).join('\n')) + '</pre></details>';
    } catch (e) {
      out = '<div class="band fill-red" style="margin-top:14px;color:#fff"><h2 style="color:#fff">could not read that log</h2></div>' +
        '<div class="block" style="margin-top:14px">' + esc(e.message) + '</div>';
    }
    main.innerHTML = out;
  }

  /* ---- boot ----------------------------------------------------------- */
  function boot() {
    applyTheme(theme);
    var seedParam = parseInt(params.get('seed'), 10);
    App.seed = (isFinite(seedParam) && seedParam > 0) ? (seedParam >>> 0) : (1000 + Math.floor(Math.random() * 9000));
    $('seed-label').textContent = String(App.seed);
    SC = QM.makeScenario(App.seed);
    WORLDS.forEach(function (w) { App.states[w] = QM.worlds[w].init(); App.totals[w] = 0; });

    $('footer-tools').innerHTML = ' &middot; <a href="?test=1">run the tests</a> &middot; seed ' + App.seed;

    if (params.get('test') === '1') { renderTests(); return; }
    if (params.get('verify') && params.get('log')) { renderVerify(params.get('verify'), params.get('log')); return; }

    loadSave();
    if (App.screen === 'round' && App.round > ROUNDS) App.screen = 'diagnosis';
    var best = null;
    try { best = JSON.parse(get(bestKey())); } catch (e) { best = null; }
    App.best = best;
    render();
    // the ghosts play in the background so the results screen is instant
    setTimeout(function () { try { ghosts(); } catch (e) { /* ignore */ } }, 400);
  }

  boot();
})();
</script>
</body>
</html>
