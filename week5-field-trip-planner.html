        h += '<button type="button" id="route-' + i + '" class="route-btn" data-action="assign-route" data-route="' + i + '" aria-pressed="' + (mine === i) + '"' + (disabled ? ' disabled' : '') + '>' +
          '<span class="rb-title">Route ' + (i + 1) + ': ' + esc(routeLabel(i)) + '</span>' +
          '<span class="rb-sub">' + esc(routeTimesLine(i)) + '</span>' +
          (r.note ? '<span class="rb-sub">' + phText(r.note) + '</span>' : '') +
          (tm.warning ? '<span class="rb-warn">' + esc(t.shortWarn) + ': ' + esc(tm.warning) + '</span>' : '') +
          (disabled ? '<span class="rb-warn">' + esc(t.conflictPrefix) + ' ' + conflicts.join(', ') + '</span>' : '') + '</button>';
      });
      h += '</div>';
      if (mine != null) h += '<div class="btn-row" style="margin-top:0.75rem"><button type="button" class="btn btn-ghost btn-small" data-action="clear-route">' + esc(t.clearRoute) + '</button></div>';
      h += '</section>';
    }

    h += '<section class="panel" style="--accent:var(--char-4)"><h2>' + esc(t.tableTitle) + '</h2>' + allocationTable() + '</section>';

    var ph = listPlaceholders();
    h += '<section class="panel" style="--accent:var(--ambiguous)"><h3>' + esc(t.placeholderTitle) + ' (' + ph.length + ')</h3>';
    h += ph.length ? '<ul class="small" style="padding-left:1.2rem">' + ph.map(function (p) { return '<li>' + esc(p.text) + '</li>'; }).join('') + '</ul>' : '<p>None.</p>';
    h += '</section>';
    return h;
  }

  function allocationTable() {
    var st = S.instructor;
    var rows = '';
    for (var g = 1; g <= st.groupCount; g++) {
      var ri = st.alloc[g];
      if (ri == null) { rows += '<tr><td>Group ' + g + '</td><td colspan="5" class="quiet">' + esc(CONFIG.text.instructor.notAllocated) + '</td></tr>'; continue; }
      var tm = routeTimes(CONFIG.routes[ri]);
      rows += '<tr><td>Group ' + g + '</td><td>' + esc(routeLabel(ri)) + '</td><td><span class="joincode small">' + esc(encodeJoinCode(g, ri)) + '</span></td>' +
        '<td>' + tm.sites.map(function (s) { return s.minutes + ' min'; }).join(' + ') + '</td>' +
        '<td>' + (tm.moves.length ? movesText(tm) + ' / ' : '') + minToTime(tm.leaveBy) + '</td>' +
        '<td>' + (tm.warning ? '<span class="alert">' + esc(tm.warning) + '</span>' : '—') + '</td></tr>';
    }
    return '<div class="table-wrap"><table><thead><tr><th scope="col">Group</th><th scope="col">Route</th><th scope="col">Join code</th><th scope="col">Time on site</th><th scope="col">Move by / leave by</th><th scope="col">Warnings</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function renderBrief() {
    var s = CONFIG.session;
    var h = '<section class="banner" style="--accent:var(--char-2)"><span class="eyebrow">Briefing crib · ' + esc(s.base) + '</span><h2>Talk-through</h2>' +
      '<p>' + esc(s.briefing) + ' briefing · ' + esc(s.start) + ' leave · back by ' + esc(s.returnBy) + ' · spoken debrief until ' + esc(s.debriefEnd) + '. Each group follows one route; no site is visited by more than one group.</p></section>';

    h += '<section class="panel" style="--accent:var(--char-2)"><h2>1. Ethics</h2><ol class="ethics-list">' +
      CONFIG.ethics.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ol>' +
      '<p class="small" style="margin-top:0.75rem">Perimeter-only sites: ' + esc(firstRestriction()) + '</p></section>';

    h += '<section class="panel" style="--accent:var(--char-4)"><h2>2. Roles</h2><p>Each observer covers different characteristics, on their own phone, at every site on the route. Roles come from group size and letter; no syncing is needed.</p>' + roleTable() + '</section>';

    h += '<section class="panel" style="--accent:var(--char-1)"><h2>3. The eight characteristics</h2><div class="crib-grid">';
    CONFIG.characteristics.forEach(function (c) {
      h += '<div class="crib-char" style="' + charStyle(c.id) + '"><h3>' + c.num + '. ' + esc(c.name) + '</h3><p class="small">' + esc(c.def) + '</p><ul class="lookfor">' +
        c.lookFor.map(function (x) { return '<li class="small">' + esc(x) + '</li>'; }).join('') + '</ul></div>';
    });
    h += '</div></section>';

    h += '<section class="panel" style="--accent:var(--char-3)"><h2>4. Produces or blocks</h2><p>For every characteristic, observers note what about the place produces it or blocks it:</p><div class="chips">' +
      CONFIG.factors.map(function (f) { return '<span class="chip-btn" style="cursor:default">' + esc(f.label) + '</span>'; }).join('') +
      '</div><p style="margin-top:0.75rem">Explanation, not description: the differences between the sites on a route are what groups will explain.</p></section>';

    h += '<section class="panel" style="--accent:var(--char-7)"><h2>5. ' + esc(CONFIG.text.observer.spotTitle) + '</h2><p>' + esc(CONFIG.text.observer.spotHelp) + '</p><p class="small">Observers log each place on the Spotted tab, with what could be seen as they passed:</p><div class="chips">' +
      CONFIG.spotStatuses.map(function (k) { return '<span class="chip-btn" style="cursor:default">' + esc(k.label) + '</span>'; }).join('') + '</div></section>';

    h += '<section class="panel" style="--accent:var(--char-6)"><h2>6. Routes and timings</h2>';
    CONFIG.routes.forEach(function (r, i) {
      var tm = routeTimes(r);
      h += '<div class="disc-item" style="--accent:var(--char-' + ((i % 8) + 1) + ')"><h3>Route ' + (i + 1) + ': ' + esc(routeLabel(i)) + '</h3>' +
        '<p class="small">Walk out ' + r.walkOut + ' min' + (r.sites.length > 1 ? ' · between ' + betweenWalks(r).join(' + ') + ' min' : '') + ' · back ' + r.walkBack + ' min' + (r.note ? ' · ' + phText(r.note) : '') + '</p>' +
        '<p class="small">' + esc(routeTimesLine(i)) + (tm.moves.length ? ' · move by ' + movesText(tm) : '') + ' · leave by ' + minToTime(tm.leaveBy) + '</p>' +
        (tm.warning ? '<p class="alert small">' + esc(tm.warning) + '</p>' : '');
      r.sites.forEach(function (id) {
        var site = SITE[id];
        if (!site) return;
        h += '<p class="small"><strong>' + esc(site.name) + '</strong> · ' + esc(site.type) + '<br>' + phText(site.address) +
          (site.perimeterOnly ? '<br><span class="alert">' + esc(site.restrictionNote) + '</span>' : '') +
          (site.venueNote ? '<br>' + phText(site.venueNote) : '') + '<br>' + phText(site.facilitatorNote) + '</p>';
      });
      h += '</div>';
    });
    h += '</section>';
    return h;
  }
  function firstRestriction() {
    for (var i = 0; i < CONFIG.sites.length; i++) if (CONFIG.sites[i].perimeterOnly) return CONFIG.sites[i].restrictionNote;
    return '';
  }
  function roleTable() {
    var h = '<div class="table-wrap"><table><thead><tr><th scope="col">Letter</th><th scope="col">Role</th><th scope="col">Characteristics</th><th scope="col">Group sizes</th></tr></thead><tbody>';
    CONFIG.roles.forEach(function (r) {
      var sizes = CONFIG.groupSizes.filter(function (n) { return n >= r.minSize; });
      h += '<tr><td><strong>' + esc(r.letter) + '</strong></td><td>' + esc(r.title) + '</td><td>' +
        r.chars.map(function (c) { return '<span class="rating-pill"><span class="mark mark-present" style="' + charStyle(c) + '" aria-hidden="true"></span>' + esc(CHAR[c].name) + '</span>'; }).join('<br>') +
        '</td><td>' + sizes.join(', ') + '</td></tr>';
    });
    return h + '</tbody></table></div>';
  }

  // Sites shown in the debrief: allocated routes in group order.
  function debriefSites() {
    var st = S.instructor, out = [];
    for (var g = 1; g <= st.groupCount; g++) {
      var ri = st.alloc[g];
      if (ri == null || !CONFIG.routes[ri]) continue;
      CONFIG.routes[ri].sites.forEach(function (id) { if (SITE[id]) out.push({ id: id, group: g }); });
    }
    return out;
  }
  var RANK = { present: 3, partial: 2, absent: 1 };
  // Most and least for one characteristic across the debrief grid.
  function siteExtremes(grid, sites, c) {
    var rated = sites.filter(function (s) { return RANK[grid[s.id + '|' + c]]; });
    if (!rated.length) return null;
    var vals = rated.map(function (s) { return RANK[grid[s.id + '|' + c]]; });
    var max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
    return {
      same: max === min,
      most: rated.filter(function (s) { return RANK[grid[s.id + '|' + c]] === max; }),
      least: rated.filter(function (s) { return RANK[grid[s.id + '|' + c]] === min; })
    };
  }

  function renderDebrief() {
    var st = S.instructor, t = CONFIG.text.instructor;
    var sites = debriefSites();
    var h = '<section class="panel" style="--accent:var(--char-5)"><span class="deco-dot"></span><h2>' + esc(t.debriefTitle) + '</h2><p>' + esc(t.debriefHelp) + '</p></section>';
    if (!sites.length) return h + '<div class="notice">' + esc(t.noSites) + '</div>';
    h += '<section class="panel" style="--accent:var(--char-8)"><h3>' + esc(t.gridTitle) + '</h3><div class="table-wrap"><table><thead><tr><th scope="col">Characteristic</th>';
    sites.forEach(function (s) { h += '<th scope="col">' + esc(SITE[s.id].name) + '<br><span class="quiet">G' + s.group + '</span></th>'; });
    h += '</tr></thead><tbody>';
    CONFIG.characteristics.forEach(function (c) {
      h += '<tr><th scope="row" class="char-cell" style="' + charStyle(c.id) + '">' + esc(c.name) + '</th>';
      sites.forEach(function (s) {
        var path = 'debrief.grid.' + s.id + '|' + c.id;
        var id = fid(path);
        var v = st.debrief.grid[s.id + '|' + c.id] || '';
        h += '<td><label class="sr-only" for="' + id + '">' + esc(c.name + ' at ' + SITE[s.id].name) + '</label><select id="' + id + '" data-bind="' + esc(path) + '">' +
          '<option value="">—</option>' + CONFIG.ratings.map(function (r) { return '<option value="' + r.id + '"' + (v === r.id ? ' selected' : '') + '>' + esc(r.label) + '</option>'; }).join('') +
          '</select></td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div></section>';

    h += '<section class="panel" style="--accent:var(--char-2)"><h2>' + esc(t.discussTitle) + '</h2>';
    CONFIG.characteristics.forEach(function (c) {
      var ex = siteExtremes(st.debrief.grid, sites, c.id);
      h += '<div class="disc-item" style="' + charStyle(c.id) + '"><h3>' + c.num + '. ' + esc(c.name) + '</h3>';
      if (!ex) h += '<p class="disc-line quiet">' + esc(t.noRatings) + '</p>';
      else if (ex.same) h += '<p class="disc-line"><strong>' + esc(t.allSame) + ':</strong> ' + esc(ex.most.map(function (s) { return SITE[s.id].name; }).join(', ')) + '</p>';
      else {
        h += '<p class="disc-line"><strong>' + esc(t.most) + ':</strong> ' + esc(ex.most.map(function (s) { return SITE[s.id].name; }).join(', ')) + '</p>' +
          '<p class="disc-line"><strong>' + esc(t.least) + ':</strong> ' + esc(ex.least.map(function (s) { return SITE[s.id].name; }).join(', ')) + '</p>';
      }
      h += '<p class="disc-line">' + esc(t.discussPrompt) + '</p>';
      h += textArea('debrief.notes.' + c.id, t.classNotes + ': ' + c.name, st.debrief.notes[c.id], { rows: 3 });
      h += '</div>';
    });
    h += '</section>';
    h += '<section class="panel" style="--accent:var(--char-7)"><h2>' + esc(t.spotTitle) + '</h2><p>' + esc(t.spotPrompt) + '</p>' +
      textArea('debrief.notes._spotted', t.classNotes + ': ' + t.spotTitle, st.debrief.notes._spotted, { rows: 3 }) + '</section>';
    return h;
  }

  // =====================================================================
  // Observer
  // =====================================================================
  function obsSites(obs) {
    var r = routeOf(obs.join);
    if (r) return r.sites.map(function (id) { return SITE[id]; });
    return [null, null];
  }
  function obsTabStates(obs) {
    var sk = skippedSteps(obs.join);
    return { join: sk.length ? sk.length + ' to do' : 'done' };
  }

  function renderObserver() {
    var obs = S.observer, t = CONFIG.text.observer;
    var tabs = ['join', 'role', 'map', 'field', 'spotted', 'huddle', 'share'].map(function (id) { return { id: id, label: t.tabs[id] }; });
    var h = tabsHtml(tabs, obs.tab, 'otab', 'var(--char-2)', obsTabStates(obs));
    if (obs.tab === 'role') h += renderRole();
    else if (obs.tab === 'map') h += renderObserverMap();
    else if (obs.tab === 'field') h += renderField();
    else if (obs.tab === 'spotted') h += renderSpotted();
    else if (obs.tab === 'huddle') h += renderHuddle();
    else if (obs.tab === 'share') h += renderShare();
    else h += renderJoin();
    return h;
  }

  function renderJoin() {
    var obs = S.observer, j = obs.join, t = CONFIG.text.observer;
    var h = '<section class="panel" style="--accent:var(--char-2)"><span class="deco-dot"></span><h2>' + esc(t.joinTitle) + '</h2><p class="quiet">' + esc(t.joinHelp) + '</p>';
    h += textInput('join.code', t.codeLabel, j.code, { cls: 'code-input', live: true, attrs: ' maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false"' });
    if (normaliseJoinCode(j.code).length) {
      var dec = decodeJoinCode(j.code);
      if (dec.ok) {
        h += '<div class="notice good" role="status"><strong>Group ' + dec.group + '</strong><br>' +
          CONFIG.routes[dec.routeIndex].sites.map(function (id, i) { return 'Site ' + (i + 1) + ': <strong>' + esc(SITE[id].name) + '</strong>'; }).join('<br>') + '</div>';
      } else if (normaliseJoinCode(j.code).length >= 4) {
        h += '<div class="notice bad" role="alert">' + esc(dec.error) + '</div>';
      }
    }
    h += chipGroup(t.sizeLabel, CONFIG.groupSizes.map(function (n) { return chip('radio', 'join.size', n, String(n), j.size === n, { num: true }); }).join(''), { cls: 'big' });
    var allowed = j.size ? lettersForSize(j.size) : LETTERS;
    h += chipGroup(t.letterLabel, LETTERS.map(function (l) {
      var r = roleFor(j.size || 5, l);
      return chip('radio', 'join.letter', l, l + (r ? ' · ' + r.title : ''), j.letter === l, { disabled: allowed.indexOf(l) < 0 });
    }).join(''), { cls: 'big', help: t.letterHelp });
    h += textInput('join.name', t.nameLabel, j.name, { attrs: ' autocomplete="name" maxlength="80"' });
    h += '</section>';

    h += '<section class="panel" style="--accent:var(--char-5)"><h2>' + esc(t.ethicsTitle) + '</h2><ol class="ethics-list">' +
      CONFIG.ethics.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ol>';
    obsSites(obs).forEach(function (site) {
      if (site && site.perimeterOnly) h += '<div class="restrict" style="margin-top:0.6rem"><strong>' + esc(site.name) + ':</strong> ' + esc(site.restrictionNote) + '</div>';
      if (site && site.venueNote && !isPlaceholder(site.venueNote)) h += '<div class="notice" style="margin-top:0.6rem"><strong>' + esc(site.name) + ':</strong> ' + esc(site.venueNote) + '</div>';
    });
    h += '<div class="btn-row" style="margin-top:0.9rem">';
    if (j.ethicsAt) h += '<span class="notice good" style="margin:0" role="status">✓ ' + esc(t.ethicsDone) + ' ' + esc(j.ethicsAt) + '</span>';
    else h += '<button type="button" class="btn btn-brown" id="ethics-btn" data-action="ethics">' + esc(t.ethicsConfirm) + '</button>';
    h += '</div></section>';
    h += '<div class="btn-row"><button type="button" class="btn" data-action="otab" data-tab="role">' + esc(t.startField) + ' →</button></div>';
    return h;
  }

  function renderRole() {
    var obs = S.observer, j = obs.join, t = CONFIG.text.observer;
    var role = roleFor(j.size, j.letter);
    var h = '';
    if (!role) {
      h += '<div class="notice">' + esc(t.noRole) + '</div>';
    } else {
      var accent = { A: 'var(--char-1)', B: 'var(--char-2)', C: 'var(--char-5)', D: 'var(--char-6)', E: 'var(--char-8)' }[role.letter];
      h += '<section class="role-card" style="--accent:' + accent + '"><span class="eyebrow" style="color:#fff">' + esc(t.roleTitle) + ' · group of ' + j.size + '</span>' +
        '<div class="rc-letter">' + esc(role.letter) + '</div><div class="rc-title">' + esc(role.title) + '</div><p>' + esc(role.brief) + '</p><p><strong>' + esc(t.roleSame) + '</strong></p>' +
        '<ul class="role-chars">' + role.chars.map(function (c) { return '<li>' + markHtml('present', c) + esc(CHAR[c].num + '. ' + CHAR[c].name) + '</li>'; }).join('') + '</ul></section>';
    }
    if (j.size) {
      h += '<section class="panel" style="--accent:var(--char-4)"><h3>' + esc(t.groupRoles) + '</h3><div class="table-wrap"><table><tbody>';
      lettersForSize(j.size).forEach(function (l) {
        var r = roleFor(j.size, l);
        h += '<tr' + (l === j.letter ? ' style="font-weight:800"' : '') + '><th scope="row">' + esc(l) + ' · ' + esc(r.title) + '</th><td>' + r.chars.map(function (c) { return esc(CHAR[c].name); }).join(', ') + '</td></tr>';
      });
      h += '</tbody></table></div></section>';
    }
    h += '<div class="btn-row"><button type="button" class="btn" data-action="otab" data-tab="field">' + esc(t.tabs.field) + ' →</button></div>';
    return h;
  }

  function clockHtml(kind, label, min) {
    return '<div class="clock" data-clock="' + kind + '" data-min="' + min + '"><span class="ck-label">' + esc(label) + '</span><span class="ck-time">' + minToTime(min) +
      '</span> <span class="ck-left"></span></div>';
  }

  function renderField() {
    var obs = S.observer, j = obs.join, t = CONFIG.text.observer;
    var route = routeOf(j);
    var sites = obsSites(obs);
    var n = sites.length;
    if (obs.siteIdx >= n) obs.siteIdx = 0;
    var si = obs.siteIdx;
    var site = sites[si];
    var h = '<div class="ethics-strip" role="note">' + esc(CONFIG.ethicsStrip) +
      (site && site.perimeterOnly ? '<span class="es-extra">' + esc(site.restrictionNote) + '</span>' : '') + '</div>';
    h += '<div class="site-switch' + (n === 1 ? ' single' : n === 3 ? ' three' : '') + '" role="group" aria-label="Site">';
    sites.forEach(function (s, i) {
      h += '<button type="button" class="site-btn" id="site-btn-' + i + '" data-action="site" data-site="' + i + '" aria-pressed="' + (i === si) + '"><span class="sb-num">' + esc(t.siteLabel) + ' ' + (i + 1) + '</span>' +
        '<span class="sb-name">' + esc(s ? s.name : '—') + '</span></button>';
    });
    h += '</div>';
    if (route) {
      var tm = routeTimes(route);
      h += '<div class="clocks">' + tm.moves.map(function (m, i) { return clockHtml('move', t.moveBy.replace('{n}', i + 2), m); }).join('') +
        clockHtml('leave', t.leaveBy, tm.leaveBy) + '</div>';
    } else {
      h += '<div class="notice">' + esc(t.noRoute) + '</div>';
    }
    h += spotReminderHtml();
    if (site) {
      h += '<p class="site-info">' + siteLines(site, true) + '</p>';
      if (site.venueNote && !isPlaceholder(site.venueNote)) h += '<div class="notice">' + esc(site.venueNote) + '</div>';
    }
    charsForObserver(j).forEach(function (c) { h += renderCharCard(obs, si, site, c); });
    return h;
  }

  function renderCharCard(obs, si, site, c) {
    var t = CONFIG.text.observer, ch = CHAR[c];
    var perimeter = site && site.perimeterOnly;
    var prompts = perimeter ? ch.perimeterLookFor : ch.lookFor;
    var explicit = obs.ratings[si] && obs.ratings[si][c];
    var rating = effectiveRating(obs, si, c);
    var h = '<article class="char-card" style="' + charStyle(c) + '" aria-labelledby="cc-' + c + '">';
    h += '<div class="char-head"><span class="char-num' + (darkOn(c) ? ' dark-text' : '') + '" aria-hidden="true">' + ch.num + '</span><div><div class="char-name" id="cc-' + c + '">' + esc(ch.name) + '</div><div class="char-def">' + esc(ch.def) + '</div></div></div>';
    if (perimeter && ch.peopleDependent) h += '<div class="restrict">' + esc(site.restrictionNote) + (!explicit ? '<br>' + esc(t.defaultNA) : '') + '</div>';
    h += '<ul class="lookfor">' + prompts.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>';
    var path = 'ratings.' + si + '.' + c;
    h += chipGroup(t.ratingLegend, CONFIG.ratings.map(function (r) { return chip('radio', path, r.id, r.label, rating === r.id); }).join(''), { cls: 'grid2' });
    var notes = obs.notes.filter(function (x) { return x.s === si && x.c === c; });
    if (notes.length) {
      h += '<ul class="note-list">';
      notes.forEach(function (x) { h += renderNoteItem(x); });
      h += '</ul>';
    }
    var nid = 'note-in-' + si + '-' + c;
    h += '<div class="note-add"><label class="sr-only" for="' + nid + '">' + esc(t.noteLabel + ' ' + ch.name) + '</label>' +
      '<input type="text" id="' + nid + '" data-note-input="1" data-site="' + si + '" data-ch="' + c + '" maxlength="300" placeholder="' + esc(t.notePlaceholder) + '" autocomplete="off">' +
      '<button type="button" class="btn" data-action="add-note" data-site="' + si + '" data-ch="' + c + '">' + esc(t.addNote) + '</button></div>';
    return h + '</article>';
  }

  function renderNoteItem(x) {
    var t = CONFIG.text.observer;
    var h = '<li class="note"><div class="note-meta">' + esc(x.t) + '</div>';
    if (ui.editNote === x.i) {
      var eid = 'edit-' + x.i;
      h += '<div class="note-add" style="margin-top:0.25rem"><label class="sr-only" for="' + eid + '">Edit note</label><input type="text" id="' + eid + '" data-edit-input="' + esc(x.i) + '" value="' + esc(x.x) + '" maxlength="300">' +
        '<button type="button" class="btn btn-small" data-action="save-note" data-note="' + esc(x.i) + '">' + esc(t.save) + '</button></div>';
    } else {
      h += '<p class="note-text">' + esc(x.x) + '</p>';
    }
    h += '<span class="factor-label">' + esc(t.factorPrompt) + '</span><div class="chips">' + CONFIG.factors.map(function (f) {
      return '<button type="button" class="chip-btn" id="nf-' + esc(x.i) + '-' + f.id + '" data-action="note-factor" data-note="' + esc(x.i) + '" data-factor="' + f.id + '" aria-pressed="' + (x.f === f.id) + '" title="' + esc(f.label) + '">' + esc(f.short) + '</button>';
    }).join('') + '</div><div class="btn-row">';

  // Every place spotted by the group (own record plus collected codes).
  function groupSpotsHtml(records) {
    var t = CONFIG.text.observer, items = [];
    Object.keys(records).sort().forEach(function (k) {
      (records[k].sp || []).forEach(function (x) { items.push({ l: records[k].l || '?', x: x }); });
    });
    if (!items.length) return '<p class="quiet">' + esc(t.spotNone) + '</p>';
    return '<ul class="lookfor">' + items.map(function (it) {
      return '<li><strong>' + esc(it.x.x) + '</strong>' + (it.x.k ? ' · ' + esc(spotStatusLabel(it.x.k)) : '') + (it.x.y ? '<br><span class="small">' + esc(it.x.y) + '</span>' : '') +
        '<br><span class="small quiet">' + esc('Observer ' + it.l + (it.x.t ? ' · ' + it.x.t : '')) + '</span></li>';
    }).join('') + '</ul>';
  }

  function renderHuddle() {
    var obs = S.observer, j = obs.join, t = CONFIG.text.observer;
    var h = '<section class="panel" style="--accent:var(--char-6)"><span class="deco-dot"></span><h2>' + esc(t.huddleTitle) + '</h2><p>' + esc(t.huddleHelp) + '</p></section>';
    var code = encodeShareCode(buildShareRecord(obs));
    var sk = skippedSteps(j);
    h += '<section class="panel" style="--accent:var(--char-1)"><h3>' + esc(t.sendTitle) + '</h3><p class="small">' + esc(t.sendHelp) + '</p>';
    if (sk.length) h += '<div class="notice">Join steps skipped: ' + esc(sk.join(', ')) + '. Your code records this.' + (sk.indexOf('letter') >= 0 ? ' Without a letter, nobody can add your code.' : '') + '</div>';
    h += '<label class="field-label" for="my-code">My share code</label><textarea id="my-code" class="code-box" rows="4" readonly>' + esc(code) + '</textarea>' +
      '<div class="btn-row" style="margin-top:0.5rem"><button type="button" class="btn" data-action="copy-code">' + esc(t.copyCode) + '</button>' +
      (typeof navigator !== 'undefined' && navigator.share ? '<button type="button" class="btn btn-ghost" data-action="share-code">' + esc(t.shareCode) + '</button>' : '') + '</div></section>';

    h += '<section class="panel" style="--accent:var(--char-3)"><h3>' + esc(t.addTitle) + '</h3>';
    if (j.group == null) h += '<div class="notice">' + esc(t.needJoin) + '</div>';
    h += '<div class="field"><label for="paste-obs">' + esc(t.addLabel) + '</label><textarea id="paste-obs" class="code-box" rows="4" data-ui="pasteObs">' + esc(ui.pasteObs) + '</textarea></div>' +
      '<button type="button" class="btn" data-action="add-codes"' + (j.group == null ? ' disabled' : '') + '>' + esc(t.addBtn) + '</button>';

    h += '</section>';

    h += '<section class="panel" style="--accent:var(--char-4)"><h3>' + esc(t.lettersTitle) + '</h3>' + lettersHtml(obs) + '</section>';

    h += '<details class="tools"><summary>' + esc(t.readAloudTitle) + '</summary><div class="tools-body"><p class="small quiet">' + esc(t.readAloudHelp) + '</p><div class="readaloud">' + readAloudHtml(obs) + '</div></div></details>';
    return h;
  }

  function lettersHtml(obs) {
    var t = CONFIG.text.observer, j = obs.join;
    var size = j.size || 5;
    var letters = lettersForSize(size);
    var missing = [];
    var h = '<div class="letters">';
    letters.forEach(function (l) {
      var isMe = l === j.letter;
      var have = isMe || !!obs.peers[l];
      if (!have) missing.push(l);
      var who = isMe ? 'you' : (obs.peers[l] ? (obs.peers[l].n || 'in').split(' ')[0] : 'missing');
      h += '<span class="letter ' + (have ? 'have' : 'missing') + '" title="' + esc(who) + '">' + l + '<small>' + esc(who.slice(0, 7)) + '</small></span>';
    });
    h += '</div>';
    h += missing.length ? '<p><strong>' + esc(t.stillMissing) + ':</strong> ' + missing.join(', ') + '</p>' : '<p class="notice good">' + esc(t.allIn) + '</p>';
    var peers = Object.keys(obs.peers).sort();
    if (peers.length) {
      h += '<ul class="report-list">' + peers.map(function (l) {
        var p = obs.peers[l];
        return '<li>' + esc(l + ' · ' + (p.n || 'no name') + ' · ' + p.no.length + ' notes · ' + (p.sp || []).length + ' ' + t.spotCount) +
          ' <button type="button" class="btn btn-ghost btn-small" data-action="remove-peer" data-letter="' + l + '">' + esc(t.removePeer) + ' ' + l + '</button></li>';
      }).join('') + '</ul>';
    }
    return h;
  }

  function reportHtml(r) {
    var h = '<ul class="report-list" role="status" style="margin-top:0.75rem">';
    r.added.forEach(function (x) { h += '<li>Added: ' + esc(x) + '</li>'; });
    r.replaced.forEach(function (x) { h += '<li>Updated: ' + esc(x) + '</li>'; });
    r.duplicate.forEach(function (x) { h += '<li class="warn">Skipped: ' + esc(x) + '</li>'; });
    r.warnings.forEach(function (x) { h += '<li class="warn">' + esc(x) + '</li>'; });
    r.rejected.forEach(function (x) { h += '<li class="bad">Rejected: ' + esc(x) + '</li>'; });
    if (r.invalid) r.invalid.forEach(function (x) { h += '<li class="bad">' + esc(x) + '</li>'; });
    return h + '</ul>';
  }

  function readAloudHtml(obs) {
    var sites = obsSites(obs);
    var h = '';
    sites.forEach(function (site, si) {
      h += '<p><strong>' + esc(site ? site.name : 'Site ' + (si + 1)) + '.</strong> ';
      h += charsForObserver(obs.join).map(function (c) {
        var r = effectiveRating(obs, si, c);
        var notes = obs.notes.filter(function (x) { return x.s === si && x.c === c; });
        return esc(CHAR[c].name + ': ' + (r ? RATING[r].label : 'not rated')) + (notes.length ? ' (' + esc(notes.slice(0, 2).map(function (x) { return x.x; }).join('; ')) + ')' : '') + '.';
      }).join(' ') + '</p>';
    });
    if (obs.spots.length) {
      h += '<p><strong>' + esc(CONFIG.text.observer.spotTitle) + '.</strong> ' + obs.spots.map(function (x) {
        return esc(x.x + (x.k ? ' (' + spotStatusLabel(x.k).toLowerCase() + ')' : '')) + '.';
      }).join(' ') + '</p>';
    }
    return h;
  }

  function mergedGridHtml(records, sites, opts) {
    var t = CONFIG.text.observer;
    var grid = mergedGrid(records, sites.length);
    var h = '<div class="table-wrap"><table class="merged"><thead><tr><th scope="col">Characteristic</th>';
    sites.forEach(function (s, i) { h += '<th scope="col">' + esc(s ? s.name : 'Site ' + (i + 1)) + '</th>'; });
    h += '</tr></thead><tbody>';
    CONFIG.characteristics.forEach(function (c) {
      h += '<tr><th scope="row" class="char-cell" style="' + charStyle(c.id) + '">' + esc(c.name) + '</th>';
      sites.forEach(function (s, si) {
        var cell = grid[si][c.id];
        h += '<td><div class="cell-ratings">' + (cell.ratings.length ? cell.ratings.map(function (x) { return ratingPill(x.rating, c.id, x.l); }).join('') : ratingPill('', c.id)) + '</div>' +
          (cell.double ? '<span class="agree-tag' + (cell.agree ? '' : ' differ') + '">' + esc(cell.agree ? t.doubleAgree : t.doubleDiffer) + '</span>' : '') + '</td>';
      });
      h += '</tr>';
    });
    return h + '</tbody></table></div>';
  }

  function renderShare() {
    var obs = S.observer, t = CONFIG.text.observer;
    var sites = obsSites(obs);
    var single = sites.length === 1;
    var h = '<section class="panel" style="--accent:var(--char-8)"><h2>' + esc(t.shareTitle) + '</h2><p class="quiet">' + esc(t.shareHelp) + '</p></section>';
    h += '<section class="contrast-block"><span class="eyebrow" style="color:#fff">' + esc(single ? t.contrastTitleSingle : t.contrastTitle) + '</span>';
    var cid = fid('contrast.ch');
    h += '<div class="field"><label for="' + cid + '">' + esc(t.contrastChar) + '</label><select id="' + cid + '" data-bind="contrast.ch"><option value="">' + esc(t.chooseChar) + '</option>' +
      CONFIG.characteristics.map(function (c) { return '<option value="' + c.id + '"' + (obs.contrast.ch === c.id ? ' selected' : '') + '>' + esc(c.num + '. ' + c.name) + '</option>'; }).join('') + '</select></div>';
    h += textArea('contrast.text', single ? t.contrastTextSingle : t.contrastText, obs.contrast.text, { rows: 3, max: CONFIG.words.shareSentenceMax });
    h += '</section>';
    h += '<section class="panel" style="--accent:var(--char-4)"><h3>' + esc(t.gridTitle) + '</h3>' + mergedGridHtml(obsAllRecords(obs), sites) + '</section>';
    h += '<section class="panel" style="--accent:var(--char-7)"><h3>' + esc(t.spotGroup) + '</h3>' + groupSpotsHtml(obsAllRecords(obs)) + '</section>';

  // =====================================================================
  // Homework
  // =====================================================================
  var HW_STEPS = ['load', 'sort', 'agree', 'explain', 'overall', 'decline', 'claims', 'outputs'];

  function renderHomework() {
    var hw = S.homework, t = CONFIG.text.homework;
    var tabs = HW_STEPS.map(function (id) { return { id: id, label: t.tabs[id] }; });
    var states = {};
    HW_STEPS.forEach(function (s) { if (s !== 'outputs' && hwSiteCount(hw)) states[s] = stepIssues(hw, s).length ? 'to do' : 'done'; });
    var h = tabsHtml(tabs, hw.step, 'htab', 'var(--char-5)', states);
    if (hw.step !== 'load' && !hwSiteCount(hw)) return h + '<div class="notice">' + esc(stepIssues(hw, 'load')[0]) + '</div>' + renderLoad();
    switch (hw.step) {
      case 'sort': h += renderSort(); break;
      case 'agree': h += renderAgree(); break;
      case 'explain': h += renderExplain(); break;
      case 'overall': h += renderOverall(); break;
      case 'decline': h += renderDecline(); break;
      case 'claims': h += renderClaims(); break;
      case 'outputs': h += renderOutputs(); break;
      default: h += renderLoad();
    }
    var i = HW_STEPS.indexOf(hw.step);
    h += '<div class="btn-row" style="margin-top:1rem">' +
      (i > 0 ? '<button type="button" class="btn btn-ghost" data-action="htab" data-tab="' + HW_STEPS[i - 1] + '">← ' + esc(t.tabs[HW_STEPS[i - 1]]) + '</button>' : '') +
      (i < HW_STEPS.length - 1 ? '<button type="button" class="btn" data-action="htab" data-tab="' + HW_STEPS[i + 1] + '">' + esc(t.tabs[HW_STEPS[i + 1]]) + ' →</button>' : '') + '</div>';
    return h;
  }

  function hasObserverData() {
    try { var raw = localStorage.getItem(KEYS.observer); return !!raw; } catch (e) { return false; }
  }

  function renderLoad() {
    var hw = S.homework, t = CONFIG.text.homework;
    var h = '<section class="panel" style="--accent:var(--char-5)"><span class="deco-dot"></span><h2>' + esc(t.loadTitle) + '</h2><p>' + esc(t.loadHelp) + '</p>';
    h += '<div class="btn-row">' + (hasObserverData() ? '<button type="button" class="btn" data-action="hw-from-device">' + esc(t.fromDevice) + '</button>' : '<span class="quiet">' + esc(t.noDevice) + '</span>') +
      '<button type="button" class="btn btn-ghost" data-action="import">' + esc(CONFIG.text.tools.importJson) + '</button></div>';
    h += '<div class="field" style="margin-top:1rem"><label for="paste-hw">' + esc(t.pasteLabel) + '</label><textarea id="paste-hw" class="code-box" rows="5" data-ui="pasteHw">' + esc(ui.pasteHw) + '</textarea></div>' +
      '<button type="button" class="btn" data-action="hw-add-codes">' + esc(t.pasteBtn) + '</button>';
    if (ui.hwReport) h += reportHtml(ui.hwReport);
    h += '</section>';

    if (hw.group == null) {
      h += '<section class="panel" style="--accent:var(--char-3)">' + textInput('code', t.codeLabel, hw.code, { cls: 'code-input', live: true, attrs: ' maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false"' });
      var n = normaliseJoinCode(hw.code);
      if (n.length >= 4) { var d = decodeJoinCode(n); if (!d.ok) h += '<div class="notice bad" role="alert">' + esc(d.error) + '</div>'; }
      h += '</section>';
    }

    var keys = Object.keys(hw.records).sort();
    h += '<section class="panel" style="--accent:var(--char-1)"><h3>' + esc(t.loaded) + '</h3>';
    if (hw.group != null) h += '<p><strong>Group ' + hw.group + '</strong> · ' + esc(routeLabel(hw.routeIndex)) + '</p>';
    if (keys.length) {
      h += '<ul class="loaded-list">' + keys.map(function (k) {
        var r = hw.records[k];
        return '<li>' + esc((r.l || 'No letter') + ' · ' + (r.n || 'no name') + ' · ' + r.no.length + ' notes · ' + (r.sp || []).length + ' ' + CONFIG.text.observer.spotCount + (r.sk && r.sk.length ? ' · skipped: ' + r.sk.join(', ') : '')) + '</li>';
      }).join('') + '</ul>';
    } else h += '<p class="quiet">None yet.</p>';
    h += '</section>';

    h += '<section class="panel" style="--accent:var(--char-2)"><h3>' + esc(t.meTitle) + '</h3>' + textInput('me.name', t.nameLabel, hw.me.name, { attrs: ' autocomplete="name" maxlength="80"' });
    if (keys.length) h += chipGroup(t.letterLabel, keys.map(function (k) { return chip('radio', 'me.letter', k, (k === '_' ? 'No letter' : k) + (hw.records[k].n ? ' · ' + hw.records[k].n : ''), hw.me.letter === k); }).join(''));
    h += '</section>';
    return h;
  }

  // To-do list under an explanation or claim; refreshed while typing.
  function issuesHtml(key, iss) {
    return '<ul class="check-list" data-issues="' + esc(key) + '" aria-live="off">' + issuesInner(iss) + '</ul>';
  }
  function issuesInner(iss) {
    return iss.length ? iss.map(function (x) { return '<li><span class="issue">' + esc(x) + '</span></li>'; }).join('') : '<li class="done">Complete.</li>';
  }
  function refreshIssues() {
    if (mode !== 'homework') return;
    Array.prototype.forEach.call(document.querySelectorAll('[data-issues]'), function (el) {
      var k = el.getAttribute('data-issues').split(':');
      el.innerHTML = issuesInner(k[0] === 'explain' ? explanationIssues(S.homework, k[1]) :
        k[0] === 'decline' ? declineIssues(S.homework.decline[+k[1]]) : claimIssues(S.homework.claims[k[1]]));
    });
  }

  function noteLabel(note) { return 'Observer ' + note.letter + (note.who ? ' (' + note.who + ')' : '') + (note.t ? ' · ' + note.t : ''); }

  function renderSort() {
    var hw = S.homework, t = CONFIG.text.homework;
    var notes = hwNotes(hw);
    var h = '<section class="panel" style="--accent:var(--char-3)"><span class="deco-dot"></span><h2>' + esc(t.sortTitle) + '</h2><p>' + esc(t.sortHelp) + '</p>';
    if (notes.length) h += '<p><strong>' + notes.filter(function (x) { return noteTags(hw, x).ok; }).length + ' / ' + notes.length + '</strong> confirmed.</p>';
    h += '</section>';
    if (!notes.length) return h + '<div class="notice">' + esc(t.noNotes) + '</div>' + hwSpotsPanel(hw);
    var n = hwSiteCount(hw);
    notes.forEach(function (note) {
      var tags = noteTags(hw, note);
      var base = 'sort.' + note.key;
      var accent = CHAR[tags.chars[0]] ? CHAR[tags.chars[0]].colour : 'var(--border)';
      h += '<article class="hw-note' + (tags.ok ? ' ok' : '') + '" style="--accent:' + accent + '"><div class="note-meta">' + esc(noteLabel(note)) + '</div><blockquote>' + esc(note.x) + '</blockquote>';
      h += '<div class="tag-row">' + chipGroup(t.charsLabel, CONFIG.characteristics.map(function (c) {
        return chip('checkbox', base + '.chars', c.id, c.name, tags.chars.indexOf(c.id) >= 0, { style: charStyle(c.id) });
      }).join('')) + '</div>';
      if (n > 1) h += '<div class="tag-row">' + chipGroup(t.siteLabel, siteRange(n).map(function (si) { return chip('radio', base + '.site', si, hwSiteName(hw, si), tags.site === si, { num: true }); }).join('')) + '</div>';
      h += '<div class="tag-row">' + chipGroup(t.factorLabel, [chip('radio', base + '.factor', '', t.noFactor, !tags.factor)].concat(CONFIG.factors.map(function (f) { return chip('radio', base + '.factor', f.id, f.label, tags.factor === f.id); })).join('')) + '</div>';
      h += '<div class="tag-row">' + chipGroup(t.claimsLabel, CONFIG.claims.map(function (cl) { return chip('checkbox', base + '.claims', cl.id, cl.name, tags.claims.indexOf(cl.id) >= 0, { style: '--accent:' + cl.colour }); }).join('')) + '</div>';
      h += '<button type="button" class="btn ' + (tags.ok ? 'btn-ghost' : '') + '" id="conf-' + fid(note.key) + '" data-action="sort-confirm" data-key="' + esc(note.key) + '" aria-pressed="' + tags.ok + '">' + esc(tags.ok ? '✓ ' + t.confirmed : t.confirm) + '</button></article>';
    });
    h += hwSpotsPanel(hw);
    return h;
  }

  function hwSpotsPanel(hw) {
    var t = CONFIG.text.homework, spots = hwSpots(hw);
    var h = '<section class="panel" style="--accent:var(--char-7)"><h3>' + esc(t.spotTitle) + ' (' + spots.length + ')</h3><p class="small quiet">' + esc(t.spotHelp) + '</p>';
    if (!spots.length) return h + '<p class="quiet">' + esc(CONFIG.text.observer.spotNone) + '</p></section>';
    h += '<ul class="lookfor">' + spots.map(function (x) {
      return '<li><strong>' + esc(x.x) + '</strong>' + (x.k ? ' · ' + esc(SPOT_STATUS[x.k].label) : '') + (x.y ? '<br><span class="small">' + esc(x.y) + '</span>' : '') +
        '<br><span class="small quiet">' + esc(noteLabel(x)) + '</span></li>';
    }).join('') + '</ul>';
    return h + '</section>';
  }

  function renderAgree() {
    var hw = S.homework, t = CONFIG.text.homework;
    var list = doubleRatedList(hw);
    var h = '<section class="panel" style="--accent:var(--char-6)"><span class="deco-dot"></span><h2>' + esc(t.agreeTitle) + '</h2><p>' + esc(t.agreeHelp) + '</p></section>';
    if (!list.length) return h + '<div class="notice plain">' + esc(t.noDouble) + '</div>';
    var notes = hwNotes(hw);
    list.forEach(function (d) {
      var k = d.si + '|' + d.c;
      var a = hw.agree[k] || {};

  function renderExplain() {

    var notes = hwNotes(hw);
    CONFIG.characteristics.forEach(function (c) {

      var iss = explanationIssues(hw, c.id);
      h += '<section class="panel" style="' + charStyle(c.id) + '"><span class="eyebrow">' + (iss.length ? 'In progress' : '✓ Complete') + '</span><h2>' + esc(c.name) + '</h2><p class="small quiet">' + esc(c.def) + '</p>';

        h += '<div class="disc-item" style="' + charStyle(c.id) + '"><h3>' + esc(hwSiteName(hw, s)) + ' ' + ratingPill(finalRating(hw, s, c.id), c.id) + '</h3>';

        h += chipGroup(t.factorsAt, CONFIG.factors.map(function (f) { return chip('checkbox', base + '.sites.' + s + '.factors', f.id, f.label, (sd.factors || []).indexOf(f.id) >= 0); }).join(''));

      var showAll = !!ui.showAll[c.id];

      var inner = list.map(function (x) { return chip('checkbox', base + '.refs', x.key, hwSiteName(hw, noteTags(hw, x).site) + ': ' + x.x, (e.refs || []).indexOf(x.key) >= 0); }).join('');
      h += chipGroup(t.notesField, inner || '<span class="quiet small">' + esc(t.noTagged) + '</span>');
      h += '<button type="button" class="btn btn-ghost btn-small" data-action="show-all" data-ch="' + c.id + '" id="sa-' + c.id + '">' + esc(showAll ? t.showTagged : t.showAll) + '</button>';

  function renderDecline() {
    var hw = S.homework, t = CONFIG.text.homework;
    var valid = validExplanations(hw), spots = hwSpots(hw);
    var rule = t.declineRule.replace('{n}', CONFIG.words.declineCount).replace('{l}', declineLensTarget());
    var h = '<section class="panel" style="--accent:var(--char-3)"><span class="deco-dot"></span><h2>' + esc(t.declineTitle) + '</h2><p>' + esc(t.declineHelp) + '</p>' +
      '<p><strong>' + esc(rule) + '</strong></p>';

    validDeclines(hw).forEach(function (d) { covered[d.lens] = true; });
    h += '<span class="field-label">' + esc(t.lensCoverage) + '</span><div class="lens-row">' + CONFIG.lenses.map(function (l) {
      return '<span class="lens-tag' + (covered[l.id] ? ' filled' : '') + (l.colour === 'var(--char-4)' ? ' dark-ink' : '') + '" style="--accent:' + l.colour + '"><span class="pip" aria-hidden="true"></span>' + esc(l.name) +
        '<span class="sr-only">' + (covered[l.id] ? ': covered' : ': not yet covered') + '</span></span>';
    }).join('') + '</div></section>';

    if (!hw.decline.length) h += '<div class="notice">' + esc(t.declineNone) + '</div>';
    hw.decline.forEach(function (d, i) {
      var base = 'decline.' + i;
      var iss = declineIssues(d);
      var accent = LENS[d.lens] ? LENS[d.lens].colour : 'var(--char-3)';
      h += '<section class="panel" style="--accent:' + accent + '"><span class="eyebrow">' + (iss.length ? 'In progress' : '✓ Complete') + '</span><h2>' + esc(t.declineItem) + ' ' + (i + 1) + '</h2>';
      h += chipGroup(t.declineClaim, CONFIG.claims.map(function (cl) { return chip('radio', base + '.claim', cl.id, cl.name + ': ' + cl.def, d.claim === cl.id, { style: '--accent:' + cl.colour }); }).join(''), { cls: 'grid2' });
      h += chipGroup(t.declineLens, CONFIG.lenses.map(function (l) { return chip('radio', base + '.lens', l.id, l.name + ' · ' + l.focus, d.lens === l.id, { style: '--accent:' + l.colour }); }).join(''));
      h += chipGroup(t.declineFactor, CONFIG.factors.map(function (f) { return chip('radio', base + '.factor', f.id, f.label, d.factor === f.id); }).join(''));
      var ground = valid.map(function (c) { return chip('checkbox', base + '.refs', 'x:' + c, 'Explanation: ' + CHAR[c].name, (d.refs || []).indexOf('x:' + c) >= 0, { style: charStyle(c) }); })
        .concat(spots.map(function (x) { return chip('checkbox', base + '.refs', 'p:' + x.key, 'Spotted: ' + spotLabel(x), (d.refs || []).indexOf('p:' + x.key) >= 0, { style: '--accent:var(--char-7)' }); })).join('');
      h += chipGroup(t.declineGround, ground || '<span class="quiet small">' + esc(t.declineNoGround) + '</span>');
      h += textArea(base + '.mechanism', t.declineMechanism, d.mechanism, { min: CONFIG.words.min, rows: 6 });
      h += textArea(base + '.evidence', t.declineEvidence, d.evidence, { min: CONFIG.words.min, rows: 5 });
      h += textInput(base + '.line', t.declineLine, d.line, { min: CONFIG.words.sentenceMin, max: CONFIG.words.sentenceMax });
      h += issuesHtml('decline:' + i, iss);
      h += '<div class="btn-row" style="margin-top:0.75rem">';
      if (ui.delDecline === d.id) {
        h += '<button type="button" class="btn btn-red btn-small" id="dd2-' + esc(d.id) + '" data-action="decline-del-yes" data-id="' + esc(d.id) + '">' + esc(t.declineRemoveConfirm) + '</button>' +
          '<button type="button" class="btn btn-ghost btn-small" data-action="decline-del-no">' + esc(t.declineCancel) + '</button>';
      } else {
        h += '<button type="button" class="btn btn-ghost btn-small" id="dd-' + esc(d.id) + '" data-action="decline-del" data-id="' + esc(d.id) + '">' + esc(t.declineRemove) + '</button>';
      }
      h += '</div></section>';
    });
    if (hw.decline.length < CONFIG.words.declineMax) h += '<div class="btn-row"><button type="button" class="btn btn-red" id="decline-add" data-action="decline-add">' + esc(t.declineAdd) + '</button></div>';
    return h;
  }

  function renderClaims() {
    var hw = S.homework, t = CONFIG.text.homework;
    var h = '<section class="panel" style="--accent:var(--char-2)"><span class="deco-dot"></span><h2>' + esc(t.claimsTitle) + '</h2><p>' + esc(t.claimsHelp) + '</p></section>';
    h += '<section class="banner" style="--accent:var(--char-1)"><span class="eyebrow">Snapshot</span><p style="font-size:1.1rem;font-weight:600">' + esc(CONFIG.snapshotNote) + '</p></section>';
    var notes = hwNotes(hw);
    var spots = hwSpots(hw);
    var valid = validExplanations(hw);
    var declines = validDeclines(hw);
    CONFIG.claims.forEach(function (cl) {
      var e = hw.claims[cl.id] || {};
      var base = 'claims.' + cl.id;
      h += '<section class="panel" style="--accent:' + cl.colour + '"><div class="claim-head"><div class="ch-name">' + esc(cl.name) + '</div><div class="ch-def">' + esc(cl.def) + '</div></div>';
      h += chipGroup(t.scopeLabel, CONFIG.scopeOptions.map(function (o) { return chip('radio', base + '.scope', o.id, o.label, e.scope === o.id); }).join(''));
      h += textArea(base + '.why', t.whyField, e.why, { min: CONFIG.words.min, rows: 5 });
      h += textArea(base + '.suggests', t.suggestsField, e.suggests, { rows: 4 });
      var tagged = notes.filter(function (x) { return noteTags(hw, x).claims.indexOf(cl.id) >= 0; });
      var refChips = tagged.map(function (x) { return chip('checkbox', base + '.refs', 'n:' + x.key, hwSiteName(hw, noteTags(hw, x).site) + ': ' + x.x, (e.refs || []).indexOf('n:' + x.key) >= 0); })
        .concat(valid.map(function (c) { return chip('checkbox', base + '.refs', 'x:' + c, 'Explanation: ' + CHAR[c].name, (e.refs || []).indexOf('x:' + c) >= 0, { style: charStyle(c) }); }))
        .concat(declines.filter(function (d) { return d.claim === cl.id; }).map(function (d) { return chip('checkbox', base + '.refs', 'd:' + d.id, 'Candidate explanation: ' + declineLabel(d), (e.refs || []).indexOf('d:' + d.id) >= 0, { style: '--accent:' + LENS[d.lens].colour }); }))
        .concat(spots.map(function (x) { return chip('checkbox', base + '.refs', 'p:' + x.key, 'Spotted: ' + spotLabel(x), (e.refs || []).indexOf('p:' + x.key) >= 0, { style: '--accent:var(--char-7)' }); })).join('');
      h += chipGroup(t.suggestsLinks, refChips || '<span class="quiet small">Tag notes to this claim in step 1, complete explanations in step 3, or load places spotted on the walk, to link them here.</span>');
      h += textArea(base + '.needed', t.neededField, e.needed, { min: CONFIG.words.min, rows: 5 });
      if (e.scope === 'speaks' || e.scope === 'partly') h += textInput(base + '.finding', t.findingField, e.finding, { min: CONFIG.words.sentenceMin, max: CONFIG.words.sentenceMax });
      h += issuesHtml('claim:' + cl.id, claimIssues(e));
      h += '</section>';
    });
    return h;
  }

  function renderOutputs() {
    var hw = S.homework, t = CONFIG.text.homework;
    var h = '<section class="panel" style="--accent:var(--char-7)"><span class="deco-dot"></span><h2>' + esc(t.outputsTitle) + '</h2><h3>' + esc(t.checklist) + '</h3><ul class="check-list">';
    HW_STEPS.slice(0, HW_STEPS.length - 1).forEach(function (s) {
      var iss = stepIssues(hw, s);
      h += '<li class="' + (iss.length ? '' : 'done') + '"><strong>' + esc(t.tabs[s]) + '</strong>' + iss.slice(0, 6).map(function (x) { return '<span class="issue">' + esc(x) + '</span>'; }).join('') +
        (iss.length > 6 ? '<span class="issue">and ' + (iss.length - 6) + ' more</span>' : '') + '</li>';
    });
    h += '</ul><div class="btn-row" style="margin-top:1rem"><button type="button" class="btn" data-action="print-report">' + esc(t.printReport) + '</button>' +
      '<button type="button" class="btn btn-red" data-action="print-cards">' + esc(t.printCards) + '</button>' +
      '<button type="button" class="btn btn-ghost" data-action="copy-text">' + esc(CONFIG.text.tools.copyText) + '</button>' +
      '<button type="button" class="btn btn-ghost" data-action="export">' + esc(CONFIG.text.tools.exportJson) + '</button></div></section>';
    var cards = buildCards(hw);
    h += '<section class="panel" style="--accent:var(--char-1)"><h3>' + esc(t.cardsTitle) + '</h3>';
    if (!cards.chars.length) h += '<p class="notice">' + esc(t.noCharCards) + '</p>';
    if (!cards.declines.length) h += '<p class="notice">' + esc(t.noDeclineCards) + '</p>';
    if (!cards.claims.length) h += '<p class="notice">' + esc(t.noClaimCards) + '</p>';
    h += '<div class="preview-cards">' + cards.chars.concat(cards.declines, cards.claims).join('') + '</div></section>';

  // =====================================================================
  // Homework outputs: cards, report, text
  // =====================================================================
  function hwSitesLabel(hw) { var out = []; for (var i = 0; i < hwSiteCount(hw); i++) out.push(hwSiteName(hw, i)); return out.join(' · '); }
  function scopeLabel(id) { for (var i = 0; i < CONFIG.scopeOptions.length; i++) if (CONFIG.scopeOptions[i].id === id) return CONFIG.scopeOptions[i].label; return ''; }
  function levelLabel(id) { for (var i = 0; i < CONFIG.overallLevels.length; i++) if (CONFIG.overallLevels[i].id === id) return CONFIG.overallLevels[i].label; return ''; }

  function buildCards(hw) {
    var name = String(hw.me.name || '').trim() || 'Name not given';
    var eyebrow = 'Week 5 · Field visit · Group ' + (hw.group == null ? '?' : hw.group);
    var chars = validExplanations(hw).map(function (c) {
      var e = hw.explain[c];
      return '<div class="a6" style="' + charStyle(c) + '"><div class="a6-eyebrow">' + esc(eyebrow) + ' · Characteristic</div><div class="a6-bar"></div>' +
        '<div class="a6-title">' + esc(CHAR[c].name) + '</div><div class="a6-label">Sites</div><div class="a6-text">' + esc(hwSitesLabel(hw)) + '</div>' +
        '<div class="a6-label">Explanation</div><div class="a6-text">' + esc(e.line) + '</div><div class="a6-foot">' + esc(name) + '</div></div>';
    });
    var declines = validDeclines(hw).map(function (d) {
      var cl = CLAIM[d.claim], lens = LENS[d.lens];
      return '<div class="a6" style="--accent:' + lens.colour + '"><div class="a6-eyebrow">' + esc(eyebrow) + ' · Candidate explanation</div><div class="a6-bar"></div>' +
        '<div class="a6-title">' + esc(cl.name) + ': ' + esc(cl.def) + '</div><div class="a6-label">Lens</div><div class="a6-text">' + esc(lens.name) + ' · ' + esc(FACTOR[d.factor].label) + '</div>' +
        '<div class="a6-label">Explanation</div><div class="a6-text">' + esc(d.line) + '</div>' +
        '<div class="a6-label">Evidence that would test it</div><div class="a6-text">' + esc(d.evidence) + '</div><div class="a6-foot">' + esc(name) + '</div></div>';
    });
    var claims = CONFIG.claims.filter(function (cl) { return claimCardEligible(hw.claims[cl.id]); }).map(function (cl) {
      var e = hw.claims[cl.id];
      return '<div class="a6" style="--accent:' + cl.colour + '"><div class="a6-eyebrow">' + esc(eyebrow) + ' · Claim wall</div><div class="a6-bar"></div>' +
        '<div class="a6-title">' + esc(cl.name) + ': ' + esc(cl.def) + '</div><div class="a6-label">Sites</div><div class="a6-text">' + esc(hwSitesLabel(hw)) + '</div>' +
        '<div class="a6-label">Scope</div><div class="a6-text">' + esc(scopeLabel(e.scope)) + '</div>' +
        '<div class="a6-label">Finding</div><div class="a6-text">' + esc(e.finding) + '</div>' +
        '<div class="a6-label">Evidence still needed</div><div class="a6-text">' + esc(e.needed) + '</div><div class="a6-foot">' + esc(name) + '</div></div>';
    });
    return { chars: chars, declines: declines, claims: claims };
  }
  function buildCardsHtml(hw) {
    var all = buildCards(hw);
    var cards = all.chars.concat(all.declines, all.claims);
    if (!cards.length) return '<div class="p-doc"><p>No cards to print yet.</p></div>';
    var h = '';
    for (var i = 0; i < cards.length; i += 4) h += '<section class="card-sheet">' + cards.slice(i, i + 4).join('') + '</section>';
    return h;
  }

  function noteByKey(hw, key) { var all = hwNotes(hw); for (var i = 0; i < all.length; i++) if (all[i].key === key) return all[i]; return null; }

  function buildReportHtml(hw) {
    var n = hwSiteCount(hw);

    var h = '<div class="p-doc"><h1>Week 5 field visit: individual report</h1><p class="p-meta">' + esc(name) + ' · Observer ' + esc(hw.me.letter || '?') + ' · Group ' + (hw.group == null ? '?' : hw.group) +
      (hw.routeIndex != null ? ' · Route ' + (hw.routeIndex + 1) + ': ' + esc(routeLabel(hw.routeIndex)) : '') + '</p>';
    for (var si = 0; si < n; si++) {
      var site = SITE[hwRoute(hw).sites[si]];
      h += '<p class="p-meta"><strong>' + esc(site.name) + '</strong> · ' + esc(site.type) + '</p>';
    }
    h += '<h2 style="--accent:var(--char-4)">Overview</h2><table><thead><tr><th>Characteristic</th>';
    for (var s = 0; s < n; s++) h += '<th>' + esc(hwSiteName(hw, s)) + '</th>';
    h += '</tr></thead><tbody>';
    CONFIG.characteristics.forEach(function (c) {
      h += '<tr><td class="char-cell" style="' + charStyle(c.id) + '">' + esc(c.name) + '</td>';
      for (var s2 = 0; s2 < n; s2++) h += '<td>' + ratingPill(finalRating(hw, s2, c.id), c.id) + '</td>';
      h += '</tr>';
    });
    h += '</tbody></table>';

    var dl = doubleRatedList(hw);
    if (dl.length) {
      h += '<h2 style="--accent:var(--char-6)">Agreement</h2>';
      dl.forEach(function (d) {
        var a = hw.agree[d.si + '|' + d.c] || {};
        h += '<div class="p-block" style="' + charStyle(d.c) + '"><h3>' + esc(CHAR[d.c].name) + ' · ' + esc(hwSiteName(hw, d.si)) + '</h3><p>' +
          esc(d.cell.ratings.map(function (x) { return x.l + ': ' + RATING[x.rating].label; }).join('; ')) + ' → <strong>' + esc(a.rating ? RATING[a.rating].label : 'unresolved') + '</strong></p><p>' + esc(a.reason || '') + '</p></div>';
      });
    }

    h += '<h2 style="--accent:var(--char-1)">Explanations</h2>';
    var any = false;
    CONFIG.characteristics.forEach(function (c) {
      var e = hw.explain[c.id];
      if (!e || !e.on) return;
      any = true;
      h += '<div class="p-block" style="' + charStyle(c.id) + '"><h3>' + esc(c.name) + '</h3>';
      for (var s3 = 0; s3 < n; s3++) {
        var sd = (e.sites && e.sites[s3]) || {};
        h += '<p><strong>' + esc(hwSiteName(hw, s3)) + ' (' + esc(finalRating(hw, s3, c.id) ? RATING[finalRating(hw, s3, c.id)].label : 'not rated') + '):</strong> ' + esc(sd.text || '') +
          (sd.factors && sd.factors.length ? ' <em>[' + esc(sd.factors.map(function (f) { return FACTOR[f].label; }).join(', ')) + ']</em>' : '') + '</p>';
      }
      if (n > 1) h += '<p><strong>Contrast:</strong> ' + esc(e.contrast || '') + '</p>';
      var refs = (e.refs || []).map(function (k) { return noteByKey(hw, k); }).filter(Boolean);

  function declineById(hw, id) { var all = hw.decline || []; for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i]; return null; }

  function refLabel(hw, r) {
    if (r.indexOf('x:') === 0) return 'Explanation: ' + (CHAR[r.slice(2)] ? CHAR[r.slice(2)].name : r);

    if (r.indexOf('d:') === 0) { var dd = declineById(hw, r.slice(2)); return dd ? 'Candidate explanation: ' + declineLabel(dd) : r; }
    var n = noteByKey(hw, r.slice(2));

  function buildReportText(hw) {

    if (hw.routeIndex != null) line('Route ' + (hw.routeIndex + 1) + ': ' + routeLabel(hw.routeIndex));
    line('');
    line('OVERVIEW');
    CONFIG.characteristics.forEach(function (c) {
      var parts = [];
      for (var s = 0; s < n; s++) { var r = finalRating(hw, s, c.id); parts.push(hwSiteName(hw, s) + ': ' + (r ? RATING[r].label : 'not rated')); }
      line('- ' + c.name + ' | ' + parts.join(' | '));
    });
    var dl = doubleRatedList(hw);
    if (dl.length) {
      line(''); line('AGREEMENT');
      dl.forEach(function (d) {
        var a = hw.agree[d.si + '|' + d.c] || {};
        line('- ' + CHAR[d.c].name + ', ' + hwSiteName(hw, d.si) + ': ' + d.cell.ratings.map(function (x) { return x.l + ' ' + RATING[x.rating].label; }).join(', ') + ' -> ' + (a.rating ? RATING[a.rating].label : 'unresolved'));
        if (a.reason) line('  ' + a.reason);
      });
    }
    line(''); line('EXPLANATIONS');
    CONFIG.characteristics.forEach(function (c) {
      var e = hw.explain[c.id];
      if (!e || !e.on) return;
      line('* ' + c.name.toUpperCase());
      for (var s = 0; s < n; s++) {
        var sd = (e.sites && e.sites[s]) || {};
        line('  ' + hwSiteName(hw, s) + ': ' + (sd.text || '') + (sd.factors && sd.factors.length ? ' [' + sd.factors.map(function (f) { return FACTOR[f].label; }).join(', ') + ']' : ''));
      }
      if (n > 1) line('  Contrast: ' + (e.contrast || ''));
      (e.refs || []).forEach(function (k) { var x = noteByKey(hw, k); if (x) line('  Note: ' + x.x + ' (' + noteLabel(x) + ')'); });
      line('  In one sentence: ' + (e.line || ''));
    });
    line(''); line('OVERALL');
    for (var s5 = 0; s5 < n; s5++) {
      var o = hw.overall[s5] || {};
      line('- ' + hwSiteName(hw, s5) + ': ' + (o.level ? levelLabel(o.level) : 'not judged'));
      if (o.text) line('  ' + o.text);
    }
    line(''); line('CANDIDATE EXPLANATIONS OF DECLINE');
    if (!hw.decline.length) line('- none');
    hw.decline.forEach(function (d, i) {
      line('* ' + (i + 1) + '. ' + (CLAIM[d.claim] ? CLAIM[d.claim].name.toUpperCase() + ': ' + CLAIM[d.claim].def : 'No claim chosen'));
      line('  Lens: ' + (LENS[d.lens] ? LENS[d.lens].name : 'not chosen') + ' | What was seen at work: ' + (FACTOR[d.factor] ? FACTOR[d.factor].label : 'not chosen'));
      (d.refs || []).forEach(function (r) { line('  Rests on: ' + refLabel(hw, r)); });
      line('  Mechanism: ' + (d.mechanism || ''));
      line('  Evidence that would test it: ' + (d.evidence || ''));
      line('  In one sentence: ' + (d.line || ''));
    });
    line(''); line('DECLINE CLAIMS');
    line(CONFIG.snapshotNote);
    CONFIG.claims.forEach(function (cl) {
      var e = hw.claims[cl.id] || {};
      line('* ' + cl.name.toUpperCase() + ': ' + cl.def);
      line('  Scope: ' + (scopeLabel(e.scope) || 'not judged'));
      line('  Why: ' + (e.why || ''));
      if (e.suggests) line('  What the visit suggests: ' + e.suggests);
      (e.refs || []).forEach(function (r) { line('  Linked: ' + refLabel(hw, r)); });

      if (e.scope === 'speaks' || e.scope === 'partly') line('  Finding: ' + (e.finding || ''));
    });
    var spots = hwSpots(hw);
    if (spots.length) {
      line(''); line(CONFIG.text.homework.spotTitle.toUpperCase());

  function setStatus(msg) {

  function copyToClipboard(text, done) {
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        done(ok);
      } catch (e) { done(false); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    else fallback();
  }

  function exportJson() {
    var data = clone(S[mode]);
    var name = 'week5-' + mode;
    if (mode === 'observer') name += '-group' + (data.join.group || 'x') + '-' + (data.join.letter || 'x');
    if (mode === 'homework') name += '-' + (String(data.me.name || 'student').replace(/[^A-Za-z0-9]+/g, '-').toLowerCase());
    try {
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      setStatus(CONFIG.text.tools.exported);
    } catch (e) { setStatus(CONFIG.text.tools.importFailed + e.message); }
  }

  // Imports a JSON file. Homework also accepts an observer export.
  function importJson(text) {
    var data;
    try { data = JSON.parse(text); } catch (e) { return 'not valid JSON.'; }
    if (!data || typeof data !== 'object') return 'not a saved file from this tool.';
    if (data.schema === SCHEMAS[mode]) { S[mode] = normalise(mode, data); return ''; }
    if (mode === 'homework' && data.schema === SCHEMAS.observer) { loadObserverIntoHomework(normalise('observer', data)); return ''; }
    return 'it was saved from a different part of the tool (' + (data.schema || 'unknown') + ').';
  }

  function hwExpect() { return { group: S.homework.group, routeIndex: S.homework.routeIndex, own: null }; }
  function hwAccept(records) {
    var hw = S.homework;
    if (hw.group == null) {
      for (var i = 0; i < records.length; i++) if (records[i].g != null && records[i].r != null) { hw.group = records[i].g; hw.routeIndex = records[i].r; break; }
    }
    var res = mergeRecords(hw.records, records.filter(function (r) { return r.l; }), hwExpect());
    hw.records = res.records;
    records.filter(function (r) { return !r.l; }).forEach(function (r) { res.report.rejected.push((r.n || 'An observer') + ': no observer letter.'); });
    return res.report;
  }
  function loadObserverIntoHomework(obs) {
    var hw = S.homework;
    var own = buildShareRecord(obs);
    var peers = Object.keys(obs.peers).map(function (k) { return obs.peers[k]; });
    if (hw.group == null && own.g != null) { hw.group = own.g; hw.routeIndex = own.r; }
    var key = own.l || '_';
    if (own.g === hw.group && own.r === hw.routeIndex) hw.records[key] = own;
    var report = hwAccept(peers);
    if (own.g !== hw.group || own.r !== hw.routeIndex) report.rejected.push('Your own observer data is from a different group or route.');
    else report.added.unshift('Your own data' + (own.l ? ' (observer ' + own.l + ')' : ''));
    if (!hw.me.name && own.n) hw.me.name = own.n;
    if (!hw.me.letter) hw.me.letter = key;
    ui.hwReport = report;
  }

  function parsePasted(text) {
    var codes = extractShareCodes(text);
    var recs = [], invalid = [];
    codes.forEach(function (c, i) {
      var p = parseShareCode(c);
      if (p.ok) recs.push(p.record); else invalid.push('Code ' + (i + 1) + ': ' + p.error);
    });
    if (!codes.length) invalid.push('No share codes found in the pasted text.');
    return { records: recs, invalid: invalid };
  }

    render();
    var again = document.getElementById('note-in-' + si + '-' + c);
    if (again) again.focus();
