<!--
  Week 5 field visit (Activity 8, EXPLAIN phase).

  One self-contained file with three entry points, chosen on the start
  screen or by URL hash:
    #instructor  laptop console: allocate routes, briefing crib, debrief guide
    #observer    each student's phone: join, role, field log, huddle, share-out
    #homework    per student, any device: sort, agreement, explain, overall,
                 decline claims, outputs (A4 report, A6 cards)

  All editable content is in CONFIG at the top of the script.
  No network calls: phones exchange data only as pasted share codes.

  Storage keys (localStorage, one per entry point):
    tp-w5-instructor-v1, tp-w5-observer-v1, tp-w5-homework-v1

  Join code: 4 characters from a 31-character alphabet (no 0, O, 1, I, L).
    char 1 = group number, char 2 = route index,
    char 3 = hash of the route's site ids (rejects codes made from a
             different route list), char 4 = check character
             (1*c1 + 2*c2 + 3*c3) mod 31, which catches any single typo
             and any swap of two neighbouring characters.

  Share code: TP5.<version>.<base64url of UTF-8 JSON>.<FNV-1a checksum, 8 hex>
    JSON keys: v version, g group, r route index, h route hash, s group size,
    l observer letter, n name, sk skipped join steps, ra ratings by site
    index then characteristic id, no notes [{i id, s site index,
    c characteristic id, x text, t time, f factor id}], sp places spotted on
    the walk [{i id, x what and where, y why, k status id, t time}]
    (optional: codes without sp still load), at created (ms).
    Site indices run 0-2: a route has one to three sites.
-->
<style>
:root {
  --bg: #F2DFBE;
  --bg-card: #FFFAF2;
  --bg-deep: #E8D2A8;
  --text: #2A1F18;
  --text-muted: #6A5A48;
  --border: #D8C8A8;

  --char-1: #5C3A96;
  --char-2: #B52838;
  --char-3: #C85218;
  --char-4: #D4A020;
  --char-5: #7A5828;
  --char-6: #B83068;
  --char-7: #CC6830;
  --char-8: #7E58A8;

  --correct: #2A7A42;
  --correct-bg: #E6F4EA;
  --incorrect: #B82828;
  --incorrect-bg: #FDEEEE;
  --ambiguous: #B98A10;
  --ambiguous-bg: #FFF3D6;

  --claim-supply: #C85218;
  --claim-use: #7A5828;
  --claim-quality: #B83068;
  --claim-outcome: #7E58A8;

  --accent: var(--char-1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  overflow-x: hidden;
}

.app-wrap { max-width: 1180px; margin: 0 auto; padding: 1.5rem 2rem 4rem; position: relative; }

h1 {
  font-size: clamp(2.2rem, 6vw, 4rem);
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  line-height: 1.05;
  margin-bottom: 0.6rem;
  position: relative;
  z-index: 1;
}
h2 {
  font-size: clamp(1.5rem, 3vw, 2.1rem);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  line-height: 1.15;
  margin-bottom: 0.75rem;
}
h3 {
  font-size: 1.1rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  line-height: 1.25;
  margin-bottom: 0.5rem;
}
p { margin-bottom: 0.75rem; }
p:last-child { margin-bottom: 0; }

.eyebrow {
  display: block;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 0.4rem;
}
.lede { font-size: 1.05rem; line-height: 1.6; color: var(--text-muted); max-width: 720px; position: relative; z-index: 1; }
.quiet { color: var(--text-muted); }
.small { font-size: 0.88rem; }
.alert { color: var(--incorrect); font-weight: 700; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- Focus ---------- */
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--char-1); outline-offset: 2px; }
.chip input:focus-visible + span { outline: 3px solid var(--char-1); outline-offset: 2px; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--char-1); outline-offset: 1px; border-color: var(--char-1); }

/* ---------- Page header ---------- */
.page-header { position: relative; overflow: hidden; padding: 2.5rem 0 1.75rem; }
.page-header::before {
  content: ''; position: absolute; width: 260px; height: 260px;
  background: var(--char-1); border-radius: 50%; opacity: 0.08;
  top: -70px; right: -40px; z-index: 0; pointer-events: none;
}
.page-header::after {
  content: ''; position: absolute; width: 80px; height: 80px;
  background: var(--char-4); opacity: 0.12;
  bottom: 24px; right: 170px; transform: rotate(22deg); z-index: 0; pointer-events: none;
}
.page-header .deco-ring {
  position: absolute; width: 110px; height: 110px; border: 6px solid var(--char-2);
  border-radius: 50%; opacity: 0.1; top: 18px; right: 70px; z-index: 0; pointer-events: none;
}
.page-header .deco-tri {
  position: absolute; width: 0; height: 0; z-index: 0; pointer-events: none;
  border-left: 34px solid transparent; border-right: 34px solid transparent;
  border-bottom: 58px solid var(--char-3); opacity: 0.12; top: 30px; right: 260px; transform: rotate(-14deg);
}
.page-header .deco-bar {
  position: absolute; width: 140%; height: 6px; background: var(--char-3);
  bottom: 0; left: -20%; transform: rotate(-1.2deg); opacity: 0.2; z-index: 0; pointer-events: none;
}
.page-header .eyebrow { color: var(--char-2); position: relative; z-index: 1; }
.header-rule { margin: 1.5rem 0 0; height: 4px; background: var(--char-1); border: none; position: relative; z-index: 1; }
.header-rule::after { content: ''; display: block; height: 4px; background: var(--char-4); width: 30%; margin-top: 4px; }

.page-header.compact { padding: 1rem 0 0.75rem; }
.page-header.compact h1 { font-size: clamp(1.5rem, 4vw, 2.2rem); margin-bottom: 0; }
.page-header.compact .lede, .page-header.compact .deco-tri { display: none; }
.page-header.compact .header-rule { margin-top: 0.75rem; }
.page-header.compact::before { width: 160px; height: 160px; top: -60px; }
.page-header.compact::after { width: 44px; height: 44px; bottom: 12px; right: 120px; }
.page-header.compact .deco-ring { width: 70px; height: 70px; top: 4px; right: 40px; }

/* ---------- Buttons ---------- */
.btn {
  font-family: inherit; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; border: 2px solid transparent; cursor: pointer;
  padding: 0.6rem 1.2rem; min-height: 44px; min-width: 44px; border-radius: 0;
  background: var(--char-1); color: #fff; display: inline-flex; align-items: center;
  justify-content: center; gap: 0.4rem; text-decoration: none; text-align: center;
  transition: background-color 0.15s ease, transform 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.btn:hover { background: var(--char-2); transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn:disabled:hover { background: var(--char-1); }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--text); }
.btn-ghost:hover { background: var(--text); color: var(--bg-card); }
.btn-ghost:disabled:hover { background: transparent; color: var(--text); }
.btn-red { background: var(--char-2); }
.btn-red:hover { background: var(--char-1); }
.btn-brown { background: var(--char-5); }
.btn-small { font-size: 0.72rem; padding: 0.4rem 0.8rem; letter-spacing: 0.1em; }
.btn-row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
.btn-row + .btn-row { margin-top: 0.6rem; }

/* ---------- Mode bar and tools ---------- */
.mode-bar {
  display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; align-items: center;
  justify-content: space-between; margin: 1rem 0 0.75rem;
}
.mode-tag {
  display: inline-flex; align-items: center; gap: 0.6rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.85rem;
}
.mode-tag .pip { width: 14px; height: 14px; background: var(--accent); display: inline-block; }
.mode-links { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.tools { border: 2px solid var(--border); background: var(--bg-card); margin-bottom: 1rem; }
.tools > summary {
  list-style: none; cursor: pointer; min-height: 44px; display: flex; align-items: center;
  padding: 0.5rem 1rem; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; border-left: 6px solid var(--char-5);
}
.tools > summary::-webkit-details-marker { display: none; }
.tools > summary::after { content: '+'; margin-left: auto; font-size: 1.2rem; }
.tools[open] > summary::after { content: '\2212'; }
.tools-body { padding: 0.75rem 1rem 1rem; border-top: 2px solid var(--border); }
.status-line { margin-top: 0.6rem; font-size: 0.9rem; font-weight: 600; min-height: 1.4em; }
.confirm-box {
  margin-top: 0.75rem; padding: 0.9rem 1rem; border: 2px solid var(--incorrect);
  border-left-width: 6px; background: var(--incorrect-bg);
}

/* ---------- Tabs ---------- */
.tabs {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 4px;
  border-bottom: 2px solid var(--border); margin-bottom: 1.25rem;
}
.tab {
  background: none; border: none; border-bottom: 4px solid transparent; margin-bottom: -2px;
  font-family: inherit; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-muted); padding: 0.55rem 0.4rem;
  min-height: 48px; cursor: pointer; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; text-align: center; overflow-wrap: anywhere; transition: color 0.2s ease, border-color 0.2s ease;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); background: var(--bg-card); }
.tab .tab-state { font-size: 0.68rem; letter-spacing: 0.06em; font-weight: 700; }
.tab .tab-state.done { color: var(--text); }

/* ---------- Panels and banners ---------- */
.panel {
  background: var(--bg-card); border: 2px solid var(--border); border-left: 6px solid var(--accent);
  padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; position: relative; overflow: hidden;
}
.panel > .eyebrow:first-child { color: var(--text-muted); }
.panel.tinted { background: var(--bg-card); }
.panel .deco-dot {
  position: absolute; width: 90px; height: 90px; border-radius: 50%; background: var(--accent);
  opacity: 0.08; right: -24px; top: -24px; pointer-events: none;
}
.panel > *:not(.deco-dot) { position: relative; z-index: 1; }
.banner { background: var(--accent); color: #fff; padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; position: relative; overflow: hidden; }
.banner h2, .banner h3 { color: #fff; margin-bottom: 0.3rem; }
.banner p { color: #fff; }
.banner .eyebrow { color: #fff; opacity: 1; }
.banner::after {
  content: ''; position: absolute; width: 120px; height: 120px; border: 8px solid #fff;
  border-radius: 50%; opacity: 0.14; right: -30px; bottom: -40px; pointer-events: none;
}
.banner.dark-text, .banner.dark-text h2, .banner.dark-text h3, .banner.dark-text p, .banner.dark-text .eyebrow { color: var(--text); }
.banner.dark-text::after { border-color: var(--text); }
.notice {
  border: 2px solid var(--border); border-left: 6px solid var(--ambiguous); background: var(--ambiguous-bg);
  padding: 0.8rem 1rem; margin-bottom: 1rem; font-size: 0.95rem;
}
.notice.bad { border-left-color: var(--incorrect); background: var(--incorrect-bg); }
.notice.good { border-left-color: var(--correct); background: var(--correct-bg); }
.notice.plain { border-left-color: var(--char-1); background: var(--bg-card); }
.ph { background: var(--ambiguous-bg); border: 1.5px dashed var(--ambiguous); padding: 0 4px; font-size: 0.9em; }

.section-break { position: relative; height: 26px; margin: 0.75rem 0; overflow: hidden; }
.section-break::before {
  content: ''; position: absolute; width: 120%; height: 6px; background: var(--accent);
  top: 10px; left: -10%; transform: rotate(-1.5deg);
}

/* ---------- Start screen ---------- */
.start-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.25rem; position: relative; margin-top: 1rem; }
.start-wrap { position: relative; overflow: hidden; padding: 1rem 0 2rem; }
.start-wrap::before {
  content: ''; position: absolute; width: 380px; height: 380px; background: var(--char-6);
  opacity: 0.07; transform: rotate(18deg); left: -120px; bottom: -160px; pointer-events: none;
}
.start-wrap::after {
  content: ''; position: absolute; width: 180px; height: 180px; border: 8px solid var(--char-5);
  border-radius: 50%; opacity: 0.1; right: 8%; bottom: -50px; pointer-events: none;
}
.start-card {
  display: flex; flex-direction: column; gap: 0.5rem; text-decoration: none; color: #fff;
  background: var(--accent); padding: 1.5rem 1.5rem 1.75rem; min-height: 200px; position: relative;
  overflow: hidden; z-index: 1; transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.start-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(42,31,24,0.12); }
.start-card .sc-num { font-size: 3rem; font-weight: 800; line-height: 1; opacity: 0.35; }
.start-card .sc-title { font-size: 1.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; line-height: 1.1; }
.start-card .sc-desc { font-size: 1rem; line-height: 1.5; }
.start-card .sc-who { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin-top: auto; }
.start-card::after {
  content: ''; position: absolute; width: 90px; height: 90px; background: #fff; opacity: 0.12;
  right: -20px; top: -20px; transform: rotate(30deg);
}
.start-card.dark-text { color: var(--text); }

/* ---------- Form controls ---------- */
.field { margin-bottom: 1.1rem; }
.field > label, .field-label, fieldset > legend {
  display: block; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; margin-bottom: 0.35rem; color: var(--text);
}
fieldset { border: none; margin-bottom: 1.1rem; min-width: 0; }
.help { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.4rem; }
input[type="text"], textarea, select {
  font-family: inherit; font-size: 1rem; color: var(--text); background: #fff;
  border: 2px solid var(--border); border-radius: 0; padding: 0.6rem 0.75rem; width: 100%;
  min-height: 44px; transition: border-color 0.2s ease;
}
textarea { line-height: 1.5; resize: vertical; }
input.code-input { font-size: 1.8rem; font-weight: 800; letter-spacing: 0.4em; text-transform: uppercase; max-width: 15rem; text-align: center; }
.wc { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; margin-top: 0.25rem; color: var(--text-muted); }
.wc.ok { color: var(--correct); }
.wc.short, .wc.over { color: var(--incorrect); }

.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chip { position: relative; display: inline-flex; cursor: pointer; }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip span, .chip-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
  min-height: 44px; min-width: 44px; padding: 0.35rem 0.75rem; border: 2px solid var(--border);
  background: #fff; font-family: inherit; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--text); cursor: pointer; text-align: left;
  transition: border-color 0.2s ease, background-color 0.2s ease;
}
.chip span:hover, .chip-btn:hover { border-color: var(--accent); }
.chip input:checked + span, .chip-btn[aria-pressed="true"] {
  border: 3px solid var(--accent); background: var(--bg-deep); padding: 0.3rem 0.7rem;
}
.chip input:checked + span::before, .chip-btn[aria-pressed="true"]::before { content: '\2713'; font-weight: 800; }
.chip input:disabled + span { opacity: 0.4; cursor: not-allowed; }
.chips.big .chip span, .chips.big .chip-btn { font-size: 0.9rem; min-height: 52px; }
.chips.grid2 { display: grid; grid-template-columns: 1fr 1fr; }
.chips.grid2 .chip span { width: 100%; justify-content: flex-start; }

/* ---------- Characteristic cards (field) ---------- */
.char-card {
  background: var(--bg-card); border: 2px solid var(--border); border-left: 8px solid var(--accent);
  padding: 1.1rem 1.1rem 1.2rem; margin-bottom: 1.25rem; position: relative; overflow: hidden;
}
.char-card::after {
  content: ''; position: absolute; width: 70px; height: 70px; background: var(--accent);
  opacity: 0.1; right: -18px; top: -18px; transform: rotate(24deg); pointer-events: none;
}
.char-head { display: flex; gap: 0.75rem; align-items: flex-start; margin-bottom: 0.6rem; }
.char-num {
  flex-shrink: 0; width: 40px; height: 40px; background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.25rem;
}
.char-num.dark-text { color: var(--text); }
.char-name { font-size: 1.15rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.2; }
.char-def { font-size: 0.92rem; color: var(--text-muted); }
.lookfor { margin: 0.4rem 0 0.9rem 0; padding: 0; list-style: none; }
.lookfor li { position: relative; padding-left: 1.2rem; font-size: 0.98rem; margin-bottom: 0.3rem; }
.lookfor li::before { content: ''; position: absolute; left: 0; top: 0.5em; width: 9px; height: 9px; background: var(--accent); }
.restrict { font-size: 0.88rem; border-left: 4px solid var(--incorrect); padding: 0.4rem 0.6rem; background: var(--incorrect-bg); margin-bottom: 0.7rem; }

.note-add { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
.note-add input { flex: 1; min-width: 0; }
.note-list { list-style: none; margin-top: 0.75rem; }
.note {
  border-top: 2px solid var(--border); padding: 0.6rem 0; font-size: 0.95rem;
}
.note-meta { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
.note-text { margin: 0.15rem 0 0.4rem; overflow-wrap: anywhere; }
.note .chips { margin-bottom: 0.4rem; }
.note .chip-btn { font-size: 0.68rem; padding: 0.2rem 0.5rem; letter-spacing: 0.04em; }
.note .chip-btn[aria-pressed="true"] { padding: 0.15rem 0.45rem; }
.factor-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.25rem; display: block; color: var(--text-muted); }

/* ---------- Field chrome ---------- */
.ethics-strip {
  position: sticky; top: 0; z-index: 20; background: var(--char-5); color: #fff;
  padding: 0.5rem 0.9rem; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em;
  margin: 0 0 1rem; border-bottom: 4px solid var(--char-4);
}
.lens-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.4rem; }
.lens-tag {
  display: inline-flex; align-items: center; gap: 0.45rem; min-height: 36px; padding: 0.3rem 0.75rem;
  border: 2px solid var(--accent); background: var(--bg-card); color: var(--text);
  font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  transition: background-color 0.2s ease, color 0.2s ease;
}
.lens-tag .pip { width: 10px; height: 10px; background: var(--accent); display: inline-block; }
.lens-tag.filled { background: var(--accent); color: #fff; }
.lens-tag.filled .pip { background: #fff; }
.lens-tag.filled.dark-ink { color: var(--text); }
.lens-tag.filled.dark-ink .pip { background: var(--text); }
.spot-reminder {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem;
  border-left: 6px solid var(--char-7); background: rgba(204,104,48,0.10); padding: 0.5rem 0.75rem;
  margin-bottom: 1rem; font-size: 0.9rem; font-weight: 600;
}
.ethics-strip .es-extra { display: block; font-weight: 600; margin-top: 0.2rem; }
.site-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 0.9rem; }
.site-switch.single { grid-template-columns: 1fr; }
.site-switch.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.site-btn {
  font-family: inherit; text-align: left; border: 2px solid var(--border); background: var(--bg-card);
  padding: 0.6rem 0.8rem; min-height: 60px; cursor: pointer; color: var(--text);
  border-top: 6px solid var(--border); transition: border-color 0.2s ease;
}
.site-btn .sb-num { display: block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
.site-btn .sb-name { display: block; font-weight: 800; font-size: 0.95rem; line-height: 1.2; }
.site-btn[aria-pressed="true"] { border-color: var(--char-1); border-top-color: var(--char-1); background: #fff; }
.clocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.5rem; margin-bottom: 1rem; }
.clock { background: var(--text); color: var(--bg-card); padding: 0.6rem 0.8rem; border-left: 6px solid var(--char-4); }
.clock .ck-label { display: block; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.clock .ck-time { font-size: 1.6rem; font-weight: 800; line-height: 1.1; }
.clock .ck-left { display: block; font-size: 0.85rem; font-weight: 600; }
.clock.past { border-left-color: var(--char-2); }
.site-info { font-size: 0.9rem; margin-bottom: 1rem; }

/* ---------- Ratings ---------- */
.mark { display: inline-block; width: 18px; height: 18px; border: 3px solid var(--accent); vertical-align: -3px; flex-shrink: 0; background: transparent; }
.mark-present { background: var(--accent); }
.mark-partial { box-shadow: inset 6px 0 0 var(--accent); }
.mark-absent { background: transparent; }
.mark-na { border-style: dashed; border-color: var(--text-muted); }
.mark-none { border: 2px dotted var(--border); }
.rating-pill { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; font-weight: 700; white-space: nowrap; }
.rating-pill .lt { font-size: 0.68rem; color: var(--text-muted); }

/* ---------- Tables and grids ---------- */
.table-wrap { overflow-x: auto; margin-bottom: 1rem; }
table { border-collapse: collapse; width: 100%; background: var(--bg-card); }
th, td { border: 2px solid var(--border); padding: 0.5rem 0.6rem; text-align: left; vertical-align: top; font-size: 0.92rem; }
th { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; background: var(--bg-deep); }
th[scope="row"] { font-size: 0.88rem; letter-spacing: 0.01em; text-transform: none; background: var(--bg-card); }
.char-cell { border-left: 6px solid var(--accent); font-weight: 700; min-width: 8rem; }
.merged td { min-width: 7rem; }
.agree-tag { display: inline-block; margin-top: 0.25rem; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 1px 5px; border: 2px solid var(--correct); color: var(--correct); }
.agree-tag.differ { border-color: var(--incorrect); color: var(--incorrect); }
.cell-ratings { display: flex; flex-direction: column; gap: 0.2rem; }
.joincode { font-size: 2.4rem; font-weight: 800; letter-spacing: 0.3em; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
.joincode.small { font-size: 1.2rem; letter-spacing: 0.2em; }
.spell { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }

/* ---------- Instructor ---------- */
.group-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.5rem; margin-top: 0.75rem; }
.group-btn, .route-btn {
  font-family: inherit; text-align: left; cursor: pointer; background: #fff; color: var(--text);
  border: 2px solid var(--border); border-left: 6px solid var(--border); padding: 0.6rem 0.8rem;
  min-height: 64px; transition: border-color 0.2s ease, background-color 0.2s ease;
}
.group-btn:hover:not(:disabled), .route-btn:hover:not(:disabled) { border-color: var(--char-1); }
.group-btn[aria-pressed="true"] { border-color: var(--char-1); border-width: 3px; border-left-width: 6px; background: rgba(92,58,150,0.10); }
.group-btn.allocated { border-left-color: var(--char-1); }
.group-btn .gb-title, .route-btn .rb-title { display: block; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; }
.group-btn .gb-sub, .route-btn .rb-sub { display: block; font-size: 0.85rem; color: var(--text-muted); }
.route-list { display: grid; gap: 0.5rem; }
.route-btn { width: 100%; }
.route-btn[aria-pressed="true"] { border-color: var(--char-3); border-width: 3px; border-left-width: 6px; background: rgba(200,82,24,0.10); }
.route-btn:disabled { opacity: 0.55; cursor: not-allowed; background: var(--bg); }
.route-btn .rb-warn { display: block; font-size: 0.85rem; font-weight: 700; color: var(--incorrect); }
.stepper { display: inline-flex; align-items: center; gap: 0.5rem; }
.stepper output { min-width: 6rem; text-align: center; font-weight: 800; }
.crib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
.crib-char { border-left: 6px solid var(--accent); padding: 0.4rem 0 0.4rem 0.8rem; background: var(--bg); }
.crib-char h3 { font-size: 0.95rem; margin-bottom: 0.2rem; }
.ethics-list { list-style: none; counter-reset: eth; }
.ethics-list li { counter-increment: eth; position: relative; padding: 0.35rem 0 0.35rem 2.2rem; border-top: 2px solid var(--border); }
.ethics-list li::before {
  content: counter(eth); position: absolute; left: 0; top: 0.35rem; width: 1.6rem; height: 1.6rem;
  background: var(--char-2); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 0.85rem;
}
.disc-item { border-top: 4px solid var(--accent); padding-top: 0.75rem; margin-top: 1rem; }
.disc-line { font-size: 0.95rem; margin-bottom: 0.3rem; }
.disc-line strong { text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.1em; }

/* ---------- Observer role / huddle / share ---------- */
.role-card { background: var(--accent); color: #fff; padding: 1.5rem; margin-bottom: 1.25rem; position: relative; overflow: hidden; }
.role-card .rc-letter { font-size: 4.5rem; font-weight: 800; line-height: 1; }
.role-card .rc-title { font-size: 1.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
.role-card p { color: #fff; }
.role-card::after {
  content: ''; position: absolute; width: 150px; height: 150px; border: 10px solid #fff; border-radius: 50%;
  opacity: 0.15; right: -40px; top: -40px; pointer-events: none;
}
.role-chars { list-style: none; margin-top: 0.75rem; }
.role-chars li { display: flex; gap: 0.6rem; align-items: center; background: var(--bg-card); color: var(--text); padding: 0.5rem 0.7rem; margin-bottom: 0.4rem; font-weight: 700; }
.letters { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
.letter {
  width: 52px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border: 3px solid var(--text); font-weight: 800; font-size: 1.2rem; line-height: 1;
}
.letter small { font-size: 0.55rem; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; }
.letter.have { background: var(--text); color: var(--bg-card); }
.letter.missing { border-style: dashed; color: var(--text-muted); border-color: var(--text-muted); }
.code-box { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 0.8rem; word-break: break-all; background: #fff; }
.report-list { list-style: none; font-size: 0.92rem; }
.report-list li { padding: 0.3rem 0 0.3rem 0.7rem; border-left: 4px solid var(--correct); margin-bottom: 0.25rem; background: var(--correct-bg); }
.report-list li.bad { border-left-color: var(--incorrect); background: var(--incorrect-bg); }
.report-list li.warn { border-left-color: var(--ambiguous); background: var(--ambiguous-bg); }
.contrast-block { background: var(--char-1); color: #fff; padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; position: relative; overflow: hidden; }
.contrast-block label, .contrast-block .field-label, .contrast-block p, .contrast-block .wc { color: #fff; }
.contrast-block .wc.short, .contrast-block .wc.over { color: #fff; text-decoration: underline; }
.contrast-block::after { content: ''; position: absolute; width: 0; height: 0; border-left: 50px solid transparent; border-right: 50px solid transparent; border-bottom: 86px solid var(--char-4); opacity: 0.35; right: -20px; bottom: -30px; transform: rotate(18deg); pointer-events: none; }
.contrast-block > * { position: relative; z-index: 1; }
.contrast-block :focus-visible { outline-color: #fff; }
.readaloud { font-size: 1.05rem; line-height: 1.6; }

/* ---------- Homework ---------- */
.hw-note { border: 2px solid var(--border); border-left: 6px solid var(--accent); background: var(--bg-card); padding: 0.9rem 1rem; margin-bottom: 1rem; }
.hw-note.ok { border-left-color: var(--correct); }
.hw-note blockquote { font-size: 1.02rem; font-weight: 600; margin: 0.2rem 0 0.6rem; overflow-wrap: anywhere; }
.tag-row { margin-bottom: 0.6rem; }
.claim-head { padding: 0.9rem 1.25rem; color: #fff; background: var(--accent); margin: -1.25rem -1.5rem 1rem; }
.claim-head .ch-name { font-size: 1.3rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
.claim-head .ch-def { font-size: 1.2rem; font-weight: 700; line-height: 1.35; }
.check-list { list-style: none; }
.check-list li { padding: 0.35rem 0 0.35rem 1.9rem; position: relative; border-top: 2px solid var(--border); }
.check-list li::before { content: ''; position: absolute; left: 0; top: 0.55rem; width: 16px; height: 16px; border: 3px solid var(--incorrect); }
.check-list li.done::before { background: var(--correct); border-color: var(--correct); }
.check-list li .issue { display: block; font-size: 0.85rem; color: var(--incorrect); }
.preview-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
.loaded-list { list-style: none; }
.loaded-list li { padding: 0.45rem 0.6rem; border-left: 6px solid var(--char-1); background: #fff; margin-bottom: 0.35rem; }

/* ---------- Cards (screen preview and print) ---------- */
.a6 {
  border: 2px dashed var(--text-muted); background: #fff; padding: 1rem; display: flex; flex-direction: column;
  aspect-ratio: 105 / 148; overflow: hidden; position: relative;
}
.a6 .a6-eyebrow { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
.a6 .a6-bar { height: 8px; background: var(--accent); margin: 0.4rem 0 0.6rem; }
.a6 .a6-title { font-size: 1.05rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.15; margin-bottom: 0.3rem; }
.a6 .a6-label { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-top: 0.5rem; }
.a6 .a6-text { font-size: 0.85rem; line-height: 1.4; overflow-wrap: anywhere; }
.a6 .a6-foot { margin-top: auto; padding-top: 0.5rem; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border-top: 2px solid var(--border); }

/* ---------- Route map ---------- */
.map-wrap { border: 2px solid var(--text); margin: 0.75rem 0 1rem; background: var(--bg-card); }
.route-map { display: block; width: 100%; height: auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.map-legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 1.25rem; }
.ml-route { border-top: 4px solid var(--accent); padding-top: 0.5rem; }
.ml-route h3 { margin-bottom: 0.35rem; }
.ml-site { display: flex; gap: 0.6rem; align-items: flex-start; margin-bottom: 0.6rem; }
.ml-code {
  flex: none; width: 2.2rem; height: 2.2rem; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent); color: var(--ink, #fff); font-weight: 800; font-size: 0.85rem;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.ml-code.ring { background: var(--bg-card); color: var(--text); border: 4px solid var(--accent); }
.ml-code.base { border-radius: 0; background: var(--text); color: #fff; }
.ml-link { display: inline-flex; align-items: center; min-height: 44px; color: var(--char-1); font-weight: 700; }

#print-area { display: none; }

/* ---------- Responsive ---------- */
@media (max-width: 860px) {
  .app-wrap { padding: 1rem 16px 3rem; }
}
@media (max-width: 600px) {
  .page-header { padding: 1.5rem 0 1.25rem; }
  .page-header .deco-tri { display: none; }
  .panel { padding: 1rem 1rem; }
  .banner { padding: 1rem; }
  .claim-head { margin: -1rem -1rem 1rem; }
  .tabs { grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); }
  .tab { font-size: 0.66rem; letter-spacing: 0.04em; padding: 0.5rem 0.2rem; }
  .chips.grid2 { grid-template-columns: 1fr; }
  .joincode { font-size: 2rem; }
  th, td { padding: 0.4rem; font-size: 0.85rem; }
  .char-cell { min-width: 6.5rem; }
  table.merged { table-layout: fixed; }
  table.merged th[scope="row"] { width: 34%; min-width: 0; font-size: 0.72rem; letter-spacing: 0.02em; text-transform: none; }
  table.merged thead th:first-child { width: 34%; }
  .merged td { min-width: 0; padding: 0.35rem 0.3rem; }
  .merged .rating-pill { font-size: 0.72rem; gap: 0.2rem; white-space: normal; }
  .merged .mark { width: 14px; height: 14px; border-width: 2px; }
  .merged .agree-tag { font-size: 0.6rem; }
  .merged thead th { font-size: 0.62rem; letter-spacing: 0.03em; overflow-wrap: anywhere; padding: 0.35rem 0.3rem; }
  .merged .char-cell { min-width: 0; }
  .merged select { font-size: 0.8rem; padding: 0.3rem; margin-top: 0.2rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .btn:hover, .start-card:hover { transform: none; }
}

/* ---------- Print ---------- */
@page { size: A4; margin: 10mm; }
@media print {
  body { background: #fff; font-size: 10pt; }
  .app-wrap, .ethics-strip { display: none !important; }
  #print-area { display: block; color: #2A1F18; }
  * { box-shadow: none !important; }
  .p-doc h1 { font-size: 18pt; margin-bottom: 2mm; }
  .p-doc h2 { font-size: 13pt; margin: 5mm 0 2mm; padding-top: 2mm; border-top: 1.2mm solid var(--accent); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .p-doc h3 { font-size: 10.5pt; margin: 3mm 0 1mm; }
  .p-doc p, .p-doc li, .p-doc td, .p-doc th { font-size: 9.5pt; }
  .p-doc .p-meta { font-size: 9pt; color: #6A5A48; margin-bottom: 3mm; }
  .p-doc .p-block { break-inside: avoid; border-left: 1.2mm solid var(--accent); padding-left: 3mm; margin-bottom: 3mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .p-doc table { break-inside: auto; }
  .p-doc tr { break-inside: avoid; }
  .p-doc th, .p-doc td { border: 0.3mm solid #B9A98C; padding: 1.2mm 1.6mm; }
  .p-doc th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .p-doc .char-cell { border-left: 1.5mm solid var(--accent); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .mark, .agree-tag, .ethics-list li::before { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .card-sheet {
    display: grid; grid-template-columns: 95mm 95mm; grid-template-rows: 134mm 134mm;
    break-after: page; page-break-after: always;
  }
  .card-sheet:last-child { break-after: auto; page-break-after: auto; }
  .card-sheet .a6 {
    aspect-ratio: auto; width: 95mm; height: 134mm; border: 0.3mm dashed #8A7A62; padding: 6mm;
  }
  .card-sheet .a6 .a6-bar { height: 2mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .card-sheet .a6 .a6-title { font-size: 12pt; }
  .card-sheet .a6 .a6-text { font-size: 9pt; }
  .card-sheet .a6 .a6-label { font-size: 6.5pt; }
  .card-sheet .a6 .a6-eyebrow { font-size: 6.5pt; }
  .card-sheet .a6 .a6-foot { font-size: 7pt; }
}
</style>
</head>
<body>
<div class="app-wrap" id="w5-app">
  <header class="page-header" id="w5-header">
    <div class="deco-ring"></div>

    <div class="deco-bar"></div>
    <span class="eyebrow" id="w5-eyebrow"></span>
    <h1 id="w5-title"></h1>

</div>

        suggestsLinks: 'Linked notes, explanations, candidate explanations and places spotted on the walk',
        neededField: 'What evidence would be needed to test this claim properly? (For example: repeated observation over time, records of openings and closures, survey data.)',
        findingField: 'One-sentence finding for the claim-wall card',
        outputsTitle: 'Step 7 · Outputs',
        checklist: 'What is complete',
        printReport: 'Print A4 report',
        printCards: 'Print A6 cards',
        cardsTitle: 'Card preview',
        noClaimCards: 'No claim-wall cards: a card is made only for a claim you marked "speaks to" or "partly speaks to", with a finding and the evidence still needed.',

  // =====================================================================
  // Constants
  // =====================================================================
  var ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // 31 characters, no 0 O 1 I L

  // Counts words: whitespace-separated tokens that contain at least one

  // Status of a text against an optional minimum and maximum word count.

  function getPath(obj, path) {

    o[parts[parts.length - 1]] = value;

  // =====================================================================
  // Routes, join codes and timings (pure)
  // =====================================================================
  function routeHash(route) { return fnv1a(route.sites.join('|')) % 31; }

  function encodeJoinCode(group, routeIndex, routes) {

    if (!(group >= 1 && group <= 30 && group % 1 === 0)) return null;
    if (!(routeIndex >= 0 && routeIndex <= 30) || !routes[routeIndex]) return null;
    var v1 = group, v2 = routeIndex, v3 = routeHash(routes[routeIndex]);
    var v4 = (v1 + 2 * v2 + 3 * v3) % 31;

    routes = routes || CONFIG.routes;

    if (code.length !== 4) return { ok: false, code: code, error: 'A join code has 4 characters.' };
    var v = [];
    for (var i = 0; i < 4; i++) {
      var idx = ALPHABET.indexOf(code[i]);
      if (idx < 0) return { ok: false, code: code, error: '"' + code[i] + '" is never used in join codes (codes have no 0, O, 1, I or L). Check the code with your instructor.' };
      v.push(idx);
    }
    if ((v[0] + 2 * v[1] + 3 * v[2]) % 31 !== v[3]) return { ok: false, code: code, error: 'This code does not check out: a character is probably mistyped.' };
    if (v[0] < 1) return { ok: false, code: code, error: 'This code does not name a group.' };
    if (!routes[v[1]]) return { ok: false, code: code, error: 'This code names a route that is not in this file. Check you have the same file as your instructor.' };
    if (routeHash(routes[v[1]]) !== v[2]) return { ok: false, code: code, error: 'This code was made from a different route list. Check you have the same file as your instructor.' };

  }

  function routesShareSite(a, b) {
    if (!a || !b) return false;
    for (var i = 0; i < a.sites.length; i++) if (b.sites.indexOf(a.sites[i]) >= 0) return true;
    return false;
  }

  // Groups (other than `group`) whose allocated route shares a site with route `ri`.
  function routeConflicts(alloc, routes, group, ri) {

  }

  // Minutes for each walk between consecutive sites. walkBetween may be
  // one number (used for every such walk) or a list, one per walk.
  function betweenWalks(route) {

    }
    return out;
  }

  // Time on site per site, derived from session start/return and walks.
  // Observation time is split equally; the last site takes any remainder.
  // moves: time to leave each site except the last; moveBy: the first.
  function routeTimes(route, session) {
    session = session || CONFIG.session;
    var start = timeToMin(session.start), ret = timeToMin(session.returnBy);
    var n = route.sites.length;
    var walks = betweenWalks(route);
    var out = +route.walkOut || 0, back = +route.walkBack || 0;
    var between = walks.reduce(function (a, b) { return a + b; }, 0);
    var observe = (ret - start) - out - between - back;
    var leaveBy = ret - back;
    var per = Math.floor(observe / n);
    var sites = [], moves = [];
    var t = start + out;
    for (var i = 0; i < n; i++) {

      sites.push({ arrive: t, leave: leave, minutes: leave - t });
      if (i < n - 1) { moves.push(leave); t = leave + walks[i]; }

    var minObs = session.minObsMinutes;
    var short = shortest < minObs;
    var warning = '';
    if (shortest <= 0) warning = 'The walks take up all the time available: no time on site.';

    return { sites: sites, observe: observe, moveBy: moveBy, moves: moves, leaveBy: leaveBy, shortest: shortest, short: short, warning: warning };
  }

  function validateConfig(cfg) {
    cfg = cfg || CONFIG;
    var errs = [];
    var siteIds = {};
    cfg.sites.forEach(function (s) {
      if (siteIds[s.id]) errs.push('Site id "' + s.id + '" is used twice.');
      siteIds[s.id] = true;
    });
    cfg.sites.forEach(function (s) {
      if (!validLatLon(s.lat, s.lon)) errs.push('Site "' + s.id + '" needs a map position (lat and lon in decimal degrees).');
    });
    if (!validLatLon(cfg.session.baseLat, cfg.session.baseLon)) errs.push('session.baseLat and session.baseLon must give the base\'s map position.');
    var mi = cfg.mapImage;
    if (mi && !(validLatLon(mi.north, mi.west) && validLatLon(mi.south, mi.east) && mi.north > mi.south && mi.east > mi.west)) errs.push('mapImage edges must be decimal degrees with north > south and east > west.');
    else if (mi) cfg.sites.forEach(function (s) {
      if (validLatLon(s.lat, s.lon) && (s.lat > mi.north || s.lat < mi.south || s.lon > mi.east || s.lon < mi.west)) errs.push('Site "' + s.id + '" lies outside the map image.');
    });

      var label = 'Route ' + (i + 1);
      if (!r.sites || r.sites.length < 1 || r.sites.length > MAX_SITES) errs.push(label + ' must have one to ' + MAX_SITES + ' sites.');
      (r.sites || []).forEach(function (id) { if (!siteIds[id]) errs.push(label + ' names an unknown site "' + id + '".'); });
      if (r.sites && r.sites.some(function (id, i) { return r.sites.indexOf(id) !== i; })) errs.push(label + ' lists the same site twice.');
      function isMin(v) { return typeof v === 'number' && v >= 0; }
      ['walkOut', 'walkBack'].forEach(function (k) {

      });

    cfg.roles.forEach(function (r) {

    });

    return errs;
  }

  // Every CONFIG string that still starts with "PLACEHOLDER:".
  function listPlaceholders(cfg) {
    cfg = cfg || CONFIG;
    var out = [];
    (function walk(o, path) {
      if (typeof o === 'string') { if (isPlaceholder(o)) out.push({ path: path, text: o }); return; }

  // =====================================================================
  // Roles (pure)
  // =====================================================================
  function lettersForSize(size) {
    return CONFIG.roles.filter(function (r) { return r.minSize <= size; }).map(function (r) { return r.letter; });
  }
  function roleFor(size, letter) {
    if (!size || !letter) return null;

    return null;

  // Characteristics this observer covers (all eight when no role yet).
  function charsForObserver(join) {

  }
  // Characteristics covered by two observers for a given group size.
  function doubleCovered(size) {

  }

  // =====================================================================
  // Observer data and share codes (pure)
  // =====================================================================
  function routeOf(join) { return join && join.routeIndex != null ? CONFIG.routes[join.routeIndex] || null : null; }

  function defaultRating(siteId, chId) {

  }

    if (!join || !join.letter) sk.push('letter');
    if (!join || !String(join.name || '').trim()) sk.push('name');
    if (!join || !join.ethicsAt) sk.push('ethics');
    return sk;
  }

  // Builds the record an observer sends to the group.
  function buildShareRecord(obs, at) {
    var join = obs.join || {};
    var route = routeOf(join);
    var n = siteCountOf(join);
    var mine = charsForObserver(join);
    var ra = {};
    for (var si = 0; si < n; si++) {
      ra[si] = {};
      CHAR_IDS.forEach(function (c) {
        var rated = obs.ratings && obs.ratings[si] && obs.ratings[si][c];
        if (mine.indexOf(c) >= 0 || rated) {

      g: join.group == null ? null : join.group,
      r: join.routeIndex == null ? null : join.routeIndex,
      h: route ? routeHash(route) : null,
      s: join.size || null,
      l: join.letter || '',
      n: String(join.name || '').trim(),
      sk: skippedSteps(join),
      ra: ra,
      no: (obs.notes || []).map(function (x) { return { i: x.i, s: x.s, c: x.c, x: x.x, t: x.t, f: x.f || '' }; }),
      sp: (obs.spots || []).map(function (x) { return { i: x.i, x: x.x, y: x.y || '', k: x.k || '', t: x.t }; }),

  // Checks and cleans a decoded record. Returns null when unusable.
  function sanitizeRecord(o) {

    var rec = {
      v: o.v,
      g: (typeof o.g === 'number' && o.g >= 1 && o.g <= 30) ? o.g : null,
      r: (typeof o.r === 'number' && CONFIG.routes[o.r]) ? o.r : null,
      h: typeof o.h === 'number' ? o.h : null,
      s: CONFIG.groupSizes.indexOf(o.s) >= 0 ? o.s : null,
      l: LETTERS.indexOf(o.l) >= 0 ? o.l : '',
      n: typeof o.n === 'string' ? o.n.slice(0, 80) : '',
      sk: Array.isArray(o.sk) ? o.sk.filter(function (x) { return typeof x === 'string'; }).slice(0, 10) : [],
      ra: {},
      no: [],
      sp: [],

    if (rec.r != null && rec.h != null && routeHash(CONFIG.routes[rec.r]) !== rec.h) return null;
    var ra = o.ra && typeof o.ra === 'object' ? o.ra : {};

      if (!ra[si] || typeof ra[si] !== 'object') return;

      o.no.slice(0, 400).forEach(function (x) {

        if (typeof x.x !== 'string' || !CHAR[x.c] || !validSiteIndex(x.s)) return;
        rec.no.push({
          i: String(x.i || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 20), s: x.s, c: x.c, x: x.x.slice(0, 600),
          t: typeof x.t === 'string' ? x.t.slice(0, 5) : '', f: FACTOR[x.f] ? x.f : ''
        });
      });
    }
    if (Array.isArray(o.sp)) {
      o.sp.slice(0, 100).forEach(function (x) {
        if (!x || typeof x !== 'object' || typeof x.x !== 'string' || !x.x.trim()) return;
        rec.sp.push({
          i: String(x.i || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 20), x: x.x.slice(0, 300),
          y: typeof x.y === 'string' ? x.y.slice(0, 300) : '', k: SPOT_STATUS[x.k] ? x.k : '',
          t: typeof x.t === 'string' ? x.t.slice(0, 5) : ''
        });
      });
    }
    return rec;
  }

  function validSiteIndex(si) { return typeof si === 'number' && si % 1 === 0 && si >= 0 && si < MAX_SITES; }

  function parseShareCode(str) {
    var s = String(str || '').replace(/\s+/g, '');
    var m = /^([A-Za-z0-9]+)\.(\d+)\.([A-Za-z0-9_-]+)\.([0-9a-fA-F]{8})$/.exec(s);
    if (!m || m[1] !== SHARE_PREFIX) return { ok: false, error: 'Not a share code from this tool.' };
    if (+m[2] !== SHARE_VERSION) return { ok: false, error: 'This code comes from a different version of the tool.' };
    var sum = ('0000000' + fnv1a(m[3]).toString(16)).slice(-8);
    if (sum !== m[4].toLowerCase()) return { ok: false, error: 'This code is damaged or incomplete. Copy it again.' };

    try { obj = JSON.parse(b64urlToUtf8(m[3])); } catch (e) { return { ok: false, error: 'This code could not be read.' }; }

    return { ok: true, record: rec };

  // Finds every share code inside pasted text (chat messages, line breaks).
  function extractShareCodes(text) {
    var s = String(text || '').replace(/\s+/g, '');
    var re = new RegExp(SHARE_PREFIX + '\\.\\d+\\.[A-Za-z0-9_-]+\\.[0-9a-fA-F]{8}', 'g');
    return s.match(re) || [];
  }

  // Merges incoming records into `records` (keyed by observer letter).
  // expect = { group, routeIndex, own } where own is the receiver's own
  // letter (never replaced by an incoming code), or null.
  function mergeRecords(records, incoming, expect) {
    var out = {};
    Object.keys(records || {}).forEach(function (k) { out[k] = records[k]; });
    var report = { added: [], replaced: [], duplicate: [], rejected: [], warnings: [] };
    (incoming || []).forEach(function (rec) {
      var who = rec.l ? 'Observer ' + rec.l + (rec.n ? ' (' + rec.n + ')' : '') : (rec.n || 'An observer');
      if (expect.group == null || expect.routeIndex == null) { report.rejected.push(who + ': enter a join code first.'); return; }
      if (rec.g !== expect.group || rec.r !== expect.routeIndex) {
        report.rejected.push(who + ': this code is from ' + (rec.g == null ? 'an observer who did not join a group' : 'another group or route (group ' + rec.g + ')') + '.');
        return;
      }
      if (!rec.l) { report.rejected.push(who + ': no observer letter. Ask them to choose one and send again.'); return; }
      if (expect.own && rec.l === expect.own) {
        if (expect.ownName && rec.n && rec.n !== expect.ownName) report.rejected.push(who + ': uses your letter ' + rec.l + '. One of you needs to change letter.');
        else report.duplicate.push(who + ': this is your own code.');
        return;
      }
      var ex = out[rec.l];
      if (!ex) { out[rec.l] = rec; report.added.push(who); return; }
      if (ex.n && rec.n && ex.n !== rec.n) report.warnings.push('Two different people sent codes as observer ' + rec.l + ' (' + ex.n + ', ' + rec.n + '). The newer code is kept.');
      if (rec.at > ex.at) { out[rec.l] = rec; report.replaced.push(who + ': newer code replaces the older one.'); }

  }

  // Merged grid: grid[siteIndex][charId] = { ratings: [{ l, rating }], double, agree }.
  function mergedGrid(records, nSites) {
    var grid = {};
    for (var si = 0; si < nSites; si++) {
      grid[si] = {};
      CHAR_IDS.forEach(function (c) {
        var list = [];
        Object.keys(records).sort().forEach(function (k) {
          var rec = records[k];
          var r = rec && rec.ra && rec.ra[si] && rec.ra[si][c];
          if (r) list.push({ l: rec.l || k, rating: r });
        });
        var agree = list.length >= 2 ? list.every(function (x) { return x.rating === list[0].rating; }) : null;
        grid[si][c] = { ratings: list, double: list.length >= 2, agree: agree };
      });
    }
    return grid;
  }

  // =====================================================================
  // Homework (pure, given a homework state object)
  // =====================================================================
  function siteRange(n) { var out = []; for (var i = 0; i < n; i++) out.push(i); return out; }
  function hwRoute(hw) { return hw.routeIndex != null ? CONFIG.routes[hw.routeIndex] || null : null; }
  function hwSiteCount(hw) { var r = hwRoute(hw); return r ? r.sites.length : 0; }
  function hwSiteName(hw, si) { var r = hwRoute(hw); return r && SITE[r.sites[si]] ? SITE[r.sites[si]].name : 'Site ' + (+si + 1); }

  function hwNotes(hw) {
    var out = [];
    Object.keys(hw.records).sort().forEach(function (k) {
      var rec = hw.records[k];
      (rec.no || []).forEach(function (n) {
        out.push({ key: k + ':' + n.i, letter: rec.l || k, who: rec.n, s: n.s, c: n.c, x: n.x, t: n.t, f: n.f });
      });
    });
    return out;
  }
  // Places spotted on the walk, from every loaded observer.
  function hwSpots(hw) {
    var out = [];
    Object.keys(hw.records).sort().forEach(function (k) {
      var rec = hw.records[k];
      (rec.sp || []).forEach(function (x) {
        out.push({ key: k + ':' + x.i, letter: rec.l || k, who: rec.n, x: x.x, y: x.y, k: x.k, t: x.t });
      });
    });
    return out;
  }
  function spotLabel(x) { return x.x + (x.k && SPOT_STATUS[x.k] ? ' (' + SPOT_STATUS[x.k].label.toLowerCase() + ')' : ''); }

  function noteTags(hw, note) {
    var t = hw.sort[note.key];
    return {
      chars: t && Array.isArray(t.chars) ? t.chars : [note.c],
      site: t && t.site != null ? +t.site : note.s,
      factor: t && t.factor != null ? t.factor : (note.f || ''),
      claims: t && Array.isArray(t.claims) ? t.claims : [],
      ok: !!(t && t.ok)
    };
  }

  function hwGrid(hw) { return mergedGrid(hw.records, hwSiteCount(hw) || 2); }

  function doubleRatedList(hw) {
    var grid = hwGrid(hw), out = [];
    for (var si = 0; si < hwSiteCount(hw); si++) {
      CHAR_IDS.forEach(function (c) { if (grid[si][c].double) out.push({ si: si, c: c, cell: grid[si][c] }); });
    }
    return out;
  }

  function finalRating(hw, si, c) {
    var k = si + '|' + c;
    if (hw.final[k]) return hw.final[k];
    if (hw.agree[k] && hw.agree[k].rating) return hw.agree[k].rating;
    var cell = hwGrid(hw)[si] && hwGrid(hw)[si][c];
    if (cell && cell.ratings.length && (cell.ratings.length === 1 || cell.agree)) return cell.ratings[0].rating;
    return '';
  }
  // True when at least two sites have different final ratings.
  function sitesDiffer(hw, c) {
    var seen = '';
    for (var si = 0; si < hwSiteCount(hw); si++) {
      var r = finalRating(hw, si, c);
      if (!r) continue;
      if (seen && r !== seen) return true;
      seen = r;
    }
    return false;
  }

  function blankExplanation() {
    var sites = {};
    SITE_KEYS.forEach(function (k) { sites[k] = { text: '', factors: [] }; });
    return { on: false, sites: sites, contrast: '', refs: [], line: '' };
  }
  function explanationIssues(hw, c) {
    var e = hw.explain[c];
    var issues = [];
    if (!e || !e.on) return ['Not chosen.'];
    var n = hwSiteCount(hw);
    for (var si = 0; si < n; si++) {
      var s = (e.sites && e.sites[si]) || {};
      if (!longOk(s.text)) issues.push(hwSiteName(hw, si) + ': write at least ' + CONFIG.words.min + ' words.');
      if (!s.factors || !s.factors.length) issues.push(hwSiteName(hw, si) + ': tag at least one feature that accounts for it.');
    }
    if (n > 1 && !longOk(e.contrast)) issues.push('Contrast: write at least ' + CONFIG.words.min + ' words.');
    if (!e.refs || !e.refs.length) issues.push('Link at least one supporting note.');
    if (!sentenceOk(e.line)) issues.push('Card sentence: ' + CONFIG.words.sentenceMin + ' to ' + CONFIG.words.sentenceMax + ' words.');
    return issues;
  }
  function validExplanations(hw) { return CHAR_IDS.filter(function (c) { return explanationIssues(hw, c).length === 0; }); }

  // ---- Step 5: candidate explanations of decline
  function blankDecline(id) { return { id: id, claim: '', lens: '', factor: '', refs: [], mechanism: '', evidence: '', line: '' }; }
  function nextDeclineId(hw) {
    var n = 0;
    (hw.decline || []).forEach(function (d) { var m = /^d(\d+)$/.exec(d.id || ''); if (m) n = Math.max(n, +m[1]); });
    return 'd' + (n + 1);
  }
  function declineIssues(d) {
    var issues = [];
    if (!d) return ['Missing.'];
    if (!CLAIM[d.claim]) issues.push('Choose the decline claim.');
    if (!LENS[d.lens]) issues.push('Choose a lens.');
    if (!FACTOR[d.factor]) issues.push('Choose what you saw at work.');
    if (!d.refs || !d.refs.length) issues.push('Link at least one explanation or spotted place it rests on.');
    if (!longOk(d.mechanism)) issues.push('Mechanism: at least ' + CONFIG.words.min + ' words.');
    if (!longOk(d.evidence)) issues.push('Evidence: at least ' + CONFIG.words.min + ' words.');
    if (!sentenceOk(d.line)) issues.push('Card sentence: ' + CONFIG.words.sentenceMin + ' to ' + CONFIG.words.sentenceMax + ' words.');
    return issues;
  }
  function validDeclines(hw) { return (hw.decline || []).filter(function (d) { return declineIssues(d).length === 0; }); }
  function declineLensCount(hw) {
    var seen = {};
    validDeclines(hw).forEach(function (d) { seen[d.lens] = true; });
    return Object.keys(seen).length;
  }
  function declineLensTarget() { return Math.max(1, Math.min(CONFIG.words.declineLenses || 1, CONFIG.lenses.length, CONFIG.words.declineCount)); }
  function declineLabel(d) { return (CLAIM[d.claim] ? CLAIM[d.claim].name : 'No claim') + ', ' + (LENS[d.lens] ? LENS[d.lens].name.toLowerCase() : 'no lens') + (d.line ? ': ' + d.line : ''); }

  function claimIssues(entry) {
    var issues = [];
    if (!entry || !entry.scope) return ['Choose a scope.'];
    if (!longOk(entry.why)) issues.push('Why: at least ' + CONFIG.words.min + ' words.');
    if (!longOk(entry.needed)) issues.push('Evidence needed: at least ' + CONFIG.words.min + ' words.');
    if ((entry.scope === 'speaks' || entry.scope === 'partly') && !sentenceOk(entry.finding)) issues.push('Finding: ' + CONFIG.words.sentenceMin + ' to ' + CONFIG.words.sentenceMax + ' words.');
    return issues;
  }
  // A claim-wall card is produced only for a claim marked "speaks to" or
  // "partly speaks to", with a valid finding and the evidence still needed.
  function claimCardEligible(entry) {
    if (!entry || (entry.scope !== 'speaks' && entry.scope !== 'partly')) return false;
    return sentenceOk(entry.finding) && longOk(entry.needed);
  }

  function stepIssues(hw, step) {
    var issues = [];
    var n = hwSiteCount(hw);
    if (step === 'load') {
      if (!n) issues.push('Load your group\'s codes (the route is not known yet).');
      if (!String(hw.me.name || '').trim()) issues.push('Enter your name.');
      if (!hw.me.letter) issues.push('Say which observer you were.');
    } else if (step === 'sort') {
      hwNotes(hw).forEach(function (note) {
        var t = noteTags(hw, note);
        if (!t.ok) issues.push('Note "' + note.x.slice(0, 40) + '" not confirmed.');
        else if (!t.chars.length) issues.push('Note "' + note.x.slice(0, 40) + '" has no characteristic.');
      });
    } else if (step === 'agree') {
      doubleRatedList(hw).forEach(function (d) {
        var a = hw.agree[d.si + '|' + d.c] || {};
        if (!a.rating || !longOk(a.reason)) issues.push(hwSiteName(hw, d.si) + ', ' + CHAR[d.c].name + ': resolution and reason needed.');
      });
    } else if (step === 'explain') {
      var valid = validExplanations(hw);
      if (valid.length < CONFIG.words.explainCount) issues.push(valid.length + ' of ' + CONFIG.words.explainCount + ' explanations complete.');
      var anyDiffer = CHAR_IDS.some(function (c) { return sitesDiffer(hw, c); });
      if (n > 1 && anyDiffer && !valid.some(function (c) { return sitesDiffer(hw, c); })) issues.push('At least one complete explanation must be a characteristic where the sites differ.');
    } else if (step === 'overall') {
      for (var si = 0; si < n; si++) {
        var o = hw.overall[si] || {};
        if (!o.level) issues.push(hwSiteName(hw, si) + ': choose a judgement.');
        if (!longOk(o.text)) issues.push(hwSiteName(hw, si) + ': justification needs ' + CONFIG.words.min + ' words.');
        if (!o.refs || !o.refs.length) issues.push(hwSiteName(hw, si) + ': link at least one explanation.');
      }
    } else if (step === 'decline') {
      var vd = validDeclines(hw).length;
      if (vd < CONFIG.words.declineCount) issues.push(vd + ' of ' + CONFIG.words.declineCount + ' candidate explanations complete.');
      var lt = declineLensTarget();
      if (declineLensCount(hw) < lt) issues.push('Complete explanations cover ' + declineLensCount(hw) + ' of the ' + lt + ' lenses needed.');
      (hw.decline || []).forEach(function (d, i) {
        var di = declineIssues(d);
        if (di.length) issues.push('Candidate explanation ' + (i + 1) + ': ' + di[0]);
      });
    } else if (step === 'claims') {
      CONFIG.claims.forEach(function (cl) {
        claimIssues(hw.claims[cl.id]).forEach(function (x) { issues.push(cl.name + ': ' + x); });
      });
    }
    return issues;
  }

  // Fills in any missing keys from the blank state (forward compatible).
  function normalise(which, s) {
    var b = BLANK[which]();

    Object.keys(b).forEach(function (k) {
      if (!has(s, k) || s[k] === undefined) s[k] = b[k];
      else if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && typeof s[k] === 'object' && s[k] !== null) {
        Object.keys(b[k]).forEach(function (kk) { if (!has(s[k], kk)) s[k][kk] = b[k][kk]; });

  }

  // =====================================================================
  // Route map (inline SVG, no map tiles, no network)
  // =====================================================================
  function validLatLon(lat, lon) {
    return typeof lat === 'number' && typeof lon === 'number' && isFinite(lat) && isFinite(lon) &&
      Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
  }
  var M_PER_DEG = 111320;
  // Straight-line distance in metres (equirectangular; accurate to well
  // under 1% at the scale of a walking route).
  function distanceM(a, b) {
    var k = Math.cos((a.lat + b.lat) / 2 * Math.PI / 180);
    var dx = (b.lon - a.lon) * k, dy = b.lat - a.lat;
    return Math.sqrt(dx * dx + dy * dy) * M_PER_DEG;
  }
  function mercY(lat) { return Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) * 180 / Math.PI; }
  // The embedded background map, or null when it is missing.
  var mapImageCache;
  function mapImageSrc() {
    if (mapImageCache !== undefined) return mapImageCache;
    var el = typeof document !== 'undefined' && document.getElementById('w5-map-image');
    var data = el ? el.textContent.replace(/\s+/g, '') : '';
    mapImageCache = data ? 'data:image/webp;base64,' + data : null;
