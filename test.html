<meta charset="utf-8">
<title>Third Places — Test Suite</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 2rem; }
  h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
  .summary { margin-bottom: 1.5rem; font-size: 0.95rem; }
  .pass { color: #4caf50; }
  .fail { color: #f44336; }
  .suite { margin-bottom: 1.5rem; }
  .suite-header { font-weight: 700; font-size: 1rem; margin-bottom: 0.3rem; color: #ccc; }
  .test { padding: 3px 0; font-size: 0.85rem; }
  .test.pass::before { content: "✓ "; color: #4caf50; }
  .test.fail::before { content: "✗ "; color: #f44336; }
  .test.fail { color: #f44336; }
  .error-detail { color: #e57373; font-size: 0.8rem; margin-left: 1.2rem; }
</style>

<h1>Third Places — Test Suite</h1>
<div class="summary" id="summary"></div>
<div id="results"></div>

<!-- Minimal DOM stubs the scripts expect -->
<div id="app" style="display:none"></div>
<nav id="toolbar" style="display:none">
  <button id="btn-prev"></button>
  <span id="phase-indicator"></span>
  <button id="btn-next"></button>
</nav>
<div style="display:none">
  <div id="intro" class="screen"></div>
  <div id="game" class="screen"></div>
  <div id="summary-screen" class="screen"></div>
  <div id="intro-dots"></div>
  <div id="game-dots"></div>
  <div id="game-header"></div>
  <div id="game-body"></div>
</div>

<!-- Load all app scripts so their globals are available -->
<script id="decoder-source"></script>
<script id="lab-source"></script>
<script id="builder-source"></script>

<script>
(function() {
  var passed = 0, failed = 0;
  var results = document.getElementById('results');
  var currentSuite = null;
  var currentSuiteEl = null;

  function suite(name) {
    currentSuite = name;
    currentSuiteEl = document.createElement('div');
    currentSuiteEl.className = 'suite';
    currentSuiteEl.innerHTML = '<div class="suite-header">' + name + '</div>';
    results.appendChild(currentSuiteEl);
  }

  function assert(name, fn) {
    var el = document.createElement('div');
    el.className = 'test';
    try {
      fn();
      el.classList.add('pass');
      el.textContent = name;
      passed++;
    } catch(e) {
      el.classList.add('fail');
      el.textContent = name;
      var detail = document.createElement('div');
      detail.className = 'error-detail';
      detail.textContent = e.message;
      el.appendChild(detail);
      failed++;
    }
    currentSuiteEl.appendChild(el);
  }

  function eq(a, b, msg) {
    if (a !== b) throw new Error((msg || '') + ' expected ' + JSON.stringify(b) + ', got ' + JSON.stringify(a));
  }

  function ok(v, msg) {
    if (!v) throw new Error(msg || 'assertion failed');
  }

  // =========================================================
  // Load scripts by extracting <script> content from each HTML
  // =========================================================
  function extractAndRun(html, label) {
    var m = html.match(/<script>([\s\S]*?)<\/script>/);
    if (!m) throw new Error('No <script> in ' + label);
    var code = m[1]
      .replace(/document\.addEventListener\(/g, 'void(0 && ')
      .replace(/document\.getElementById\('app'\)\.addEventListener\(/g, 'void(0 && ')
      .replace(/\$\('[^']+'\)\.addEventListener\(/g, 'void(0 && ');
    code = code.replace(/\nrender\(\);\s*$/, '');
    return code;
  }

  function loadScripts(callback) {
    var loaded = 0;
    var labCode, decoderCode, builderCode, benchCode;

    function done() {
      loaded++;
      if (loaded < 4) return;

      // Execute decoder in a namespace
      try {
        var decoderFn = new Function(
          decoderCode + '\n'
          + 'window.D_CHARACTERISTICS = CHARACTERISTICS;\n'
          + 'window.D_state = state;\n'
          + 'window.D_shuffle = shuffle;\n'
        );
        decoderFn();
      } catch(e) {
        suite('LOAD ERRORS');
        assert('decoder.html parses without syntax errors', function() { throw e; });
      }

      // Execute lab
      try {
        var labFn = new Function(
          labCode + '\n'
          + 'window.L_CHARS = CHARS;\n'
          + 'window.L_CASES = CASES;\n'
          + 'window.L_SVG = SVG;\n'
          + 'window.L_STRESS_DOMAINS = STRESS_DOMAINS;\n'
          + 'window.L_state = state;\n'
          + 'window.L_SCREENS = SCREENS;\n'
          + 'window.L_screenIndex = screenIndex;\n'
          + 'window.L_esc = esc;\n'
          + 'window.L_voteBtn = voteBtn;\n'
          + 'window.L_toggleBtn = toggleBtn;\n'
          + 'window.L_predBtn = predBtn;\n'
          + 'window.L_geoDecor = geoDecor;\n'
          + 'window.L_statusToStrength = statusToStrength;\n'
          + 'window.L_strengthToStatus = strengthToStatus;\n'
          + 'window.L_getEffectiveProfile = getEffectiveProfile;\n'
          + 'window.L_applyPredictions = applyPredictions;\n'
          + 'window.L_getCaseDomains = getCaseDomains;\n'
          + 'window.L_getCondition = getCondition;\n'
          + 'window.L_getCaseTests = getCaseTests;\n'
          + 'window.L_findScreenByType = findScreenByType;\n'
          + 'window.L_renderReveal = renderReveal;\n'
          + 'window.L_renderInvestigate = renderInvestigate;\n'
          + 'window.L_renderProfile = renderProfile;\n'
          + 'window.L_renderCases = renderCases;\n'
          + 'window.L_renderStressIntro = renderStressIntro;\n'
          + 'window.L_renderTallyBar = renderTallyBar;\n'
          + 'window.L_renderMiniChart = renderMiniChart;\n'
          + 'window.L_renderTriangleSVG = renderTriangleSVG;\n'
          + 'window.L_voteCompRow = voteCompRow;\n'
          + 'window.L_tallyBtn = tallyBtn;\n'
          + 'window.L_finalizeStressTest = finalizeStressTest;\n'
          + 'window.L_navigate = navigate;\n'
          + 'window.L_updateToolbar = updateToolbar;\n'
          + 'window.L_render = render;\n'
        );
        labFn();
      } catch(e) {
        suite('LOAD ERRORS');
        assert('lab.html parses without syntax errors', function() { throw e; });
      }

      // Execute builder
      try {
        var builderFn = new Function(
          builderCode + '\n'
          + 'window.B_CHARS = CHARS;\n'
          + 'window.B_SCENARIOS = SCENARIOS;\n'
          + 'window.B_LEVERS = LEVERS;\n'
          + 'window.B_LEVER_INDEX = LEVER_INDEX;\n'
          + 'window.B_GROUPS = GROUPS;\n'
          + 'window.B_INITIAL_LEVERS = INITIAL_LEVERS;\n'
          + 'window.B_EVENTS = EVENTS;\n'
          + 'window.B_INSOLVENCY_EVENT = INSOLVENCY_EVENT;\n'
          + 'window.B_SEASONS = SEASONS;\n'
          + 'window.B_blankMods = blankMods;\n'
          + 'window.B_computeTargets = computeTargets;\n'
          + 'window.B_stepCharacteristics = stepCharacteristics;\n'
          + 'window.B_computeEconomy = computeEconomy;\n'
          + 'window.B_disruptionOf = disruptionOf;\n'
          + 'window.B_scoreOf = scoreOf;\n'
          + 'window.B_verdictOf = verdictOf;\n'
          + 'window.B_statusOf = statusOf;\n'
          + 'window.B_newGame = newGame;\n'
          + 'window.B_actionsAllowed = actionsAllowed;\n'
          + 'window.B_previewOption = previewOption;\n'
          + 'window.B_endSeason = endSeason;\n'
          + 'window.B_advanceSeason = advanceSeason;\n'
          + 'window.B_eligibleEvent = eligibleEvent;\n'
          + 'window.B_choiceSelectable = choiceSelectable;\n'
          + 'window.B_resolveEvent = resolveEvent;\n'
          + 'window.B_debriefOf = debriefOf;\n'
          + 'window.B_esc = esc;\n'
          + 'window.B_money = money;\n'
          + 'window.B_renderIntro = renderIntro;\n'
          + 'window.B_renderScenario = renderScenario;\n'
          + 'window.B_renderSeason = renderSeason;\n'
          + 'window.B_renderResult = renderResult;\n'
          + 'window.B_renderEvent = renderEvent;\n'
          + 'window.B_renderFinal = renderFinal;\n'
          + 'window.B_setGame = function(g) { game = g; };\n'
          + 'window.B_setEventOutcome = function(o) { eventOutcome = o; };\n'
        );
        builderFn();
      } catch(e) {
        suite('LOAD ERRORS');
        assert('builder.html parses without syntax errors', function() { throw e; });
      }

      // Execute adjudication bench (its init is guarded on #bench-app, absent here; it exposes window.W6B)
      try {
        var benchFn = new Function(benchCode);
        benchFn();
      } catch(e) {
        suite('LOAD ERRORS');
        assert('week6b-adjudication-bench.html parses without syntax errors', function() { throw e; });
      }

      callback();
    }

    var xhr4 = new XMLHttpRequest();
    xhr4.open('GET', 'week6b-adjudication-bench.html');
    xhr4.onload = function() { benchCode = extractAndRun(xhr4.responseText, 'bench'); done(); };
    xhr4.onerror = function() { benchCode = ''; done(); };
    xhr4.send();

    var xhr1 = new XMLHttpRequest();
    xhr1.open('GET', 'third-place-decoder.html');
    xhr1.onload = function() { decoderCode = extractAndRun(xhr1.responseText, 'decoder'); done(); };
    xhr1.onerror = function() { decoderCode = ''; done(); };
    xhr1.send();

    var xhr2 = new XMLHttpRequest();
    xhr2.open('GET', 'third-place-lab.html');
    xhr2.onload = function() { labCode = extractAndRun(xhr2.responseText, 'lab'); done(); };
    xhr2.onerror = function() { labCode = ''; done(); };
    xhr2.send();

    var xhr3 = new XMLHttpRequest();
    xhr3.open('GET', 'third-place-builder.html');
    xhr3.onload = function() { builderCode = extractAndRun(xhr3.responseText, 'builder'); done(); };
    xhr3.onerror = function() { builderCode = ''; done(); };
    xhr3.send();
  }

  function runTests() {

    // =====================================================
    // DECODER TESTS
    // =====================================================

    suite('Decoder — Data Integrity');

    assert('CHARACTERISTICS has 8 entries', function() {
      eq(D_CHARACTERISTICS.length, 8);
    });

    assert('Each characteristic has required fields', function() {
      D_CHARACTERISTICS.forEach(function(c, i) {
        ok(c.name, 'missing name at index ' + i);
        ok(c.colorHex, 'missing colorHex at index ' + i);
        ok(c.definition, 'missing definition at index ' + i);
        ok(Array.isArray(c.distractorDefs), 'distractorDefs not array at ' + i);
        eq(c.distractorDefs.length, 3, 'distractorDefs length at ' + i);
        ok(c.hint, 'missing hint at ' + i);
        ok(c.feedback, 'missing feedback at ' + i);
      });
    });

    assert('All colorHex values are valid hex colours', function() {
      D_CHARACTERISTICS.forEach(function(c) {
        ok(/^#[0-9A-Fa-f]{6}$/.test(c.colorHex), c.name + ' has invalid hex: ' + c.colorHex);
      });
    });

    assert('No duplicate characteristic names', function() {
      var names = D_CHARACTERISTICS.map(function(c) { return c.name; });
      eq(new Set(names).size, 8, 'duplicate names found');
    });

    suite('Decoder — shuffle()');

    assert('shuffle returns a new array of the same length', function() {
      var input = [1, 2, 3, 4, 5];
      var result = D_shuffle(input);
      eq(result.length, 5);
      ok(result !== input, 'should return a new array');
    });

    assert('shuffle does not mutate the input', function() {
      var input = [10, 20, 30];
      var copy = input.slice();
      D_shuffle(input);
      eq(JSON.stringify(input), JSON.stringify(copy));
    });

    assert('shuffle preserves all elements', function() {
      var input = [1, 2, 3, 4, 5, 6, 7, 8];
      var result = D_shuffle(input);
      var sorted = result.slice().sort(function(a, b) { return a - b; });
      eq(JSON.stringify(sorted), JSON.stringify(input));
    });

    // =====================================================
    // LAB — DATA INTEGRITY
    // =====================================================

    suite('Lab — Data Integrity');

    assert('CHARS has 8 entries with id, name, hex', function() {
      eq(L_CHARS.length, 8);
      L_CHARS.forEach(function(c, i) {
        ok(c.id, 'missing id at ' + i);
        ok(c.name, 'missing name at ' + i);
        ok(/^#[0-9A-Fa-f]{6}$/.test(c.hex), 'invalid hex at ' + i);
      });
    });

    assert('CASES has at least 2 entries', function() {
      ok(L_CASES.length >= 2, 'expected at least 2 cases');
      L_CASES.forEach(function(c) {
        ok(c.id, 'missing case id');
        ok(c.name, 'missing case name');
        ok(c.description, 'missing case description');
      });
    });

    assert('SVG exists for each case', function() {
      L_CASES.forEach(function(c) {
        ok(L_SVG[c.id], 'missing SVG for case ' + c.id);
        ok(L_SVG[c.id].indexOf('<svg') !== -1, 'SVG for ' + c.id + ' is not valid SVG');
      });
    });

    assert('STRESS_DOMAINS exists for each case', function() {
      L_CASES.forEach(function(c) {
        ok(L_STRESS_DOMAINS[c.id], 'missing STRESS_DOMAINS for ' + c.id);
        ok(L_STRESS_DOMAINS[c.id].length > 0, 'empty domains for ' + c.id);
      });
    });

    assert('Each stress domain has conditions with chain arrays', function() {
      L_CASES.forEach(function(c) {
        L_STRESS_DOMAINS[c.id].forEach(function(d) {
          ok(d.id, 'domain missing id');
          ok(d.label, 'domain missing label');
          ok(d.conditions.length > 0, 'domain has no conditions');
          d.conditions.forEach(function(cond) {
            ok(cond.id, 'condition missing id');
            ok(cond.name, 'condition missing name');
            ok(cond.intervention, 'condition missing intervention');
            ok(Array.isArray(cond.chain), 'condition chain is not array');
            ok(cond.chain.length >= 2, 'chain too short for ' + cond.id);
          });
        });
      });
    });

    assert('SCREENS has 12 entries covering all phases', function() {
      eq(L_SCREENS.length, 12);
      var phases = {};
      L_SCREENS.forEach(function(s) { phases[s.phase] = true; });
      ok(phases.part2, 'missing part2');
      ok(phases.part3, 'missing part3');
      ok(phases.part4, 'missing part4');
    });

    assert('State initialised with cases matching CASES', function() {
      eq(L_state.cases.length, L_CASES.length);
      L_state.cases.forEach(function(sc, i) {
        eq(sc.id, L_CASES[i].id);
        eq(sc.characteristics.length, 8);
      });
    });

    // =====================================================
    // LAB — PURE FUNCTIONS
    // =====================================================

    suite('Lab — statusToStrength / strengthToStatus');

    assert('statusToStrength maps correctly', function() {
      eq(L_statusToStrength('present'), 2);
      eq(L_statusToStrength('ambiguous'), 1);
      eq(L_statusToStrength('absent'), 0);
      eq(L_statusToStrength(null), 0);
      eq(L_statusToStrength(''), 0);
    });

    assert('strengthToStatus maps correctly', function() {
      eq(L_strengthToStatus(2), 'present');
      eq(L_strengthToStatus(3), 'present');
      eq(L_strengthToStatus(1), 'ambiguous');
      eq(L_strengthToStatus(0), 'absent');
      eq(L_strengthToStatus(-1), 'absent');
    });

    assert('round-trip: statusToStrength then strengthToStatus', function() {
      ['present', 'ambiguous', 'absent'].forEach(function(s) {
        eq(L_strengthToStatus(L_statusToStrength(s)), s);
      });
    });

    suite('Lab — applyPredictions');

    assert('stronger increases strength by 1, capped at 2', function() {
      var profile = [{ id: 'a', name: 'A', hex: '#000', strength: 1, status: 'ambiguous' }];
      var result = L_applyPredictions(profile, { a: 'stronger' });
      eq(result[0].strength, 2);
      eq(result[0].status, 'present');
    });

    assert('weaker decreases strength by 1, floored at 0', function() {
      var profile = [{ id: 'a', name: 'A', hex: '#000', strength: 1, status: 'ambiguous' }];
      var result = L_applyPredictions(profile, { a: 'weaker' });
      eq(result[0].strength, 0);
      eq(result[0].status, 'absent');
    });

    assert('stronger at max (2) stays at 2', function() {
      var profile = [{ id: 'a', name: 'A', hex: '#000', strength: 2, status: 'present' }];
      var result = L_applyPredictions(profile, { a: 'stronger' });
      eq(result[0].strength, 2);
    });

    assert('weaker at min (0) stays at 0', function() {
      var profile = [{ id: 'a', name: 'A', hex: '#000', strength: 0, status: 'absent' }];
      var result = L_applyPredictions(profile, { a: 'weaker' });
      eq(result[0].strength, 0);
    });

    assert('applyPredictions does not mutate original profile', function() {
      var profile = [{ id: 'a', name: 'A', hex: '#000', strength: 1, status: 'ambiguous' }];
      L_applyPredictions(profile, { a: 'stronger' });
      eq(profile[0].strength, 1);
    });

    suite('Lab — findScreenByType');

    assert('finds existing screen types', function() {
      eq(L_findScreenByType('reveal'), 0);
      eq(L_findScreenByType('stressIntro'), 4);
      eq(L_findScreenByType('synthesisFinal'), 11);
    });

    assert('returns -1 for unknown type', function() {
      eq(L_findScreenByType('nonexistent'), -1);
    });

    suite('Lab — esc()');

    assert('escapes HTML special characters', function() {
      var result = L_esc('<b>"test" & \'stuff\'</b>');
      ok(result.indexOf('<') === -1, 'should escape <');
      ok(result.indexOf('>') === -1, 'should escape >');
      ok(result.indexOf('&amp;') !== -1, 'should escape &');
    });

    suite('Lab — HTML generators');

    assert('voteBtn produces button with correct attributes', function() {
      var html = L_voteBtn('initial', 'yes', 'YES', 'yes');
      ok(html.indexOf('data-action="vote"') !== -1);
      ok(html.indexOf('data-kind="initial"') !== -1);
      ok(html.indexOf('data-val="yes"') !== -1);
      ok(html.indexOf('selected') !== -1);
    });

    assert('voteBtn without selection has no selected class', function() {
      var html = L_voteBtn('initial', 'yes', 'YES', 'no');
      ok(html.indexOf('selected') === -1);
    });

    assert('toggleBtn marks active state correctly', function() {
      var html = L_toggleBtn(0, 'present', '✓', 'present');
      ok(html.indexOf('active') !== -1);
      var html2 = L_toggleBtn(0, 'present', '✓', 'absent');
      ok(html2.indexOf('active') === -1);
    });

    assert('geoDecor produces positioned div', function() {
      var html = L_geoDecor('#ff0000', 10, 20, 'circle', 0.1);
      ok(html.indexOf('position:absolute') !== -1);
      ok(html.indexOf('border-radius:50%') !== -1);
      ok(html.indexOf('#ff0000') !== -1);
    });

    assert('renderTallyBar returns empty for zero votes', function() {
      eq(L_renderTallyBar({ yes: 0, no: 0, ambivalent: 0 }), '');
    });

    assert('renderTallyBar produces segments for non-zero votes', function() {
      var html = L_renderTallyBar({ yes: 5, no: 3, ambivalent: 2 });
      ok(html.indexOf('tally-seg') !== -1);
      ok(html.indexOf('50%') !== -1); // 5/10 = 50%
    });

    assert('renderMiniChart produces rows for each characteristic', function() {
      var profile = L_CHARS.map(function(c) {
        return { id: c.id, name: c.name, hex: c.hex, strength: 1, status: 'ambiguous' };
      });
      var html = L_renderMiniChart(profile, 'test');
      var count = (html.match(/mini-bar-row/g) || []).length;
      eq(count, 8);
    });

    assert('renderTriangleSVG produces valid SVG', function() {
      var svg = L_renderTriangleSVG();
      ok(svg.indexOf('<svg') !== -1);
      ok(svg.indexOf('</svg>') !== -1);
    });

    suite('Lab — Render functions produce HTML');

    assert('renderReveal returns non-empty HTML with case info', function() {
      var html = L_renderReveal();
      ok(html.length > 100);
      ok(html.indexOf('CASE') !== -1);
      ok(html.indexOf('vote-btn') !== -1);
    });

    assert('renderInvestigate returns HTML with 8 characteristic rows', function() {
      var html = L_renderInvestigate();
      var rows = (html.match(/char-row/g) || []).length;
      ok(rows >= 8, 'expected at least 8 char-row occurrences, got ' + rows);
    });

    assert('renderProfile returns HTML with bar chart', function() {
      var html = L_renderProfile();
      ok(html.indexOf('bar-track') !== -1);
    });

    assert('renderCases returns HTML with case cards', function() {
      var html = L_renderCases();
      ok(html.indexOf('case-card') !== -1);
    });

    // =====================================================
    // LAB — getCaseDomains / getCondition
    // =====================================================

    suite('Lab — Domain and Condition Lookup');

    assert('getCaseDomains returns domains for case 0', function() {
      var domains = L_getCaseDomains(0);
      ok(domains.length >= 2, 'expected at least 2 domains');
    });

    assert('getCondition finds a valid condition', function() {
      var domains = L_getCaseDomains(0);
      var firstCond = domains[0].conditions[0];
      var result = L_getCondition(firstCond.id);
      ok(result !== null, 'condition not found');
      eq(result.condition.id, firstCond.id);
    });

    assert('getCondition returns null for invalid id', function() {
      eq(L_getCondition('nonexistent-condition-xyz'), null);
    });


    // =====================================================
    // BUILDER — DATA INTEGRITY
    // =====================================================

    suite('Builder — Data Integrity');

    assert('CHARS has 8 entries: 5 direct, 3 emergent, valid hex', function() {
      eq(B_CHARS.length, 8);
      var direct = 0, emergent = 0;
      B_CHARS.forEach(function(c) {
        ok(c.id && c.name && c.def, 'missing field on ' + c.id);
        ok(/^#[0-9A-Fa-f]{6}$/.test(c.hex), 'invalid hex for ' + c.id);
        if (c.kind === 'direct') direct++;
        if (c.kind === 'emergent') emergent++;
      });
      eq(direct, 5); eq(emergent, 3);
    });

    assert('Builder CHARS use the same colours as the lab', function() {
      B_CHARS.forEach(function(c, i) { eq(c.hex, L_CHARS[i].hex, c.name); });
    });

    assert('SCENARIOS has 3 entries with economics fields', function() {
      eq(B_SCENARIOS.length, 3);
      B_SCENARIOS.forEach(function(sc) {
        ok(sc.id && sc.name && sc.subtitle && sc.blurb, 'missing text on ' + sc.id);
        ok(sc.constraints.length >= 3, 'constraints on ' + sc.id);
        ok(typeof sc.money === 'number' && typeof sc.rent === 'number' && typeof sc.subsidy === 'number', 'money fields on ' + sc.id);
        ok(sc.baseFootfall > 0, 'footfall on ' + sc.id);
        ok(sc.rentLabel, 'rentLabel on ' + sc.id);
        ok(['residential', 'highstreet', 'campus'].indexOf(sc.location) !== -1, 'location on ' + sc.id);
      });
    });

    assert('Every lever has unique options with cost, run and description', function() {
      B_LEVERS.forEach(function(l) {
        ok(l.id && l.name && l.group, 'lever fields on ' + l.id);
        ok(l.disruption > 0, 'disruption on ' + l.id);
        ok(l.options.length >= 2, 'options on ' + l.id);
        var ids = {};
        l.options.forEach(function(o) {
          ok(!ids[o.id], 'duplicate option ' + o.id + ' on ' + l.id);
          ids[o.id] = true;
          ok(o.label && o.desc, 'label/desc on ' + l.id + '/' + o.id);
          ok(typeof o.cost === 'number' && typeof o.run === 'number', 'cost/run on ' + l.id + '/' + o.id);
        });
      });
    });

    assert('INITIAL_LEVERS names a valid option for every lever', function() {
      B_LEVERS.forEach(function(l) {
        var v = B_INITIAL_LEVERS[l.id];
        ok(v, 'no initial value for ' + l.id);
        ok(l.options.some(function(o) { return o.id === v; }), 'invalid initial ' + v + ' for ' + l.id);
      });
      eq(Object.keys(B_INITIAL_LEVERS).length, B_LEVERS.length);
    });

    assert('Every lever group is listed in GROUPS', function() {
      var g = {};
      B_GROUPS.forEach(function(x) { g[x.id] = true; });
      B_LEVERS.forEach(function(l) { ok(g[l.group], 'unknown group ' + l.group + ' on ' + l.id); });
    });

    assert('EVENTS reference valid scenarios, levers, options and characteristics', function() {
      var scIds = B_SCENARIOS.map(function(s) { return s.id; });
      var charIds = B_CHARS.map(function(c) { return c.id; });
      function checkEffect(eff, where) {
        if (eff.levers) Object.keys(eff.levers).forEach(function(k) {
          ok(B_LEVER_INDEX[k], where + ' unknown lever ' + k);
          ok(B_LEVER_INDEX[k].options.some(function(o) { return o.id === eff.levers[k]; }), where + ' unknown option ' + eff.levers[k]);
        });
        ['shock', 'mod'].forEach(function(key) {
          if (!eff[key]) return;
          Object.keys(eff[key]).forEach(function(k) {
            ok(charIds.indexOf(k) !== -1 || (key === 'mod' && k === 'pressure'), where + ' unknown characteristic ' + k);
          });
        });
        ok(eff.note, where + ' missing note');
      }
      var ids = {};
      B_EVENTS.forEach(function(ev) {
        ok(!ids[ev.id], 'duplicate event ' + ev.id); ids[ev.id] = true;
        ok(ev.title && ev.text, 'title/text on ' + ev.id);
        ok(typeof ev.when === 'function', 'when on ' + ev.id);
        ok(ev.scenarios.length > 0, 'scenarios on ' + ev.id);
        ev.scenarios.forEach(function(s) { ok(scIds.indexOf(s) !== -1, 'unknown scenario ' + s + ' on ' + ev.id); });
        ok(ev.choices.length >= 1, 'choices on ' + ev.id);
        ev.choices.forEach(function(c) {
          ok(c.id && c.label && c.desc, 'choice fields on ' + ev.id);
          if (c.requires) ok(c.requiresText, 'requiresText on ' + ev.id + '/' + c.id);
          if (c.tryable) ok(ev.fallback, 'tryable without fallback on ' + ev.id);
          checkEffect(c.effect, ev.id + '/' + c.id);
        });
        if (ev.fallback) checkEffect(ev.fallback.effect, ev.id + '/fallback');
      });
      ok(B_INSOLVENCY_EVENT.choices.some(function(c) { return c.effect.close; }), 'insolvency has no close option');
    });

    assert('Every scenario has at least 4 possible events', function() {
      B_SCENARIOS.forEach(function(sc) {
        var n = B_EVENTS.filter(function(ev) { return ev.scenarios.indexOf(sc.id) !== -1; }).length;
        ok(n >= 4, sc.id + ' has only ' + n + ' events');
      });
    });

    // =====================================================
    // BUILDER — MODEL
    // =====================================================

    suite('Builder — computeTargets');

    function leversWith(over) {
      var l = {};
      Object.keys(B_INITIAL_LEVERS).forEach(function(k) { l[k] = B_INITIAL_LEVERS[k]; });
      Object.keys(over || {}).forEach(function(k) { l[k] = over[k]; });
      return l;
    }

    assert('returns the five direct characteristics in 0..100', function() {
      var t = B_computeTargets(leversWith(), B_SCENARIOS[0], B_blankMods(), 0);
      ['ng', 'lv', 'cv', 'ac', 'lp'].forEach(function(k) {
        ok(typeof t[k] === 'number' && t[k] >= 0 && t[k] <= 100, k + ' out of range: ' + t[k]);
      });
      eq(Object.keys(t).length, 5);
    });

    assert('gating, quiet rules, premium prices and branding lower the expected characteristics', function() {
      var sc = B_SCENARIOS[0], m = B_blankMods();
      var base = B_computeTargets(leversWith({ entry:'open', noise:'moderate', price:'low', decor:'scuffed' }), sc, m, 0);
      ok(B_computeTargets(leversWith({ entry:'membership' }), sc, m, 0).ng < base.ng, 'membership should lower Neutral Ground');
      ok(B_computeTargets(leversWith({ noise:'quiet' }), sc, m, 0).cv < base.cv, 'quiet policy should lower Conversation');
      ok(B_computeTargets(leversWith({ price:'high' }), sc, m, 0).lv < base.lv, 'premium prices should lower Leveler');
      ok(B_computeTargets(leversWith({ decor:'branded' }), sc, m, 0).lp < base.lp, 'branding should lower Low Profile');
      ok(B_computeTargets(leversWith({ hours:'extended' }), sc, m, 0).ac > base.ac, 'extended hours should raise Accessibility');
    });

    assert('persistent modifiers shift targets', function() {
      var sc = B_SCENARIOS[0];
      var m = B_blankMods(); m.lv = -20;
      var a = B_computeTargets(leversWith(), sc, B_blankMods(), 0);
      var b = B_computeTargets(leversWith(), sc, m, 0);
      eq(Math.round(a.lv - b.lv), 20);
    });

    suite('Builder — stepCharacteristics');

    assert('a quiet season grows the regulars; disruption shrinks them', function() {
      var g = B_newGame('community');
      var quiet = B_stepCharacteristics(g.values, g.levers, g.scenario, B_blankMods(), 0);
      var noisy = B_stepCharacteristics(g.values, g.levers, g.scenario, B_blankMods(), 20);
      ok(quiet.rg > g.values.rg, 'regulars should grow in a quiet season');
      ok(noisy.rg < quiet.rg, 'disruption should reduce regulars');
      ok(noisy.ha < quiet.ha, 'disruption should reduce home away from home');
    });

    assert('values stay within 0..100 and are not mutated in place', function() {
      var g = B_newGame('highstreet');
      var before = JSON.stringify(g.values);
      var v = B_stepCharacteristics(g.values, g.levers, g.scenario, B_blankMods(), 60);
      Object.keys(v).forEach(function(k) { ok(v[k] >= 0 && v[k] <= 100, k + ' out of range'); });
      eq(JSON.stringify(g.values), before);
    });

    suite('Builder — computeEconomy');

    assert('net equals takings plus subsidy minus all costs', function() {
      var g = B_newGame('campus');
      var e = B_computeEconomy(g.levers, g.scenario, g.values, B_blankMods(), g.rent, g.subsidy);
      eq(e.net, e.revenue + e.subsidy - e.costs);
      eq(e.costs, e.rent + e.staff + e.security + e.running + e.supplies);
      eq(e.supplies, Math.round(e.revenue * 0.35));
      eq(e.subsidy, 5000);
    });

    assert('premium prices raise spend per visit and lower footfall', function() {
      var g = B_newGame('highstreet');
      var low = B_computeEconomy(leversWith({ price:'low' }), g.scenario, g.values, B_blankMods(), g.rent, g.subsidy);
      var high = B_computeEconomy(leversWith({ price:'high' }), g.scenario, g.values, B_blankMods(), g.rent, g.subsidy);
      ok(high.spend > low.spend, 'spend');
      ok(high.footfall < low.footfall, 'footfall');
    });

    assert('long hours on campus add a security charge; elsewhere they do not', function() {
      var c = B_newGame('campus'), h = B_newGame('highstreet');
      eq(B_computeEconomy(leversWith({ hours:'long' }), c.scenario, c.values, B_blankMods(), c.rent, c.subsidy).security, 2000);
      eq(B_computeEconomy(leversWith({ hours:'long' }), h.scenario, h.values, B_blankMods(), h.rent, h.subsidy).security, 0);
    });

    suite('Builder — scoring and verdicts');

    assert('disruptionOf sums lever weights', function() {
      eq(B_disruptionOf({}), 0);
      eq(B_disruptionOf({ entry:{}, price:{} }), B_LEVER_INDEX.entry.disruption + B_LEVER_INDEX.price.disruption);
    });

    assert('scoreOf is the rounded mean of the eight values', function() {
      var v = { ng:100, lv:100, cv:100, ac:100, rg:0, lp:0, pm:0, ha:0 };
      eq(B_scoreOf(v), 50);
    });

    assert('statusOf maps thresholds', function() {
      eq(B_statusOf(65), 'present'); eq(B_statusOf(64), 'ambiguous'); eq(B_statusOf(40), 'ambiguous'); eq(B_statusOf(39), 'absent');
    });

    assert('verdictOf covers closed, third place, in the making, venue and second place', function() {
      function all(n) { return { ng:n, lv:n, cv:n, ac:n, rg:n, lp:n, pm:n, ha:n }; }
      eq(B_verdictOf(all(90), true).id, 'closed');
      eq(B_verdictOf(all(80), false).id, 'third');
      var weak = all(80); weak.rg = 30;
      eq(B_verdictOf(weak, false).id, 'making', 'one weak characteristic should block the top verdict');
      eq(B_verdictOf(all(60), false).id, 'making');
      eq(B_verdictOf(all(45), false).id, 'venue');
      eq(B_verdictOf(all(20), false).id, 'second');
    });

    suite('Builder — game loop');

    assert('newGame starts in season 1 with scenario money and no regulars', function() {
      var g = B_newGame('community');
      eq(g.season, 1); eq(g.money, 14000); eq(g.rent, 1500);
      ok(g.values.rg < 15, 'regulars should start low');
      eq(g.closed, false); eq(g.finished, false); eq(g.history.length, 0);
      eq(B_actionsAllowed(g), 3);
    });

    assert('previewOption reports direct deltas, disruption and money change', function() {
      var g = B_newGame('community');
      var p = B_previewOption(g, 'entry', 'open');
      ok(p.deltas.ng > 0, 'open door should raise Neutral Ground');
      eq(p.disruption, B_LEVER_INDEX.entry.disruption);
      ok(typeof p.netDelta === 'number');
    });

    assert('endSeason applies pending changes, charges costs, records history and clears the tray', function() {
      var g = B_newGame('community');
      g.pending = { layout:'communal', entry:'open' };
      var r = B_endSeason(g);
      eq(g.levers.layout, 'communal'); eq(g.levers.entry, 'open');
      eq(r.spent, 1200);
      eq(r.disruption, B_LEVER_INDEX.layout.disruption + B_LEVER_INDEX.entry.disruption);
      eq(g.history.length, 1);
      eq(Object.keys(g.pending).length, 0);
      eq(g.money, 14000 - 1200 + r.eco.net);
    });

    assert('selecting the current option is not a change', function() {
      var g = B_newGame('community');
      g.pending = { price:'mid' };
      var r = B_endSeason(g);
      eq(Object.keys(r.changes).length, 0);
      eq(r.disruption, 0);
    });

    assert('advanceSeason increments and finishes after the last season', function() {
      var g = B_newGame('highstreet');
      g.season = B_SEASONS;
      B_advanceSeason(g);
      eq(g.finished, true);
      var g2 = B_newGame('highstreet');
      B_advanceSeason(g2);
      eq(g2.season, 2);
      eq(B_actionsAllowed(g2), 2);
    });

    assert('a full quiet play-through ends after 8 seasons with a history entry per season', function() {
      var g = B_newGame('campus');
      var guard = 0;
      while (!g.finished && guard++ < 20) {
        B_endSeason(g);
        if (g.pendingEvent) B_resolveEvent(g, g.pendingEvent, g.pendingEvent.choices[0].id);
        B_advanceSeason(g);
      }
      eq(g.history.length, B_SEASONS);
      eq(g.finished, true);
    });

    suite('Builder — events');

    assert('insolvency event fires when overdrawn; a second overdraft closes the place', function() {
      var g = B_newGame('community');
      g.money = -5000;
      eq(B_eligibleEvent(g).id, 'insolvency');
      g.insolvencies = 1;
      B_endSeason(g);
      eq(g.closed, true); eq(g.finished, true);
    });

    assert('the developer sale fires in season 6 of the community scenario only', function() {
      var g = B_newGame('community');
      g.season = 6;
      eq(B_eligibleEvent(g).id, 'sale');
      var h = B_newGame('highstreet');
      h.season = 6;
      var ev = B_eligibleEvent(h);
      ok(!ev || ev.id !== 'sale', 'sale should not fire on the high street');
    });

    assert('events fire at most once', function() {
      var g = B_newGame('community');
      g.season = 6;
      var ev = B_eligibleEvent(g);
      B_resolveEvent(g, ev, 'a');
      var again = B_eligibleEvent(g);
      ok(!again || again.id !== 'sale', 'sale fired twice');
    });

    assert('an unmet, non-tryable choice cannot be taken; a tryable one falls back', function() {
      var g = B_newGame('community');
      g.season = 6; g.money = 1000; g.values.rg = 10; g.values.ha = 10;
      var ev = B_eligibleEvent(g);
      var buy = ev.choices[2], rally = ev.choices[1];
      eq(B_choiceSelectable(ev, buy, g), false);
      eq(B_resolveEvent(g, ev, buy.id), null);
      eq(B_choiceSelectable(ev, rally, g), true);
      var res = B_resolveEvent(g, ev, rally.id);
      eq(res.choiceLabel, ev.fallback.label);
      eq(g.rent, 6000);
    });

    assert('resolving a choice applies levers, money and persistent modifiers', function() {
      var g = B_newGame('community');
      g.season = 6; g.values.rg = 80; g.values.ha = 80;
      var ev = B_eligibleEvent(g);
      var res = B_resolveEvent(g, ev, 'a');
      eq(g.levers.entry, 'membership');
      eq(g.money, 14000 + 8000);
      ok(res.effect, 'effect returned');
      var g2 = B_newGame('highstreet');
      g2.season = 3;
      var chain = B_eligibleEvent(g2);
      eq(chain.id, 'chain');
      B_resolveEvent(g2, chain, 'b');
      ok(g2.mods.chain && g2.mods.chain.footfall < 1, 'footfall modifier stored');
    });

    assert('debriefOf always returns at least one lesson', function() {
      var g = B_newGame('community');
      ok(B_debriefOf(g).length >= 1);
      g.closed = true;
      ok(B_debriefOf(g).some(function(l) { return l.title.indexOf('rent') !== -1; }), 'closure lesson');
    });

    suite('Builder — render functions');

    assert('money formats with pound sign and thousands separator', function() {
      eq(B_money(14000), '£14,000');
      eq(B_money(-424), '-£424');
    });

    assert('renderIntro and renderScenario produce expected markup', function() {
      ok(B_renderIntro().indexOf('data-action="to-scenario"') !== -1);
      var html = B_renderScenario();
      eq((html.match(/scenario-card/g) || []).length, 3);
    });

    assert('renderSeason shows a card for every lever option and marks current ones', function() {
      var g = B_newGame('community');
      B_setGame(g);
      var html = B_renderSeason();
      ok(html.indexOf('data-action="end-season"') !== -1);
      ok(html.indexOf('class="card current"') !== -1);
      ok(html.indexOf('The Courtyard Unit') !== -1);
    });

    assert('renderResult, renderEvent and renderFinal produce HTML after a season', function() {
      var g = B_newGame('community');
      g.season = 6;
      B_setGame(g);
      B_endSeason(g);
      var r = B_renderResult();
      ok(r.indexOf('bar-row') !== -1 && r.indexOf('In the bank') !== -1);
      ok(g.pendingEvent, 'expected an event');
      B_setEventOutcome(null);
      var e = B_renderEvent();
      ok(e.indexOf('data-action="choose"') !== -1);
      g.finished = true;
      var f = B_renderFinal();
      ok(f.indexOf('class="verdict') !== -1 && f.indexOf('For discussion') !== -1);
    });

    assert('esc escapes HTML in builder', function() {
      ok(B_esc('<i>&</i>').indexOf('<') === -1);
    });

    // =====================================================
    // ENCODING
    // =====================================================

    suite('Encoding — UTF-8 declaration');

    assert('lab.html has meta charset=utf-8', function() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'third-place-lab.html', false);
      xhr.send();
      ok(xhr.responseText.indexOf('charset="utf-8"') !== -1 || xhr.responseText.indexOf("charset='utf-8'") !== -1 || xhr.responseText.indexOf('charset=utf-8') !== -1,
        'missing meta charset');
    });

    assert('builder.html has meta charset=utf-8', function() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'third-place-builder.html', false);
      xhr.send();
      ok(xhr.responseText.indexOf('charset="utf-8"') !== -1, 'missing meta charset');
    });

    assert('builder.html uses no curly quotes in its script', function() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'third-place-builder.html', false);
      xhr.send();
      var m = xhr.responseText.match(/<script>([\s\S]*?)<\/script>/);
      ok(m && !/[\u2018\u2019\u201C\u201D]/.test(m[1]), 'curly quotes found');
    });

    assert('decoder.html has meta charset=utf-8', function() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'third-place-decoder.html', false);
      xhr.send();
      ok(xhr.responseText.indexOf('charset="utf-8"') !== -1 || xhr.responseText.indexOf("charset='utf-8'") !== -1 || xhr.responseText.indexOf('charset=utf-8') !== -1,
        'missing meta charset');
    });

    // =====================================================
    // ADJUDICATION BENCH (week 6b)
    // =====================================================

    suite('Adjudication Bench — Config integrity');

    assert('W6B test hook is exposed', function() {
      ok(window.W6B && W6B.CONFIG, 'missing W6B');
    });

    assert('CONFIG has 1 to 3 cases, each with exactly two explanations', function() {
      var cases = W6B.CONFIG.cases;
      ok(cases.length >= 1 && cases.length <= 3, 'case count ' + cases.length);
      cases.forEach(function(c) { eq(c.explanations.length, 2, c.id); });
    });

    assert('Each explanation has id, label, valid lens and each case a valid claim type', function() {
      W6B.CONFIG.cases.forEach(function(c) {
        ok(W6B.CONFIG.claimTypes[c.claim.type], 'bad claim type ' + c.claim.type);
        c.explanations.forEach(function(e) {
          ok(e.id && e.label && e.mechanism, 'missing fields on ' + e.id);
          ok(W6B.CONFIG.lenses[e.lens], 'bad lens ' + e.lens);
          ok(Array.isArray(e.evidenceCards) && e.evidenceCards.length > 0, 'no cards on ' + e.id);
        });
      });
    });

    assert('Evidence card ids are unique within each case', function() {
      W6B.CONFIG.cases.forEach(function(c) {
        var seen = {};
        c.explanations.forEach(function(e) { e.evidenceCards.forEach(function(k) {
          ok(!seen[k.id], 'duplicate card id ' + k.id + ' in ' + c.id); seen[k.id] = true;
          ok(k.title && k.summary, 'card ' + k.id + ' missing text');
        }); });
      });
    });

    assert('Four criteria, each with 2 to 3 guiding questions', function() {
      eq(W6B.CONFIG.criteria.length, 4);
      eq(W6B.CONFIG.criteria.map(function(c) { return c.id; }).join(','), 'causal,scope,implications,method');
      W6B.CONFIG.criteria.forEach(function(c) { ok(c.questions.length >= 2 && c.questions.length <= 3, c.id); });
    });

    assert('Rating scale and verdict lists match the specification', function() {
      eq(W6B.CONFIG.ratingScale.map(function(r) { return r.id; }).join(','), 'strong,moderate,weak,none');
      eq(W6B.CONFIG.verdicts.map(function(v) { return v.id; }).join(','), 'survives,scope-limited,fails,undecidable');
      eq(W6B.CONFIG.relations.length, 6);
      eq(W6B.CONFIG.designTypes.length, 7);
    });

    suite('Adjudication Bench — Validation rules');

    assert('wordCount splits on whitespace', function() {
      eq(W6B.wordCount('  one two\nthree  '), 3);
      eq(W6B.wordCount(''), 0);
    });

    assert('validatePrediction enforces prefix and minimum words', function() {
      ok(W6B.validatePrediction('Fewer visits.').length === 2, 'short and wrong prefix');
      ok(W6B.validatePrediction('If this is true, we would expect one two three four five six seven eight nine ten.').length === 0, 'valid rejected');
    });

    assert('validateCell rejects a rated cell with zero cited cards', function() {
      var w = 'word '.repeat(30);
      ok(W6B.validateCell({ rating: 'strong', warrant: w, cited: [] }).length === 1);
      ok(W6B.validateCell({ rating: 'weak', warrant: w, cited: [] }).length === 1);
    });

    assert('validateCell accepts "no evidence" with zero cited cards and a full warrant', function() {
      var w = 'word '.repeat(30);
      eq(W6B.validateCell({ rating: 'none', warrant: w, cited: [] }).length, 0);
      ok(W6B.validateCell({ rating: 'none', warrant: 'too short', cited: [] }).length === 1, 'short warrant');
    });

    assert('buildExport output validates against the documented schema', function() {
      var st = W6B.blankState();
      st.caseId = W6B.CONFIG.cases[0].id;
      st.group.name = 'Test';
      W6B.setState(st);
      var out = W6B.buildExport();
      eq(out.schema, 'week6b-adjudication-bench');
      eq(out.explanations.length, 2);
      ['id', 'label', 'lens', 'claimType', 'verdict', 'scopeLimits', 'ratings'].forEach(function(k) { ok(k in out.explanations[0], 'missing ' + k); });
      eq(W6B.validateExport(out).length, 0, W6B.validateExport(out).join('; '));
    });

    assert('validateExport rejects a foreign schema', function() {
      ok(W6B.validateExport({ schema: 'other' }).length > 0);
    });

    suite('Adjudication Bench — Encoding');

    assert('week6b-adjudication-bench.html has meta charset=utf-8', function() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'week6b-adjudication-bench.html', false);
      xhr.send();
      ok(xhr.responseText.indexOf('<meta charset="utf-8">') === 0, 'charset must be the first thing in the file');
    });

    assert('week6b-adjudication-bench.html uses no curly quotes in its script', function() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'week6b-adjudication-bench.html', false);
      xhr.send();
      var m = xhr.responseText.match(/<script>([\s\S]*?)<\/script>/);
      ok(m && !/[\u2018\u2019\u201C\u201D]/.test(m[1]), 'curly quotes found');
    });

    // =====================================================
    // SUMMARY
    // =====================================================

    var total = passed + failed;
    var summaryEl = document.getElementById('summary');
    summaryEl.innerHTML = '<span class="' + (failed ? 'fail' : 'pass') + '">'
      + passed + '/' + total + ' passed'
      + (failed ? ', ' + failed + ' failed' : '')
      + '</span>';
    document.title = (failed ? '✗ ' : '✓ ') + passed + '/' + total + ' — Third Places Tests';
  }

  loadScripts(runTests);
})();
</script>
