<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claim Wall Analyser</title>

<!--
  CLAIM WALL ANALYSER - VIEWER (Sessions 3 and 4)
  Social Phenomena Challenge. Build spec: claim-wall-spec.md. Coding rules:
  ANALYSIS_PROTOCOL.md. Data: analysis/S1.json, embedded below.

  What this file does
    Shows one coded snapshot of the claim wall in five places:
      - Grid: claims x lenses, mirroring the board, with compact sub-scores
      - Oldenburg coverage: characteristics x claims
      - Entry detail: everything coded for one card (opens from any card or ID)
      - Claim synthesis: one panel per claim
      - Overrides: every instructor override on the current snapshot
    A Student view toggle hides scores and synthesis and keeps the grid, the
    Oldenburg mapping and the testable implications (spec Section 5). Hidden
    content is not rendered at all in student view, not merely hidden by CSS.
    Open with ?view=student to start in student view.

  Instructor override (Session 4)
    In instructor view, each code block in the entry detail (the Oldenburg
    mapping and the six strength criteria) has an Override button. An override
    never edits the analyst's code: it is stored in the document's `overrides`
    array as a JSON Pointer, the analyst's original value, the new value, a
    reason, a name and a time (schema.json, $defs/override). The viewer shows
    the reconciled value (original with overrides applied), marks it
    "Overridden" and shows the original beside it. The claim synthesis is the
    analyst's and is not recomputed; panels say so when an override touches
    them. Student view shows reconciled values marked "Revised by instructor",
    with no originals or reasons.

  Export, loading and snapshots (Session 4)
    Export JSON: the analyst's document unchanged, plus the `overrides` array.
    It validates against schema.json and loads back into this viewer.
    Export .xlsx: reconciled entries, the analyst's entries, every override
    with its original value, and snapshot metadata, written by the inline
    zip/SpreadsheetML writer below (no library).
    Load analysis JSON: any analysis/*.json, validated in the browser against
    the embedded schema (embedded-schema block) and the checks in
    `semanticErrors` and `overrideErrors`. A file that fails is rejected with
    the reasons listed and nothing in the viewer changes.
    The snapshot selector switches between the built-in snapshot and loaded
    files. Overrides and loaded files are kept in this browser's localStorage
    (key in CONFIG.storageKey) until Reset. The diff view is a disabled
    placeholder until a second snapshot is coded (spec Session 5).

  Embedded data
    The embedded-analysis block holds analysis/S1.json verbatim and the
    embedded-schema block holds analysis/schema.json verbatim. Do not edit
    either by hand. After either file changes, run from claim-wall/:
      python3 scripts/embed_analysis.py
    which rewrites both blocks and checks they parse back equal.

  No external dependencies; works from file:// and GitHub Pages.
-->
<style>
  :root {
    --bg: #F2DFBE;
    --bg-card: #FFFAF2;
    --bg-deep: #E8D2A8;
    --text: #2A1F18;
    --text-muted: #6A5A48;
    --border: #D8C8A8;

    --char-1: #5C3A96;
    --char-2: #B52838;
    --char-3: #C85218;
    --char-4: #D4A020;
    --char-5: #7A5828;
    --char-6: #B83068;
    --char-7: #CC6830;
    --char-8: #7E58A8;

    --correct: #2A7A42;
    --correct-bg: #E6F4EA;
    --incorrect: #B82828;
    --incorrect-bg: #FDEEEE;
    --ambiguous: #B98A10;
    --ambiguous-bg: #FFF3D6;

    /* Lens colours follow week6b-adjudication-bench.html */
    --lens-psychology: #5C3A96;
    --lens-economics: #D4A020;
    --lens-politics: #B52838;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
  }
  :focus-visible { outline: 3px solid var(--char-1); outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  .app-wrap { max-width: 1180px; margin: 0 auto; padding: 2rem; }

  h1 {
    font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 800; letter-spacing: 0.06em;
    text-transform: uppercase; line-height: 1.1; margin-bottom: 0.5rem;
  }
  h2 {
    font-size: clamp(1.5rem, 3vw, 2.1rem); font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.04em; line-height: 1.2; margin-bottom: 0.75rem;
  }
  h3 {
    font-size: 1.05rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
    line-height: 1.25; margin-bottom: 0.5rem;
  }
  h4 {
    font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em;
    line-height: 1.3; margin-bottom: 0.4rem;
  }
  p { margin-bottom: 0.75rem; }
  .lede { font-size: 1.02rem; line-height: 1.6; color: var(--text-muted); max-width: 720px; margin-bottom: 1rem; }
  .eyebrow { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); }
  .quiet { color: var(--text-muted); font-size: 0.88rem; }
  .pip { display: inline-block; width: 10px; height: 10px; flex: none; vertical-align: middle; }

  /* ── Page header with decorative geometry ── */
  .page-header {
    position: relative; overflow: hidden;
    padding: 2rem 2rem 1.5rem 0; margin-bottom: 1.25rem;
    border-bottom: 6px solid var(--char-6);
  }
  .page-header > * { position: relative; z-index: 1; }
  .page-header::before {
    content: ''; position: absolute; width: 220px; height: 220px;
    background: var(--char-6); border-radius: 50%; opacity: 0.08;
    top: -60px; right: -40px; z-index: 0;
  }
  .page-header::after {
    content: ''; position: absolute; width: 70px; height: 70px;
    background: var(--char-4); opacity: 0.12;
    bottom: 14px; right: 150px; transform: rotate(25deg); z-index: 0;
  }
  .page-header .deco-bar {
    position: absolute; z-index: 0; pointer-events: none;
    width: 160px; height: 10px; background: var(--char-3);
    top: 30px; right: 270px; transform: rotate(-8deg); opacity: 0.9;
  }
  .page-header .deco-ring {
    position: absolute; z-index: 0; pointer-events: none;
    width: 90px; height: 90px; border: 6px solid var(--char-1); border-radius: 50%;
    bottom: -30px; right: 40px; opacity: 0.3;
  }
  .header-meta {
    display: flex; flex-wrap: wrap; gap: 0.35rem 1.25rem; align-items: center;
    font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 0.75rem;
  }
  .header-meta .pip { margin-right: 6px; }
  .snapshot-notes { font-size: 0.88rem; max-width: 760px; }
  .snapshot-notes summary {
    cursor: pointer; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; min-height: 44px; display: flex; align-items: center;
  }
  .snapshot-notes ul { margin: 0 0 0.5rem 1.2rem; }

  /* ── Toolbar: view tabs + student toggle ── */
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 0.75rem 1rem; align-items: flex-end; justify-content: space-between;
    border-bottom: 2px solid var(--border); margin-bottom: 1.25rem;
  }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab {
    font-family: inherit; background: none; border: none; cursor: pointer;
    border-bottom: 4px solid transparent; margin-bottom: -2px;
    padding: 0.6rem 0.9rem; min-height: 44px;
    font-size: 0.8rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-muted);
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--tab-color, var(--char-1)); }
  .tab .pip { margin-right: 8px; background: var(--tab-color, var(--char-1)); }

  .view-toggle {
    font-family: inherit; cursor: pointer; min-height: 44px; margin-bottom: 8px;
    display: inline-flex; align-items: center; gap: 0.6rem;
    padding: 0.5rem 1rem; border: 2px solid var(--text); background: transparent; color: var(--text);
    font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    transition: background-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }
  .view-toggle:hover { transform: translateY(-2px); }
  .view-toggle .switch {
    width: 34px; height: 18px; border: 2px solid currentColor; position: relative; flex: none;
  }
  .view-toggle .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; background: currentColor;
    transition: left 0.2s ease;
  }
  .view-toggle[aria-pressed="true"] { background: var(--char-1); border-color: var(--char-1); color: #fff; }
  .view-toggle[aria-pressed="true"] .switch::after { left: 18px; }

  .mode-banner {
    background: var(--char-1); color: #fff; padding: 0.9rem 1.25rem; margin-bottom: 1.25rem;
    font-size: 0.92rem; position: relative; overflow: hidden;
  }
  .mode-banner strong { text-transform: uppercase; letter-spacing: 0.1em; margin-right: 0.5rem; }
  .mode-banner::after {
    content: ''; position: absolute; width: 60px; height: 60px; background: var(--char-4);
    right: -14px; top: -18px; transform: rotate(25deg); opacity: 0.9;
  }
  .mode-banner > * { position: relative; z-index: 1; }

  /* ── Generic panel ── */
  .panel {
    position: relative; overflow: hidden;
    background: var(--bg-card); border: 2px solid var(--border);
    border-left: 8px solid var(--panel-color, var(--char-1));
    padding: 1.5rem 1.5rem 1.75rem; margin-bottom: 1.5rem;
  }
  .panel > * { position: relative; z-index: 1; }
  .panel::before {
    content: ''; position: absolute; width: 180px; height: 180px;
    background: var(--panel-color, var(--char-1)); opacity: 0.06;
    top: -60px; right: -50px; transform: rotate(18deg); z-index: 0;
  }
  .panel-intro { max-width: 760px; }

  .legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1.25rem; font-size: 0.82rem; margin: 0.5rem 0 1rem; }
  .legend > span { display: inline-flex; align-items: center; gap: 0.4rem; }
  .legend b { font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.72rem; }

  .note-box {
    border-left: 5px solid var(--ambiguous); background: var(--ambiguous-bg);
    padding: 0.85rem 1.1rem; margin: 0.75rem 0 1rem; font-size: 0.9rem;
  }
  .note-box.info { border-left-color: var(--char-1); background: rgba(92,58,150,0.08); }

  /* ── Chips ── */
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 2px 7px; border: 1.5px solid; line-height: 1.4; vertical-align: middle;
  }
  .chip.uncertain { color: #7A5A08; border-color: var(--ambiguous); background: var(--ambiguous-bg); border-style: dashed; }
  .chip.flag { color: var(--incorrect); border-color: var(--incorrect); background: var(--incorrect-bg); }
  .chip.move { color: var(--char-5); border-color: var(--char-5); background: #fff; }
  .chip.cand { color: #fff; border-color: var(--correct); background: var(--correct); }
  .chip.lens { color: var(--text); border-color: var(--text); background: #fff; }
  .lens-tag {
    display: inline-block; padding: 2px 8px; font-size: 0.68rem; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase; color: #fff; background: var(--lens-color);
  }
  .lens-tag.on-light { color: var(--text); }

  /* ── Compact sub-score display ── */
  .scores { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; margin-top: 0.55rem; }
  .ss {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    border: 1.5px solid var(--border); background: #fff; padding: 3px 1px 4px; min-width: 0;
  }
  .ss abbr { text-decoration: none; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; color: var(--text-muted); }
  .ss .val { font-size: 0.82rem; font-weight: 800; line-height: 1; }
  .ss .bars { display: flex; gap: 2px; }
  .ss .bars i { display: block; width: 8px; height: 5px; border: 1px solid var(--text); }
  .ss .bars i.on { background: var(--text); }
  .scores.wide { max-width: 420px; }

  /* ── Grid view ── */
  .wall {
    display: grid;
    grid-template-columns: minmax(170px, 0.9fr) repeat(3, minmax(0, 1fr));
    gap: 6px;
  }
  .wall-corner { align-self: end; }
  .wall-colhead {
    background: var(--lens-color); color: #fff; padding: 0.6rem 0.8rem;
    font-size: 0.85rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .wall-colhead.on-light { color: var(--text); }
  .wall-rowhead {
    background: var(--bg-card); border: 2px solid var(--border); border-top: 0;
    display: flex; flex-direction: column;
  }
  .wall-rowhead .claim-block {
    background: var(--claim-color); color: #fff; padding: 0.6rem 0.8rem;
    font-size: 1.2rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.2;
  }
  .wall-rowhead .claim-body { padding: 0.7rem 0.8rem 0.8rem; border-left: 6px solid var(--claim-color); flex: 1; }
  .wall-rowhead .claim-text { font-weight: 700; font-size: 0.95rem; line-height: 1.4; margin-bottom: 0.5rem; }
  .wall-rowhead .claim-count { font-size: 0.78rem; color: var(--text-muted); }
  .link-btn {
    font-family: inherit; background: none; border: none; cursor: pointer; padding: 0;
    color: var(--char-1); font-weight: 700; font-size: 0.75rem; letter-spacing: 0.1em;
    text-transform: uppercase; text-decoration: underline; text-underline-offset: 3px;
    min-height: 44px; display: inline-flex; align-items: center;
  }
  .link-btn:hover { color: var(--char-2); }
  .wall-cell {
    background: rgba(255,250,242,0.55); border: 2px dashed var(--border);
    padding: 6px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
  }
  .wall-cell .cell-head { display: none; }
  .wall-cell .empty { font-size: 0.82rem; color: var(--text-muted); padding: 0.5rem; }

  .wcard {
    font-family: inherit; text-align: left; cursor: pointer; width: 100%;
    color: var(--text); background: var(--bg-card);
    border: 2px solid var(--border); border-left: 6px solid var(--lens-color);
    padding: 0.6rem 0.65rem 0.65rem; min-height: 44px;
    display: block; position: relative;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.2s ease;
  }
  .wcard:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(42,31,24,0.12); border-color: var(--lens-color); }
  .wcard-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-bottom: 0.3rem; }
  .wcard-id { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
  .wcard-text { display: block; font-size: 0.9rem; line-height: 1.4; overflow-wrap: anywhere; }
  .wcard-chars { display: flex; flex-wrap: wrap; gap: 3px 8px; margin-top: 0.45rem; font-size: 0.7rem; font-weight: 700; }
  .wcard-chars > span { display: inline-flex; align-items: center; gap: 4px; }
  .wcard-chars .pip { width: 9px; height: 9px; }
  .wcard-flags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 0.45rem; }
  .ins { font-style: italic; color: var(--text-muted); }

  /* ── Coverage view ── */
  .cov-table { width: 100%; border-collapse: separate; border-spacing: 4px; table-layout: fixed; }
  .cov-table th, .cov-table td { vertical-align: top; text-align: left; }
  .cov-table thead th {
    background: var(--claim-color); color: #fff; padding: 0.55rem 0.7rem;
    font-size: 1.2rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.2;
    overflow-wrap: anywhere;
  }
  .cov-table thead th small { display: block; font-size: 1.2rem; }
  .cov-table thead th.corner { background: transparent; color: var(--text-muted); font-size: 0.72rem; letter-spacing: 0.12em; vertical-align: bottom; width: 26%; }
  .cov-table tbody th {
    background: var(--bg-card); border: 2px solid var(--border); border-left: 8px solid var(--char-color);
    padding: 0.55rem 0.7rem; font-size: 0.9rem; font-weight: 800; line-height: 1.3;
  }
  .cov-table tbody th .def { margin-top: 0.3rem; }
  .cov-table tbody th .def summary {
    cursor: pointer; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-muted); min-height: 44px; display: flex; align-items: center;
  }
  .cov-table tbody th .def p { font-weight: 400; font-size: 0.85rem; margin: 0.25rem 0 0.2rem; }
  .cov-table tbody th .def .src { font-size: 0.72rem; color: var(--text-muted); }
  .cov-cell { background: var(--bg-card); border: 2px solid var(--border); padding: 0.4rem 0.5rem; }
  .cov-cell.has { border-color: var(--char-color); background: #fff; }
  .cov-cell.none { background: transparent; border-style: dashed; color: var(--text-muted); font-size: 0.82rem; }
  .cov-list { list-style: none; display: flex; flex-direction: column; gap: 3px; }
  .eref {
    font-family: inherit; cursor: pointer; text-align: left;
    background: #fff; color: var(--text); border: 2px solid var(--text);
    padding: 0.25rem 0.5rem; min-height: 44px; min-width: 44px;
    font-size: 0.78rem; font-weight: 800; letter-spacing: 0.06em;
    display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  .eref:hover { background: var(--text); color: var(--bg-card); }
  .eref .rel { font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.66rem; }
  .cov-foot td { font-size: 0.8rem; color: var(--text-muted); padding: 0.3rem 0.5rem; }
  .cov-foot th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); text-align: left; padding: 0.3rem 0.5rem; }

  table.plain { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  table.plain th {
    text-align: left; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
    border-bottom: 3px solid var(--text); padding: 0.4rem 0.5rem;
  }
  table.plain td { border-bottom: 2px solid var(--border); padding: 0.45rem 0.5rem; vertical-align: top; }
  .table-wrap { overflow-x: auto; }

  /* ── Rationale display ── */
  .rat { margin-top: 0.35rem; font-size: 0.88rem; }
  .rat .quotes { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 0.25rem; }
  .q {
    background: rgba(212,160,32,0.12); border-left: 3px solid var(--char-4);
    padding: 1px 6px; font-size: 0.85rem; overflow-wrap: anywhere;
  }
  .q::before { content: '\201C'; }
  .q::after { content: '\201D'; }

  /* ── Synthesis view ── */
  .claim-jump { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.25rem; }
  .claim-jump a {
    display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0.4rem 0.85rem;
    border: 2px solid var(--claim-color); border-left-width: 8px; background: var(--bg-card); color: var(--text);
    font-size: 0.75rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none;
  }
  .claim-jump a:hover { background: var(--text); color: #fff; }
  .syn {
    position: relative; overflow: hidden;
    background: var(--bg-card); border: 2px solid var(--border); border-left: 8px solid var(--claim-color);
    margin-bottom: 1.75rem; scroll-margin-top: 1rem;
  }
  .syn::after {
    content: ''; position: absolute; width: 120px; height: 120px; border: 8px solid var(--claim-color);
    border-radius: 50%; opacity: 0.08; right: -30px; bottom: -40px; z-index: 0; pointer-events: none;
  }
  .syn-banner { background: var(--claim-color); color: #fff; padding: 1.1rem 1.5rem; position: relative; overflow: hidden; }
  .syn-banner::after {
    content: ''; position: absolute; width: 70px; height: 70px; background: #fff; opacity: 0.12;
    right: 24px; top: -20px; transform: rotate(25deg);
  }
  .syn-banner h2 { margin: 0 0 0.25rem; color: #fff; }
  .syn-banner .claim-text { font-size: 1.2rem; font-weight: 700; line-height: 1.35; }
  .syn-body { padding: 1.25rem 1.5rem 1.5rem; position: relative; z-index: 1; }
  .syn-sec { padding: 1rem 0; border-top: 4px solid var(--sec-color, var(--border)); }
  .syn-sec:first-child { border-top: none; padding-top: 0; }
  .syn-sec h3 { display: flex; align-items: center; gap: 0.5rem; }
  .syn-sec h3 .pip { width: 12px; height: 12px; background: var(--sec-color); }
  .syn-item { border: 2px solid var(--border); background: #fff; padding: 0.75rem 0.9rem; margin-top: 0.6rem; }
  .syn-item-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 0.35rem; }
  .syn-item p:last-child { margin-bottom: 0; }
  .refs { display: flex; flex-wrap: wrap; gap: 4px; margin: 0.35rem 0; }
  .gap-list { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.88rem; margin: 0.3rem 0 0.6rem; }
  .gap-list li { display: inline-flex; align-items: center; gap: 6px; }
  .empty-line { font-size: 0.88rem; color: var(--text-muted); font-style: italic; }

  /* ── Entry detail dialog ── */
  dialog#detail {
    border: none; padding: 0; margin: auto; width: min(860px, calc(100vw - 24px));
    max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px);
    background: var(--bg-card); color: var(--text); border-left: 10px solid var(--claim-color, var(--char-1));
  }

  .dlg-head {

  .ovf-checks { display: flex; flex-wrap: wrap; gap: 0 1.25rem; }
  .ovf-row { border: 2px solid var(--border); border-left: 6px solid var(--char-1); padding: 0.5rem 0.7rem 0.7rem; margin-top: 0.6rem; }
  .ovf-row-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; }

  .ovf-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 0.75rem; }
  .wordcount { font-size: 0.8rem; font-weight: 700; margin-top: 0.25rem; color: var(--incorrect); }
  .wordcount.met { color: var(--correct); }
  .ovf-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }

  /* ── Responsive ── */
  @media (max-width: 1000px) {
    .wall { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .cov-table, .cov-table tbody, .cov-table tr, .cov-table td, .cov-table tbody th { display: block; width: auto; }

    .cov-table td { margin-top: 4px; }
    .cov-table td::before {
      content: attr(data-label); display: block; font-size: 0.68rem; font-weight: 800;
      letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 3px; color: var(--text);
    }

    .cov-table tfoot tr { display: flex; flex-wrap: wrap; gap: 4px 12px; }
    .cov-table tfoot td, .cov-table tfoot th { display: block; padding: 0.2rem 0; }
    .cov-table tfoot td::before { content: attr(data-label) ': '; display: inline; }
    table.plain.stack thead { display: none; }
    table.plain.stack, table.plain.stack tbody, table.plain.stack tr, table.plain.stack td { display: block; width: auto; }
    table.plain.stack tr { border-bottom: 3px solid var(--border); padding: 0.4rem 0; }
    table.plain.stack td { border: none; padding: 0.15rem 0; }
    table.plain.stack td::before {
      content: attr(data-label) ': '; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
    }
  }
  @media (max-width: 400px) {
    .scores { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  @media (prefers-reduced-motion: reduce) {

  }

  /* ── Print: current view only, controls hidden ── */
  @media print {

    .wcard, .ss .bars i.on, .chip, .cov-table tbody th, .dlg-head, .wall-cell .cell-head {

<script type="application/json" id="embedded-schema">
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "claim-wall/analysis/schema.json",
  "title": "Claim Wall Analysis",
  "description": "One snapshot of the claim wall coded per ANALYSIS_PROTOCOL.md. Sub-scores are reported separately; there is no total.",
  "type": "object",
  "additionalProperties": false,
  "required": ["schema_version", "protocol_version", "theory_file", "snapshot", "entries", "claim_synthesis", "snapshot_gaps", "overrides"],
  "properties": {
    "schema_version": { "const": "1.0" },
    "protocol_version": { "type": "string", "minLength": 1 },
    "theory_file": {
      "type": "object",
      "additionalProperties": false,
      "required": ["path", "sha256"],
      "properties": {
        "path": { "const": "../third-place-content.md" },
        "sha256": { "type": "string", "pattern": "^[0-9a-f]{64}$" }
      }
    },
    "snapshot": { "$ref": "#/$defs/snapshot" },
    "entries": {
      "type": "array",
      "minItems": 1,
      "items": { "$ref": "#/$defs/entry" }
    },
    "claim_synthesis": {
      "type": "array",
      "minItems": 4,
      "maxItems": 4,
      "items": { "$ref": "#/$defs/claim_synthesis" }
    },
    "snapshot_gaps": {
      "type": "object",
      "additionalProperties": false,
      "required": ["characteristics_unengaged_anywhere"],
      "properties": {
        "characteristics_unengaged_anywhere": {
          "type": "array",
          "uniqueItems": true,
          "items": { "$ref": "#/$defs/characteristic_name" }
        },
        "notes": { "type": "string" }
      }
    },
    "overrides": {
      "description": "Written by the viewer (Session 4) only; [] when written by the analyst. The analyst's original code is never edited in place.",
      "type": "array",
      "items": { "$ref": "#/$defs/override" }
    }
  },

  "$defs": {
    "entry_id": { "type": "string", "pattern": "^S[0-9]+-[0-9]{3}$" },
    "snapshot_id": { "type": "string", "pattern": "^S[0-9]+$" },
    "claim_no": { "type": "integer", "minimum": 1, "maximum": 4 },
    "claim_label": { "enum": ["Quantity", "Usage", "Outcomes", "Quality"] },
    "lens": { "enum": ["Psychology", "Economics", "Politics"] },
    "score": { "type": "integer", "enum": [0, 1, 2] },
    "criterion": { "enum": ["claim_fit", "mechanism", "explains_change", "lens_fit", "testability", "scope", "oldenburg"] },

    "characteristic_name": {
      "description": "Exact names from the Section A headings of the theory file (ANALYSIS_PROTOCOL.md Section 2).",
      "enum": [
        "Neutral Ground",
        "The Leveler",
        "Conversation is the Main Activity",
        "Accessibility and Accommodation",
        "The Regulars",
        "A Low Profile",
        "The Mood is Playful",
        "A Home Away from Home"
      ]
    },

    "rationale": {
      "description": "Every code carries one. Each quote must appear verbatim in Card_Text and contain no square brackets (checked by the validator).",
      "type": "object",
      "additionalProperties": false,
      "required": ["quotes", "text"],
      "properties": {
        "quotes": {
          "type": "array",
          "minItems": 1,
          "items": { "type": "string", "minLength": 1, "pattern": "^[^\\[\\]]+$" }
        },
        "text": { "type": "string", "minLength": 1 }
      }
    },

    "snapshot": {
      "type": "object",
      "additionalProperties": false,
      "required": ["snapshot_id", "snapshot_date", "source_workbook", "entry_count", "uncertain_count", "analyst", "generated_at"],
      "properties": {
        "snapshot_id": { "$ref": "#/$defs/snapshot_id" },
        "snapshot_date": {
          "description": "From Entries!Snapshot_Date; null when blank in the workbook.",
          "type": ["string", "null"],
          "format": "date"
        },
        "source_workbook": { "type": "string", "minLength": 1 },
        "entry_count": { "type": "integer", "minimum": 1 },
        "uncertain_count": { "type": "integer", "minimum": 0 },
        "analyst": { "type": "string", "minLength": 1 },
        "generated_at": { "type": "string", "format": "date-time" },
        "notes": {
          "description": "Snapshot-level transcription notes, e.g. cards visible on the board but not captured.",
          "type": "array",
          "items": { "type": "string" }
        }
      }
    },

    "entry": {
      "type": "object",
      "additionalProperties": false,
      "required": ["entry_id", "claim_no", "discipline", "card_text", "transcription_confidence", "transcription_caveat", "caveat_affects", "oldenburg", "strength"],
      "properties": {
        "entry_id": { "$ref": "#/$defs/entry_id" },
        "claim_no": { "$ref": "#/$defs/claim_no" },
        "discipline": { "$ref": "#/$defs/lens" },
        "card_text": { "description": "Copied verbatim from the workbook; the validator checks equality.", "type": "string", "minLength": 1 },
        "transcription_confidence": { "enum": ["High", "Uncertain"] },
        "transcription_caveat": { "type": ["string", "null"] },
        "caveat_affects": {
          "type": "array",
          "uniqueItems": true,
          "items": { "$ref": "#/$defs/criterion" }
        },
        "oldenburg": { "$ref": "#/$defs/oldenburg" },
        "strength": { "$ref": "#/$defs/strength" },
        "analyst_note": { "type": "string" }
      },
      "allOf": [
        {
          "if": { "properties": { "transcription_confidence": { "const": "Uncertain" } } },
          "then": { "properties": { "transcription_caveat": { "type": "string", "minLength": 1 } } }
        }
      ]
    },

    "oldenburg": {
      "type": "object",
      "additionalProperties": false,
      "required": ["engagement", "characteristics", "vocabulary_flags"],
      "properties": {
        "engagement": { "enum": ["engaged", "none"] },
        "characteristics": {
          "type": "array",
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": ["name", "relation", "rationale"],
            "properties": {
              "name": { "$ref": "#/$defs/characteristic_name" },
              "relation": { "enum": ["erodes", "barrier", "invokes"] },
              "rationale": { "$ref": "#/$defs/rationale" }
            }
          }
        },
        "none_rationale": { "$ref": "#/$defs/rationale" },
        "vocabulary_flags": {
          "type": "array",
          "items": {

  var EMBEDDED = JSON.parse(document.getElementById('embedded-analysis').textContent);
  var CHAR_BY_NAME = {};
  CONFIG.characteristics.forEach(function (c) { CHAR_BY_NAME[c.name] = c; });
  var LENS_BY_ID = {};
  CONFIG.lenses.forEach(function (l) { LENS_BY_ID[l.id] = l; });
  var CLAIM_NOS = [1, 2, 3, 4];
  var CRIT_KEYS = CONFIG.criteria.map(function (c) { return c.key; });
  var CRIT_BY_KEY = {};
  CONFIG.criteria.forEach(function (c) { CRIT_BY_KEY[c.key] = c; });

  // The fields of each strength criterion an override may change. All are
  // required by the schema, so a pointer to any of them always resolves.
  var CRIT_FIELDS = {
    claim_fit: ['score', 'rationale', 'misfiled_to', 'not_an_explanation'],
    mechanism: ['score', 'rationale'],
    explains_change: ['score', 'rationale'],
    lens_fit: ['score', 'rationale', 'actual_lens'],
    testability: ['score', 'rationale', 'testable_implication', 'implication_note'],
    scope: ['score', 'rationale', 'stated_scope', 'bodo_question']
  };
  // Overridden fields that student view shows (as "Revised by instructor").
  var STUDENT_VISIBLE_RELS = ['oldenburg', 'strength/testability/testable_implication',
    'strength/testability/implication_note', 'strength/scope/bodo_question'];

  var SLOTS = [];
  var BASE, DATA, ENTRIES, BY_ID, BASE_BY_ID, ENTRY_INDEX, SYN, CANDIDATE_IDS, OV_BY_PTR, OV_BY_ENTRY;

  function useSlot(slot) {
    BASE = slot.base;
    DATA = reconcile(BASE, slot.overrides);
    ENTRIES = DATA.entries;
    BY_ID = {}; BASE_BY_ID = {}; ENTRY_INDEX = {};
    ENTRIES.forEach(function (e, i) { BY_ID[e.entry_id] = e; ENTRY_INDEX[e.entry_id] = i; });
    BASE.entries.forEach(function (e) { BASE_BY_ID[e.entry_id] = e; });
    SYN = {};
    DATA.claim_synthesis.forEach(function (c) { SYN[c.claim_no] = c; });
    // Entries passing the candidate gate on their filed claim (from synthesis).
    CANDIDATE_IDS = {};
    DATA.claim_synthesis.forEach(function (c) {
      c.candidates.forEach(function (k) { CANDIDATE_IDS[k.entry_id] = c.claim_no; });
    });
    OV_BY_PTR = {}; OV_BY_ENTRY = {};
    slot.overrides.forEach(function (ov) {
      OV_BY_PTR[ov.pointer] = ov;
      (OV_BY_ENTRY[ov.target.entry_id] = OV_BY_ENTRY[ov.target.entry_id] || []).push(ov);
    });
  }

  function currentSlot() {
    for (var i = 0; i < SLOTS.length; i++) if (SLOTS[i].key === state.slot) return SLOTS[i];
    return SLOTS[0];
  }

  // Override lookups. `rel` is the path below /entries/<i>/, e.g.
  // 'oldenburg' or 'strength/mechanism/score'.
  function relOf(ptr) { return ptr.replace(/^\/entries\/\d+\//, ''); }
  function ovAt(id, rel) { return OV_BY_PTR['/entries/' + ENTRY_INDEX[id] + '/' + rel] || null; }
  function entryOvs(id) { return OV_BY_ENTRY[id] || []; }
  function blockOvs(id, block) {
    var pre = block === 'oldenburg' ? 'oldenburg' : 'strength/' + block + '/';
    return entryOvs(id).filter(function (ov) {
      var r = relOf(ov.pointer);
      return block === 'oldenburg' ? r === pre : r.indexOf(pre) === 0;
    });
  }
  function studentVisibleOv(id) {
    return entryOvs(id).some(function (ov) { return STUDENT_VISIBLE_RELS.indexOf(relOf(ov.pointer)) > -1; });
  }

  // ==========================================================================
  // State
  // ==========================================================================
  var params;
  try { params = new URLSearchParams(window.location.search); } catch (err) { params = null; }
  var state = {
    student: !!(params && params.get('view') === 'student'),
    tab: 'grid',
    detailId: null,
    returnFocus: null,
    slot: 'embedded',
    by: '',              // name recorded on overrides; remembered between edits
    edit: null,          // { entryId, block, draft, errors, reason, by } while an override form is open
    revertArm: null,     // block whose "Revert to analyst code" awaits confirmation
    resetArm: false      // Reset awaits confirmation
  };

  // ==========================================================================
  // Helpers
  // ==========================================================================
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  // Escapes, then shows `field_names` from the protocol wording as code.
  function codeSpans(s) {
    return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
  }
  function claimLabel(n) { return SYN[n].claim_label; }
  function claimColor(n) { return CONFIG.claimColors[n]; }
  function lensColor(id) { return LENS_BY_ID[id] ? LENS_BY_ID[id].color : 'var(--text)'; }
  function lensOnLight(id) { return !!(LENS_BY_ID[id] && LENS_BY_ID[id].onLight); }

  // Card text with square-bracketed transcriber insertions marked.
  function cardTextHtml(t) {
    return esc(t).replace(/\[[^\]]*\]/g, function (m) {
      return '<span class="ins" title="Transcriber insertion or best-guess reading">' + m + '</span>';
    });
  }

  function lensTag(id) {
    return '<span class="lens-tag' + (lensOnLight(id) ? ' on-light' : '') + '" style="--lens-color:' + lensColor(id) + '">' + esc(id) + '</span>';
  }

  // `ovRels` (optional): only overrides at these rels mark the button.
  function eref(id, extra, ovRels) {
    var e = BY_ID[id];
    var ovs = e ? entryOvs(id).filter(function (ov) { return !ovRels || ovRels.indexOf(relOf(ov.pointer)) > -1; }) : [];
    var marked = state.student ? (e && studentVisibleOv(id) && (!ovRels || ovs.length)) : ovs.length > 0;
    var label = 'Open entry ' + id + (e ? ': ' + e.card_text : '') + (marked ? (state.student ? ' (revised by instructor)' : ' (has instructor overrides)') : '');
    return '<button type="button" class="eref" data-entry="' + esc(id) + '" aria-label="' + esc(label) + '">' + esc(id)
      + (marked ? '<span class="ovm" aria-hidden="true">*</span>' : '') + (extra || '') + '</button>';
  }

  function rationaleHtml(r) {
    if (!r) return '';
    var h = '<div class="rat"><div class="quotes" aria-label="Quoted from the card">';
    r.quotes.forEach(function (q) { h += '<span class="q">' + esc(q) + '</span>'; });
    h += '</div><div>' + esc(r.text) + '</div></div>';
    return h;
  }

  function scoreBars(v) {
    return '<span class="bars" aria-hidden="true"><i class="' + (v >= 1 ? 'on' : '') + '"></i><i class="' + (v >= 2 ? 'on' : '') + '"></i></span>';
  }

  // Compact six-cell sub-score display. `scores` maps criterion key -> 0/1/2.
  // `orig` (optional) maps a criterion key to the analyst's score for each
  // overridden score; those cells are marked with a border and an asterisk.
  function scoresHtml(scores, wide, orig) {
    orig = orig || {};
    var label = CONFIG.criteria.map(function (c) {
      return c.name + ' ' + scores[c.key] + (c.key in orig ? ' (overridden; analyst ' + orig[c.key] + ')' : '');
    }).join(', ');
    var h = '<span class="scores' + (wide ? ' wide' : '') + '" role="img" aria-label="Sub-scores out of 2: ' + esc(label) + '">';
    CONFIG.criteria.forEach(function (c) {
      var v = scores[c.key], ov = c.key in orig;
      h += '<span class="ss' + (ov ? ' ov' : '') + '" data-crit="' + c.key + '" data-score="' + v + '"' + (ov ? ' data-orig="' + orig[c.key] + '"' : '')
        + ' title="' + esc(c.name + ': ' + v + ' of 2' + (ov ? ' (overridden; analyst ' + orig[c.key] + ')' : '')) + '">'
        + '<abbr>' + esc(c.abbr) + '</abbr><span class="val">' + v + '</span>' + scoreBars(v) + '</span>';
    });
    return h + '</span>';
  }
  // Analyst's scores for every overridden score of an entry.
  function scoreOrigs(e) {
    var o = {};
    CRIT_KEYS.forEach(function (k) {
      if (ovAt(e.entry_id, 'strength/' + k + '/score')) o[k] = BASE_BY_ID[e.entry_id].strength[k].score;
    });
    return o;
  }
  function gatePasses(e) {
    var s = e.strength;
    return s.claim_fit.score === 2 && s.mechanism.score >= 1 && s.explains_change.score >= 1;
  }
  function entryScores(e) {
    var s = {};
    CONFIG.criteria.forEach(function (c) { s[c.key] = e.strength[c.key].score; });
    return s;
  }

  // Instructor-only flag chips for a card.
  function flagChips(e) {
    var st = e.strength, h = '';
    if (CANDIDATE_IDS[e.entry_id] === e.claim_no) h += '<span class="chip cand">Candidate</span>';
    if (st.claim_fit.misfiled_to != null) h += '<span class="chip move">Better fits claim ' + st.claim_fit.misfiled_to + '</span>';
    if (st.claim_fit.not_an_explanation) h += '<span class="chip flag">Not an explanation: ' + esc(CONFIG.notExplanationLabels[st.claim_fit.not_an_explanation.type]) + '</span>';
    if (st.lens_fit.actual_lens.primary !== e.discipline) h += '<span class="chip lens">Coded lens: ' + esc(st.lens_fit.actual_lens.primary) + '</span>';
    var n = entryOvs(e.entry_id).length;
    if (n) {
      h += '<span class="chip ov">Overridden: ' + n + ' field' + (n === 1 ? '' : 's') + '</span>';
      var was = gatePasses(BASE_BY_ID[e.entry_id]), now = gatePasses(e);
      if (was !== now) h += '<span class="chip flag">Gate now ' + (now ? 'passed' : 'failed') + ' (synthesis not recomputed)</span>';
    }
    return h;
  }

  function uncertainChip(e) {
    return e.transcription_confidence === 'Uncertain' ? '<span class="chip uncertain">Uncertain transcription</span>' : '';
  }

  function charPip(name) {
    var c = CHAR_BY_NAME[name];
    return '<span class="pip" aria-hidden="true" style="background:' + (c ? c.color : 'var(--text)') + '"></span>';
  }

  // ==========================================================================
  // Header
  // ==========================================================================
  function renderHeader() {
    var s = DATA.snapshot;
    document.getElementById('hdr-eyebrow').textContent = CONFIG.eyebrow;
    document.getElementById('hdr-title').textContent = CONFIG.title;
    document.getElementById('hdr-lede').textContent = CONFIG.lede;
    var gen = s.generated_at ? s.generated_at.slice(0, 10) : 'unknown';
    document.getElementById('hdr-meta').innerHTML =
      '<span><span class="pip" style="background:var(--char-6)"></span>Snapshot ' + esc(s.snapshot_id) + '</span>'
      + '<span><span class="pip" style="background:var(--char-1)"></span>' + s.entry_count + ' cards</span>'
      + '<span><span class="pip" style="background:var(--char-4)"></span>' + s.uncertain_count + ' uncertain transcriptions</span>'
      + '<span><span class="pip" style="background:var(--char-3)"></span>Board date: ' + esc(s.snapshot_date || 'not recorded') + '</span>'
      + '<span><span class="pip" style="background:var(--char-5)"></span>Protocol v' + esc(DATA.protocol_version) + ' · coded ' + esc(gen) + '</span>'
      + '<span><span class="pip" style="background:var(--char-8)"></span>Source: ' + esc(slotSource(currentSlot())) + '</span>'
      + (state.student ? '' : '<span id="hdr-ov-count"><span class="pip" style="background:var(--char-2)"></span>' + currentSlot().overrides.length + ' instructor override' + (currentSlot().overrides.length === 1 ? '' : 's') + '</span>');
    var notes = s.notes || [];
    var det = document.getElementById('hdr-notes');
    det.hidden = false;
    if (notes.length) {
      det.innerHTML = '<summary>Snapshot notes (' + notes.length + ')</summary><ul>'
        + notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>'
        + '<p class="quiet">Source: ' + esc(s.source_workbook) + '. Analyst: ' + esc(s.analyst) + '.</p>';
    } else {
      det.innerHTML = '';
      det.hidden = true;
    }
  }

  function visibleTabs() {
    return CONFIG.tabs.filter(function (t) { return !(state.student && t.instructorOnly); });
  }

  function renderChrome() {
    var tabs = visibleTabs();
    if (!tabs.some(function (t) { return t.id === state.tab; })) state.tab = tabs[0].id;
    document.getElementById('tabs').innerHTML = tabs.map(function (t) {
      var sel = t.id === state.tab;
      var count = t.id === 'overrides' ? ' (' + currentSlot().overrides.length + ')' : '';
      return '<button type="button" role="tab" class="tab" id="tab-' + t.id + '" aria-controls="view" aria-selected="' + sel + '" tabindex="' + (sel ? '0' : '-1') + '" data-tab="' + t.id + '" style="--tab-color:' + t.color + '"><span class="pip" aria-hidden="true"></span>' + esc(t.label + count) + '</button>';
    }).join('');
    document.getElementById('view').setAttribute('aria-labelledby', 'tab-' + state.tab);

    var tog = document.getElementById('view-toggle');
    tog.setAttribute('aria-pressed', String(state.student));
    document.getElementById('view-toggle-label').textContent = CONFIG.toggleLabel + ': ' + (state.student ? 'on' : 'off');
    document.body.classList.toggle('student-view', state.student);

    var b = document.getElementById('mode-banner');
    b.innerHTML = state.student
      ? '<div class="mode-banner"><strong>Student view</strong><span>' + esc(CONFIG.studentBanner) + '</span></div>'
      : '';
    renderHeader();
    renderDataBar();
  }

  // ==========================================================================
  // Grid view
  // ==========================================================================
  function renderGrid() {
    var h = '<section class="panel" style="--panel-color:var(--char-6)">'
      + '<h2>Grid</h2><p class="panel-intro">Claims by lens, as on the board. Select a card to see everything coded for it.</p>';
    h += '<div class="legend" aria-label="Legend">';
    if (!state.student) {
      h += '<span><b>Sub-scores, each 0 to 2:</b></span>';
      CONFIG.criteria.forEach(function (c) { h += '<span><b>' + esc(c.abbr) + '</b> ' + esc(c.name) + '</span>'; });
    }
    h += '<span><span class="ins">[ ]</span> transcriber insertion</span>';
    h += '<span><span class="chip uncertain">Uncertain transcription</span></span>';
    if (!state.student) h += '<span><span class="chip ov">Overridden</span> <b>*</b> instructor override; original kept in the entry detail</span>';
    else if (currentSlot().overrides.length) h += '<span><span class="chip rev">Revised by instructor</span></span>';
    h += '</div>';
    if (!state.student) h += '<p class="quiet">' + esc(CONFIG.instructorNote) + '</p>';

    h += '<div class="wall" id="wall"><div class="wall-corner eyebrow" aria-hidden="true">Claim / lens</div>';
    CONFIG.lenses.forEach(function (l) {
      h += '<div class="wall-colhead' + (l.onLight ? ' on-light' : '') + '" style="--lens-color:' + l.color + '" aria-hidden="true">' + esc(l.id) + '</div>';
    });

    CLAIM_NOS.forEach(function (n) {
      var syn = SYN[n];
      var inClaim = ENTRIES.filter(function (e) { return e.claim_no === n; });
      h += '<div class="wall-rowhead" style="--claim-color:' + claimColor(n) + '" id="row-claim-' + n + '">'
        + '<h3 class="claim-block" style="margin:0">Claim ' + n + ' <span>' + esc(syn.claim_label) + '</span></h3>'
        + '<div class="claim-body"><p class="claim-text">' + esc(syn.claim_text) + '</p>'
        + '<p class="claim-count">' + inClaim.length + ' cards</p>';
      if (!state.student) h += '<button type="button" class="link-btn" data-goto-synthesis="' + n + '">Claim ' + n + ' synthesis</button>';
      h += '</div></div>';

      CONFIG.lenses.forEach(function (l) {
        var cell = inClaim.filter(function (e) { return e.discipline === l.id; });
        h += '<section class="wall-cell" data-claim="' + n + '" data-lens="' + l.id + '" aria-label="Claim ' + n + ', ' + esc(syn.claim_label) + ', ' + l.id + ': ' + cell.length + ' cards">'
          + '<h4 class="cell-head' + (l.onLight ? ' on-light' : '') + '" style="--lens-color:' + l.color + '">' + esc(l.id) + ' · ' + cell.length + '</h4>';
        if (!cell.length) h += '<p class="empty">No cards.</p>';
        cell.forEach(function (e) { h += wallCard(e, l); });
        h += '</section>';
      });
    });
    h += '</div></section>';
    return h;
  }

  function wallCard(e, l) {
    var h = '<button type="button" class="wcard" data-entry="' + e.entry_id + '" style="--lens-color:' + l.color + '">'
      + '<span class="wcard-top"><span class="wcard-id">' + e.entry_id + '</span>' + uncertainChip(e)
      + (state.student && studentVisibleOv(e.entry_id) ? '<span class="chip rev">Revised by instructor</span>' : '') + '</span>'
      + '<span class="wcard-text">' + cardTextHtml(e.card_text) + '</span>';
    var chars = e.oldenburg.characteristics;
    if (chars.length) {
      h += '<span class="wcard-chars"><span class="sr-only">Oldenburg characteristics:</span>';
      chars.forEach(function (c) {
        h += '<span>' + charPip(c.name) + esc(c.name) + ' (' + esc(CONFIG.relations[c.relation].label.toLowerCase()) + ')</span>';
      });
      h += '</span>';
    }
    if (!state.student) {
      h += scoresHtml(entryScores(e), false, scoreOrigs(e));
      var flags = flagChips(e);
      if (flags) h += '<span class="wcard-flags">' + flags + '</span>';
    }
    return h + '</button>';
  }

  // ==========================================================================
  // Oldenburg coverage view
  // ==========================================================================
  function renderCoverage() {
    var h = '<section class="panel" style="--panel-color:var(--char-1)">'
      + '<h2>Oldenburg coverage</h2>'
      + '<p class="panel-intro">Which cards engage each characteristic, by the claim they are filed under. Definitions are quoted from the theory file (' + esc(CONFIG.theoryFileLabel) + ').</p>'
      + (currentSlot().overrides.length ? '<p class="quiet">' + (state.student ? 'Mappings marked * were revised by the instructor.' : 'Mappings include instructor overrides; entries marked * have an overridden Oldenburg mapping.') + '</p>' : '');
    h += '<div class="legend" aria-label="Relations">';
    Object.keys(CONFIG.relations).forEach(function (k) {
      h += '<span><b>' + esc(CONFIG.relations[k].label) + '</b> ' + esc(CONFIG.relations[k].desc) + '</span>';
    });
    h += '</div>';

    h += '<table class="cov-table" id="cov-table"><caption class="sr-only">Oldenburg characteristics by claim</caption><thead><tr><th class="corner" scope="col">Characteristic</th>';
    CLAIM_NOS.forEach(function (n) {
      h += '<th scope="col" style="--claim-color:' + claimColor(n) + '"><small>Claim ' + n + '</small>' + esc(claimLabel(n)) + '</th>';
    });
    h += '</tr></thead><tbody>';
    CONFIG.characteristics.forEach(function (ch) {
      h += '<tr data-char="' + esc(ch.name) + '" style="--char-color:' + ch.color + '"><th scope="row">' + esc(ch.name)
        + '<details class="def"><summary>Definition</summary><p>' + esc(ch.definition) + '</p><p class="src">' + esc(ch.source) + '</p></details></th>';
      CLAIM_NOS.forEach(function (n) {
        var hits = [];
        ENTRIES.forEach(function (e) {
          if (e.claim_no !== n) return;
          e.oldenburg.characteristics.forEach(function (c) { if (c.name === ch.name) hits.push({ e: e, c: c }); });
        });
        var lbl = 'Claim ' + n + ' · ' + claimLabel(n);
        if (!hits.length) {
          h += '<td class="cov-cell none" data-claim="' + n + '" data-label="' + esc(lbl) + '">No cards</td>';
        } else {
          h += '<td class="cov-cell has" data-claim="' + n + '" data-label="' + esc(lbl) + '"><ul class="cov-list">';
          hits.forEach(function (x) {
            h += '<li>' + eref(x.e.entry_id, '<span class="rel">' + esc(CONFIG.relations[x.c.relation].label) + '</span>', ['oldenburg']) + '</li>';
          });
          h += '</ul></td>';
        }
      });
      h += '</tr>';
    });
    h += '</tbody><tfoot class="cov-foot"><tr><th scope="row">Cards engaging any characteristic</th>';
    CLAIM_NOS.forEach(function (n) {
      var all = ENTRIES.filter(function (e) { return e.claim_no === n; });
      var eng = all.filter(function (e) { return e.oldenburg.engagement === 'engaged'; });
      h += '<td data-label="Claim ' + n + '">' + eng.length + ' of ' + all.length + '</td>';
    });
    h += '</tr></tfoot></table>';

    // Vocabulary flags (part of the Oldenburg mapping, rubric 4.1).
    var flags = [];
    ENTRIES.forEach(function (e) {
      e.oldenburg.vocabulary_flags.forEach(function (f) { flags.push({ e: e, f: f }); });
    });
    h += '<div class="section-break" style="--break-color:var(--char-4)" aria-hidden="true"></div>';
    h += '<h3>Oldenburg vocabulary on the cards</h3><p class="quiet">Where a card uses a characteristic\'s name or a variant of it, and whether that use matches the theory file\'s definition.</p>';
    if (!flags.length) {
      h += '<p class="empty-line">No card uses Oldenburg vocabulary.</p>';
    } else {
      h += '<div class="table-wrap"><table class="plain stack" id="vocab-table"><thead><tr><th scope="col">Card</th><th scope="col">Term as written</th><th scope="col">Maps to</th><th scope="col">Usage</th><th scope="col">Rationale</th></tr></thead><tbody>';
      flags.forEach(function (x) {
        h += '<tr><td data-label="Card">' + eref(x.e.entry_id, '', ['oldenburg']) + ' <span class="quiet">Claim ' + x.e.claim_no + '</span></td>'
          + '<td data-label="Term as written"><span class="q">' + esc(x.f.term_as_written) + '</span></td>'
          + '<td data-label="Maps to">' + charPip(x.f.maps_to) + ' ' + esc(x.f.maps_to) + '</td>'
          + '<td data-label="Usage"><strong>' + esc(CONFIG.usageLabels[x.f.usage_matches_definition]) + '</strong></td>'
          + '<td data-label="Rationale">' + rationaleHtml(x.f.rationale) + '</td></tr>';
      });
      h += '</tbody></table></div>';
    }

    // Snapshot-level gaps are synthesis (rubric 4.3): instructor view only.
    if (!state.student) {
      var g = DATA.snapshot_gaps;
      h += '<div class="note-box info" id="snapshot-gaps"><h4>Snapshot gaps (synthesis)</h4>';
      if (currentSlot().overrides.length) h += '<p class="quiet">From the analyst\'s codes; not recomputed after overrides.</p>';
      h += '<p><strong>Engaged by no card on any claim:</strong> ' + (g.characteristics_unengaged_anywhere.length ? g.characteristics_unengaged_anywhere.map(esc).join(', ') : 'none') + '.</p>';
      if (g.notes) h += '<p>' + esc(g.notes) + '</p>';
      h += '</div>';
    }
    return h + '</section>';
  }

  // ==========================================================================
  // Claim synthesis view (instructor only)
  // ==========================================================================
  function renderSynthesis() {
    if (state.student) return '';
    var h = '<nav class="claim-jump" aria-label="Jump to claim">';
    CLAIM_NOS.forEach(function (n) {
      h += '<a href="#syn-claim-' + n + '" style="--claim-color:' + claimColor(n) + '">Claim ' + n + ' · ' + esc(claimLabel(n)) + '</a>';
    });
    h += '</nav>';
    CLAIM_NOS.forEach(function (n) { h += synPanel(SYN[n]); });
    return h;
  }

  // Entries a synthesis panel discusses: those filed under the claim and
  // every entry it references.
  function synthesisEntryIds(c) {
    var ids = ENTRIES.filter(function (e) { return e.claim_no === c.claim_no; }).map(function (e) { return e.entry_id; });
    function add(id) { if (ids.indexOf(id) < 0) ids.push(id); }
    c.candidates.concat(c.imported_candidates, c.nearest_misses).forEach(function (k) { add(k.entry_id); });
    c.clusters.concat(c.convergence, c.tensions).forEach(function (k) { k.entry_ids.forEach(add); });
    return ids;
  }

  // Where else a cluster id appears (clusters spanning claims are repeated).
  function clusterElsewhere(id, n) {
    return DATA.claim_synthesis.filter(function (c) {
      return c.claim_no !== n && c.clusters.some(function (k) { return k.cluster_id === id; });
    }).map(function (c) { return c.claim_no; });
  }

  function secOpen(key, extraIntro) {
    var s = CONFIG.synthesisSections[key];
    return '<div class="syn-sec" data-sec="' + key + '" style="--sec-color:' + s.color + '"><h3><span class="pip" aria-hidden="true"></span>' + esc(s.label) + '</h3>' + (extraIntro || '');
  }

  function candidateItem(k, showFrom) {
    var e = BY_ID[k.entry_id];
    var h = '<div class="syn-item"><div class="syn-item-head">' + eref(k.entry_id) + lensTag(e.discipline);
    if (showFrom) h += '<span class="chip move">Filed under claim ' + e.claim_no + '</span>';
    h += '</div><p>' + cardTextHtml(e.card_text) + '</p>' + scoresHtml(k.subscores, true) + '<p style="margin-top:0.5rem">' + esc(k.why) + '</p></div>';
    return h;
  }

  function synPanel(c) {
    var n = c.claim_no;
    var h = '<section class="syn" id="syn-claim-' + n + '" data-claim="' + n + '" style="--claim-color:' + claimColor(n) + '" aria-labelledby="syn-h-' + n + '" tabindex="-1">'
      + '<div class="syn-banner"><h2 id="syn-h-' + n + '">Claim ' + n + ' · ' + esc(c.claim_label) + '</h2><p class="claim-text">' + esc(c.claim_text) + '</p></div><div class="syn-body">';
    var touched = synthesisEntryIds(c).filter(function (id) { return entryOvs(id).length; });
    if (touched.length) {
      h += '<div class="note-box" data-part="stale"><h4>Instructor overrides</h4><p>' + esc(CONFIG.synthesisStaleNote) + '</p><div class="refs">'
        + touched.map(function (id) { return eref(id); }).join('') + '</div></div>';
    }

    h += secOpen('candidates', '<p class="quiet">' + esc(CONFIG.candidateGate) + '</p>');
    if (!c.candidates.length) h += '<p class="empty-line">No card filed under this claim passes the gate.</p>';
    c.candidates.forEach(function (k) { h += candidateItem(k, false); });
    h += '</div>';

    if (c.imported_candidates.length) {
      h += secOpen('imported', '<p class="quiet">Cards filed under another claim whose stated effect fits this claim more directly. Listed separately, not as candidates.</p>');
      c.imported_candidates.forEach(function (k) { h += candidateItem(k, true); });
      h += '</div>';
    }

    if (c.nearest_misses.length) {
      h += secOpen('misses');
      c.nearest_misses.forEach(function (m) {
        var e = BY_ID[m.entry_id];
        h += '<div class="syn-item"><div class="syn-item-head">' + eref(m.entry_id) + lensTag(e.discipline)
          + '<span class="chip flag">Fails: ' + m.fails.map(function (f) { return esc(CONFIG.affectsLabels[f]); }).join(', ') + '</span></div>'
          + '<p>' + cardTextHtml(e.card_text) + '</p>' + scoresHtml(entryScores(BASE_BY_ID[m.entry_id]), true) + '</div>';
      });
      h += '</div>';
    }

    h += secOpen('clusters', '<p class="quiet">Duplicate: same cause and effect. Overlap: same cause, different effect or framing.</p>');
    if (!c.clusters.length) h += '<p class="empty-line">None recorded.</p>';
    c.clusters.forEach(function (k) {
      var other = clusterElsewhere(k.cluster_id, n);
      h += '<div class="syn-item" data-cluster="' + esc(k.cluster_id) + '"><div class="syn-item-head"><span class="chip lens">' + esc(k.kind) + '</span><span class="quiet">' + esc(k.cluster_id) + '</span>'
        + (other.length ? '<span class="chip move">Also under claim ' + other.join(', ') + '</span>' : '') + '</div>'
        + '<p>' + esc(k.shared_element) + '</p><div class="refs">' + k.entry_ids.map(function (id) { return eref(id); }).join('') + '</div>'
        + '<div class="rat"><div class="quotes" aria-label="Quoted from the cards">'
        + k.quotes.map(function (q) { return '<span class="q">' + esc(q.quote) + '</span> <span class="quiet">' + esc(q.entry_id) + '</span>'; }).join(' ')
        + '</div></div></div>';
    });
    h += '</div>';

    h += secOpen('convergence', '<p class="quiet">One mechanism expressed in different disciplinary language.</p>');
    if (!c.convergence.length) h += '<p class="empty-line">None recorded.</p>';
    c.convergence.forEach(function (k) {
      h += '<div class="syn-item"><div class="syn-item-head">' + k.lenses.map(lensTag).join(' ') + '</div>'
        + '<p>' + esc(k.shared_mechanism) + '</p><div class="refs">' + k.entry_ids.map(function (id) { return eref(id); }).join('') + '</div></div>';
    });
    h += '</div>';

    h += secOpen('tensions', '<p class="quiet">Described, not adjudicated.</p>');
    if (!c.tensions.length) h += '<p class="empty-line">None recorded.</p>';
    c.tensions.forEach(function (k) {
      h += '<div class="syn-item"><div class="refs">' + k.entry_ids.map(function (id) { return eref(id); }).join('') + '</div><p>' + esc(k.description) + '</p></div>';
    });
    h += '</div>';

    var g = c.gaps;
    h += secOpen('gaps');
    h += '<h4>Characteristics engaged by no card on this claim</h4>';
    h += g.characteristics_unengaged.length
      ? '<ul class="gap-list">' + g.characteristics_unengaged.map(function (nm) { return '<li>' + charPip(nm) + esc(nm) + '</li>'; }).join('') + '</ul>'
      : '<p class="empty-line">None: every characteristic is engaged.</p>';
    h += '<h4>Lenses with no mechanism-level card</h4>';
    h += g.lenses_without_mechanism.length
      ? '<p>' + g.lenses_without_mechanism.map(lensTag).join(' ') + '</p>'
      : '<p class="empty-line">None: every lens has a card with a stated causal relation.</p>';
    if (g.notes) h += '<p>' + esc(g.notes) + '</p>';
    h += '</div>';

    return h + '</div></section>';
  }

  // ==========================================================================
  // Entry detail

  function ovMark() {
    return state.student ? ' <span class="ov-mark rev">Revised by instructor</span>' : ' <span class="ov-mark">Overridden</span>';

  // Override controls under a code block (instructor view only).
  function ovControls(e, block, ovs) {

  // Analyst original beside the override, field by field, then the reasons.
  function ovBox(ovs) {
    var h = '<div class="ov-box" data-part="ov-box"><h4>Instructor override</h4><div class="table-wrap"><table class="plain stack"><thead><tr>'
      + '<th scope="col">Field</th><th scope="col">Analyst original</th><th scope="col">Override</th></tr></thead><tbody>';
    var groups = [];
    ovs.forEach(function (ov) {
      var f = fieldOf(ov.pointer);
      h += '<tr data-pointer="' + esc(ov.pointer) + '"><td data-label="Field">' + esc(CONFIG.fieldLabels[f] || f) + '</td>'
        + '<td data-label="Analyst original" data-role="original">' + fmtVal(f, ov.original_value) + '</td>'
        + '<td data-label="Override" data-role="override">' + fmtVal(f, ov.override_value) + '</td></tr>';
      var key = ov.reason + '\u0000' + ov.by + '\u0000' + ov.at;
      if (groups.indexOf(key) < 0) groups.push(key);
    });
    h += '</tbody></table></div>';
    groups.forEach(function (g) {
      var p = g.split('\u0000');
      h += '<div class="ov-why"><p class="kv"><b>Reason:</b> ' + esc(p[0]) + '</p><p class="quiet">By ' + esc(p[1]) + ' · ' + esc(fmtTime(p[2])) + '</p></div>';

  function renderDetail(id) {
    var e = BY_ID[id];
    var idx = ENTRIES.indexOf(e);
    var st = e.strength;
    var editing = !state.student && state.edit && state.edit.entryId === id ? state.edit.block : null;

      + '<button type="button" class="dlg-close" data-close>Close</button></div><div class="dlg-body">';

    // Card and transcription
    h += '<div class="card-meta">' + lensTag(e.discipline)

    h += '<blockquote class="card-face" style="--lens-color:' + lensColor(e.discipline) + '">' + cardTextHtml(e.card_text) + '</blockquote>';

      if (e.caveat_affects.length) h += '<p class="kv"><b>Codes that could change:</b> ' + e.caveat_affects.map(function (k) { return esc(CONFIG.affectsLabels[k] || k); }).join(', ') + '</p>';
      h += '</div>';
    }

    if (!state.student && e.analyst_note) {
      h += '<div class="note-box info" data-part="analyst-note"><h4>Analyst note</h4><p>' + esc(e.analyst_note) + '</p></div>';
    }

    // Oldenburg mapping
    var o = e.oldenburg;
    var oOvs = blockOvs(id, 'oldenburg');
    h += '<div class="dsec" data-part="oldenburg" style="--sec-color:var(--char-1)"><h3><span class="pip" aria-hidden="true"></span>Oldenburg mapping' + (oOvs.length ? ovMark() : '') + '</h3>';
    if (editing === 'oldenburg') {
      h += oldenburgForm(e);
    } else {
      h += oldenburgHtml(o);
      if (!state.student) {
        h += ovControls(e, 'oldenburg', oOvs);
        if (oOvs.length) h += ovBox(oOvs);
      }
    }
    h += '</div>';

    // Explanation strength (instructor only)
    if (!state.student) {
      h += '<div class="dsec" data-part="strength" style="--sec-color:var(--char-3)"><h3><span class="pip" aria-hidden="true"></span>Explanation strength</h3>'
        + '<p class="quiet">' + esc(CONFIG.instructorNote) + '</p>' + scoresHtml(entryScores(e), true, scoreOrigs(e));
      CONFIG.criteria.forEach(function (c) {
        var code = st[c.key];
        var ovs = blockOvs(id, c.key);
        var fo = function (f) { return ovAt(id, 'strength/' + c.key + '/' + f) ? ovMark() : ''; };
        if (editing === c.key) {
          h += '<div class="code-block is-ov" data-crit="' + c.key + '">' + critForm(e, c) + '</div>';
          return;
        }
        h += '<div class="code-block' + (ovs.length ? ' is-ov' : '') + '" data-crit="' + c.key + '"><div class="code-head"><span class="name">' + esc(c.name) + '</span>'
          + '<span class="score-badge' + (fo('score') ? ' ov' : '') + '" aria-label="' + esc(c.name + ' score ' + code.score + ' of 2' + (fo('score') ? ', overridden' : '')) + '">' + code.score + '<small>/ 2</small></span>' + fo('score')
          + '<span class="quiet">' + esc(c.question) + '</span></div>'
          + '<p class="anchor"><b>Anchor ' + code.score + ':</b> ' + codeSpans(c.anchors[code.score]) + '</p>'
          + (fo('rationale') ? '<p class="kv"><b>Rationale</b>' + fo('rationale') + '</p>' : '') + rationaleHtml(code.rationale);
        if (c.key === 'claim_fit') {
          if (code.misfiled_to != null || fo('misfiled_to')) h += '<p class="kv"><b>Better fits:</b> ' + fmtVal('misfiled_to', code.misfiled_to) + fo('misfiled_to') + '</p>';
          if (code.not_an_explanation) {
            h += '<div class="kv"><b>Not an explanation:</b> ' + esc(CONFIG.notExplanationLabels[code.not_an_explanation.type]) + fo('not_an_explanation') + rationaleHtml(code.not_an_explanation.rationale) + '</div>';
          } else if (fo('not_an_explanation')) {
            h += '<p class="kv"><b>Not an explanation:</b> none' + fo('not_an_explanation') + '</p>';
          }
        }
        if (c.key === 'lens_fit') {
          var al = code.actual_lens;
          h += '<p class="kv"><b>Coded lens:</b> ' + esc(al.primary) + (al.secondary.length ? ' (secondary: ' + al.secondary.map(esc).join(', ') + ')' : '') + fo('actual_lens') + ' · <b>Filed:</b> ' + esc(e.discipline) + '</p>';
        }
        if (c.key === 'testability' && (fo('testable_implication') || fo('implication_note'))) {
          h += '<p class="kv"><b>Testable implication and note:</b> shown below' + ovMark() + '</p>';
        }
        if (c.key === 'scope') {
          h += '<p class="kv"><b>Stated scope:</b> ' + esc(code.stated_scope || 'none stated') + fo('stated_scope') + '</p>';
          if (fo('bodo_question')) h += '<p class="kv"><b>Bodø question:</b> shown below' + ovMark() + '</p>';
        }
        h += ovControls(e, c.key, ovs);
        if (ovs.length) h += ovBox(ovs);
        h += '</div>';
      });
      h += '</div>';
    }

    // Testable implication (both views)
    var t = st.testability;
    var tMark = ovAt(id, 'strength/testability/testable_implication') ? ovMark() : '';
    var nMark = ovAt(id, 'strength/testability/implication_note') ? ovMark() : '';
    h += '<div class="dsec" data-part="implication" style="--sec-color:var(--correct)"><h3><span class="pip" aria-hidden="true"></span>Testable implication' + tMark + '</h3>';
    if (t.testable_implication) {
      h += '<p class="implication">' + esc(t.testable_implication) + '</p>';
      if (t.implication_note) h += '<p class="kv"><b>Added by the analyst:</b> ' + esc(t.implication_note) + nMark + '</p>';
    } else {
      h += '<p class="empty-line">No testable implication was written for this card.</p>';
      if (!state.student && t.implication_note) h += '<p class="kv"><b>Why:</b> ' + esc(t.implication_note) + nMark + '</p>';
    }
    h += '<p class="quiet">An implication says what would be observed if the card were right. It does not say whether it is observed.</p></div>';

    // Scope question (both views)
    var bMark = ovAt(id, 'strength/scope/bodo_question') ? ovMark() : '';
    h += '<div class="dsec" data-part="bodo" style="--sec-color:var(--char-6)"><h3><span class="pip" aria-hidden="true"></span>Scope question: Bodø' + bMark + '</h3>'
      + '<p class="bodo">' + esc(st.scope.bodo_question) + '</p><p class="quiet">An open question, not a verdict.</p></div>';

    var prev = ENTRIES[idx - 1], next = ENTRIES[idx + 1];
    h += '<div class="dlg-nav"><button type="button" class="btn" data-entry-nav="' + (prev ? prev.entry_id : '') + '"' + (prev ? '' : ' disabled') + '>Previous' + (prev ? ': ' + prev.entry_id : '') + '</button>'
      + '<button type="button" class="btn" data-entry-nav="' + (next ? next.entry_id : '') + '"' + (next ? '' : ' disabled') + '>Next' + (next ? ': ' + next.entry_id : '') + '</button></div>';
    h += '</div>';

    var dlg = document.getElementById('detail');
    dlg.style.setProperty('--claim-color', claimColor(e.claim_no));
    dlg.innerHTML = h;
  }

  // ==========================================================================
  // JSON utilities: clone, deep equality, RFC 6901 pointers, reconciliation
  // ==========================================================================
  function clone(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }

  function deq(a, b) {
    if (a === b) return true;
    if (typeof a !== typeof b || a === null || b === null || typeof a !== 'object') return false;
    if (Array.isArray(a) !== Array.isArray(b)) return false;
    if (Array.isArray(a)) {
      if (a.length !== b.length) return false;
      for (var i = 0; i < a.length; i++) if (!deq(a[i], b[i])) return false;
      return true;
    }
    var ka = Object.keys(a), kb = Object.keys(b);
    if (ka.length !== kb.length) return false;
    for (var j = 0; j < ka.length; j++) {
      if (!Object.prototype.hasOwnProperty.call(b, ka[j]) || !deq(a[ka[j]], b[ka[j]])) return false;
    }
    return true;
  }

  function ptrTokens(p) {
    if (p === '') return [];
    if (p.charAt(0) !== '/') return null;
    return p.slice(1).split('/').map(function (t) { return t.replace(/~1/g, '/').replace(/~0/g, '~'); });
  }
  // Returns { found, value }.
  function ptrGet(doc, p) {
    var toks = ptrTokens(p), cur = doc;
    if (!toks) return { found: false };
    for (var i = 0; i < toks.length; i++) {
      var t = toks[i];
      if (Array.isArray(cur)) {
        if (!/^(0|[1-9][0-9]*)$/.test(t) || Number(t) >= cur.length) return { found: false };
        cur = cur[Number(t)];
      } else if (cur !== null && typeof cur === 'object' && Object.prototype.hasOwnProperty.call(cur, t)) {
        cur = cur[t];
      } else {
        return { found: false };
      }
    }
    return { found: true, value: cur };
  }
  // Replaces the value at an existing pointer (overrides only ever replace).
  function ptrSet(doc, p, v) {
    var toks = ptrTokens(p), cur = doc;
    for (var i = 0; i < toks.length - 1; i++) cur = cur[Array.isArray(cur) ? Number(toks[i]) : toks[i]];
    var last = toks[toks.length - 1];
    cur[Array.isArray(cur) ? Number(last) : last] = v;
  }

  // The analyst's document with every override applied, in order.
  function reconcile(base, overrides) {
    var doc = clone(base);
    overrides.forEach(function (ov) { ptrSet(doc, ov.pointer, clone(ov.override_value)); });
    doc.overrides = clone(overrides);
    return doc;
  }

  // The document an export writes: the analyst's codes untouched, plus overrides.
  function exportDoc(slot) {
    var doc = clone(slot.base);
    doc.overrides = clone(slot.overrides);
    return doc;
  }

  // ==========================================================================
  // JSON Schema validation (draft 2020-12 subset)
  //
  // Implements exactly the keywords analysis/schema.json uses. If the schema
  // gains a keyword this code does not implement, the viewer refuses to load
  // files and says so, rather than silently skipping the check.
  // ==========================================================================
  var SCHEMA_ANNOTATIONS = { '$schema': 1, '$id': 1, '$defs': 1, title: 1, description: 1 };
  var SCHEMA_KEYWORDS = {
    '$ref': 1, type: 1, 'const': 1, 'enum': 1, required: 1, properties: 1, additionalProperties: 1,
    items: 1, minItems: 1, maxItems: 1, uniqueItems: 1, minLength: 1, maxLength: 1, pattern: 1,
    minimum: 1, maximum: 1, oneOf: 1, anyOf: 1, allOf: 1, 'if': 1, then: 1, 'else': 1, format: 1
  };
  function unsupportedKeywords(s, path, out) {
    if (typeof s === 'boolean') return out;
    Object.keys(s).forEach(function (k) {
      if (!SCHEMA_KEYWORDS[k] && !SCHEMA_ANNOTATIONS[k]) out.push(path + '/' + k);
    });
    function sub(x, p) { if (x && typeof x === 'object' || typeof x === 'boolean') unsupportedKeywords(x, p, out); }
    if (s.$defs) Object.keys(s.$defs).forEach(function (k) { sub(s.$defs[k], path + '/$defs/' + k); });
    if (s.properties) Object.keys(s.properties).forEach(function (k) { sub(s.properties[k], path + '/properties/' + k); });
    ['items', 'if', 'then', 'else'].forEach(function (k) { if (k in s) sub(s[k], path + '/' + k); });
    if (s.additionalProperties && typeof s.additionalProperties === 'object') sub(s.additionalProperties, path + '/additionalProperties');
    ['oneOf', 'anyOf', 'allOf'].forEach(function (k) { (s[k] || []).forEach(function (x, i) { sub(x, path + '/' + k + '/' + i); }); });
    return out;
  }
  var SCHEMA_UNSUPPORTED = unsupportedKeywords(SCHEMA, '#', []);

  function resolveRef(ref) {
    if (ref.indexOf('#') !== 0) throw new Error('Only local $ref values are supported: ' + ref);
    var r = ptrGet(SCHEMA, ref.slice(1));
    if (!r.found) throw new Error('Unresolvable $ref: ' + ref);
    return r.value;
  }
  function isType(v, t) {
    switch (t) {
      case 'null': return v === null;
      case 'boolean': return typeof v === 'boolean';
      case 'object': return v !== null && typeof v === 'object' && !Array.isArray(v);
      case 'array': return Array.isArray(v);
      case 'string': return typeof v === 'string';
      case 'number': return typeof v === 'number' && isFinite(v);
