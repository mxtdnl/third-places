    });
    h += '<div class="ovf-actions"><button type="button" class="btn ghost" data-ed="add-ch">Add characteristic</button></div></fieldset>';
    h += rationaleFields('ed-none', 'Rationale when no characteristic is engaged', d.none_rationale, 'Used only when engagement is "Engages no characteristic".');
    var usage = Object.keys(CONFIG.usageLabels).map(function (k) { return [k, CONFIG.usageLabels[k]]; });
    h += '<fieldset class="ovf-field"><legend>Oldenburg vocabulary on the card</legend>';
    if (!d.vocabulary_flags.length) h += '<p class="hint">None.</p>';
    d.vocabulary_flags.forEach(function (f, i) {
      h += '<div class="ovf-row"><div class="ovf-row-head"><b>Vocabulary flag ' + (i + 1) + '</b>'
        + '<button type="button" class="btn ghost" data-ed="remove-vf" data-i="' + i + '">Remove<span class="sr-only"> vocabulary flag ' + (i + 1) + '</span></button></div>'
        + '<label for="ed-vf-term-' + i + '">Term as written on the card</label><input type="text" id="ed-vf-term-' + i + '" value="' + esc(f.term_as_written) + '">'
        + '<div class="ovf-grid2"><div><label for="ed-vf-map-' + i + '">Maps to</label>' + selectHtml('ed-vf-map-' + i, names, f.maps_to) + '</div>'
        + '<div><label for="ed-vf-use-' + i + '">Usage</label>' + selectHtml('ed-vf-use-' + i, usage, f.usage_matches_definition) + '</div></div>'
        + rationaleFields('ed-vf-' + i, 'Rationale', f.rationale) + '</div>';
    });
    h += '<div class="ovf-actions"><button type="button" class="btn ghost" data-ed="add-vf">Add vocabulary flag</button></div></fieldset>';
    return h + reasonFields() + formActions() + '</form>';
  }

  function fval(id) { var el = document.getElementById(id); return el ? el.value : ''; }
  function readRationale(prefix) {
    return {
      quotes: fval(prefix + '-q').split('\n').map(function (q) { return q.trim(); }).filter(Boolean),
      text: fval(prefix + '-t')
    };
  }
  function radioVal(name) {
    var el = document.querySelector('#detail input[name="' + name + '"]:checked');
    return el ? el.value : null;
  }

  // Reads the open form into state.edit (draft, reason, name).
  function readForm() {
    var ed = state.edit, d = ed.draft;
    ed.reason = fval('ed-reason');
    ed.by = fval('ed-by');
    if (ed.block === 'oldenburg') {
      var eng = radioVal('ed-eng') || d.engagement;
      var chars = d.characteristics.map(function (c, i) {
        return { name: fval('ed-ch-name-' + i), relation: fval('ed-ch-rel-' + i), rationale: readRationale('ed-ch-' + i) };
      });
      var vfs = d.vocabulary_flags.map(function (f, i) {
        return { term_as_written: fval('ed-vf-term-' + i), maps_to: fval('ed-vf-map-' + i), usage_matches_definition: fval('ed-vf-use-' + i), rationale: readRationale('ed-vf-' + i) };
      });
      ed.draft = { engagement: eng, characteristics: chars, none_rationale: readRationale('ed-none'), vocabulary_flags: vfs };
      return;
    }
    var k = ed.block, nd = {};
    var sc = radioVal('ed-score');
    nd.score = sc === null ? d.score : Number(sc);
    nd.rationale = readRationale('ed-r');
    if (k === 'claim_fit') {
      var mf = fval('ed-misfiled');
      nd.misfiled_to = mf === '' ? null : Number(mf);
      var nt = fval('ed-nae');
      nd.not_an_explanation = nt === '' ? null : { type: nt, rationale: readRationale('ed-nae') };
    }
    if (k === 'lens_fit') {
      nd.actual_lens = {
        primary: fval('ed-primary'),
        secondary: CONFIG.lenses.map(function (l) { return l.id; }).filter(function (id) { var el = document.getElementById('ed-sec-' + id); return el && el.checked; })
      };
    }
    if (k === 'testability') {
      var im = fval('ed-impl');
      nd.testable_implication = im.trim() === '' ? null : im;
      nd.implication_note = fval('ed-implnote');
    }
    if (k === 'scope') {
      var ss = fval('ed-scope');
      nd.stated_scope = ss.trim() === '' ? null : ss;
      nd.bodo_question = fval('ed-bodo');
    }
    ed.draft = nd;
  }

  // The schema-shaped value for the Oldenburg block from the draft.
  function oldenburgValue(d) {
    var v = { engagement: d.engagement, characteristics: d.engagement === 'none' ? [] : d.characteristics };
    if (d.engagement === 'none') v.none_rationale = d.none_rationale;
    v.vocabulary_flags = d.vocabulary_flags;
    return v;
  }

  function startEdit(block) {
    var e = BY_ID[state.detailId];
    var draft = block === 'oldenburg' ? clone(e.oldenburg) : clone(e.strength[block]);
    if (block === 'oldenburg' && !draft.none_rationale) draft.none_rationale = { quotes: [], text: '' };
    var prev = blockOvs(e.entry_id, block)[0];
    state.edit = { entryId: e.entry_id, block: block, draft: draft, errors: null, reason: prev ? prev.reason : '', by: state.by };
    state.revertArm = null;
    rerenderDetail();
    var first = document.querySelector('#detail form[data-edit-form] input, #detail form[data-edit-form] select, #detail form[data-edit-form] textarea');
    if (first) first.focus();
  }

  function endEdit(block) {
    state.edit = null;
    rerenderDetail();
    var b = document.querySelector('#detail [data-ov-open="' + block + '"]');
    if (b) b.focus();
  }

  function rerenderDetail() {
    var dlg = document.getElementById('detail');
    var top = dlg.scrollTop;
    renderDetail(state.detailId);
    dlg.scrollTop = top;
  }

  // Validates the form and, if it passes, replaces this block's overrides.
  function saveEdit() {
    readForm();
    var ed = state.edit, slot = currentSlot();
    var e = BY_ID[ed.entryId], idx = ENTRY_INDEX[ed.entryId];
    var errors = [];
    if (wordCount(ed.reason) < CONFIG.reasonMinWords) errors.push('Reason: write at least ' + CONFIG.reasonMinWords + ' words (now ' + wordCount(ed.reason) + ').');
    if (!ed.by.trim()) errors.push('Your name: required, so the override records who made it.');

    // Field-level values and pointers for this block.
    var fields;
    if (ed.block === 'oldenburg') {
      if (ed.draft.engagement === 'engaged' && !ed.draft.characteristics.length) errors.push('Characteristics: add at least one, or choose "Engages no characteristic".');
      if (ed.draft.engagement === 'none' && ed.draft.characteristics.length) errors.push('Characteristics: remove them, or choose "Engages one or more characteristics".');
      fields = [{ ptr: '/entries/' + idx + '/oldenburg', value: oldenburgValue(ed.draft), rationales: [] }];
      var ov = fields[0].value;
      ov.characteristics.forEach(function (c, i) { fields[0].rationales.push(['Characteristic ' + (i + 1), c.rationale]); });
      if (ov.none_rationale) fields[0].rationales.push(['No-engagement rationale', ov.none_rationale]);
      ov.vocabulary_flags.forEach(function (f, i) { fields[0].rationales.push(['Vocabulary flag ' + (i + 1), f.rationale]); });
    } else {
      fields = CRIT_FIELDS[ed.block].map(function (f) {
        var r = [];
        if (f === 'rationale') r.push(['Rationale', ed.draft.rationale]);
        if (f === 'not_an_explanation' && ed.draft.not_an_explanation) r.push(['Not-an-explanation rationale', ed.draft.not_an_explanation.rationale]);
        return { ptr: '/entries/' + idx + '/strength/' + ed.block + '/' + f, value: ed.draft[f], rationales: r };
      });
    }
    // Every code needs a quoted basis that is verbatim card text (spec 4).
    fields.forEach(function (f) {
      f.rationales.forEach(function (r) {
        if (!r[1].quotes.length) errors.push(r[0] + ': quote at least one fragment of the card.');
        r[1].quotes.forEach(function (q) {
          if (/[\[\]]/.test(q)) errors.push(r[0] + ': "' + q + '" contains square brackets, which mark transcriber text, not student text.');
          else if (e.card_text.indexOf(q) < 0) errors.push(r[0] + ': "' + q + '" is not in the card text exactly as written.');
        });
        if (!r[1].text.trim()) errors.push(r[0] + ': the rationale text is empty.');
      });
    });

    var list = slot.overrides.slice(), now = new Date().toISOString(), changed = 0, n = 0;
    fields.forEach(function (f) {
      var current = ptrGet(DATA, f.ptr).value;
      if (deq(current, f.value)) return; // untouched: keep any existing override as it is
      changed++;
      list = list.filter(function (o) { return o.pointer !== f.ptr; });
      var original = ptrGet(BASE, f.ptr).value;
      if (deq(original, f.value)) return; // set back to the analyst's value: no override
      list.push({
        override_id: 'ov-' + Date.now().toString(36) + '-' + (n++) + '-' + Math.random().toString(36).slice(2, 6),
        target: { kind: 'entry', entry_id: ed.entryId },
        pointer: f.ptr,
        original_value: clone(original),
        override_value: clone(f.value),
        reason: ed.reason.trim(),
        by: ed.by.trim(),
        at: now
      });
    });
    if (!changed) errors.push('Nothing changed: edit at least one value, or cancel.');

    if (!errors.length) {
      var candidate = exportDoc(slot);
      candidate.overrides = list;
      validateDocument(candidate).errors.forEach(function (er) {
        errors.push(describePath(candidate, er.path) + ': ' + er.msg.replace(' (after applying the overrides)', ''));
      });
    }
    if (errors.length) {
      ed.errors = errors;
      rerenderDetail();
      var box = document.querySelector('#detail [data-form-errors]');
      if (box) box.focus();
      return;
    }
    slot.overrides = list;
    state.by = ed.by.trim();
    var block = ed.block;
    useSlot(slot);
    persist();
    setStatus('ok', 'Override saved on ' + ed.entryId + ' (' + (block === 'oldenburg' ? 'Oldenburg mapping' : CRIT_BY_KEY[block].name) + '). Export JSON to keep it outside this browser.');
    state.edit = null;
    renderChrome();
    renderView();
    endEdit(block);
  }

  function revertBlock(block) {
    var slot = currentSlot(), id = state.detailId;
    var drop = blockOvs(id, block).map(function (o) { return o.pointer; });
    slot.overrides = slot.overrides.filter(function (o) { return drop.indexOf(o.pointer) < 0; });
    state.revertArm = null;
    useSlot(slot);
    persist();
    setStatus('ok', 'Reverted ' + id + ' (' + (block === 'oldenburg' ? 'Oldenburg mapping' : CRIT_BY_KEY[block].name) + ') to the analyst\'s code.');
    renderChrome();
    renderView();
    rerenderDetail();
    var b = document.querySelector('#detail [data-ov-open="' + block + '"]');
    if (b) b.focus();
  }

  // ==========================================================================
  // Overrides tab
  // ==========================================================================
  function renderOverrides() {
    if (state.student) return '';
    var slot = currentSlot();
    var h = '<section class="panel" style="--panel-color:var(--char-2)"><h2>Overrides</h2>'
      + '<p class="panel-intro">' + esc(CONFIG.overrideNote) + ' To add one, open an entry and use Override on the code you disagree with.</p>';
    if (!slot.overrides.length) return h + '<p class="empty-line">No overrides on this snapshot.</p></section>';
    h += '<div class="table-wrap"><table class="plain stack" id="ov-table"><thead><tr><th scope="col">Entry</th><th scope="col">Field</th><th scope="col">Analyst original</th><th scope="col">Override</th><th scope="col">Reason</th><th scope="col">By and when</th></tr></thead><tbody>';
    slot.overrides.forEach(function (ov) {
      var f = fieldOf(ov.pointer);
      h += '<tr data-pointer="' + esc(ov.pointer) + '"><td data-label="Entry">' + eref(ov.target.entry_id) + '</td>'
        + '<td data-label="Field">' + esc(fieldPath(ov)) + '</td>'
        + '<td data-label="Analyst original">' + fmtVal(f, ov.original_value) + '</td>'
        + '<td data-label="Override">' + fmtVal(f, ov.override_value) + '</td>'
        + '<td data-label="Reason">' + esc(ov.reason) + '</td>'
        + '<td data-label="By and when">' + esc(ov.by) + '<br><span class="quiet">' + esc(fmtTime(ov.at)) + '</span></td></tr>';
    });
    return h + '</tbody></table></div></section>';
  }

  // ==========================================================================
  // Snapshots: data bar, persistence, loading, reset
  // ==========================================================================
  function slotSource(slot) { return slot.source === 'embedded' ? CONFIG.builtInLabel : slot.fileName; }
  function slotLabel(slot) {
    var s = slot.base.snapshot.snapshot_id + ' · ' + slotSource(slot);
    if (!state.student) s += ' · ' + slot.overrides.length + ' override' + (slot.overrides.length === 1 ? '' : 's');
    return s;
  }

  function renderDataBar() {
    var sel = document.getElementById('snap-select');
    sel.innerHTML = SLOTS.map(function (s) {
      return '<option value="' + esc(s.key) + '"' + (s.key === state.slot ? ' selected' : '') + '>' + esc(slotLabel(s)) + '</option>';
    }).join('');
    document.getElementById('diff-note').textContent = CONFIG.diffNote;
    document.getElementById('data-actions').hidden = state.student;
    var c = document.getElementById('data-confirm');
    if (state.student || !state.resetArm) { c.innerHTML = ''; return; }
    var n = SLOTS.reduce(function (a, s) { return a + s.overrides.length; }, 0);
    c.innerHTML = '<div class="msg warn"><p>' + esc(CONFIG.resetWarning) + '</p><p>Now held: ' + n + ' override' + (n === 1 ? '' : 's') + ', ' + (SLOTS.length - 1) + ' loaded snapshot' + (SLOTS.length === 2 ? '' : 's') + '.</p>'
      + '<div class="confirm-row"><button type="button" class="btn warn" data-action="reset-confirm">Confirm reset</button><button type="button" class="btn ghost" data-action="reset-cancel">Cancel</button></div></div>';
  }

  function setStatus(kind, text) {
    document.getElementById('data-status').innerHTML = text ? '<div class="msg' + (kind === 'warn' ? ' warn' : '') + '">' + esc(text) + '</div>' : '';
    if (kind !== 'keep-error') document.getElementById('data-error').innerHTML = '';
  }
  function setError(title, items, more, doc) {
    var h = '<div class="msg err" data-load-error><h4>' + esc(title) + '</h4>';
    if (items.length) {
      h += '<ul>' + items.map(function (er) { return '<li>' + esc(typeof er === 'string' ? er : describePath(doc, er.path) + ': ' + er.msg) + '</li>'; }).join('') + '</ul>';
      if (more) h += '<p>…and ' + more + ' more.</p>';
    }
    h += '<p>Nothing was changed: the viewer still shows ' + esc(slotLabel(currentSlot())) + '.</p></div>';
    document.getElementById('data-status').innerHTML = '';
    document.getElementById('data-error').innerHTML = h;
  }

  function persist() {
    var payload = {
      version: 1, by: state.by, current: state.slot,
      slots: SLOTS.map(function (s) {
        return s.source === 'embedded'
          ? { key: s.key, source: s.source, snapshot_id: s.base.snapshot.snapshot_id, overrides: s.overrides }
          : { key: s.key, source: s.source, fileName: s.fileName, base: s.base, overrides: s.overrides };
      })
    };
    try {
      window.localStorage.setItem(CONFIG.storageKey, JSON.stringify(payload));
      return true;
    } catch (err) {
      setStatus('warn', 'This browser would not save the overrides (storage is blocked or full). They stay until the page is closed; use Export JSON to keep them.');
      return false;
    }
  }

  // Restores overrides and loaded files saved earlier. Anything that no
  // longer validates (for example after the embedded data changed) is dropped
  // with a notice rather than applied.
  function restore() {
    var raw = null, dropped = [];
    try { raw = window.localStorage.getItem(CONFIG.storageKey); } catch (err) { return; }
    if (!raw) return;
    var saved;
    try { saved = JSON.parse(raw); } catch (err) { setStatus('warn', 'Saved viewer data in this browser could not be read and was ignored.'); return; }
    if (!saved || !Array.isArray(saved.slots)) return;
    if (typeof saved.by === 'string') state.by = saved.by;
    saved.slots.forEach(function (s) {
      try {
        if (s.source === 'embedded') {
          var doc = clone(SLOTS[0].base);
          doc.overrides = s.overrides || [];
          if (validateDocument(doc).errors.length) dropped.push('overrides on the built-in snapshot');
          else SLOTS[0].overrides = doc.overrides;
        } else if (s.source === 'file' && s.base) {
          var d2 = clone(s.base);
          d2.overrides = s.overrides || [];
          if (validateDocument(d2).errors.length) dropped.push(s.fileName || 'a loaded file');
          else SLOTS.push({ key: s.key, source: 'file', fileName: s.fileName, base: s.base, overrides: d2.overrides });
        }
      } catch (err) { dropped.push(s.fileName || 'saved data'); }
    });
    if (saved.current && SLOTS.some(function (x) { return x.key === saved.current; })) state.slot = saved.current;
    if (dropped.length) setStatus('warn', 'Saved data no longer matches and was not restored: ' + dropped.join(', ') + '.');
  }

  function selectSlot(key) {
    if (state.detailId) closeDetail();
    state.slot = key;
    state.edit = null;
    state.revertArm = null;
    useSlot(currentSlot());
    persist();
    render();
  }

  function loadFile(file) {
    if (!file) return;
    var name = file.name || 'file';
    if (!/\.json$/i.test(name)) { setError('Could not load ' + name, ['Only analysis JSON files (.json) can be loaded.'], 0, null); return; }
    if (file.size > CONFIG.maxFileMB * 1024 * 1024) { setError('Could not load ' + name, ['The file is larger than ' + CONFIG.maxFileMB + ' MB.'], 0, null); return; }
    var reader = new FileReader();
    reader.onerror = function () { setError('Could not load ' + name, ['The browser could not read the file.'], 0, null); };
    reader.onload = function () { acceptText(name, String(reader.result)); };
    reader.readAsText(file);
  }

  // Parses, validates and (if valid) adds a loaded document as a snapshot.
  function acceptText(name, text) {
    var doc;
    try {
      doc = JSON.parse(text.replace(/^﻿/, ''));
    } catch (err) {
      setError('Could not load ' + name + ': not valid JSON', [String(err.message || err)], 0, null);
      return false;
    }
    var res;
    try { res = validateDocument(doc); } catch (err) { res = { errors: [{ path: '', msg: 'could not be checked: ' + (err.message || err) }], warnings: [] }; }
    if (res.errors.length) {
      var shown = res.errors.slice(0, CONFIG.maxErrorsShown);
      setError('Could not load ' + name + ': it is not a valid analysis file (' + res.errors.length + ' problem' + (res.errors.length === 1 ? '' : 's') + ')', shown, res.errors.length - shown.length, doc);
      return false;
    }
    var base = clone(doc);
    base.overrides = [];
    var existing = SLOTS.filter(function (s) { return s.source === 'file' && s.fileName === name && s.base.snapshot.snapshot_id === doc.snapshot.snapshot_id; })[0];
    var slot = existing || { key: 'file-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6), source: 'file', fileName: name };
    slot.base = base;
    slot.overrides = clone(doc.overrides);
    if (!existing) SLOTS.push(slot);
    selectSlot(slot.key);
    var msg = 'Loaded ' + name + ': snapshot ' + doc.snapshot.snapshot_id + ', ' + doc.entries.length + ' entries, ' + doc.overrides.length + ' override' + (doc.overrides.length === 1 ? '' : 's') + (existing ? ' (replaced the earlier copy of this file).' : '.');
    if (res.warnings.length) msg += ' Warning: ' + res.warnings.map(function (w) { return describePath(doc, w.path) + ' ' + w.msg; }).join('; ') + '.';
    setStatus(res.warnings.length ? 'warn' : 'ok', msg);
    return true;
  }

  function resetAll() {
    try { window.localStorage.removeItem(CONFIG.storageKey); } catch (err) { /* nothing stored */ }
    SLOTS.length = 1;
    SLOTS[0].overrides = [];
    state.resetArm = false;
    state.by = '';
    selectSlot('embedded');
    try { window.localStorage.removeItem(CONFIG.storageKey); } catch (err) { /* nothing stored */ }
    setStatus('ok', 'Reset: no overrides, built-in snapshot only.');
  }

  // ==========================================================================
  // Export: JSON and .xlsx
  // ==========================================================================
  function stamp() { return new Date().toISOString().slice(0, 10); }
  function exportName(ext) {
    var slot = currentSlot();
    return 'claim-wall-' + slot.base.snapshot.snapshot_id + '-' + (slot.overrides.length ? 'with-overrides-' : '') + stamp() + '.' + ext;
  }
  function download(name, blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name; a.hidden = true;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
  }
  function exportJson() {
    var doc = exportDoc(currentSlot());
    var bad = validateDocument(doc).errors;
    if (bad.length) { setError('Export stopped: the data does not validate', bad.slice(0, CONFIG.maxErrorsShown), 0, doc); return; }
    download(exportName('json'), new Blob([JSON.stringify(doc, null, 2) + '\n'], { type: 'application/json' }));
    setStatus('ok', 'Exported ' + exportName('json') + ': the analyst\'s codes unchanged, plus ' + doc.overrides.length + ' override' + (doc.overrides.length === 1 ? '' : 's') + '.');
  }
  function exportXlsx() {
    download(exportName('xlsx'), new Blob([buildXlsx(currentSlot())], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    setStatus('ok', 'Exported ' + exportName('xlsx') + ': reconciled entries, the analyst\'s entries, overrides and snapshot details.');
  }

  // Column definitions shared by the reconciled and analyst entry sheets.
  // Scores and claim numbers are numbers; everything else is text.
  var XLSX_ENTRY_COLS = (function () {
    var cols = [
      ['Entry_ID', function (e) { return e.entry_id; }],
      ['Claim_No', function (e) { return e.claim_no; }],
      ['Claim_Label', function (e, d) { return claimLabelIn(d, e.claim_no); }],
      ['Discipline', function (e) { return e.discipline; }],
      ['Card_Text', function (e) { return e.card_text; }],
      ['Transcription_Confidence', function (e) { return e.transcription_confidence; }],
      ['Transcription_Caveat', function (e) { return e.transcription_caveat; }],
      ['Caveat_Affects', function (e) { return e.caveat_affects.join(', '); }],
      ['Oldenburg_Engagement', function (e) { return e.oldenburg.engagement; }],
      ['Oldenburg_Characteristics', function (e) { return e.oldenburg.characteristics.map(function (c) { return c.name + ' (' + c.relation + ')'; }).join('; '); }],
      ['Oldenburg_Rationales', function (e) {
        var o = e.oldenburg;
        return o.characteristics.map(function (c) { return c.name + ': ' + rationaleText(c.rationale); })
          .concat(o.none_rationale ? ['None: ' + rationaleText(o.none_rationale)] : []).join('\n');
      }],
      ['Vocabulary_Flags', function (e) {
        return e.oldenburg.vocabulary_flags.map(function (f) { return '"' + f.term_as_written + '" -> ' + f.maps_to + ' (' + f.usage_matches_definition + '): ' + rationaleText(f.rationale); }).join('\n');
      }]
    ];
    CONFIG.criteria.forEach(function (c) {
      var t = c.name.replace(/ /g, '_');
      cols.push([t + '_Score', function (e) { return e.strength[c.key].score; }]);
      cols.push([t + '_Rationale', function (e) { return rationaleText(e.strength[c.key].rationale); }]);
    });
    return cols.concat([
      ['Misfiled_To', function (e) { return e.strength.claim_fit.misfiled_to; }],
      ['Not_An_Explanation', function (e) { var n = e.strength.claim_fit.not_an_explanation; return n ? n.type + ': ' + rationaleText(n.rationale) : null; }],
      ['Actual_Lens_Primary', function (e) { return e.strength.lens_fit.actual_lens.primary; }],
      ['Actual_Lens_Secondary', function (e) { return e.strength.lens_fit.actual_lens.secondary.join(', '); }],
      ['Testable_Implication', function (e) { return e.strength.testability.testable_implication; }],
      ['Implication_Note', function (e) { return e.strength.testability.implication_note; }],
      ['Stated_Scope', function (e) { return e.strength.scope.stated_scope; }],
      ['Bodo_Question', function (e) { return e.strength.scope.bodo_question; }],
      ['Analyst_Note', function (e) { return e.analyst_note || null; }]
    ]);
  })();
  function claimLabelIn(doc, n) {
    var c = doc.claim_synthesis.filter(function (x) { return x.claim_no === n; })[0];
    return c ? c.claim_label : '';
  }

  function xlsxSheets(slot) {
    var rec = reconcile(slot.base, slot.overrides);
    var ovByEntry = {};
    slot.overrides.forEach(function (ov) { (ovByEntry[ov.target.entry_id] = ovByEntry[ov.target.entry_id] || []).push(fieldPath(ov)); });
    function entryRows(doc, withOv) {
      var head = XLSX_ENTRY_COLS.map(function (c) { return c[0]; });
      if (withOv) head.push('Overridden_Fields');
      var rows = [head];
      doc.entries.forEach(function (e) {
        var r = XLSX_ENTRY_COLS.map(function (c) { return c[1](e, doc); });
        if (withOv) r.push((ovByEntry[e.entry_id] || []).join('; '));
        rows.push(r);
      });
      return rows;
    }
    var ovRows = [['Override_ID', 'Entry_ID', 'Field', 'Pointer', 'Original_Value', 'Override_Value', 'Original_JSON', 'Override_JSON', 'Reason', 'By', 'At']];
    slot.overrides.forEach(function (ov) {
      var f = fieldOf(ov.pointer);
      ovRows.push([ov.override_id, ov.target.entry_id, fieldPath(ov), ov.pointer, fmtText(f, ov.original_value), fmtText(f, ov.override_value),
        JSON.stringify(ov.original_value), JSON.stringify(ov.override_value), ov.reason, ov.by, ov.at]);
    });
    var s = slot.base.snapshot;
    var meta = [['Field', 'Value'],
      ['Snapshot_ID', s.snapshot_id], ['Snapshot_Date', s.snapshot_date], ['Source_Workbook', s.source_workbook],
      ['Entry_Count', s.entry_count], ['Uncertain_Count', s.uncertain_count], ['Analyst', s.analyst], ['Coded_At', s.generated_at],
      ['Schema_Version', slot.base.schema_version], ['Protocol_Version', slot.base.protocol_version],
      ['Theory_File', slot.base.theory_file.path], ['Theory_File_SHA256', slot.base.theory_file.sha256],
      ['Loaded_From', slotSource(slot)], ['Override_Count', slot.overrides.length], ['Exported_At', new Date().toISOString()],
      ['Note', 'Entries_Reconciled has every override applied. Entries_Analyst is the analyst\'s coding, unchanged. Overrides lists each change with its original value. The claim synthesis is not included; it is in the JSON export.']];
    return [
      { name: 'Entries_Reconciled', rows: entryRows(rec, true) },
      { name: 'Entries_Analyst', rows: entryRows(slot.base, false) },
      { name: 'Overrides', rows: ovRows },
      { name: 'Snapshot', rows: meta }
    ];
  }

  // Minimal .xlsx writer: SpreadsheetML parts in an uncompressed (stored) zip.
  // Plain cells only: numbers as numbers, text as inline strings, no styling.
  function xmlEsc(s) {
    return String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function colName(i) {
    var s = '';
    for (i += 1; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s;
    return s;
  }
  function sheetXml(rows) {
    var x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
    rows.forEach(function (row, r) {
      x += '<row r="' + (r + 1) + '">';
      row.forEach(function (v, c) {
        if (v === null || v === undefined || v === '') return;
        var ref = colName(c) + (r + 1);
        if (typeof v === 'number') x += '<c r="' + ref + '"><v>' + v + '</v></c>';
        else x += '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(v) + '</t></is></c>';
      });
      x += '</row>';
    });
    return x + '</sheetData></worksheet>';
  }
  function buildXlsx(slot) {
    var sheets = xlsxSheets(slot);
    var NS = 'http://schemas.openxmlformats.org/';
    var head = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
    var files = [
      ['[Content_Types].xml', head + '<Types xmlns="' + NS + 'package/2006/content-types">'
        + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
        + '<Default Extension="xml" ContentType="application/xml"/>'
        + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
        + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
        + sheets.map(function (s, i) { return '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'; }).join('')
        + '</Types>'],
      ['_rels/.rels', head + '<Relationships xmlns="' + NS + 'package/2006/relationships">'
        + '<Relationship Id="rId1" Type="' + NS + 'officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
      ['xl/workbook.xml', head + '<workbook xmlns="' + NS + 'spreadsheetml/2006/main" xmlns:r="' + NS + 'officeDocument/2006/relationships"><sheets>'
        + sheets.map(function (s, i) { return '<sheet name="' + xmlEsc(s.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>'; }).join('')
        + '</sheets></workbook>'],
      ['xl/_rels/workbook.xml.rels', head + '<Relationships xmlns="' + NS + 'package/2006/relationships">'
        + sheets.map(function (s, i) { return '<Relationship Id="rId' + (i + 1) + '" Type="' + NS + 'officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>'; }).join('')
        + '<Relationship Id="rId' + (sheets.length + 1) + '" Type="' + NS + 'officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
      ['xl/styles.xml', head + '<styleSheet xmlns="' + NS + 'spreadsheetml/2006/main">'
        + '<fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts>'
        + '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>'
        + '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'
        + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
        + '<cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs>'
        + '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>']
    ];
    sheets.forEach(function (s, i) { files.push(['xl/worksheets/sheet' + (i + 1) + '.xml', sheetXml(s.rows)]); });
    return zipStore(files);
  }

  var CRC_TABLE = (function () {
    var t = [];
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(b) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  // files: [[name, text]]. Returns a Uint8Array holding a zip with no compression.
  function zipStore(files) {
    var enc = new TextEncoder(), parts = [], central = [], offset = 0;
    var d = new Date();
    var dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    var dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    files.forEach(function (f) {
      var name = enc.encode(f[0]), data = enc.encode(f[1]), crc = crc32(data);
      var lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      var ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
      ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
      ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
      ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
      ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
      parts.push(new Uint8Array(lh.buffer), name, data);
      central.push(new Uint8Array(ch.buffer), name);
      offset += 30 + name.length + data.length;
    });
    var cdSize = central.reduce(function (a, p) { return a + p.length; }, 0);
    var end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(4, 0, true); end.setUint16(6, 0, true);
    end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true); end.setUint16(20, 0, true);
    var all = parts.concat(central, [new Uint8Array(end.buffer)]);
    var out = new Uint8Array(all.reduce(function (a, p) { return a + p.length; }, 0)), pos = 0;
    all.forEach(function (p) { out.set(p, pos); pos += p.length; });
    return out;
  }

  // ==========================================================================
  // Render + events
  // ==========================================================================
  function renderView() {
    var v = document.getElementById('view');
    if (state.tab === 'grid') v.innerHTML = renderGrid();
    else if (state.tab === 'coverage') v.innerHTML = renderCoverage();
    else if (state.tab === 'overrides') v.innerHTML = renderOverrides();
    else v.innerHTML = renderSynthesis();
  }

  function render() {
    renderChrome();
    renderView();
    if (state.detailId && document.getElementById('detail').open) renderDetail(state.detailId);
  }

  function setTab(id, focusTab) {
    state.tab = id;
    render();
    if (focusTab) {
      var b = document.getElementById('tab-' + id);
      if (b) b.focus();
    }
  }

  function setStudent(on) {
    state.student = on;
    state.edit = null;
    state.revertArm = null;
    state.resetArm = false;
    try {
      var url = new URL(window.location.href);
      if (on) url.searchParams.set('view', 'student'); else url.searchParams.delete('view');
      window.history.replaceState(null, '', url.toString());
    } catch (err) { /* file:// in some browsers; the toggle still works */ }
    render();
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest ? ev.target.closest('button, a') : null;
    if (!t) return;
    if (t.hasAttribute('data-tab')) { setTab(t.getAttribute('data-tab'), false); return; }
    if (t.id === 'view-toggle') { setStudent(!state.student); return; }
    if (t.hasAttribute('data-entry')) { openDetail(t.getAttribute('data-entry'), t); return; }
    if (t.hasAttribute('data-entry-nav')) { var nid = t.getAttribute('data-entry-nav'); state.edit = null; state.revertArm = null; if (nid) openDetail(nid); return; }
    // Override controls inside the entry detail.
    if (t.hasAttribute('data-ov-open')) { startEdit(t.getAttribute('data-ov-open')); return; }
    if (t.hasAttribute('data-ov-cancel')) { endEdit(state.edit.block); return; }
    if (t.hasAttribute('data-ov-revert-arm')) {
      state.revertArm = t.getAttribute('data-ov-revert-arm');
      rerenderDetail();
      var cf = document.querySelector('#detail [data-ov-revert]');
      if (cf) cf.focus();
      return;
    }
    if (t.hasAttribute('data-ov-revert-cancel')) {
      var blk = state.revertArm;
      state.revertArm = null;
      rerenderDetail();
      var ra = document.querySelector('#detail [data-ov-revert-arm="' + blk + '"]');
      if (ra) ra.focus();
      return;
    }
    if (t.hasAttribute('data-ov-revert')) { revertBlock(t.getAttribute('data-ov-revert')); return; }
    if (t.hasAttribute('data-ed')) {
      readForm();
      var act = t.getAttribute('data-ed'), i = Number(t.getAttribute('data-i')), d = state.edit.draft;
      var blank = { quotes: [], text: '' };
      if (act === 'add-ch') d.characteristics.push({ name: CONFIG.characteristics[0].name, relation: 'invokes', rationale: clone(blank) });
      if (act === 'remove-ch') d.characteristics.splice(i, 1);
      if (act === 'add-vf') d.vocabulary_flags.push({ term_as_written: '', maps_to: CONFIG.characteristics[0].name, usage_matches_definition: 'undeterminable', rationale: clone(blank) });
      if (act === 'remove-vf') d.vocabulary_flags.splice(i, 1);
      state.edit.errors = null;
      rerenderDetail();
      var focusSel = act === 'add-ch' ? '#ed-ch-name-' + (d.characteristics.length - 1)
        : act === 'add-vf' ? '#ed-vf-term-' + (d.vocabulary_flags.length - 1)
        : act === 'remove-ch' ? '[data-ed="add-ch"]' : '[data-ed="add-vf"]';
      var fe = document.querySelector('#detail ' + focusSel);
      if (fe) fe.focus();
      return;
    }
    // Data bar.
    var action = t.getAttribute('data-action');
    if (action === 'load') { document.getElementById('file-input').click(); return; }
    if (action === 'export-json') { exportJson(); return; }
    if (action === 'export-xlsx') { exportXlsx(); return; }
    if (action === 'reset') {
      state.resetArm = true;
      renderDataBar();
      document.querySelector('[data-action="reset-confirm"]').focus();
      return;
    }
    if (action === 'reset-cancel') {
      state.resetArm = false;
      renderDataBar();
      document.querySelector('[data-action="reset"]').focus();
      return;
    }
    if (action === 'reset-confirm') { resetAll(); document.querySelector('[data-action="reset"]').focus(); return; }
    if (t.hasAttribute('data-close')) { closeDetail(); return; }
    if (t.hasAttribute('data-goto-synthesis')) {
      var n = t.getAttribute('data-goto-synthesis');
      setTab('synthesis', false);
      var sec = document.getElementById('syn-claim-' + n);
      if (sec) { sec.scrollIntoView(); sec.focus({ preventScroll: true }); }
      return;
    }
    if (t.matches('.claim-jump a')) {
      ev.preventDefault();
      var target = document.getElementById(t.getAttribute('href').slice(1));
      if (target) { target.scrollIntoView(); target.focus({ preventScroll: true }); }
    }
  });

  document.addEventListener('submit', function (ev) {
    if (ev.target.hasAttribute && ev.target.hasAttribute('data-edit-form')) { ev.preventDefault(); saveEdit(); }
  });
  // Live word count for the override reason.
  document.addEventListener('input', function (ev) {
    if (ev.target.id !== 'ed-reason') return;
    var n = wordCount(ev.target.value), min = CONFIG.reasonMinWords, out = document.getElementById('ed-reason-count');
    out.textContent = n + ' of ' + min + ' words';
    out.classList.toggle('met', n >= min);
  });
  document.getElementById('snap-select').addEventListener('change', function (ev) {
    selectSlot(ev.target.value);
    setStatus('ok', 'Showing ' + slotLabel(currentSlot()) + '.');
  });
  document.getElementById('file-input').addEventListener('change', function (ev) {
    var f = ev.target.files && ev.target.files[0];
    loadFile(f);
    ev.target.value = '';
  });

  // Arrow-key navigation between tabs (WAI-ARIA tabs pattern).
  document.getElementById('tabs').addEventListener('keydown', function (ev) {
    var tabs = visibleTabs();
    var i = tabs.map(function (t) { return t.id; }).indexOf(state.tab);
    var j = null;
    if (ev.key === 'ArrowRight') j = (i + 1) % tabs.length;
    else if (ev.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
    else if (ev.key === 'Home') j = 0;
    else if (ev.key === 'End') j = tabs.length - 1;
    if (j === null) return;
    ev.preventDefault();
    setTab(tabs[j].id, true);
  });

  var dlgEl = document.getElementById('detail');
  dlgEl.addEventListener('close', function () {
    state.detailId = null;
    // Clear content so a closed dialog never holds instructor-only text.
    dlgEl.innerHTML = '';
    state.edit = null;
    state.revertArm = null;
    document.body.classList.remove('dialog-open');
    var rf = state.returnFocus;
    state.returnFocus = null;
    if (rf && document.body.contains(rf)) rf.focus();
  });
  // Click on the backdrop closes the dialog.
  dlgEl.addEventListener('click', function (ev) { if (ev.target === dlgEl) closeDetail(); });
  // Escape while an override form is open cancels the form, not the dialog.
  dlgEl.addEventListener('cancel', function (ev) {
    if (state.edit) { ev.preventDefault(); endEdit(state.edit.block); }
  });

  // Start: the built-in snapshot, then anything saved in this browser.
  var embeddedBase = clone(EMBEDDED);
  embeddedBase.overrides = [];
  SLOTS.push({ key: 'embedded', source: 'embedded', fileName: null, base: embeddedBase, overrides: clone(EMBEDDED.overrides) });
  restore();
  useSlot(currentSlot());
  render();

  // Test hook for scripts/verify_session4.mjs (read-only helpers).
  window.ClaimWallViewer = { validateDocument: validateDocument, schemaErrors: schemaErrors, reconcile: reconcile };
})();
</script>
