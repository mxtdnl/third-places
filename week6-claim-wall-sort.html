<!--
  WEEK 6 - CLAIM WALL SORT
  Social Phenomena Challenge, ADJUDICATE phase (week 6).

  A click-and-drag virtual copy of the physical claim wall. Groups, on their
  own devices, (1) tidy the wall, (2) add new cards from the week 5 field
  visit, and (3) link similar explanations with red string, then reproduce
  the changes on the corkboard. The instructor merges the groups' exports
  into one class wall. One screen, one board, no steps, no scoring.

  This tool never asks what should be done about the decline, and it shows
  no analyser output (scores, misfiling, lens fit, synthesis): students
  decide where cards belong.

  ============================================================================
  DESIGN DEPARTURE (documented exception to CLAUDE.md)
  ============================================================================
  The BOARD deliberately departs from the house palette, the way mondi.html
  has its own design system: it is a corkboard (CSS-only speckled cork inside
  a wooden frame), the cards are paper index cards in the colours of the real
  card stock (CONFIG.cardColours), each slightly rotated with a push-pin and
  a soft shadow, cell boundaries are drawn as tape, and links are red string.
  Everything AROUND the board (header, toolbar, buttons, dialogs, lists,
  typography) follows CLAUDE.md: house tokens, zero radius on UI controls,
  uppercase labels. Pins and string knots are round because they depict
  real pins, not UI controls.

  ============================================================================
  EXPORT JSON  (tool "week6-claim-wall-sort", schemaVersion 1)
  ============================================================================
  {
    "tool": "week6-claim-wall-sort",            REQUIRED, constant
    "schemaVersion": 1,                          REQUIRED
    "cardSet": "S1",                             REQUIRED, must match CONFIG.cardSet
    "cardIds": ["S1-001", ...],                  REQUIRED, the starting card ids
    "exportedAt": "ISO 8601 timestamp",
    "group": { "name": "string", "members": ["string", ...] },
    "cells": { "c1-psychology": ["S1-001", ...], ..., "hold": [...] },
                                                 card positions, in order within
                                                 each cell. Cell keys are
                                                 "c<claim>-<lens>" or "hold".
    "newCards": [ { "id", "text", "claim", "lens", "source", "group",
                    "origin" (cell when added), "createdAt" } ],
    "connections": [ { "a", "b" (a < b), "label",
                       "local": true if drawn on this wall,
                       "groups": [ { "group", "label" } ] from merged groups } ],
    "merge": null for a group's own wall, or for a merged wall:
      { "sources": [ { "group", "members", "exportedAt",
                       "placements": { cardId: cellKey },
                       "newCards": [...], "connections": [ { "a", "b", "label" } ] } ],
        "overrides": { cardId: { "cell", "basis" (majority cell when picked), "at" } },
        "removedLinks": ["a|b", ...], "removedCards": [cardId, ...] }
  }

  MERGING. A merged wall keeps every group's raw placements in
  merge.sources, so merging a merged wall again with a late group's file
  recounts every card as if all the original files had been merged at once.
  The instructor's picks (overrides) survive a re-merge unless the new count
  changes the card's majority cell.
  ============================================================================
-->
<style>
  :root {
    --bg: #F2DFBE;
    --bg-card: #FFFAF2;
    --bg-deep: #E8D2A8;
    --text: #2A1F18;
    --text-muted: #6A5A48;
    --border: #D8C8A8;

    --char-1: #5C3A96;
    --char-2: #B52838;
    --char-3: #C85218;
    --char-4: #D4A020;
    --char-5: #7A5828;
    --char-6: #B83068;
    --char-7: #CC6830;
    --char-8: #7E58A8;

    --correct: #2A7A42;
    --incorrect: #B82828;
    --incorrect-bg: #FDEEEE;

    /* Board only (the documented departure): cork, frame, tape, string */
    --cork: #C49A6C;
    --frame: #6B4423;
    --frame-light: #82552E;
    --frame-dark: #573517;
    --tape: rgba(246, 238, 214, 0.92);
    --string: #9A0C16;
    --card-ink: #2A1F18;
    --card-ink-muted: #4A3828;
    --stamp-disputed: #7A1420;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
  }
  :focus-visible { outline: 3px solid var(--char-1); outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  .app-wrap { max-width: 1240px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }

  h1 {
    font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 800; letter-spacing: 0.06em;
    text-transform: uppercase; line-height: 1.1; margin-bottom: 0.5rem;
  }
  h2 {
    font-size: clamp(1.2rem, 2.4vw, 1.6rem); font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.05em; line-height: 1.2; margin-bottom: 0.75rem;
  }
  h3 { font-size: 0.95rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
  p { margin-bottom: 0.6rem; }
  .eyebrow { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); }
  .lede { font-size: 1.02rem; color: var(--text-muted); max-width: 760px; margin-bottom: 0.25rem; }
  .quiet { color: var(--text-muted); font-size: 0.88rem; }
  .alert { color: var(--incorrect); font-weight: 700; font-size: 0.88rem; }

  /* ── Page header with house geometry ── */
  .page-header {
    position: relative; overflow: hidden;
    padding: 1.5rem 2rem 1.25rem 0; margin-bottom: 1rem;
    border-bottom: 6px solid var(--char-5);
  }
  .page-header > * { position: relative; z-index: 1; }
  .page-header::before {
    content: ''; position: absolute; width: 220px; height: 220px;
    background: var(--char-2); border-radius: 50%; opacity: 0.08;
    top: -70px; right: -40px; z-index: 0;
  }
  .page-header::after {
    content: ''; position: absolute; width: 64px; height: 64px;
    background: var(--char-4); opacity: 0.14;
    bottom: 14px; right: 150px; transform: rotate(25deg); z-index: 0;
  }
  .page-header .deco-bar {
    position: absolute; z-index: 0; pointer-events: none;
    width: 150px; height: 10px; background: var(--char-3);
    top: 26px; right: 250px; transform: rotate(-8deg);
  }
  .page-header .deco-ring {
    position: absolute; z-index: 0; pointer-events: none;
    width: 84px; height: 84px; border: 6px solid var(--char-1); border-radius: 50%;
    bottom: -30px; right: 40px; opacity: 0.3;
  }

  /* ── Group strip ── */
  .group-strip {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 0.5rem 1rem;
    background: var(--bg-card); border: 2px solid var(--border); border-left: 6px solid var(--char-1);
    padding: 0.75rem 1rem; margin-bottom: 0.75rem;
  }
  .field label, .field .label {
    display: block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.2rem;
  }
  input[type="text"], textarea, select {
    width: 100%; font: inherit; font-size: 0.95rem; color: var(--text);
    background: #fff; border: 2px solid var(--border); border-radius: 0;
    padding: 0.5rem 0.65rem; min-height: 44px;
  }
  textarea { min-height: 110px; resize: vertical; }
  input:focus, textarea:focus, select:focus { border-color: var(--char-1); outline: 3px solid var(--char-4); outline-offset: 1px; }

  /* ── Buttons ── */
  .btn {
    font: inherit; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    min-height: 44px; padding: 0.55rem 1rem; border: 2px solid transparent; border-radius: 0;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
    transition: background-color 0.15s ease, color 0.15s ease, transform 0.15s ease, border-color 0.2s ease;
  }
  .btn:active { transform: translateY(0); }
  .btn-primary { background: var(--char-1); color: #fff; }
  .btn-primary:hover { background: var(--char-2); transform: translateY(-2px); }
  .btn-accent { background: var(--char-5); color: #fff; }
  .btn-accent:hover { background: var(--char-2); transform: translateY(-2px); }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--text); }
  .btn-ghost:hover { background: var(--text); color: var(--bg); transform: translateY(-2px); }
  .btn-ghost[aria-pressed="true"] { background: var(--char-2); border-color: var(--char-2); color: #fff; }
  .btn-danger { background: transparent; color: var(--incorrect); border-color: var(--incorrect); }
  .btn-danger:hover { background: var(--incorrect); color: #fff; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-small { font-size: 0.68rem; padding: 0.4rem 0.75rem; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; }
  .toolbar .sep { width: 2px; align-self: stretch; background: var(--border); margin: 0 0.15rem; }
  .status {
    min-height: 1.6rem; font-size: 0.88rem; font-weight: 600; margin-bottom: 0.5rem;
    padding-left: 0.6rem; border-left: 4px solid var(--char-4);
  }
  .status:empty { border-left-color: transparent; }

  /* ── Merge panel ── */
  .merge-panel {
    background: rgba(200,82,24,0.08); border: 2px solid var(--border); border-left: 6px solid var(--char-3);
    padding: 0.75rem 1rem; margin-bottom: 0.75rem; font-size: 0.9rem;
  }
  .merge-panel ul { list-style: none; display: flex; flex-wrap: wrap; gap: 0.35rem 1.25rem; margin-top: 0.25rem; }
  .merge-panel li::before { content: ''; display: inline-block; width: 9px; height: 9px; background: var(--char-3); margin-right: 6px; }

  /* ── Connect-mode banner ── */
  .connect-banner {
    background: var(--char-2); color: #fff; padding: 0.6rem 1rem; margin-bottom: 0.5rem;
    font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.8rem;
    display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; justify-content: space-between;
  }
  .connect-banner .btn { border-color: #fff; color: #fff; }
  .connect-banner .btn:hover { background: #fff; color: var(--char-2); }

  /* ============================================================
     THE BOARD (corkboard: the documented departure)
     ============================================================ */
  .frame {
    position: relative;
    border: 18px solid var(--frame);
    border-image: repeating-linear-gradient(100deg, var(--frame) 0 9px, var(--frame-light) 9px 13px, var(--frame-dark) 13px 19px, var(--frame) 19px 26px) 18;
    box-shadow: 0 6px 18px rgba(42,31,24,0.25), inset 0 0 0 2px rgba(0,0,0,0.25);
    background: var(--cork);
  }
  .cork-tex {
    background-color: var(--cork);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(92,58,28,0.38) 0 1px, transparent 1.6px),

  .cork { position: relative; padding: 10px; }

  .cell { position: relative; min-height: 120px; }

  .pin {
    position: absolute; top: 4px; left: 50%; width: 14px; height: 14px; margin-left: -7px;

  .stamp {

  .print-only { display: none; }

  /* ── Narrow: stacked cells, Move to... instead of drag ── */
  @media (max-width: 699.98px) {
    .app-wrap { padding: 1rem 16px 2.5rem; }

    .wall-corner, .lens-head { display: none; }

    .cell { min-height: 0; padding: 8px; }
    .cell-label { display: block; margin-bottom: 0.4rem; }
    .cell-label span {
      display: inline-block; background: var(--bg-card); color: var(--card-ink); padding: 0.15rem 0.5rem;
      font-size: 0.68rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .card { cursor: pointer; touch-action: manipulation; flex-basis: 100%; max-width: none; }
    .ghost { flex-basis: 100%; max-width: none; }
    .two-col { grid-template-columns: minmax(0, 1fr); }
    .link-list li { grid-template-columns: auto minmax(0, 1fr); }

  }

  /* ── Print: A4 landscape board, connections list, A6 new cards ── */
  @page { size: A4 landscape; margin: 8mm; }
  @media print {

    .merge-panel { padding: 1.5mm 3mm; margin-bottom: 2mm; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .frame { border: 0.6mm solid #6B4423; border-image: none; box-shadow: none; background: #fff; }
    .cork-tex { background: #fff !important; }
    .cork { padding: 0; }
    .wall { background: #fff; gap: 0; padding: 0; grid-template-columns: 28mm repeat(3, minmax(0, 1fr)); }
    .wall > * { border: 0.3mm solid #9A8A70; }

    .cell { min-height: 0; break-inside: auto; }
    .cell.empty .cell-cards::before { background: none; }
    .cell-cards { gap: 1.5mm; min-height: 0; }
    .card, .claim-card {
      transform: none; box-shadow: none; padding: 1.5mm 2mm; flex: 1 1 36mm; max-width: none;
      border: 0.3mm solid #2A1F18; break-inside: avoid;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }

    .card-text { font-size: 7.5pt; margin: 0.5mm 0; }
    .card-lens, .card-foot, .chip { font-size: 6pt; }
    .stamp { position: static; display: inline-block; transform: none; font-size: 6pt; margin-right: 1mm; box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    .card-links { display: block; font-size: 6.5pt; font-weight: 800; color: #9A0C16; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .claim-card .claim-label { font-size: 9pt; }

    .lens-head .paper, .hold-head .paper, .wall-corner .paper { box-shadow: none; font-size: 7pt; padding: 0; }
    .panel { break-before: page; border: 0; border-top: 1mm solid #9A0C16; margin: 0; padding: 2mm 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

<script>
(function () {
  'use strict';

  // ==========================================================================
  // CONFIG: everything a non-developer may want to edit lives here.
  // No text in this tool is a placeholder. Do not add study findings,
  // statistics or facts about real places.
  // ==========================================================================
  var CONFIG = {
    // Identity of exports. Files from any other tool are rejected on import.
    toolId: 'week6-claim-wall-sort',
    schemaVersion: 1,
    // Autosave key, namespaced per tool and version. Bump the suffix to
    // start every device afresh after a breaking change to the card set.
    storageKey: 'week6-claim-wall-sort-v1',
    // The snapshot the starting cards come from (claim-wall/analysis/S1.json).
    // Exports carry it, and files for a different card set are rejected.
    cardSet: 'S1',

    // Card stock colours. MATCH THESE TO THE REAL CARD STOCK on the wall.
    // Text on every colour is #2A1F18; keep each colour light enough for
    // a contrast ratio of at least 4.5:1 against it (WCAG AA). The four
    // values below give 7.3:1 or more.
    cardColours: {
      psychology: '#F4A99B',  // salmon pink cards
      economics:  '#F2CC5B',  // yellowy gold cards
      politics:   '#F59A4A',  // orange cards
      claim:      '#8CC98A'   // green claim header cards
    },

    // The four claim rows, in the wall's own order and wording (from S1).
    // week5 is the matching term on the week 5 field visit cards.
    claims: [
      { no: 1, label: 'Quantity', text: 'The # of third places is declining (quantity)', week5: 'Supply' },
      { no: 2, label: 'Usage', text: 'People use third places less than they did before (usage)', week5: 'Use' },
      { no: 3, label: 'Outcomes', text: 'Outcomes of third places are worsening for social/community (outcomes)', week5: 'Outcome' },
      { no: 4, label: 'Quality', text: 'Remaining places exhibit fewer third-place characteristics (quality)', week5: 'Quality' }
    ],
    // The three lens columns, in the wall's order. week5 is the matching
    // lens name on the week 5 field visit cards.
    lenses: [
      { id: 'psychology', name: 'Psychology', week5: 'Psychological' },
      { id: 'economics', name: 'Economics', week5: 'Economic' },
      { id: 'politics', name: 'Politics', week5: 'Political' }
    ],
    // The holding area at the bottom edge of the board.
    holdingName: 'Not sure / not an explanation',

    // New cards from the week 5 field visit.
    newCard: {
      minWords: 8,
      maxWords: 30,
      source: 'Field visit (week 5)'
    },
    // Maximum words in a red-line label.
    labelMaxWords: 8,
    // Below this width the board becomes stacked cells and cards are moved
    // with "Move to..." instead of dragging.
    narrowBreakpoint: 700,

    // Interface copy.
    text: {
      eyebrow: 'Week 6 \u00b7 Adjudicate \u00b7 Claim wall',
      title: 'Claim Wall Sort',

      newCards: clone(r.newCards).map(function (c) { c.group = String(r.group).trim(); return c; }).sort(function (a, b) { return cmp(a.id, b.id); }),
      connections: r.connections.map(function (c) { return { a: c.a < c.b ? c.a : c.b, b: c.a < c.b ? c.b : c.a, label: c.label || '' }; })
        .sort(function (a, b) { return cmp(linkKey(a.a, a.b), linkKey(b.a, b.b)); })
    };
  }
  // The group records inside one file: a group's own wall is one record; a
  // merged wall expands to its original groups plus anything added on it.
  function recordsOf(file) {
    var placements = {};
    Object.keys(file.cells).forEach(function (k) { file.cells[k].forEach(function (id) { placements[id] = k; }); });
    if (!file.merge) {
      return {
        records: [normRecord({
          group: file.group.name, members: file.group.members, exportedAt: file.exportedAt, placements: placements,
          newCards: file.newCards, connections: file.connections
        })],
        overrides: {}, removedLinks: [], removedCards: []
      };
    }
    var records = file.merge.sources.map(normRecord);
    var fromSources = {};
    records.forEach(function (r) { r.newCards.forEach(function (c) { fromSources[c.id] = true; }); });
    var localCards = file.newCards.filter(function (c) { return !fromSources[c.id]; });
    var localLinks = file.connections.filter(function (c) { return c.local; });
    if (localCards.length || localLinks.length) {
      var lp = {};
      localCards.forEach(function (c) { lp[c.id] = placements[c.id]; });
      records.push(normRecord({
        group: file.group.name, members: file.group.members, exportedAt: file.exportedAt, placements: lp,
        newCards: localCards, connections: localLinks
      }));
    }
    return { records: records, overrides: file.merge.overrides, removedLinks: file.merge.removedLinks, removedCards: file.merge.removedCards };
  }
  // Group names a file contributes (for the merge list).
  function groupsInFile(file) { return recordsOf(file).records.map(function (r) { return r.group; }); }

  // files: validated export objects. wallGroup: { name, members } for the result.
  function mergeFiles(files, wallGroup) {
    var errors = [];
    if (!files.length) return { errors: ['Choose at least one group file.'] };
    var records = [], overrides = {}, removedLinks = {}, removedCards = {};
    files.forEach(function (f, i) {
      var v = validateExport(f);
      if (v.length) { errors.push('File ' + (i + 1) + ': ' + v[0]); return; }
      var x = recordsOf(f);
      records = records.concat(x.records);
      Object.keys(x.overrides).forEach(function (id) {
        var o = x.overrides[id], cur = overrides[id];
        if (!cur || cmp(o.at || '', cur.at || '') > 0 || (o.at === cur.at && cmp(o.cell, cur.cell) < 0)) overrides[id] = clone(o);
      });
      x.removedLinks.forEach(function (k) { removedLinks[k] = true; });
      x.removedCards.forEach(function (k) { removedCards[k] = true; });
    });
    var byName = {};
    records.forEach(function (r) {
      if (!r.group) errors.push('A file has no group name. Ask that group to add it and export again.');
      else if (byName[normName(r.group)]) errors.push('Group "' + r.group + '" appears more than once. Remove one of its files.');
      byName[normName(r.group)] = true;
    });
    if (errors.length) return { errors: errors.filter(function (e, i, a) { return a.indexOf(e) === i; }) };
    records.sort(function (a, b) { return cmpName(a.group, b.group); });

    var state = {
      group: { name: String(wallGroup && wallGroup.name || ''), members: String(wallGroup && wallGroup.members || '') },
      cells: {}, newCards: [], connections: [],
      merge: { sources: records, overrides: {}, removedLinks: Object.keys(removedLinks).sort(), removedCards: Object.keys(removedCards).sort() }
    };
    CELL_KEYS.forEach(function (k) { state.cells[k] = []; });
    var newCards = [];
    records.forEach(function (r) { r.newCards.forEach(function (c) { if (!removedCards[c.id]) newCards.push(clone(c)); }); });
    newCards.sort(function (a, b) { return cmpName(a.group, b.group) || cmp(a.id, b.id); });
    state.newCards = newCards;

    function place(id, original) {
      var maj = majorityFor(records, id, original);
      if (!isCellKey(maj)) maj = original;
      var ov = overrides[id];
      var cell = maj;
      if (ov && ov.basis === maj && isCellKey(ov.cell)) { cell = ov.cell; state.merge.overrides[id] = clone(ov); }
      state.cells[cell].push(id);
    }
    START_IDS.forEach(function (id) { place(id, cellKey(START[id].claim, START[id].lens)); });
    newCards.forEach(function (c) { place(c.id, c.origin); });

    var onWall = {};
    allCardIds(state).forEach(function (id) { onWall[id] = true; });
    var links = {};
    records.forEach(function (r) {
      r.connections.forEach(function (c) {
        var key = linkKey(c.a, c.b);
        if (removedLinks[key] || !onWall[c.a] || !onWall[c.b]) return;
        if (!links[key]) links[key] = { a: c.a, b: c.b, label: '', local: false, groups: [] };
        if (!links[key].groups.some(function (g) { return g.group === r.group; })) links[key].groups.push({ group: r.group, label: c.label });
      });
    });
    state.connections = Object.keys(links).sort().map(function (k) { return links[k]; });
    return { state: state, errors: [] };
  }

  // ==========================================================================
  // Copy as text
  // ==========================================================================
  function cardLine(state, id) {
    var c = cardById(state, id);
    var bits = ['[' + id + '] ' + c.text];
    bits.push('(' + LENS[c.lens].name + ' card)');
    if (START[id] && c.uncertain) bits.push('(uncertain transcription)');
    if (!START[id]) bits.push('(NEW' + (state.merge && c.group ? ', ' + c.group : '') + ', ' + CONFIG.newCard.source + ')');
    if (isMoved(state, id)) bits.push('(moved from ' + cellName(originCell(state, id)) + ')');
    if (isDisputed(state, id)) bits.push('(DISPUTED)');
    return bits.join(' ');
  }
  function connLine(state, c, i) {
    var g = connGroups(state, c);
    var n = g.length;
    var line = 'L' + (i + 1) + '  ' + c.a + ' <-> ' + c.b;
    if (!state.merge) return line + (c.label ? '  "' + c.label + '"' : '');
    return line + '  (' + n + (n === 1 ? ' group' : ' groups') + ': ' + g.map(function (x) { return x.group + (x.label ? ' "' + x.label + '"' : ''); }).join('; ') + ')';
  }
  function buildText(state, now) {
    var out = [];
    var stamp = (now || new Date()).toLocaleString('en-GB');
    out.push('CLAIM WALL SORT');
    out.push('Group: ' + (String(state.group.name || '').trim() || '(no name)'));
    var mem = membersList(state.group.members);
    if (mem.length) out.push('Members: ' + mem.join(', '));
    if (state.merge) out.push('Merged from: ' + state.merge.sources.map(function (r) { return r.group; }).join(', '));
    out.push('Copied: ' + stamp);
    out.push('');
    out.push('CARDS BY CLAIM AND LENS');
    CONFIG.claims.forEach(function (cl) {
      out.push('');
      out.push('Claim ' + cl.no + ' ' + cl.label + ': ' + cl.text);
      CONFIG.lenses.forEach(function (l) {
        var ids = state.cells[cellKey(cl.no, l.id)];
        out.push('  ' + l.name + (ids.length ? '' : ': (empty)'));
        ids.forEach(function (id) { out.push('    - ' + cardLine(state, id)); });
      });
    });
    out.push('');
    out.push(CONFIG.holdingName + (state.cells[HOLD].length ? '' : ': (empty)'));
    state.cells[HOLD].forEach(function (id) { out.push('    - ' + cardLine(state, id)); });

    var moved = allCardIds(state).filter(function (id) { return isMoved(state, id); });
    out.push('');
    out.push('MOVED CARDS (from -> to)');
    if (!moved.length) out.push('  None');
    moved.forEach(function (id) { out.push('  ' + id + ': ' + cellName(originCell(state, id)) + ' -> ' + cellName(findCell(state, id))); });

    if (state.merge) {
      var disp = disputedIds(state);
      out.push('');
      out.push('DISPUTED CARDS (where each group put it)');
      if (!disp.length) out.push('  None');
      disp.forEach(function (id) {
        out.push('  ' + id + ' (now in ' + cellName(findCell(state, id)) + '): ' + cardById(state, id).text);
        votesFor(state.merge.sources, id).forEach(function (v) { out.push('    ' + v.group + ': ' + cellName(v.cell)); });
      });
    }

    out.push('');
    out.push('NEW CARDS (' + CONFIG.newCard.source + ')');
    if (!state.newCards.length) out.push('  None');
    state.newCards.forEach(function (c) {
      out.push('  [' + c.id + '] ' + c.text + ' (' + cellName(cellKey(c.claim, c.lens)) + (state.merge && c.group ? '; ' + c.group : '') + '; now in ' + cellName(findCell(state, c.id)) + ')');
    });

    out.push('');
    out.push('CONNECTIONS (red lines)');
    if (!state.connections.length) out.push('  None');
    state.connections.forEach(function (c, i) { out.push('  ' + connLine(state, c, i)); });
    return out.join('\n');
  }

  // ==========================================================================
  // Print: A6 sheets for new cards (four per A4 landscape page)
  // ==========================================================================
  function buildA6Html(state) {
    if (!state.newCards.length) return '';
    var cards = state.newCards.map(function (c) {
      var at = findCell(state, c.id);
      var p = parseCell(at);
      var title = p.hold ? CONFIG.holdingName : 'Claim ' + p.claim + ' ' + CLAIM[p.claim].label;
      return '<div class="a6" style="--card-bg:' + esc(cardColour(c.lens)) + '">' +
        '<div class="a6-eyebrow">Week 6 \u00b7 Claim wall \u00b7 New card' + (c.group ? ' \u00b7 ' + esc(c.group) : '') + '</div>' +
        '<div class="a6-bar"></div>' +
        '<div class="a6-title">' + esc(title) + '</div>' +
        '<div class="a6-lens">' + esc(LENS[c.lens].name) + ' card' + (p.hold ? '' : ' \u00b7 ' + esc(LENS[p.lens].name) + ' column') + '</div>' +
        '<div class="a6-text">' + esc(c.text) + '</div>' +
        '<div class="a6-foot">' + esc(CONFIG.newCard.source) + ' \u00b7 ' + esc(c.id) + '</div></div>';
    });
    var h = '';
    for (var i = 0; i < cards.length; i += 4) h += '<section class="a6-sheet">' + cards.slice(i, i + 4).join('') + '</section>';
    return h;
  }

  // ==========================================================================
  // UI (only runs when the page itself is open, not in test.html)
  // ==========================================================================
  var state = blankState();
  var ui = { connect: false, connectA: null, showOriginal: false, onlyDisputed: false, staged: [], stagedErrors: [], lastFocus: null };
  var els = {};
  var drag = null;
  var suppressClick = false;
  var drawQueued = false;
  var narrowMq = null;

  function byId(id) { return document.getElementById(id); }
  function isNarrow() { return narrowMq ? narrowMq.matches : false; }

  function save() {
    try {
      window.localStorage.setItem(CONFIG.storageKey, JSON.stringify(buildExport(state)));
      return true;
    } catch (e) {
      say('Could not save on this device (storage unavailable). Export your wall to keep it.');
      return false;
    }
  }
  function load() {
    try {
      var raw = window.localStorage.getItem(CONFIG.storageKey);
      if (!raw) return;
      var obj = JSON.parse(raw);
      if (!validateExport(obj).length) state = stateFromExport(obj);
    } catch (e) { /* start blank */ }
  }
  function say(msg) { els.status.textContent = msg; }
  function commit(msg) { save(); render(); if (msg) say(msg); }

  // ----- Rendering -----
  function cardHtml(id, linkNos) {
    var c = cardById(state, id);
    var isNew = !START[id];
    var moved = isMoved(state, id);
    var disputed = isDisputed(state, id);
    var cls = 'card' + (moved ? ' moved' : '') + (isNew ? ' new' : '') + (disputed ? ' disputed' : '') + (ui.connectA === id ? ' conn-a' : '');
    var label = id + ', ' + LENS[c.lens].name + ' card' + (isNew ? ', new' : '') + (moved ? ', moved from ' + cellName(originCell(state, id)) : '') + (disputed ? ', disputed' : '') + (START[id] && c.uncertain ? ', uncertain transcription' : '') + ': ' + c.text;
    var h = '<div class="' + cls + '" data-id="' + esc(id) + '" tabindex="0" role="button" aria-label="' + esc(label) + '" style="--card-bg:' + esc(cardColour(c.lens)) + ';--rot:' + rotationFor(id) + 'deg">';
    h += '<span class="pin" aria-hidden="true"></span>';
    if (isNew) h += '<span class="stamp stamp-new" aria-hidden="true">New</span>';
    if (disputed) h += '<span class="stamp stamp-disputed" aria-hidden="true">Disputed</span>';
    h += '<span class="card-lens" aria-hidden="true">' + esc(LENS[c.lens].name) + '</span>';
    h += '<p class="card-text" aria-hidden="true">' + cardTextHtml(c.text) + '</p>';
    h += '<span class="card-foot" aria-hidden="true"><span>' + esc(id) + '</span>';
    if (isNew && state.merge && c.group) h += '<span>' + esc(c.group) + '</span>';
    if (START[id] && c.uncertain) h += '<span class="chip uncertain" title="Uncertain transcription">Uncertain</span>';
    if (moved) h += '<span class="chip moved" title="Moved from ' + esc(cellName(originCell(state, id))) + '">Moved</span>';
    h += '</span>';
    if (linkNos && linkNos.length) h += '<span class="card-links" aria-hidden="true">Lines: ' + esc(linkNos.join(', ')) + '</span>';
    h += '</div>';
    return h;
  }
  function cellHtml(key, linkMap) {
    var ids = state.cells[key];
    var p = parseCell(key);
    var name = cellName(key);
    var h = '<section class="cell cork-tex' + (ids.length ? '' : ' empty') + '" data-cell="' + key + '" aria-label="' + esc(name) + ', ' + ids.length + (ids.length === 1 ? ' card' : ' cards') + '">';
    if (!p.hold) h += '<h3 class="cell-label"><span>' + esc(LENS[p.lens].name) + '</span></h3>';
    h += '<div class="cell-cards">';
    ids.forEach(function (id) { h += cardHtml(id, linkMap[id]); });
    if (ui.showOriginal) {
      allCardIds(state).forEach(function (id) {
        if (originCell(state, id) === key && findCell(state, id) !== key) {
          h += '<div class="ghost" aria-hidden="true">Originally here: ' + esc(id) + '<br>Now: ' + esc(cellName(findCell(state, id))) + '</div>';
        }
      });
    }
    h += '</div></section>';
    return h;
  }
  function renderBoard() {
    var linkMap = {};
    state.connections.forEach(function (c, i) {
      (linkMap[c.a] = linkMap[c.a] || []).push('L' + (i + 1));
      (linkMap[c.b] = linkMap[c.b] || []).push('L' + (i + 1));
    });
    var h = '<div class="wall">';
    h += '<div class="wall-corner cork-tex" aria-hidden="true"><span class="paper">Claim / lens</span></div>';
    CONFIG.lenses.forEach(function (l) {
      h += '<div class="lens-head cork-tex" aria-hidden="true"><span class="paper"><span class="swatch" style="background:' + esc(cardColour(l.id)) + '"></span>' + esc(l.name) + '</span></div>';
    });
    CONFIG.claims.forEach(function (cl) {
      h += '<div class="claim-slot cork-tex"><div class="claim-card" style="--claim-bg:' + esc(CONFIG.cardColours.claim) + ';--rot:' + rotationFor('claim-' + cl.no) + 'deg">' +
        '<span class="pin" aria-hidden="true"></span><h2 class="claim-no" style="font-size:0.68rem;margin:0">Claim ' + cl.no + '</h2>' +
        '<div class="claim-label">' + esc(cl.label) + '</div><p class="claim-text">' + esc(cl.text) + '</p></div></div>';
      CONFIG.lenses.forEach(function (l) { h += cellHtml(cellKey(cl.no, l.id), linkMap); });
    });
    h += '</div>';
    h += '<div class="hold"><div class="hold-head"><span class="paper">' + esc(CONFIG.holdingName) + '</span></div>' + cellHtml(HOLD, linkMap) + '</div>';
    h += '<svg class="strings" id="strings" aria-hidden="true"></svg><div class="tags" id="tags"></div>';
    els.board.innerHTML = h;
    els.board.classList.toggle('only-disputed', ui.onlyDisputed);
  }
  function excerpt(text, n) {
    var w = String(text).split(/\s+/);
    return w.length > n ? w.slice(0, n).join(' ') + '\u2026' : String(text);
  }
  function renderLinks() {
    var h = '<h2 id="links-title">Red lines</h2>';
    if (!state.connections.length) { els.links.innerHTML = h + '<p class="quiet">' + esc(CONFIG.text.noLinks) + '</p>'; return; }
    h += '<p class="quiet no-print">Each line as text, so the list can be read without the drawing.</p><ol class="link-list">';
    state.connections.forEach(function (c, i) {
      var a = cardById(state, c.a), b = cardById(state, c.b);
      var g = connGroups(state, c);
      h += '<li><span class="link-no">L' + (i + 1) + '</span><div class="link-body"><div><b>' + esc(c.a) + '</b> ' + esc(excerpt(a.text, 10)) + ' <b aria-label="linked with">\u2194</b> <b>' + esc(c.b) + '</b> ' + esc(excerpt(b.text, 10)) + '</div>';
      if (state.merge) {
        h += '<div class="groups">' + g.length + (g.length === 1 ? ' group' : ' groups') + ': ' + g.map(function (x) { return esc(x.group) + (x.label ? ' <span class="lbl">"' + esc(x.label) + '"</span>' : ''); }).join('; ') + '</div>';
      } else if (c.label) {
        h += '<div class="groups">Label: <span class="lbl">' + esc(c.label) + '</span></div>';
      }
      h += '</div><button type="button" class="btn btn-danger btn-small no-print" data-remove-link="' + esc(linkKey(c.a, c.b)) + '">Remove<span class="sr-only"> line L' + (i + 1) + '</span></button></li>';
    });
    els.links.innerHTML = h + '</ol>';
  }
  function renderMergePanel() {
    if (!state.merge) { els.mergePanel.innerHTML = ''; return; }
    var d = disputedIds(state).length;
    var h = '<div class="merge-panel"><b class="eyebrow" style="color:var(--char-3)">Merged wall</b> \u00b7 ' + state.merge.sources.length + ' group records \u00b7 ' + d + (d === 1 ? ' disputed card' : ' disputed cards') + '<ul>';
    state.merge.sources.forEach(function (r) {
      h += '<li>' + esc(r.group) + (r.members.length ? ' (' + esc(r.members.join(', ')) + ')' : '') + (r.exportedAt ? ' <span class="quiet">exported ' + esc(new Date(r.exportedAt).toLocaleString('en-GB')) + '</span>' : '') + '</li>';
    });
    els.mergePanel.innerHTML = h + '</ul></div>';
  }
  function renderChrome() {
    els.connectBtn.setAttribute('aria-pressed', ui.connect ? 'true' : 'false');
    els.originalBtn.setAttribute('aria-pressed', ui.showOriginal ? 'true' : 'false');
    if (!state.merge && ui.onlyDisputed) ui.onlyDisputed = false;
    els.disputedBtn.setAttribute('aria-pressed', ui.onlyDisputed ? 'true' : 'false');
    els.disputedBtn.disabled = !state.merge;
    els.banner.innerHTML = ui.connect
      ? '<div class="connect-banner" role="note"><span>' + esc(ui.connectA ? CONFIG.text.connectBannerB + ' (first: ' + ui.connectA + ')' : CONFIG.text.connectBannerA) + '</span><button type="button" class="btn btn-small" id="btn-connect-done">Done</button></div>'
      : '';
    var mem = membersList(state.group.members);
    els.printMeta.textContent = 'Group: ' + (String(state.group.name || '').trim() || '(no name)') + (mem.length ? ' \u00b7 Members: ' + mem.join(', ') : '') + ' \u00b7 Printed ' + new Date().toLocaleString('en-GB');
  }
  function render() {
    renderChrome();
    renderMergePanel();
    renderBoard();
    renderLinks();
    els.printCards.innerHTML = buildA6Html(state);
    queueDraw();
  }

  // ----- Strings -----
  function queueDraw() {
    if (drawQueued) return;
    drawQueued = true;
    window.requestAnimationFrame(function () { drawQueued = false; drawStrings(); });
  }
  function pinPoint(id, base) {
    var card = els.board.querySelector('.card[data-id="' + cssEsc(id) + '"]');
    if (!card || card.offsetParent === null) return null;
    var r = card.querySelector('.pin').getBoundingClientRect();
    return { x: r.left + r.width / 2 - base.left, y: r.top + r.height / 2 - base.top };
  }
  function cssEsc(s) { return String(s).replace(/["\\]/g, '\\$&'); }
  function drawStrings() {
    var svg = byId('strings'), tags = byId('tags');
    if (!svg || !tags) return;
    var base = els.board.getBoundingClientRect();
    svg.setAttribute('width', els.board.offsetWidth);
    svg.setAttribute('height', els.board.offsetHeight);
    var s = '', t = '';
    state.connections.forEach(function (c, i) {
      var p = pinPoint(c.a, base), q = pinPoint(c.b, base);
      if (!p || !q) return;
      var key = linkKey(c.a, c.b);
      var n = connCount(state, c);
      var w = Math.min(9, 3.5 + (n - 1) * 1.5);
      var len = Math.sqrt((q.x - p.x) * (q.x - p.x) + (q.y - p.y) * (q.y - p.y));
      var cx = (p.x + q.x) / 2, cy = (p.y + q.y) / 2 + Math.min(36, len * 0.08);
      var d = 'M' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ' Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + q.x.toFixed(1) + ' ' + q.y.toFixed(1);
      s += '<path d="' + d + '" fill="none" stroke="rgba(42,31,24,0.55)" stroke-width="' + (w + 2) + '" stroke-linecap="round"/>';
      s += '<path d="' + d + '" fill="none" style="stroke:var(--string)" stroke-width="' + w + '" stroke-linecap="round"/>';
      s += '<path class="hit" data-link="' + esc(key) + '" d="' + d + '" fill="none" stroke="transparent" stroke-width="16"/>';
      var mx = (p.x + 2 * cx + q.x) / 4, my = (p.y + 2 * cy + q.y) / 4;
      var g = connGroups(state, c);
      var labels = g.map(function (x) { return x.label; }).filter(Boolean).filter(function (x, j, a) { return a.indexOf(x) === j; });
      var txt = labels.length === 1 ? labels[0] : '';
      if (n > 1) txt = (txt ? txt + ' \u00b7 ' : '') + n + ' groups';
      var aria = 'Red line L' + (i + 1) + ' between ' + c.a + ' and ' + c.b + (state.merge ? ', ' + n + (n === 1 ? ' group' : ' groups') : '') + (txt && !state.merge ? ', ' + txt : '');
      t += '<button type="button" class="knot' + (txt ? '' : ' empty') + '" data-link="' + esc(key) + '" style="left:' + mx.toFixed(1) + 'px;top:' + my.toFixed(1) + 'px" aria-label="' + esc(aria) + '">' + esc(txt) + '</button>';
    });
    svg.innerHTML = s;
    tags.innerHTML = t;
  }
  function tipText(key) {
    var c = connByKey(state, key);
    if (!c) return '';
    var g = connGroups(state, c);
    var head = c.a + ' \u2194 ' + c.b;
    if (!state.merge) return head + (c.label ? '\n' + c.label : '');
    return head + '\n' + g.map(function (x) { return x.group + (x.label ? ': "' + x.label + '"' : ': (no label)'); }).join('\n');
  }
  function showTip(key, x, y) {
    var txt = tipText(key);

  // ----- Merge dialog -----
  function openMergeDialog() {

  function renderMergeDialog() {
    var h = '<h2 id="dlg-merge-title">Merge group files</h2>';
    h += '<p class="quiet">Choose the groups\u2019 exported files, several at once or one at a time. The files themselves are never changed. A merged wall can be merged again with a late group\u2019s file.</p>';
    h += '<div class="field"><label for="merge-files">Group files (.json)</label><input type="file" id="merge-files" accept="application/json,.json" multiple style="min-height:44px"></div>';

      h += '</ul>';
    }

    if (!ui.staged.length) h += '<p class="quiet">No files chosen yet.</p>';
    else {
      h += '<ul class="file-list">';
      ui.staged.forEach(function (s, i) {
        var groups = groupsInFile(s.obj);
        h += '<li><span><b>' + esc(s.obj.group.name || '(no group name)') + '</b>' + (s.obj.merge ? ' <span class="quiet">(merged wall: ' + esc(groups.join(', ')) + ')</span>' : '') + '<br><span class="quiet">' + esc(s.fileName) + (s.obj.exportedAt ? ' \u00b7 exported ' + esc(new Date(s.obj.exportedAt).toLocaleString('en-GB')) : '') + '</span></span>' +
          '<button type="button" class="btn btn-danger btn-small" data-unstage="' + i + '">Remove<span class="sr-only"> ' + esc(s.obj.group.name) + '</span></button></li>';
      });
      h += '</ul>';
    }
    h += '<p class="alert" id="merge-err" role="alert"></p>';
    h += '<div class="dlg-actions"><button type="button" class="btn btn-accent" data-act="merge"' + (ui.staged.length ? '' : ' disabled') + '>Merge ' + ui.staged.length + (ui.staged.length === 1 ? ' file' : ' files') + '</button><button type="button" class="btn btn-ghost" data-act="cancel">Cancel</button></div>';
    els.dlgMergeBody.innerHTML = h;
  }
  function readFiles(fileList, cb) {
    var files = Array.prototype.slice.call(fileList || []);
    var out = new Array(files.length);
    var left = files.length;
    if (!left) return cb([]);
    files.forEach(function (f, i) {
      var r = new FileReader();
      r.onload = function () { out[i] = { name: f.name, text: String(r.result) }; if (--left === 0) cb(out); };
      r.onerror = function () { out[i] = { name: f.name, text: null }; if (--left === 0) cb(out); };
      r.readAsText(f);
    });
  }
  function parseFile(f) {
    if (f.text == null) return { errors: [f.name + ': could not be read.'] };
    var obj;
    try { obj = JSON.parse(f.text); } catch (e) { return { errors: [f.name + ': not a JSON file. Nothing was changed.'] }; }
    var v = validateExport(obj);
    if (v.length) return { errors: v.map(function (m) { return f.name + ': ' + m; }) };
    return { obj: obj };
  }
  function stageFiles(fileList) {
    readFiles(fileList, function (files) {
      ui.stagedErrors = [];
      files.forEach(function (f) {
        var p = parseFile(f);
        if (p.errors) { ui.stagedErrors = ui.stagedErrors.concat(p.errors); return; }
        var have = {};
        ui.staged.forEach(function (s) { groupsInFile(s.obj).forEach(function (g) { have[normName(g)] = true; }); });
        var dup = groupsInFile(p.obj).filter(function (g) { return have[normName(g)]; });
        if (dup.length) { ui.stagedErrors.push(f.name + ': group "' + dup.join('", "') + '" is already in the merge. Remove the other file first.'); return; }
        ui.staged.push({ fileName: f.name, obj: p.obj });
      });
      renderMergeDialog();
      var inp = byId('merge-files'); if (inp) inp.focus();
    });
  }
  function onMergeDialogClick(e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var un = btn.getAttribute('data-unstage');
    if (un != null) { ui.staged.splice(+un, 1); ui.stagedErrors = []; renderMergeDialog(); byId('merge-files').focus(); return; }
    var act = btn.getAttribute('data-act');
    if (act === 'cancel') { closeDialog(els.dlgMerge); return; }
    if (act === 'merge') {
      var res = mergeFiles(ui.staged.map(function (s) { return s.obj; }), state.group);
      if (res.errors.length) { byId('merge-err').textContent = res.errors.join(' '); return; }
      var names = res.state.merge.sources.map(function (r) { return r.group; });
      if (!window.confirm('Replace the current wall with the merged wall of ' + names.length + ' group records (' + names.join(', ') + ')? Export the current wall first if you want to keep it.')) return;
      state = res.state;

      var d = disputedIds(state).length;
      var warn = state.group.name && names.some(function (n) { return normName(n) === normName(state.group.name); }) ? ' Give this merged wall its own name (for example "Class wall") before exporting.' : '';
      commit('Merged ' + names.join(', ') + '. ' + d + (d === 1 ? ' card is' : ' cards are') + ' disputed.' + warn);
    }
  }

  // ----- Drag and drop (pointer events: mouse, touch, pen) -----
  function onPointerDown(e) {
    if (e.button > 0 || isNarrow() || ui.connect) return;
    var card = e.target.closest('.card');
    if (!card || !els.board.contains(card)) return;
    drag = { id: card.getAttribute('data-id'), card: card, x: e.clientX, y: e.clientY, pid: e.pointerId, started: false, float: null, target: null, index: null };
    try { card.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }
  function onPointerMove(e) {
    if (!drag || e.pointerId !== drag.pid) return;
    if (!drag.started) {
      if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) < 6) return;
      drag.started = true;
      var r = drag.card.getBoundingClientRect();
      drag.dx = e.clientX - r.left; drag.dy = e.clientY - r.top;
      var f = drag.card.cloneNode(true);
      f.removeAttribute('tabindex'); f.removeAttribute('role'); f.setAttribute('aria-hidden', 'true');
      f.classList.add('drag-float');
      f.style.width = drag.card.offsetWidth + 'px';
      document.body.appendChild(f);
      drag.float = f;
      drag.card.classList.add('dragging');
      hideTip();
    }
    e.preventDefault();
    drag.float.style.left = (e.clientX - drag.dx) + 'px';
    drag.float.style.top = (e.clientY - drag.dy) + 'px';
    var under = document.elementFromPoint(e.clientX, e.clientY);
    var cell = under ? under.closest('.cell') : null;
    if (cell && !els.board.contains(cell)) cell = null;
    if (drag.target && drag.target !== cell) drag.target.classList.remove('drop-target');
    drag.target = cell;
    if (cell) { cell.classList.add('drop-target'); drag.index = dropIndex(cell, e.clientX, e.clientY); }
    if (e.clientY < 50) window.scrollBy(0, -14); else if (e.clientY > window.innerHeight - 50) window.scrollBy(0, 14);
  }
  function dropIndex(cell, x, y) {
    var cards = Array.prototype.slice.call(cell.querySelectorAll('.card')).filter(function (c) { return c !== drag.card; });
    for (var i = 0; i < cards.length; i++) {
      var r = cards[i].getBoundingClientRect();
      if (y < r.top) return i;
      if (y <= r.bottom && x < r.left + r.width / 2) return i;
    }
    return cards.length;
  }
  function endDrag(e, cancelled) {
    if (!drag || (e && e.pointerId !== drag.pid)) return;
    var d = drag;
    drag = null;
    if (!d.started) return;
    suppressClick = true;
    window.setTimeout(function () { suppressClick = false; }, 0);
    if (d.float && d.float.parentNode) d.float.parentNode.removeChild(d.float);
    d.card.classList.remove('dragging');
    if (d.target) d.target.classList.remove('drop-target');
    if (cancelled || !d.target) { queueDraw(); return; }
    var to = d.target.getAttribute('data-cell');
    var from = findCell(state, d.id);
    // index among the cell's cards excluding the dragged one
    var list = state.cells[to].filter(function (x) { return x !== d.id; });
    var before = list[d.index];
    var idx = before ? state.cells[to].indexOf(before) : state.cells[to].length;
    if (moveCard(state, d.id, to, idx)) commit(from === to ? d.id + ' reordered.' : d.id + ' moved to ' + cellName(to) + '.');
    else queueDraw();
    restoreFocus(d.id);
  }

  function onBoardClick(e) {
    if (suppressClick) return;
    var knot = e.target.closest('[data-link]');
    if (knot) { openLineDialog(knot.getAttribute('data-link')); return; }
    var card = e.target.closest('.card');
    if (!card) return;
    var id = card.getAttribute('data-id');
    if (ui.connect) connectPick(id); else openCardDialog(id);
  }
  function onBoardKey(e) {
    var card = e.target.closest('.card');
    if (!card) return;
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      var id = card.getAttribute('data-id');
      if (ui.connect) connectPick(id); else openCardDialog(id);
    }
  }

  // ----- Toolbar actions -----
  function download(name, text) {
    var blob = new Blob([text], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    window.setTimeout(function () { URL.revokeObjectURL(url); a.parentNode.removeChild(a); }, 500);
  }
  function doExport() {
    var errs = exportBlockers(state);
    if (errs.length) { say(errs.join(' ')); byId('grp-name').focus(); return; }
    var obj = buildExport(state);
    var slug = obj.group.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'group';
    var t = obj.exportedAt.replace(/[-:]/g, '').replace('T', '-').slice(0, 13);
    download('claim-wall-' + slug + '-' + t + '.json', JSON.stringify(obj, null, 2));
    say('Exported ' + obj.group.name + '.');
  }
  function doImport(fileList) {
    readFiles(fileList, function (files) {
      if (!files.length) return;
      var p = parseFile(files[0]);
      if (p.errors) { say(p.errors.join(' ')); return; }
      if (!window.confirm('Replace the current wall with "' + (p.obj.group.name || files[0].name) + '"? Export the current wall first if you want to keep it.')) { say('Import cancelled. Nothing was changed.'); return; }
      state = stateFromExport(p.obj);
      ui.connectA = null;
      syncGroupFields();
      commit('Imported ' + (p.obj.group.name || files[0].name) + '.');
    });
  }
  function doCopy() {
    var text = buildText(state);
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      say(ok ? 'Copied the wall as text.' : 'Copy failed: your browser blocked the clipboard.');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { say('Copied the wall as text.'); }, fallback);
    } else fallback();
  }
  function doReset() {
    if (!window.confirm('Reset the wall? Every move, new card, red line and merge on this device will be lost. Export first if you want to keep it.')) return;
    state = blankState();
    ui.connect = false; ui.connectA = null; ui.onlyDisputed = false; ui.showOriginal = false;
    syncGroupFields();
    commit('Wall reset to the starting cards.');
  }
  function syncGroupFields() {
    byId('grp-name').value = state.group.name || '';
    byId('grp-members').value = state.group.members || '';
  }

  function init() {
    els = {
      board: byId('board'), links: byId('links-panel'), status: byId('status'), banner: byId('connect-banner'),
      mergePanel: byId('merge-panel'), tip: byId('tip'), printCards: byId('print-cards'), printMeta: byId('cws-print-meta'),
      connectBtn: byId('btn-connect'), originalBtn: byId('btn-original'), disputedBtn: byId('btn-disputed'),
      dlgCard: byId('dlg-card'), dlgCardBody: byId('dlg-card-body'), dlgAdd: byId('dlg-add'), dlgAddBody: byId('dlg-add-body'),
      dlgLink: byId('dlg-link'), dlgLinkBody: byId('dlg-link-body'), dlgMerge: byId('dlg-merge'), dlgMergeBody: byId('dlg-merge-body')
    };
    byId('cws-eyebrow').textContent = CONFIG.text.eyebrow;
    byId('cws-title').textContent = CONFIG.text.title;
    byId('cws-lede').textContent = CONFIG.text.lede;
    narrowMq = window.matchMedia('(max-width: ' + (CONFIG.narrowBreakpoint - 0.02) + 'px)');
    load();
    syncGroupFields();

    var grpName = byId('grp-name'), grpMembers = byId('grp-members');
    grpName.oninput = function () { state.group.name = grpName.value; save(); renderChrome(); renderMergePanel(); renderLinks(); };
    grpMembers.oninput = function () { state.group.members = grpMembers.value; save(); renderChrome(); };

    byId('btn-add').onclick = openAddDialog;
    els.connectBtn.onclick = function () { setConnect(!ui.connect); };
    els.originalBtn.onclick = function () { ui.showOriginal = !ui.showOriginal; render(); say(ui.showOriginal ? 'Showing where moved cards started.' : 'Original places hidden.'); };
    els.disputedBtn.onclick = function () { ui.onlyDisputed = !ui.onlyDisputed; render(); say(ui.onlyDisputed ? 'Showing disputed cards only (' + disputedIds(state).length + ').' : 'Showing all cards.'); };
    byId('btn-merge').onclick = openMergeDialog;
    byId('btn-export').onclick = doExport;
    var importInput = byId('import-file');
    byId('btn-import').onclick = function () { importInput.value = ''; importInput.click(); };
    importInput.onchange = function () { doImport(importInput.files); };
    byId('btn-copy').onclick = doCopy;
    byId('btn-print').onclick = function () { renderChrome(); window.print(); };
    byId('btn-reset').onclick = doReset;
    els.banner.onclick = function (e) { if (e.target.closest('#btn-connect-done')) { setConnect(false); els.connectBtn.focus(); } };

    els.board.onclick = onBoardClick;
    els.board.onkeydown = onBoardKey;
    els.board.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove, { passive: false });
    window.addEventListener('pointerup', function (e) { endDrag(e, false); });
    window.addEventListener('pointercancel', function (e) { endDrag(e, true); });
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && drag && drag.started) { endDrag({ pointerId: drag.pid }, true); }
      else if (e.key === 'Escape' && ui.connect && !document.querySelector('dialog[open]')) { setConnect(false); els.connectBtn.focus(); }
    });
    els.board.addEventListener('mouseover', function (e) { var k = e.target.closest('[data-link]'); if (k) showTip(k.getAttribute('data-link'), e.clientX, e.clientY); });
    els.board.addEventListener('mouseout', function (e) { if (e.target.closest('[data-link]')) hideTip(); });
    els.board.addEventListener('focusin', function (e) {
      var k = e.target.closest('.knot');
      if (!k) return;
      var r = k.getBoundingClientRect();
      showTip(k.getAttribute('data-link'), r.left, r.bottom);
    });
    els.board.addEventListener('focusout', hideTip);

    els.links.onclick = function (e) {
      var b = e.target.closest('[data-remove-link]');
      if (b) { confirmRemoveLink(b.getAttribute('data-remove-link')); var h = byId('links-title'); if (h) { h.setAttribute('tabindex', '-1'); h.focus(); } }
    };
    els.dlgCardBody.onclick = onCardDialogClick;
    els.dlgAddBody.onclick = onAddDialogClick;
    els.dlgAddBody.oninput = updateAddCount;
    els.dlgAddBody.onchange = updateAddCount;
    els.dlgLinkBody.onclick = onLinkDialogClick;
    els.dlgLinkBody.oninput = updateLinkCount;
    els.dlgLinkBody.onkeydown = function (e) {
      if (e.key === 'Enter' && e.target.id === 'link-label') { e.preventDefault(); var b = els.dlgLinkBody.querySelector('[data-act="addlink"]'); if (b && !b.disabled) b.click(); }
    };
    els.dlgMergeBody.onclick = onMergeDialogClick;
    els.dlgMergeBody.onchange = function (e) { if (e.target.id === 'merge-files') stageFiles(e.target.files); };
    [els.dlgLink].forEach(function (d) {
      d.addEventListener('close', function () { if (ui.connect && els.dlgLinkBody.dataset.mode === 'add') { ui.connectA = null; render(); } });
    });

    window.addEventListener('resize', queueDraw);
    window.addEventListener('scroll', queueDraw, { passive: true });
    if (window.ResizeObserver) new window.ResizeObserver(queueDraw).observe(els.board);
    if (narrowMq.addEventListener) narrowMq.addEventListener('change', render);
    window.addEventListener('beforeprint', renderChrome);
    render();
  }

  // Test hook: pure functions and CONFIG exposed for test.html.
  window.CWS = {
    CONFIG: CONFIG,
    CELL_KEYS: CELL_KEYS,
    cellKey: cellKey,
    cellName: cellName,
    blankState: blankState,
    findCell: findCell,
    originCell: originCell,
    isMoved: isMoved,
    moveCard: moveCard,
    pickCell: pickCell,
    addNewCard: addNewCard,
    deleteNewCard: deleteNewCard,
    validateNewCard: validateNewCard,
    addConnection: addConnection,
    removeConnection: removeConnection,
    connCount: connCount,
    linkKey: linkKey,
    buildExport: buildExport,
    exportBlockers: exportBlockers,
    validateExport: validateExport,
    stateFromExport: stateFromExport,
    mergeFiles: mergeFiles,
    votesFor: votesFor,
    majorityFor: majorityFor,
    isDisputed: isDisputed,
    disputedIds: disputedIds,
    buildText: buildText,
    buildA6Html: buildA6Html,
    rotationFor: rotationFor,
    cardTextHtml: cardTextHtml,
    wordCount: wordCount
  };

  if (document.getElementById('cws-app')) init();
})();
</script>
