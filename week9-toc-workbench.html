  WEEKS 9-13 - BODØ THEORY OF CHANGE (WORKBENCH)
  Social Phenomena Challenge, INTERVENE phase (weeks 9-13). Activity 15.

  One workbench, used by each group on one device for five weeks. It builds the
  Theory of Change behind the group's recommendation to the client: that the
  club create a community third place in its new stadium. Plan:
  toc_buildplan.md. Build prompts: toc_build_prompts.md.

  BUILD STAGE: 2 of 5 (core, week 9 and week 10 screens). Screens 7-14 show
  "Arrives in week N" with their reading until their stage is built. Later
  stages add screens, output sections and A6 card types; they do not change
  the state shape below except by adding defaults through migrate(). Stage 2
  added "beliefs", "sweep", evidence "factId" and Reverse Import "absent".
  Stage 3 locks screens 7-9 on designGate(state): every outcome reaches the
  long-term outcome, every arrow has a rationale, every belief is sorted.

  Core reading (page numbers refer to the course PDFs):
    [TC]  Taplin, D. H. & Clark, H. (2012). Theory of Change Basics: A Primer
          on Theory of Change. New York: ActKnowledge. Course copy ToCBasics.pdf
    [GAF] Government Analysis Function, Evaluation Support Team. The Theory of
          Change Process - Guidance for Outcome Delivery Plans. Course copy
          ToCgov.pdf (saved 17 September 2026). Online:
          https://analysisfunction.civilservice.gov.uk/policy-store/the-analysis-function-theory-of-change-toolkit/
    [A7]  Course deck "Theory of Change" (Activity 7): theory-of-change.html

  THE CLIENT BRIEF IS CONFIDENTIAL. It is never stored in this file, quoted,
  summarised or embedded. The tool refers to it only as "the client brief (on
  the VLE)". Students type what they use from it, in their own words, with the
  slide number; every brief-derived entry requires a slide number.

  No scores. The gates check that each part is complete; they never judge
  whether an answer is right.

  ============================================================================
  RUN SHEET, WEEK 9 (90 minutes, groups of 3-5, one device per group)
  ============================================================================
   0-12  Deck (week9-toc-deck.html). Screen 1: group, members, week 9 roles;
         load the week 7 export if you have it.
  12-30  Screen 2: the client's intended impact, with the brief open.
  30-50  Screen 3: problem statement, then the long-term outcome.
  50-60  Screen 3: definitions and the accountability ceiling.
  60-83  Screen 4: stakeholders.
  83-90  Week 9 close: self-check, print the long-term outcome card, export.

  RUN SHEET, WEEK 10 (90 minutes)
   0-12  Deck (week 10). Screen 5: rotate roles for week 10.
  12-45  Screen 5: backwards map, at least two pathways; clusters; tag each
         outcome by lens and characteristic.
  45-65  Screens 5-6: a rationale on every arrow; every belief through the
         sorter. The Sceptic leads.
  65-80  Screen 6: evidence, rated on the week 6 criteria; Reverse Import.
  80-90  Screen 6: completeness pass; week 10 self-check; export.

  THE BACKWARDS MAP (screen 5). The long-term outcome is node "lto" (its text
  is lto.text). An outcome's "leadsTo" lists the outcomes, clusters or "lto"
  it is needed for (arrows run upwards). An outcome in a cluster has no
  arrows of its own; the cluster's single "leadsTo" carries them ([TC] p. 4).
  "links" is derived from the leadsTo lists by syncLinks(): one link per
  arrow, keeping its rationale and evidence while the arrow exists. Loops
  are refused. The diagram is laid out by layoutMap(): each outcome one row
  below the highest outcome it leads to; arrows that skip rows pass through
  a reserved gap in every row they cross.

  INPUT: WEEK 7 EXPORT (optional, screen 1)
  ============================================================================
  "Load week 7 export" accepts a file from week7-bodo-decline.html (tool

  ============================================================================
  EXPORT JSON  (tool "toc-workbench", schemaVersion 1)
  ============================================================================
  {
    "tool": "toc-workbench",                     REQUIRED, constant
    "schemaVersion": 1,                          REQUIRED
    "exportedAt": "ISO 8601 timestamp",
    "exportId": "string",                        = state.meta.exportId; fixed
                                                 for the life of the group's work
    "group": { "name": "string", "members": ["string", ...] }   cleaned copy
    "state": {                                   REQUIRED; used verbatim on
                                                 re-import, after migrate()
      "meta":   { "exportId": "string", "createdAt": "ISO" },
      "group":  { "name": "string", "members": ["string" x up to 5, as typed] },
      "roles":  { "week9".."week13": { "<roleId>": "memberName" } }
                roleId = facilitator | scribe | sceptic | evidence | timekeeper.
                Keyed by role, so one member may hold two roles in a group of 3.
      "imported": { "week7": null | { "group": "string", "exportedAt": "ISO",
                    "importedAt": "ISO", "sentences": [ { "member", "text" } ] } },
      "clientTheory": {                          screen 2 (week 9)
        "claims": [ { "id", "text", "slide" } ], slide = string of digits
        "ambition": "string", "ambitionSlide": "string",
        "order": [ "claimId", ... ],             the causal chain, first to last
        "linkEvidence": { "<fromId>><toId>": "given" | "not" },
        "whoseCommunity": "string" },
      "problem": { "statement", "claims": ["SUPPLY"|"USE"|"QUALITY"|"OUTCOME"],
                   "where", "forWhom" },         screen 3
      "lto": { "text", "lintReason",             lintReason = why a flagged
               "definitions": [ { "term", "meaning" } ],    word is kept
               "ceiling": { "ultimateGoal", "ambitionPosition": ""|"above"|"at"|"below",
                            "reason" } },
      "stakeholderQuestions": { "q1".."q8": "string" },     optional notes
      "stakeholders": [ { "id", "name", "fromBrief": bool, "slide",
                          "affected": ""|"yes"|"no", "influence": ""|"low"|"medium"|"high",
                          "interest": ""|"low"|"medium"|"high",
                          "canWeAsk": ""|"yes"|"no" } ],    screen 4
      LATER STAGES (present and empty from week 9 onwards):

      "beliefs": [ { "id", "text", "screen": 5|6, "at": ISO,       (stage 2)

<style>
  :root {
    --bg: #F2DFBE;
    --bg-card: #FFFAF2;
    --bg-deep: #E8D2A8;
    --text: #2A1F18;
    --text-muted: #6A5A48;

    --char-1: #5C3A96;
    --char-2: #B52838;
    --char-3: #C85218;
    --char-4: #D4A020;
    --char-5: #7A5828;
    --char-6: #B83068;

    --ambiguous: #B98A10;

  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;

  }

  .app-wrap { max-width: 1180px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }

  h1 {

  }

    font-size: clamp(1.2rem, 2.4vw, 1.6rem); font-weight: 800; text-transform: uppercase;

  .quiet { color: var(--text-muted); font-size: 0.88rem; }

  /* ── Page header with house geometry ── */

  }

  .runsheet .t { font-weight: 800; color: var(--char-5); }

  /* ── Buttons ── */
  .btn {

    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
    transition: background-color 0.15s ease, color 0.15s ease, transform 0.15s ease, border-color 0.2s ease;
  }
  .btn:active { transform: translateY(0); }
  .btn-primary { background: var(--char-1); color: #fff; }
  .btn-primary:hover { background: var(--char-2); transform: translateY(-2px); }
  .btn-accent { background: var(--char-6); color: #fff; }
  .btn-accent:hover { background: var(--char-2); transform: translateY(-2px); }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--text); }
  .btn-ghost:hover { background: var(--text); color: var(--bg); transform: translateY(-2px); }
  .btn-danger { background: transparent; color: var(--incorrect); border-color: var(--incorrect); }
  .btn-danger:hover { background: var(--incorrect); color: #fff; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-primary:disabled:hover { background: var(--char-1); }
  .btn-ghost:disabled:hover { background: transparent; color: var(--text); }
  .btn-small { min-height: 44px; min-width: 44px; padding: 0.4rem 0.6rem; font-size: 0.7rem; }

  /* ── Layout: rail, main, side panel ── */
  .rail { margin: 0.5rem 0 1rem; display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; }
  .rail-week { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .rail-week .wk {

    padding: 0 0.4rem 0 0; color: var(--text-muted);
  }
  .rail-btn {
    font: inherit; min-width: 44px; min-height: 44px; padding: 0 0.6rem; border-radius: 0; cursor: pointer;
    border: 2px solid var(--border); background: var(--bg-card); color: var(--text);
    font-size: 0.78rem; font-weight: 800; letter-spacing: 0.06em;
    display: inline-flex; align-items: center; gap: 0.35rem;
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .rail-btn .pip { width: 8px; height: 8px; background: var(--border); display: inline-block; }
  .rail-btn.done .pip { background: var(--correct); }
  .rail-btn.later { border-style: dashed; color: var(--text-muted); }
  .rail-btn[aria-current="page"] { background: var(--rail-colour); border-color: var(--rail-colour); color: var(--rail-ink, #fff); }
  .rail-btn[aria-current="page"] .pip { background: #fff; }
  .rail-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 1.25rem; align-items: start; }
  .side { position: sticky; top: 0.75rem; max-height: calc(100vh - 1.5rem); overflow-y: auto; }

  /* ── Panels ── */
  .panel {
    position: relative; overflow: hidden;
    background: var(--bg-card); border: 2px solid var(--border); border-top: 6px solid var(--panel-colour, var(--char-1));
    padding: 1.25rem 1.5rem; margin-bottom: 1rem;
  }
  .panel::after {
    content: ''; position: absolute; width: 150px; height: 150px; border-radius: 50%;
    background: var(--panel-colour, var(--char-1)); opacity: 0.07; right: -40px; bottom: -50px; pointer-events: none;
  }
  .panel > * { position: relative; z-index: 1; }
  .panel-eyebrow { color: var(--panel-ink, var(--panel-colour, var(--char-1))); margin-bottom: 0.2rem; }

  }

    opacity: 0.18; right: 24px; top: -30px; pointer-events: none;
  }
  .banner h2 { color: inherit; margin: 0; }
  .banner p { margin: 0.3rem 0 0; max-width: 820px; }
  .notice {
    font-size: 0.92rem; font-weight: 600; padding: 0.65rem 0.9rem; margin-bottom: 1rem;
    background: rgba(181,40,56,0.08); border-left: 6px solid var(--char-2);
  }

  .part { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 15rem); gap: 1rem; padding: 1rem 0; border-top: 4px solid var(--part-colour, var(--border)); }

  .guide {
    font-size: 0.85rem; line-height: 1.45; padding: 0.65rem 0.8rem; align-self: start;
    background: rgba(92,58,150,0.08); border-left: 5px solid var(--char-1);
  }
  .guide .k { display: block; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--char-1); margin-bottom: 0.25rem; }
  .guide q { quotes: '\201C' '\201D'; }
  .guide cite { display: block; font-style: normal; font-weight: 700; margin-top: 0.3rem; font-size: 0.78rem; }

  .field { margin-bottom: 0.85rem; }
  .field > label, .field .label, fieldset legend {
    display: block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.25rem;
  }
  fieldset { border: 0; min-width: 0; margin-bottom: 0.85rem; }
  input[type="text"], textarea, select {
    width: 100%; font: inherit; font-size: 0.95rem; color: var(--text);
    background: #fff; border: 2px solid var(--border); border-radius: 0;
    padding: 0.5rem 0.65rem; min-height: 44px;

  input.slide { width: 6rem; }
  textarea { min-height: 80px; resize: vertical; }

  .word-count.ok { color: var(--correct); }

  .warn {
    font-size: 0.85rem; margin-top: 0.35rem; padding: 0.4rem 0.6rem;
    background: var(--ambiguous-bg); border-left: 5px solid var(--ambiguous);
  }
  .warn:empty { display: none; }
  .warn ul { margin: 0.2rem 0 0 1.1rem; }
  .row { display: flex; flex-wrap: wrap; gap: 0.5rem 0.75rem; align-items: flex-end; }
  .row > .grow { flex: 1 1 14rem; min-width: 0; }
  .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 1rem; }

  /* Choice chips (radio and checkbox) */
  .choices { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .choice { position: relative; display: inline-flex; }
  .choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .choice > span {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0.4rem 0.8rem;
    border: 2px solid var(--border); background: #fff; cursor: pointer;
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .choice input:checked + span { background: var(--choice-colour, var(--char-1)); border-color: var(--choice-colour, var(--char-1)); color: var(--choice-ink, #fff); }
  .choice input:focus-visible + span { outline: 3px solid var(--char-4); outline-offset: 2px; }
  .choice.block { flex: 1 1 220px; }
  .choice.block > span { width: 100%; text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 0.9rem; border-left: 6px solid var(--choice-colour, var(--char-1)); }

  /* Item cards (claims, definitions, stakeholders) */
  .item {
    background: #fff; border: 2px solid var(--border); border-left: 6px solid var(--item-colour, var(--char-1));
    padding: 0.85rem 1rem; margin-bottom: 0.75rem;
  }
  .item-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
  .item-head .tag {
    display: inline-flex; align-items: center; justify-content: center; min-width: 2rem; height: 2rem; padding: 0 0.4rem;
    background: var(--item-colour, var(--char-1)); color: #fff; font-weight: 800; font-size: 0.8rem;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .item-head .grow { flex: 1 1 auto; }
  .chain { list-style: none; counter-reset: chain; }
  .chain-card {
    background: #fff; border: 2px solid var(--text); border-left: 8px solid var(--char-2);
    padding: 0.6rem 0.75rem; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; align-items: center;
  }
  .chain-card .txt { font-weight: 600; }
  .chain-card .meta { display: block; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }
  .chain-card .ctl { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .chain-link { padding: 0.5rem 0 0.5rem 1.5rem; margin-left: 1rem; border-left: 4px dashed var(--char-2); }
  .chain-link .label { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.25rem; }
  .unplaced { margin-top: 0.75rem; }

  /* Facts and drafts */
  details.drawer { border: 2px solid var(--border); background: #fff; margin-bottom: 0.85rem; }
  details.drawer > summary {
    cursor: pointer; min-height: 44px; display: flex; align-items: center; padding: 0.4rem 0.8rem;
    font-size: 0.74rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
  }
  details.drawer > div { padding: 0 0.8rem 0.8rem; }
  .fact { padding: 0.5rem 0; border-top: 2px solid var(--border); font-size: 0.88rem; }
  .fact b { display: block; }
  .fact .src { color: var(--text-muted); font-size: 0.78rem; }

  .draft .who { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }

  /* Gate */
  .gate { margin-top: 1rem; padding: 0.85rem 1rem; background: rgba(92,58,150,0.08); border-left: 6px solid var(--char-1); }
  .gate h3 { color: var(--char-1); }
  .gate ul { list-style: none; margin-bottom: 0.6rem; }

  .gate li.ok { color: var(--text-muted); }
  .gate li.ok::before { background: var(--correct); }
  .gate li.bad { color: var(--incorrect); font-weight: 700; }
  .gate.passed { background: var(--correct-bg); border-left-color: var(--correct); }
  .gate.passed h3 { color: var(--correct); }

  /* Week close */
  .closed-box { background: var(--correct-bg); border-left: 5px solid var(--correct); padding: 1rem 1.25rem; margin-top: 1rem; }
  .q-block { margin-bottom: 1rem; }
  .q-block q { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; quotes: '\201C' '\201D'; }

  /* Side panel */
  .side-sec { background: var(--bg-card); border: 2px solid var(--border); border-left: 6px solid var(--sec-colour, var(--char-1)); margin-bottom: 0.75rem; }

    cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.8rem;
    font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sec-ink, var(--text));
  }

  .refs li b { color: var(--char-1); }

  .fof-item .src { display: block; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--char-5); }
  .count-badge { display: inline-flex; min-width: 1.6rem; height: 1.4rem; align-items: center; justify-content: center; padding: 0 0.3rem; background: var(--char-1); color: #fff; font-size: 0.7rem; }
  .roles-now li { padding: 0.2rem 0; }
  .roles-now b { display: inline-block; min-width: 7.5rem; }

  /* Later screens */
  .later-box { border: 3px dashed var(--panel-colour, var(--char-1)); padding: 1.25rem 1.5rem; background: var(--bg-card); }

  .role-row { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr); gap: 0.5rem 1rem; align-items: center; padding: 0.5rem 0; border-top: 2px solid var(--border); }

  .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
  .err-list { list-style: none; margin-top: 0.5rem; }
  .err-list li { font-size: 0.85rem; color: var(--incorrect); font-weight: 700; }

  /* A6 card previews */
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; margin-top: 0.75rem; }
  .a6 {
    display: flex; flex-direction: column; background: #fff; border: 2px dashed #8A7A62; padding: 1rem 1.1rem;
    aspect-ratio: 105 / 148; overflow: hidden;
  }
  .a6-eyebrow { font-size: 0.66rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #4A3828; }
  .a6-bar { height: 10px; margin: 0.4rem 0 0.75rem; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .a6-text { font-size: 1.15rem; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; margin-bottom: 0.6rem; }
  .a6-detail { font-size: 0.78rem; line-height: 1.35; overflow-wrap: anywhere; }
  .a6-detail p { margin-bottom: 0.3rem; }
  .a6-foot { margin-top: auto; padding-top: 0.5rem; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border-top: 2px solid #2A1F18; }

  /* ── Week 10: backwards map, diagram, sorter, evidence ── */
  .map-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 0.75rem; }
  .map-top > div { padding: 0.6rem 0.8rem; border: 2px dashed var(--char-1); background: #fff; }
  .map-top .lto-box { border: 0; background: var(--char-2); color: #fff; font-weight: 700; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .map-top .k { display: block; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 0.2rem; opacity: 0.9; }
  .dg-wrap { overflow-x: auto; overflow-y: hidden; max-width: 100%; margin: 0.5rem 0; background: #fff; border: 2px solid var(--border); border-left: 6px solid var(--char-6); }
  .dg-wrap:focus-visible { outline: 3px solid var(--char-1); outline-offset: 2px; }
  svg.dg { display: block; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  .dg rect { fill: #fff; stroke: #2A1F18; stroke-width: 2; }
  .dg .dg-goal rect { fill: #FFFAF2; stroke: #5C3A96; }
  .dg .dg-lto rect { fill: #B52838; stroke: #B52838; }
  .dg .dg-lto text { fill: #fff; }
  .dg .dg-cluster rect { fill: #F4EFF9; stroke: #5C3A96; stroke-width: 3; }
  .dg .dg-loose > rect:first-child { stroke: #B82828; stroke-dasharray: 7 4; }

<script>
(function () {
  'use strict';

  // ==========================================================================
  // CONFIG: everything a non-developer may want to edit lives here.
  // Rules for editing:
  //  - Never put anything from the client brief in this file. Refer to it only
  //    as "the client brief (on the VLE)".
  //  - Quotations from the readings must match the PDF exactly, with the page.
  //    Curly quotation marks and apostrophes are written as \u201C \u201D \u2019.
  //  - Never add study findings, statistics or facts about real places without
  //    a source (facts go in CONFIG.facts, sources in the file header).
  // ==========================================================================
  var CONFIG = {
    // Identity of exports. Files from any other tool are refused on import.
    toolId: 'toc-workbench',
    schemaVersion: 1,
    // Autosave key, namespaced by tool and schema version.
    storageKey: 'toc-workbench-v1',
    // The week 7 file this tool can read on screen 1.
    week7ToolId: 'week7-bodo-decline',
    week7SchemaVersion: 2,

    // Interface copy.
    text: {
      eyebrow: 'Activity 15 · Weeks 9–13 · Intervene',
      title: 'Bodø Theory of Change',
      lede: 'Five weeks, one argument. Build the Theory of Change behind your recommendation to the client, one step a week, following Taplin and Clark. Every screen stays editable; the glossary, the reading and the self-check sit beside every screen.',
      briefNotice: 'The client brief is on the VLE. It is not stored in this tool. Type what you use from it in your own words, with the slide number.',
      laterLead: 'This screen opens in a later week. Read ahead:'
    },

    // Run sheets (90 minutes each), keyed by week. "How this session runs"
    // shows the sheet for the group's current week (the first week not yet
    // closed), or the latest sheet built.
    runSheets: {
      10: [
        { t: '0–12', what: 'Deck. Screen 5: rotate roles for week 10.' },
        { t: '12–45', what: 'Screen 5: backwards map. From the long-term outcome down, ask what must be true for each outcome, in at least two pathways. Group preconditions that act together into clusters. Tag each outcome by lens and characteristic.' },
        { t: '45–65', what: 'Screens 5 and 6: a rationale on every arrow. Every belief anyone voices goes through the sorter. The Sceptic leads.' },
        { t: '65–80', what: 'Screen 6: evidence, rated on the week 6 criteria where it matters. Reverse Import: each member places their claim on one arrow.' },
        { t: '80–90', what: 'Screen 6: completeness pass on assumptions, then the week 10 self-check and export. Design stays locked until week 11.' }
      ],
      9: [
        { t: '0–12', what: 'Deck. Screen 1: group, members and week 9 roles. Load your week 7 export if you have it.' },
        { t: '12–30', what: 'Screen 2: the client\u2019s intended impact, with the client brief (on the VLE) open.' },
        { t: '30–50', what: 'Screen 3: problem statement, then the long-term outcome.' },
        { t: '50–60', what: 'Screen 3: definitions and the accountability ceiling.' },
        { t: '60–83', what: 'Screen 4: stakeholders.' },
        { t: '83–90', what: 'Week 9 close: self-check, print the long-term outcome card, export.' }
      ]
    },

    // The readings. Page numbers in every reference refer to these PDFs.
    readings: {
      TC: { label: '[TC]', full: 'Taplin & Clark (2012), Theory of Change Basics (ToCBasics.pdf)' },
      GAF: { label: '[GAF]', full: 'Government Analysis Function, The Theory of Change Process (ToCgov.pdf)' },
      A7: { label: '[A7]', full: 'Course deck: Theory of Change (Activity 7, theory-of-change.html)' }
    },

    // Weeks: label and accent colour.
    weeks: {
      9: { label: 'Week 9 · The long-term outcome', colour: 'var(--char-1)' },
      10: { label: 'Week 10 · Backwards mapping', colour: 'var(--char-2)' },
      11: { label: 'Week 11 · Interventions', colour: 'var(--char-6)' },
      12: { label: 'Week 12 · Indicators and review', colour: 'var(--char-8)' },
      13: { label: 'Week 13 · Recommendation', colour: 'var(--char-5)' }
    },

    // The 14 screens (toc_buildplan.md §7.1). built = this stage has built it;
    // unbuilt screens show "Arrives in week N" and their reading. reading =
    // the references shown in the side panel: { ref, pages, what }.
    screens: [
      { no: 1, week: 9, built: true, title: 'Setup', colour: 'var(--char-1)',
        summary: 'Group, members and roles; optional week 7 import.',
        reading: [{ ref: 'GAF', pages: 'pp. 43–44', what: 'Workshops: facilitators, everyone heard, several sessions' }] },
      { no: 2, week: 9, built: true, title: 'Client\u2019s intended impact', colour: 'var(--char-4)',
        summary: 'The client\u2019s claims as a causal chain, its stated ambition, and whose community it means.',
        reading: [{ ref: 'GAF', pages: 'pp. 8–10', what: 'Step 1: identify stakeholders and agree intended impact' },
                  { ref: 'GAF', pages: 'pp. 11–13', what: 'Step 2: evidence and context' }] },
      { no: 3, week: 9, built: true, title: 'Problem and long-term outcome', colour: 'var(--char-2)',
        summary: 'Problem statement, positive opposite, shared definitions and the accountability ceiling.',
        reading: [{ ref: 'TC', pages: 'pp. 3–4', what: '§2 Long-term outcome: problem statement, positive opposite, definitions, accountability ceiling' },
                  { ref: 'GAF', pages: 'pp. 14–15', what: 'Step 3: impacts, or long-term goals' }] },
      { no: 4, week: 9, built: true, title: 'Stakeholders', colour: 'var(--char-8)',
        summary: 'Who is affected or has influence; who we can ask; and the week 9 close.',
        reading: [{ ref: 'GAF', pages: 'p. 8', what: 'Step 1: the eight stakeholder questions; low, medium, high' }] },
      { no: 5, week: 10, built: true, title: 'Backwards map', colour: 'var(--char-6)',
        summary: 'Outcomes, clusters and arrows with rationales, drawn as a live diagram.',
        reading: [{ ref: 'TC', pages: 'pp. 4–6', what: '§3 Causal pathways, backwards mapping, clusters; the outcomes framework; §4 rationales' },
                  { ref: 'GAF', pages: 'pp. 16–18', what: 'Step 4: outcomes (one change per outcome)' },
                  { ref: 'GAF', pages: 'pp. 29–31', what: 'Step 9: causal links' },
                  { ref: 'GAF', pages: 'p. 5', what: 'Proportionality' }] },
      { no: 6, week: 10, built: true, title: 'Assumptions and evidence', colour: 'var(--char-5)',
        summary: 'The sorter, the assumption register and the evidence log with the week 6 criteria.',
        reading: [{ ref: 'TC', pages: 'p. 6', what: '§4 Assumptions and rationales' },
                  { ref: 'GAF', pages: 'pp. 23–26', what: 'Step 7: assumptions; the quality of evidence (p. 24)' }] },
      { no: 7, week: 11, built: false, title: 'Options appraisal', colour: 'var(--char-1)',
        summary: 'At least two designs, tested as plausible, doable and testable; one chosen.',
        reading: [{ ref: 'GAF', pages: 'p. 11', what: 'Step 2, questions 6–7: alternative strategies' }] },
      { no: 8, week: 11, built: false, title: 'Interventions', colour: 'var(--char-4)',
        summary: 'Interventions on arrows, the gap walk, and inputs.',
        reading: [{ ref: 'TC', pages: 'p. 7', what: '§5 Interventions' },
                  { ref: 'GAF', pages: 'pp. 19–22', what: 'Steps 5–6: outputs, activities and inputs' }] },
      { no: 9, week: 11, built: false, title: 'Risks and stress test', colour: 'var(--char-2)',
        summary: 'The risk register and the stadium stress test against the eight characteristics.',
        reading: [{ ref: 'GAF', pages: 'pp. 27–28', what: 'Step 8: risks' }] },
      { no: 10, week: 12, built: false, title: 'Indicators', colour: 'var(--char-8)',
        summary: 'Indicators with the four targets, the M&E framework and the timeline check.',
        reading: [{ ref: 'TC', pages: 'p. 8', what: '§6 Indicators' },
                  { ref: 'GAF', pages: 'pp. 37–42', what: 'Step 11: monitoring and evaluation plan' }] },
      { no: 11, week: 12, built: false, title: 'Outside review', colour: 'var(--char-6)',
        summary: 'Review another group\u2019s theory; respond to the review of yours.',
        reading: [{ ref: 'TC', pages: 'p. 9', what: '§7 Quality review' },
                  { ref: 'GAF', pages: 'pp. 47–48', what: 'Quality assurance factors' }] },
      { no: 12, week: 13, built: false, title: 'Diagrams and narrative', colour: 'var(--char-5)',
        summary: 'The full diagram, the one-page client diagram and the narrative.',
        reading: [{ ref: 'TC', pages: 'p. 9', what: '§8 Narrative' },
                  { ref: 'GAF', pages: 'pp. 32–36', what: 'Step 10: diagram and narrative' }] },
      { no: 13, week: 13, built: false, title: 'Recommendation', colour: 'var(--char-8)',
        summary: 'The recommendation sentence, the values check and the recommendation pack.',
        reading: [{ ref: 'TC', pages: 'p. 9', what: '§8 Narrative: the plain-English executive summary' }] },
      { no: 14, week: 13, built: false, instructor: true, title: 'Class view', colour: 'var(--char-1)',
        summary: 'Instructor: every group\u2019s export side by side. No scores or rankings.',
        reading: [{ ref: 'TC', pages: 'p. 9', what: '§7 Quality review: outside reviewers' }] }
    ],

    // The glossary crosswalk (toc_buildplan.md §3.2). The course uses [TC]'s
    // terms; [GAF]'s equivalents are given for reading the toolkit.
    glossary: [
      { term: 'Ultimate goal (above the accountability ceiling)', gaf: 'Impact', note: 'What the client contributes to but is not held to' },
      { term: 'Long-term outcome', gaf: 'Impact / long-term goal', note: 'What the third place is held to' },
      { term: 'Intermediate and early outcomes (preconditions)', gaf: 'Medium- and short-term outcomes', note: '' },
      { term: 'Intervention (with its activities)', gaf: 'Outputs + activities', note: '[TC] p. 7 separates strategy, intervention and activity' },
      { term: 'Resources for an intervention', gaf: 'Inputs', note: '' },
      { term: 'Rationale (why X is needed for Y)', gaf: 'Causal link justification', note: '' },
      { term: 'Assumption (a condition taken as already in place)', gaf: 'Assumption (\u201Cunderlying conditions\u201D)', note: '[TC] is stricter: an assumption is already in place; a precondition must be brought about' },
      { term: 'Risk', gaf: 'Risk', note: '[GAF] only; [TC] has no separate term' }
    ],

    // The self-check, from [TC] p. 9. Quotations are exact. Each week ends
    // with it; completing it closes the week.
    selfCheck: {
      intro: 'Quality review should answer three basic questions: Is your theory 1) plausible, 2) \u201Cdoable\u201D (or feasible), and 3) testable?',
      introRef: '[TC] p. 9',
      lead: 'Answer for the theory as it stands this week. Nothing is scored: say where it is strong and where it is thin.',
      questions: [
        { id: 'plausible', label: 'Plausible',
          quote: 'Plausibility refers to the logic of your pathways. Does it make sense? Are the outcomes in the right order? Are preconditions actually preconditions to the outcomes you\u2019ve indicated? Are there big gaps in the logic?',
          ref: '[TC] p. 9' },
        { id: 'doable', label: 'Doable',
          quote: 'Feasibility refers to how realistic it is that your program and/or initiative can achieve your long-term outcome. Do you have the resources to implement all the interventions you\u2019ve specified? Do you need to bring in additional partners? Do you need to adjust the scope, expectations or timeline of your theory?',
          ref: '[TC] p. 9' },
        { id: 'testable', label: 'Testable',
          quote: 'Testability refers to how well you have crafted your indicators. Have you identified solid, measurable indicators that can be evaluated in a timely manner? Will these indicators be sufficient to make corrections in your course toward the LTO and to evaluate success of your program? Will they be convincing to necessary audiences?',
          ref: '[TC] p. 9' }
      ]
    },

    // Minimum word counts per field. One character never passes any field.
    words: {
      claim: 8,            // a client claim, in the group's own words
      ambition: 8,         // the client's stated ambition, in the group's words
      whoseCommunity: 25,  // whose community does the client mean?
      problem: 25,         // the problem statement
      where: 1,            // where (also needs at least 2 characters)
      forWhom: 2,          // for whom
      lto: 6,              // the long-term outcome (a short condition)
      lintReason: 15,      // why a word the lint flags is kept
      meaning: 10,         // the meaning of a defined term
      ultimateGoal: 4,     // the ultimate goal above the ceiling
      ceilingReason: 25,   // why the ambition sits above, at or below
      selfCheck: 15,       // each self-check answer
      fof: 4,              // a find-out-first item added by hand
      outcome: 4,          // an outcome on the backwards map (week 10)
      clusterLabel: 1,     // a cluster's label (also needs 2 characters)
      rationale: 12,       // "X is needed for Y because ..."
      belief: 5,           // a belief put through the sorter
      assumption: 5,       // an assumption in the register
      evidenceSummary: 8,  // what the evidence says
      evidenceSource: 2,   // where it comes from
      reverseCourse: 1,    // the parallel course (also needs 2 characters)
      reverseClaim: 12     // the imported claim
    },
    // Shortest name accepted (group, members, terms, stakeholders).
    minNameChars: 2,

    // Group size and screen minimums.
    minMembers: 3,
    maxMembers: 5,
    minClaims: 3,          // client claims on screen 2
    minStakeholders: 3,    // stakeholders on screen 4
    maxOutcomes: 15,       // soft cap on the backwards map (week 10): a warning, not a block
    // Edits to the same field of a closed week within this many minutes make
    // one revision-log entry, not one per keystroke.
    logCoalesceMinutes: 5,
    // What the close of each week offers once the week is closed: buttons,
    // and the A6 card types previewed there (CARD_TYPES ids).
    closeActions: {
      9: [{ action: 'print-cards', arg: 'lto', label: 'Print the long-term outcome card' }],
      10: [{ action: 'print-diagram', arg: 'a4', label: 'Print diagram · A4 landscape' },
           { action: 'print-diagram', arg: 'a3', label: 'Print diagram · A3 landscape' }]
    },
    weekCards: { 9: ['lto'], 10: [] },

    // Group roles ([GAF] pp. 43–44). minGroup = the smallest group that uses
    // the role. Each week, roles rotate: the suggestion never gives a member
    // the role they held the week before, but the group can override it.
    roles: [
      { id: 'facilitator', name: 'Facilitator', duty: 'Runs the discussion and makes sure everyone speaks and is heard.', minGroup: 3 },
      { id: 'scribe', name: 'Scribe', duty: 'Holds the device and types what the group agrees, not their own version.', minGroup: 3 },
      { id: 'sceptic', name: 'Sceptic', duty: 'Challenges every claim, precondition and assumption: is it needed, and is it already true?', minGroup: 3 },
      { id: 'evidence', name: 'Evidence lead', duty: 'Finds the source for each claim: a brief slide, a reading, or week 5–7 work.', minGroup: 3 },
      { id: 'timekeeper', name: 'Timekeeper', duty: 'Keeps the group to the run sheet and calls time on each block.', minGroup: 5 }
    ],
    rolesGuide2: 'When running your workshops, you should ensure everyone can add to the discussion and has a chance to speak and be heard.',
    rolesGuide2Ref: '[GAF] p. 43',

    // The four decline claims (the course's analytical spine).
    declineClaims: [
      { id: 'SUPPLY', label: 'Supply', help: 'Fewer third places exist.', colour: 'var(--char-1)' },
      { id: 'USE', label: 'Use', help: 'People use them less.', colour: 'var(--char-4)' },
      { id: 'QUALITY', label: 'Quality', help: 'Those that remain function less well as third places.', colour: 'var(--char-6)' },
      { id: 'OUTCOME', label: 'Outcome', help: 'Social consequences such as belonging and trust have worsened.', colour: 'var(--char-2)' }
    ],

    // Lint for outcome wording. Activity verbs belong to interventions (week
    // 11), not outcomes. Each verb also matches its -s, -es, -ed, -d and -ing
    // forms (with a doubled last letter: running). Irregular forms are listed.
    lint: {
      activityVerbs: ['build', 'built', 'run', 'ran', 'offer', 'host', 'provide', 'create', 'open', 'deliver',
        'organise', 'organize', 'hold', 'held', 'launch', 'install', 'set up', 'setting up', 'fund', 'hire',
        'train', 'design', 'introduce', 'establish', 'make', 'made', 'put on', 'schedule', 'advertise',
        'promote', 'sell', 'sold', 'serve', 'staff', 'programme', 'invest'],

  var ROLE = {}; CONFIG.roles.forEach(function (r) { ROLE[r.id] = r; });
  var DARK_INK = { 'var(--char-4)': '#2A1F18', 'var(--char-7)': '#2A1F18', 'var(--ambiguous)': '#2A1F18' };
  function inkFor(colour) { return DARK_INK[colour] || '#fff'; }
  // Text colour safe on cream for an accent (gold and orange are too light).
  var TEXT_SAFE = { 'var(--char-4)': '#7A5800', 'var(--char-7)': '#9A4A1A' };
  function textColour(colour) { return TEXT_SAFE[colour] || colour; }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function isObj(o) { return !!o && typeof o === 'object' && !Array.isArray(o); }
  function uid(prefix) { return prefix + Math.random().toString(36).slice(2, 9); }
  function nowIso(now) { return (now ? new Date(now) : new Date()).toISOString(); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }

  // ==========================================================================
  // Word counter. A "word" is a run of letters or digits (apostrophes and
  // hyphens inside a word are allowed). One character never passes a field.
  // ==========================================================================
  function wordCount(s) {
    var m = String(s || '').match(/[A-Za-z0-9\u00C0-\u024F]+(?:['\u2019\-][A-Za-z0-9\u00C0-\u024F]+)*/g);
    return m ? m.length : 0;
  }
  // Check a text against a minimum: { ok, n, min, msg }.
  function wordCheck(text, min) {
    var t = String(text || '').trim(), n = wordCount(t);
    min = Math.max(1, min || 1);
    var ok = n >= min && t.length >= 2;
    var msg = ok ? '' : (n >= min ? 'needs more than one character' : 'needs at least ' + plural(min, 'word') + ' (' + n + ' so far)');
    return { ok: ok, n: n, min: min, msg: msg };
  }
  function wordsOk(text, key) { return wordCheck(text, CONFIG.words[key]).ok; }
  function wordLabel(text, min) {
    var c = wordCheck(text, min);
    return c.n + ' / ' + c.min + ' word' + (c.min === 1 ? '' : 's') + (c.ok ? ' ✓' : '');
  }
  function nameOk(s) { return String(s || '').trim().length >= CONFIG.minNameChars && wordCount(s) >= 1; }
  // A slide number: a whole number from 1 to 999.
  function validSlide(v) { var t = String(v == null ? '' : v).trim(); return /^\d{1,3}$/.test(t) && +t >= 1; }

  // ==========================================================================
  // Lint (outcome wording)
  // ==========================================================================
  function reEscape(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function verbPattern(v) {
    var parts = v.split(/\s+/).map(reEscape), last = parts.pop();
    var tail = reEscape(last.slice(-1));
    var base = (parts.length ? parts.join('\\s+') + '\\s+' : '') + last;
    return new RegExp('(^|[^A-Za-z])' + base + '(?:' + tail + ')?(?:s|es|ed|d|ing)?(?![A-Za-z])', 'i');
  }
  // Activity verbs found in a text (in CONFIG order, each once).
  function lintActivity(text) {
    var t = String(text || '');
    return CONFIG.lint.activityVerbs.filter(function (v) { return verbPattern(v).test(t); });
  }
  // Negative or problem words found in a text, plus any "n't" contraction.
  function lintNegative(text) {
    var t = String(text || ''), out = CONFIG.lint.negativeWords.filter(function (w) {
      return new RegExp('(^|[^A-Za-z])' + reEscape(w) + '(?![A-Za-z])', 'i').test(t);
    });
    var m = t.match(/[A-Za-z]+n['\u2019]t(?![A-Za-z])/gi);
    if (m) m.forEach(function (x) { x = x.toLowerCase().replace('\u2019', '\''); if (out.indexOf(x) === -1) out.push(x); });
    return out;
  }
  // "and" (or "&") in a text: one change per outcome ([GAF] p. 16).
  function lintAnd(text) {
    var t = String(text || '');
    return CONFIG.lint.andWords.filter(function (w) {
      return w === '&' ? t.indexOf('&') !== -1 : new RegExp('(^|[^A-Za-z])' + reEscape(w) + '(?![A-Za-z])', 'i').test(t);
    });
  }
  // The long-term outcome lint: activity verbs and negatives.
  function ltoLint(text) {
    var a = lintActivity(text), n = lintNegative(text);
    return { activity: a, negative: n, ok: !a.length && !n.length };
  }
  function lintWarnings(l) {
    var out = [];
    l.activity.forEach(function (v) { out.push('\u201C' + v + '\u201D ' + CONFIG.lintMessages.activity); });
    l.negative.forEach(function (v) { out.push('\u201C' + v + '\u201D ' + CONFIG.lintMessages.negative); });
    return out;
  }

      clientTheory: { claims: [], ambition: '', ambitionSlide: '', order: [], linkEvidence: {}, whoseCommunity: '' },
      problem: { statement: '', claims: [], where: '', forWhom: '' },
      lto: { text: '', lintReason: '', definitions: [], ceiling: { ultimateGoal: '', ambitionPosition: '', reason: '' } },
      stakeholderQuestions: q,
      stakeholders: [],
      outcomes: [],
      clusters: [],
      links: [],
      assumptions: [],
      findOutFirst: [],
      beliefs: [],
      evidence: [],
      reverseImport: [],
      sweep: {},
      options: [],
      interventions: [],
      risks: [],
      stressTest: {},
      indicators: [],
      reviews: { given: [], received: [] },
      diagrams: { clientOutcomeIds: [], clientLinkIds: [] },
      narrative: { execSummary: '', sections: {} },
      valuesCheck: [],
      recommendation: { sentence: '' },
      selfChecks: weekMap(function () { return { plausible: '', doable: '', testable: '', completedAt: '' }; }),
      revisionLog: [],
      ui: { screen: 1, reached: 1 }
    };
  }
  // Defaults for the items of each list, so a partial item never breaks a
  // screen. Keyed by the list's path in the state.
  var ITEM_DEFAULTS = {
    'clientTheory.claims': { id: '', text: '', slide: '' },
    'lto.definitions': { term: '', meaning: '' },
    'stakeholders': { id: '', name: '', fromBrief: false, slide: '', affected: '', influence: '', interest: '', canWeAsk: '' },
    'outcomes': { id: '', text: '', level: '', pathway: '', clusterId: '', lenses: [], characteristics: [], leadsTo: [] },
    'clusters': { id: '', label: '', leadsTo: [] },
    'links': { id: '', from: '', to: '', rationale: '', evidenceIds: [] },
    'assumptions': { id: '', linkId: '', text: '', lens: '', evidenceIds: [], sort: 'assumption' },
    'findOutFirst': { id: '', text: '', source: 'manual', refId: '' },
    'beliefs': { id: '', text: '', screen: 0, sort: '', refId: '', at: '' },
    'evidence': { id: '', summary: '', source: '', type: '', slide: '', ratings: { causal: '', scope: '', implications: '', method: '' }, bodoVerdict: '', member: '', factId: '' },
    'reverseImport': { member: '', course: '', claim: '', linkId: '', stance: '', absent: false },
    'options': { id: '', summary: '', location: '', plausible: '', doable: '', testable: '', chosen: false, whyNot: '' },
    'interventions': { id: '', name: '', activities: [], linkIds: [], characteristics: [], inputs: [] },
    'risks': { id: '', text: '', internal: '', likelihood: '', mitigation: '', interventionId: '' },
    'indicators': { id: '', outcomeId: '', owner: '', howMany: '', who: '', level: '', byWhen: '', definition: '', baseline: '', dataSource: '', frequency: '', responsible: '', reporting: '' },
    'reviews.received': { fromGroup: '', items: [] },
    'valuesCheck': { value: '', slide: '', speaksTo: '', cost: '' },
    'revisionLog': { at: '', week: 0, screen: 0, change: '' }
  };
  // Objects whose keys are chosen at run time (kept as they are, if objects).
  var FREE_KEYS = { 'roles.week9': 1, 'roles.week10': 1, 'roles.week11': 1, 'roles.week12': 1, 'roles.week13': 1,
    'clientTheory.linkEvidence': 1, 'sweep': 1, 'stressTest': 1, 'narrative.sections': 1 };

  function sameKind(a, b) {

  function fill(def, value, path) {
    if (!sameKind(def, value)) return clone(def);
    if (Array.isArray(def)) {
      var item = ITEM_DEFAULTS[path];
      if (!item) return value.slice();
      return value.filter(isObj).map(function (v) { return fill(item, v, path + '[]'); });
    }
    if (isObj(def)) {
      if (FREE_KEYS[path]) return clone(value);
      var out = {};
      Object.keys(value).forEach(function (k) { out[k] = value[k]; });
      Object.keys(def).forEach(function (k) { out[k] = fill(def[k], value[k], path ? path + '.' + k : k); });
      return out;
    }
    if (def === null) return value === undefined ? null : value;
    return value;
  }
  function migrate(state) {
    var s = fill(defaultState(), isObj(state) ? state : {}, '');
    if (!s.meta.exportId) s.meta.exportId = uid('x');
    while (s.group.members.length < CONFIG.maxMembers) s.group.members.push('');
    s.group.members = s.group.members.map(function (m) { return typeof m === 'string' ? m : ''; });
    if (s.imported.week7 !== null && !isObj(s.imported.week7)) s.imported.week7 = null;
    if (typeof s.ui.screen !== 'number' || !SCREEN[s.ui.screen]) s.ui.screen = 1;
    if (typeof s.ui.reached !== 'number') s.ui.reached = 1;
    var ids = s.clientTheory.claims.map(function (c) { return c.id; });
    s.clientTheory.order = s.clientTheory.order.filter(function (id, i, o) { return ids.indexOf(id) !== -1 && o.indexOf(id) === i; });
    normaliseMap(s);
    return s;
  }

  function members(s) {
    var seen = {};
    return (s.group.members || []).map(function (m) { return String(m || '').trim().replace(/\s+/g, ' '); })
      .filter(function (m) { var k = m.toLowerCase(); if (!m || seen[k]) return false; seen[k] = true; return true; });
  }

  // ==========================================================================
  // Roles: keyed by role, so one member may hold two roles in a group of 3.
  // ==========================================================================
  function rolesFor(n) { return CONFIG.roles.filter(function (r) { return n >= r.minGroup; }); }
  // Suggested roles for a week. Week 9 deals the roles in member order; later
  // weeks move every role to the next member after last week's holder, so
  // nobody holds the same role two weeks running.
  function suggestRoles(memberList, prevWeek) {
    var n = memberList.length, out = {};
    if (!n) return out;
    rolesFor(n).forEach(function (r, i) {
      var prev = prevWeek && prevWeek[r.id], idx = memberList.indexOf(prev);
      out[r.id] = memberList[idx === -1 ? i % n : (idx + 1) % n];

    return out;
  }
  // Members who hold the same role as the week before (a warning only).
  function rotationRepeats(s, week) {
    if (week <= 9) return [];
    var now = s.roles['week' + week] || {}, prev = s.roles['week' + (week - 1)] || {};
    return Object.keys(now).filter(function (r) { return ROLE[r] && now[r] && prev[r] === now[r]; })
      .map(function (r) { return now[r] + ' was ' + ROLE[r].name + ' last week too.'; });
  }
  function roleChecks(s, week) {
    var list = members(s), now = s.roles['week' + week] || {};
    if (list.length < CONFIG.minMembers) return [];
    return rolesFor(list.length).map(function (r) {
      return { ok: list.indexOf(now[r.id]) !== -1, msg: 'Assign the ' + r.name + ' for week ' + week + '.' };
    });
  }

  // ==========================================================================
  // Gates: lists of checks with specific messages. Nothing is scored.
  // ==========================================================================
  function check(ok, msg) { return { ok: !!ok, msg: msg }; }
  function gateResult(checks) {
    var failing = checks.filter(function (c) { return !c.ok; });
    return { ok: failing.length === 0, failing: failing.map(function (c) { return c.msg; }), total: checks.length };
  }
  function wordMsg(label, text, key) {
    var c = wordCheck(text, CONFIG.words[key]);
    return check(c.ok, label + ': ' + (c.msg || 'done') + '.');
  }

  function screen1Checks(s) {
    var raw = (s.group.members || []).map(function (m) { return String(m || '').trim(); }).filter(Boolean);
    var list = members(s);
    var c = [
      check(nameOk(s.group.name), 'Give your group a name (at least ' + CONFIG.minNameChars + ' characters).'),
      check(list.length >= CONFIG.minMembers && list.length <= CONFIG.maxMembers,
        'Enter ' + CONFIG.minMembers + ' to ' + CONFIG.maxMembers + ' members (' + list.length + ' so far).'),
      check(raw.length === list.length, 'Each member needs a different name.'),
      check(raw.every(nameOk), 'Each member name needs at least ' + CONFIG.minNameChars + ' characters.')
    ];
    return c.concat(roleChecks(s, 9));
  }

  function chainLinks(s) {
    var o = s.clientTheory.order, out = [];
    for (var i = 0; i + 1 < o.length; i++) out.push({ from: o[i], to: o[i + 1], key: o[i] + '>' + o[i + 1] });
    return out;
  }
  function screen2Checks(s) {
    var ct = s.clientTheory, claims = ct.claims;
    var ids = claims.map(function (c) { return c.id; });
    var placed = ids.filter(function (id) { return ct.order.indexOf(id) !== -1; }).length;
    var links = chainLinks(s);
    var marked = links.filter(function (l) { return ct.linkEvidence[l.key] === 'given' || ct.linkEvidence[l.key] === 'not'; }).length;
    var c = [
      check(claims.length >= CONFIG.minClaims, 'Add at least ' + CONFIG.minClaims + ' client claims (' + claims.length + ' so far).')
    ];
    claims.forEach(function (cl, i) {
      var w = wordCheck(cl.text, CONFIG.words.claim);
      c.push(check(w.ok, 'Claim ' + (i + 1) + ': ' + (w.msg || 'done') + '.'));
      c.push(check(validSlide(cl.slide), 'Claim ' + (i + 1) + ': give the slide number it comes from.'));
    });
    c.push(check(claims.length > 0 && placed === claims.length, 'Place every claim in the chain (' + placed + ' of ' + claims.length + ' placed).'));
    c.push(check(links.length > 0 && marked === links.length, 'Mark every link in the chain as evidence given or not (' + marked + ' of ' + links.length + ').'));
    c.push(wordMsg('The client\u2019s stated ambition', ct.ambition, 'ambition'));
    c.push(check(validSlide(ct.ambitionSlide), 'Give the slide number of the client\u2019s stated ambition.'));
    c.push(wordMsg('Whose community?', ct.whoseCommunity, 'whoseCommunity'));
    return c;
  }

  function screen3Checks(s) {
    var p = s.problem, l = s.lto, lint = ltoLint(l.text);
    var c = [
      wordMsg('Problem statement', p.statement, 'problem'),
      check(p.claims.length > 0, 'Tick at least one decline claim (Supply, Use, Quality, Outcome).'),
      check(wordsOk(p.where, 'where') && String(p.where).trim().length >= CONFIG.minNameChars, 'Say where the problem is.'),
      check(wordsOk(p.forWhom, 'forWhom'), 'Say for whom (at least ' + plural(CONFIG.words.forWhom, 'word') + ').'),
      wordMsg('Long-term outcome', l.text, 'lto'),
      check(lint.ok || wordsOk(l.lintReason, 'lintReason'),
        'Long-term outcome: rephrase the flagged words as a positive condition, or say why you keep them (' + CONFIG.words.lintReason + ' words).'),
      check(l.definitions.length > 0, 'Define at least one key term in the long-term outcome.')
    ];
    l.definitions.forEach(function (d, i) {
      c.push(check(nameOk(d.term), 'Definition ' + (i + 1) + ': name the term.'));
      c.push(wordMsg('Definition ' + (i + 1) + ' meaning', d.meaning, 'meaning'));
    });
    c.push(wordMsg('Ultimate goal', l.ceiling.ultimateGoal, 'ultimateGoal'));
    c.push(check(!!l.ceiling.ambitionPosition, 'Place the client\u2019s ambition above, at or below the ceiling.'));
    c.push(wordMsg('Reason for the ceiling placement', l.ceiling.reason, 'ceilingReason'));
    return c;
  }

  function screen4Checks(s) {
    var st = s.stakeholders;
    var c = [check(st.length >= CONFIG.minStakeholders, 'Add at least ' + CONFIG.minStakeholders + ' stakeholders (' + st.length + ' so far).')];
    st.forEach(function (x, i) {
      var who = 'Stakeholder ' + (i + 1);
      c.push(check(nameOk(x.name), who + ': give a name.'));
      c.push(check(x.affected === 'yes' || x.affected === 'no', who + ': affected, yes or no?'));
      c.push(check(!!x.influence, who + ': rate influence.'));
      c.push(check(!!x.interest, who + ': rate interest.'));
      c.push(check(x.canWeAsk === 'yes' || x.canWeAsk === 'no', who + ': can we ask them, yes or no?'));
      if (x.fromBrief) c.push(check(validSlide(x.slide), who + ': give the slide of the client brief that names them.'));
    });
    return c;
  }

  // Week 10, screen 5: the backwards map.
  function screen5Checks(s) {
    var adj = graph(s), paths = pathwayList(s);
    var c = roleChecks(s, 10).concat([
      check(s.outcomes.length > 0, 'Add the first outcome below the long-term outcome.'),
      check(paths.length >= CONFIG.minPathways, 'Map at least ' + CONFIG.minPathways + ' pathways (' + paths.length + ' so far).')
    ]);
    s.outcomes.forEach(function (o, i) {
      var who = 'Outcome ' + (i + 1), w = wordCheck(o.text, CONFIG.words.outcome);
      c.push(check(w.ok, who + ': ' + (w.msg || 'done') + '.'));
      c.push(check(o.level === 'early' || o.level === 'intermediate', who + ': early or intermediate?'));
      c.push(check(nameOk(o.pathway), who + ': name its pathway.'));
      c.push(check(o.lenses.some(lensOk), who + ': tag at least one lens.'));
      c.push(check(reaches(adj, o.id, LTO_ID), who + ': connect it upwards to the long-term outcome.'));
    });
    s.clusters.forEach(function (k, i) {
      var who = 'Cluster ' + (i + 1), n = clusterMembers(s, k).length;
      c.push(check(nameOk(k.label), who + ': give it a label.'));
      c.push(check(n >= CONFIG.minClusterMembers, who + ': put at least ' + CONFIG.minClusterMembers + ' outcomes in it (' + n + ' so far).'));
      c.push(check(k.leadsTo.length === 1 && isTarget(s, k.leadsTo[0]), who + ': choose the one outcome it leads to.'));
    });
    s.links.forEach(function (l, i) {
      var w = wordCheck(l.rationale, CONFIG.words.rationale);
      c.push(check(w.ok, 'Arrow ' + (i + 1) + ' (' + linkName(s, l) + '): rationale ' + (w.msg || 'done') + '.'));
    });
    return c;
  }
  // Week 10, screen 6: the sorter, the register, evidence, Reverse Import
  // and the completeness pass.
  function screen6Checks(s) {
    var c = [];
    s.beliefs.forEach(function (b, i) { if (!b.sort) c.push(check(false, 'Belief ' + (i + 1) + ': answer the sorter question.')); });
    s.assumptions.forEach(function (a, i) {
      var who = 'Assumption ' + (i + 1), w = wordCheck(a.text, CONFIG.words.assumption);
      c.push(check(w.ok, who + ': ' + (w.msg || 'done') + '.'));
      c.push(check(!!linkById(s, a.linkId), who + ': choose the arrow it supports.'));
      c.push(check(lensOk(a.lens), who + ': choose its lens.'));
      c.push(check(a.evidenceIds.some(function (x) { return evidenceById(s, x); }), who + ': attach at least one evidence item.'));
    });
    s.evidence.forEach(function (e, i) {
      var who = 'Evidence ' + (i + 1), t = evType(e.type), w = wordCheck(e.summary, CONFIG.words.evidenceSummary);
      c.push(check(!!t, who + ': choose its type.'));
      if (t && t.fact) c.push(check(!!factById(e.factId), who + ': choose the week 7 fact.'));
      c.push(check(w.ok, who + ': summary ' + (w.msg || 'done') + '.'));
      c.push(check(wordCheck(e.source, CONFIG.words.evidenceSource).ok, who + ': say where it comes from (at least ' + plural(CONFIG.words.evidenceSource, 'word') + ').'));
      if (t && t.slide) c.push(check(validSlide(e.slide), who + ': give the slide of the client brief.'));
    });
    members(s).forEach(function (m) {

      if (r.absent) return;
      c.push(check(nameOk(r.course) && wordCheck(r.course, CONFIG.words.reverseCourse).ok, who + ': name the course.'));
      var w = wordCheck(r.claim, CONFIG.words.reverseClaim);
      c.push(check(w.ok, who + ': claim ' + (w.msg || 'done') + '.'));
      c.push(check(!!linkById(s, r.linkId), who + ': choose the arrow.'));
      c.push(check(r.stance === 'support' || r.stance === 'challenge', who + ': support or challenge?'));
    });
    if (!mapConnected(s)) c.push(check(false, 'Completeness pass: it opens when every outcome reaches the long-term outcome (screen 5).'));
    else s.links.forEach(function (l, i) {
      c.push(check(s.sweep[l.id] === 'none' || s.sweep[l.id] === 'added', 'Completeness pass: check arrow ' + (i + 1) + ' (' + linkName(s, l) + ') for assumptions.'));
    });
    return c;
  }
  // The week 10 gate that later stages need before design opens (plan §7.3):
  // every outcome reaches the long-term outcome, every arrow has a
  // rationale, every belief has been sorted. Stage 3 locks screens 7-9 on it.
  function designChecks(s) {
    var un = unconnected(s), unK = unconnectedClusters(s);
    var noRat = s.links.filter(function (l) { return !wordCheck(l.rationale, CONFIG.words.rationale).ok; });
    var waiting = s.beliefs.filter(function (b) { return !b.sort; });
    var cyc = findCycle(s);
    return [
      check(s.outcomes.length > 0, 'The backwards map has no outcomes yet (screen 5).'),
      check(!un.length && !unK.length, 'Connect every outcome to the long-term outcome: ' +
        un.map(function (o) { return nodeName(s, o.id); }).concat(unK.map(function (k) { return nodeName(s, k.id); })).join(', ') + ' do not reach it yet (screen 5).'),
      check(!noRat.length, 'Give every arrow a rationale: ' + noRat.map(function (l) { return 'arrow ' + arrowNo(s, l.id); }).join(', ') + ' (screen 5).'),
      check(!waiting.length, 'Sort every belief: ' + plural(waiting.length, 'belief') + ' waiting (screen 6).'),

  var SCREEN_CHECKS = { 1: screen1Checks, 2: screen2Checks, 3: screen3Checks, 4: screen4Checks, 5: screen5Checks, 6: screen6Checks };

  function weekChecks(s, week) {
    var out = [];
    CONFIG.screens.forEach(function (sc) {
      if (sc.week === week && sc.built) out = out.concat(screenChecks(s, sc.no).map(function (c) { return { ok: c.ok, msg: 'Screen ' + sc.no + ': ' + c.msg }; }));
    });
    return out;
  }
  function selfCheckChecks(s, week) {

  function closeWeek(s, week, now) {
    var g = gateResult(weekChecks(s, week).concat(selfCheckChecks(s, week)));
    if (!g.ok) return g.failing;
    s.selfChecks['week' + week].completedAt = nowIso(now);
    return [];
  }

  // Which screens can be opened. Built screens open once the screens before
  // them pass, and stay open once reached. Unbuilt screens always open (they
  // show what is coming and the reading).
  function screenEnabled(s, no) {
    var sc = SCREEN[no];
    if (!sc) return false;
    if (!sc.built || no === 1 || no <= s.ui.reached) return true;
    for (var i = 1; i < no; i++) if (SCREEN[i].built && !gateResult(screenChecks(s, i)).ok) return false;
    return true;
  }
  function currentWeek(s) {
    for (var i = 0; i < WEEKS.length; i++) if (!weekClosed(s, WEEKS[i])) return WEEKS[i];
    return 13;
  }

  // ==========================================================================
  // Find out first: one shared store; every item shows its source.
  // ==========================================================================
  function addFof(s, text, source, refId) {
    var item = { id: uid('f'), text: String(text || ''), source: CONFIG.fofSources[source] ? source : 'manual', refId: refId == null ? '' : String(refId) };
    s.findOutFirst.push(item);
    return item;
  }
  function removeFof(s, id) { s.findOutFirst = s.findOutFirst.filter(function (f) { return f.id !== id; }); }
  function fofStakeholderText(name) { return CONFIG.fofStakeholderText.replace('{name}', String(name || '').trim() || 'this stakeholder'); }
  // Keep stakeholder items in step: one per stakeholder marked "can we ask?:
  // No"; removed when the answer changes or the stakeholder goes.
  function syncStakeholderFof(s) {
    var want = {};
    s.stakeholders.forEach(function (x) { if (x.canWeAsk === 'no') want[x.id] = x; });
    s.findOutFirst = s.findOutFirst.filter(function (f) { return f.source !== 'stakeholder' || want[f.refId]; });
    Object.keys(want).forEach(function (id) {
      var f = s.findOutFirst.filter(function (x) { return x.source === 'stakeholder' && x.refId === id; })[0];
      if (f) f.text = fofStakeholderText(want[id].name);
      else addFof(s, fofStakeholderText(want[id].name), 'stakeholder', id);
    });
  }

  // ==========================================================================
  // Revision log: edits to a screen of a closed week, with a timestamp. Edits
  // to the same field within CONFIG.logCoalesceMinutes make one entry.
  // ==========================================================================
  function logEdit(s, screenNo, change, now) {
    var sc = SCREEN[screenNo];
    if (!sc || !weekClosed(s, sc.week)) return false;
    var at = nowIso(now), last = s.revisionLog[s.revisionLog.length - 1];
    if (last && last.screen === screenNo && last.change === change &&
        (new Date(at) - new Date(last.at)) <= CONFIG.logCoalesceMinutes * 60000) {
      last.at = at;
      return true;
    }
    s.revisionLog.push({ at: at, week: sc.week, screen: screenNo, change: change });
    return true;
  }

  // ==========================================================================
  // Screen 2: client claims and chain
  // ==========================================================================
  function claimById(s, id) { return s.clientTheory.claims.filter(function (c) { return c.id === id; })[0]; }
  function addClaim(s) { var c = { id: uid('c'), text: '', slide: '' }; s.clientTheory.claims.push(c); return c; }
  function removeClaim(s, id) {
    var ct = s.clientTheory;
    ct.claims = ct.claims.filter(function (c) { return c.id !== id; });
    ct.order = ct.order.filter(function (x) { return x !== id; });
    pruneLinkEvidence(s);
  }
  function placeClaim(s, id) { if (claimById(s, id) && s.clientTheory.order.indexOf(id) === -1) s.clientTheory.order.push(id); }
  function unplaceClaim(s, id) { s.clientTheory.order = s.clientTheory.order.filter(function (x) { return x !== id; }); pruneLinkEvidence(s); }
  function moveClaim(s, id, dir) {
    var o = s.clientTheory.order, i = o.indexOf(id), j = i + dir;
    if (i === -1 || j < 0 || j >= o.length) return false;
    o[i] = o[j]; o[j] = id;
    pruneLinkEvidence(s);
    return true;
  }
  // Drop link marks for links no longer in the chain.
  function pruneLinkEvidence(s) {
    var keep = {}, le = s.clientTheory.linkEvidence, out = {};
    chainLinks(s).forEach(function (l) { keep[l.key] = 1; });
    Object.keys(le).forEach(function (k) { if (keep[k]) out[k] = le[k]; });
    s.clientTheory.linkEvidence = out;
  }

  // ==========================================================================
  // Week 10: the backwards map as a graph. Nodes are outcomes, clusters and
  // the long-term outcome (LTO_ID, whose text is lto.text from screen 3).
  // Arrows run upwards, from a precondition to the outcome it is needed for.

      edges.forEach(function (e) { (groups[e[key]] = groups[e[key]] || []).push(e); });
      Object.keys(groups).forEach(function (id) {
        var g = groups[id], n = byNode[id];
        g.sort(function (a, b) { return centreOf(a[other]) - centreOf(b[other]); });
        var step = Math.min(16, (n.w - 20) / Math.max(1, g.length));
        g.forEach(function (e, i) { e[end] = n.x + n.w / 2 + (i - (g.length - 1) / 2) * step; });
      });
    }
    spread('from', 'x1', 'hopUp');
    spread('to', 'x2', 'hopDown');
    edges.forEach(function (e) {
      var a = byNode[e.from], b = byNode[e.to];
      e.y1 = a.y; e.y2 = b.y + b.h;
      // Points from the source upwards: through each waypoint's row.
      e.points = [[e.x1, e.y1]];
      e.way.slice().reverse().forEach(function (d) {
        var cx = d.x + d.w / 2;
        e.points.push([cx, d.rowBottom], [cx, d.rowTop]);
      });
      e.points.push([e.x2, e.y2]);
    });
    return { width: Math.ceil(width), height: Math.ceil(height), nodes: nodes, edges: edges, ceilingY: ceilingY, waypoints: dummies };
  }
  // The SVG path of an arrow: curves between rows, straight through the
  // rows it crosses.
  function edgePath(e) {
    var p = e.points, d = 'M' + p[0][0] + ',' + p[0][1];
    for (var i = 1; i < p.length; i++) {
      var a = p[i - 1], b = p[i];
      if (a[0] === b[0] && i % 2 === 0) { d += ' L' + b[0] + ',' + b[1]; continue; }
      var dy = Math.max(12, a[1] - b[1]) * 0.45;
      d += ' C' + a[0] + ',' + (a[1] - dy) + ' ' + b[0] + ',' + (b[1] + dy) + ' ' + b[0] + ',' + (i === p.length - 1 ? b[1] + 1 : b[1]);
    }
    return d;
  }
  // Pairs of boxes that overlap (a member sits inside its own cluster, which
  // is not an overlap). Used by the tests; an empty list is the rule.
  function layoutOverlaps(lay) {
    var out = [], n = lay.nodes;
    for (var i = 0; i < n.length; i++) for (var j = i + 1; j < n.length; j++) {
      var a = n[i], b = n[j];
      if ((a.kind === 'member' && a.cluster === b.id) || (b.kind === 'member' && b.cluster === a.id)) continue;
      if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h) out.push([a.id, b.id]);
    }
    return out;
  }

  // ==========================================================================
  // Week 7 import
  // ==========================================================================
  function validateWeek7(obj) {
    if (!isObj(obj) || obj.tool !== CONFIG.week7ToolId) return ['This file is not a week 7 \u201CWhy Bodø?\u201D export.'];
    if (obj.schemaVersion !== CONFIG.week7SchemaVersion) return ['This week 7 file is from a different version of \u201CWhy Bodø?\u201D (schemaVersion ' + esc(obj.schemaVersion) + '); this tool reads schemaVersion ' + CONFIG.week7SchemaVersion + '.'];
    if (!Array.isArray(obj.sentences)) return ['This week 7 file has no sentences.'];
    return [];
  }
  function week7Summary(obj, now) {
    return {
      group: isObj(obj.group) ? String(obj.group.name || '') : '',
      exportedAt: String(obj.exportedAt || ''),
      importedAt: nowIso(now),
      sentences: obj.sentences.filter(function (x) { return isObj(x) && x.locked && String(x.final || '').trim(); })
        .map(function (x) { return { member: String(x.member || ''), text: String(x.final).trim() }; })
    };
  }

  // ==========================================================================
  // Export and import
  // ==========================================================================
  function buildExport(s, now) {
    return {
      tool: CONFIG.toolId,
      schemaVersion: CONFIG.schemaVersion,
      exportedAt: nowIso(now),
      exportId: s.meta.exportId,
      group: { name: String(s.group.name || '').trim(), members: members(s) },
      state: clone(s)
    };
  }
  function validateImport(obj) {
    if (!isObj(obj)) return ['This file is not a workbench export.'];
    if (obj.tool === CONFIG.week7ToolId) return ['This is a week 7 file. Load it on screen 1 with \u201CLoad week 7 export\u201D.'];
    if (obj.tool !== CONFIG.toolId) return ['This file is not a Bodø Theory of Change export.'];
    if (typeof obj.schemaVersion !== 'number') return ['This file has no schema version.'];
    if (obj.schemaVersion > CONFIG.schemaVersion) return ['This file was made by a newer version of the workbench.'];
    if (!isObj(obj.state)) return ['The saved work in this file is missing.'];
    if (obj.state.group !== undefined && !isObj(obj.state.group)) return ['The saved work in this file is damaged (group).'];
    return [];
  }

  // The outcomes framework as inline SVG. opts.interactive: every outcome,
  // cluster and arrow is a focusable button (Enter or Space opens its
  // editor). Without it (print, report) the SVG is a plain picture.
  function charHex(id) { var c = CONFIG.characteristics.filter(function (x) { return x.id === id; })[0]; return c ? c.hex : '#8A7A62'; }
  function lensShort(id) { var l = CONFIG.lenses.filter(function (x) { return x.id === id; })[0]; return l ? l.label.slice(0, 3).toUpperCase() : ''; }
  function svgText(lines, x, y, cls) {
    return '<text class="' + cls + '" x="' + x + '" y="' + y + '">' + lines.map(function (l, i) {
      return '<tspan x="' + x + '" dy="' + (i ? DG.lineH : 0) + '">' + esc(l) + '</tspan>';
    }).join('') + '</text>';
  }
  function diagramSvg(s, opts) {
    opts = opts || {};
    var lay = layoutMap(s), live = !!opts.interactive, adj = graph(s), h = '';
    function btn(action, arg, label) {
      return live ? ' tabindex="0" role="button" data-action="' + action + '" data-arg="' + esc(arg) + '" aria-label="' + esc(label) + '"' : '';
    }
    h += '<svg class="dg" viewBox="0 0 ' + lay.width + ' ' + lay.height + '" width="' + lay.width + '" height="' + lay.height + '"' +
      ' role="' + (live ? 'group' : 'img') + '" aria-label="Outcomes framework: ' + plural(s.outcomes.length, 'outcome') + ', ' + plural(s.links.length, 'arrow') + '">' +
      '<defs><marker id="dg-head' + (live ? '' : '-p') + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
      '<path d="M0,0 L10,5 L0,10 z" fill="#2A1F18"/></marker></defs>';
    // Accountability ceiling.
    h += '<line class="dg-ceiling" x1="' + DG.margin / 2 + '" x2="' + (lay.width - DG.margin / 2) + '" y1="' + lay.ceilingY + '" y2="' + lay.ceilingY + '"/>' +
      '<text class="dg-ceiling-label" x="' + DG.margin / 2 + '" y="' + (lay.ceilingY - 6) + '">ACCOUNTABILITY CEILING</text>';
    // Boxes.
    lay.nodes.forEach(function (n) {
      if (n.kind === 'goal' || n.kind === 'lto') {
        var top = n.kind === 'goal' ? 'ULTIMATE GOAL · ABOVE THE CEILING' : 'LONG-TERM OUTCOME';
        h += '<g class="dg-node dg-' + n.kind + '"' + btn('dg-open', n.id, (n.kind === 'goal' ? 'Ultimate goal: ' : 'Long-term outcome: ') + n.lines.join(' ') + '. Edit on screen 3.') + '>' +
          '<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '"/>' +
          '<text class="dg-head" x="' + (n.x + DG.pad) + '" y="' + (n.y + DG.pad + 9) + '">' + top + '</text>' +
          svgText(n.lines, n.x + DG.pad, n.y + DG.pad + DG.headH + 11, 'dg-txt dg-big') + '</g>';
        return;
      }
      if (n.kind === 'cluster') {
        var k = clusterById(s, n.id), kNo = s.clusters.indexOf(k) + 1, kOk = reaches(adj, k.id, LTO_ID);
        h += '<g class="dg-node dg-cluster' + (kOk ? '' : ' dg-loose') + '"' + btn('dg-open', n.id, 'Cluster ' + kNo + ': ' + (k.label || 'no label') + ', ' + plural(n.members.length, 'outcome') + (kOk ? '' : ', not yet connected')) + '>' +
          '<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '"/>' +
          '<text class="dg-head" x="' + (n.x + DG.pad) + '" y="' + (n.y + 15) + '">' + esc(('Cluster ' + kNo + ' · ' + (k.label || '')).toUpperCase().slice(0, Math.max(24, Math.floor(n.w / 6.5)))) + '</text></g>';
        return;
      }
      var o = outcomeById(s, n.id), no = s.outcomes.indexOf(o) + 1, ok = reaches(adj, o.id, LTO_ID);
      var col = pathwayColour(s, o.pathway), lv = CONFIG.outcomeLevels.filter(function (x) { return x.id === o.level; })[0];
      var head = short((no + ' · ' + (lv ? lv.label : '?') + (o.pathway ? ' · ' + o.pathway : '')).toUpperCase(), 26);
      h += '<g class="dg-node dg-outcome' + (ok ? '' : ' dg-loose') + '"' + btn('dg-open', n.id, 'Outcome ' + no + ': ' + (o.text || 'no text yet') + (o.pathway ? ', pathway ' + o.pathway : '') + (ok ? '' : ', not yet connected to the long-term outcome')) + '>' +
        '<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '"/>' +
        '<rect class="dg-accent" x="' + n.x + '" y="' + n.y + '" width="6" height="' + n.h + '" style="fill:' + col + '"/>' +
        '<text class="dg-head" x="' + (n.x + DG.pad + 2) + '" y="' + (n.y + DG.pad + 9) + '">' + esc(head) + '</text>' +
        svgText(n.lines, n.x + DG.pad + 2, n.y + DG.pad + DG.headH + 10, 'dg-txt');
      var py = n.y + n.h - DG.pad - 8;
      o.characteristics.forEach(function (cid, j) { h += '<rect class="dg-pip" x="' + (n.x + DG.pad + 2 + j * 11) + '" y="' + py + '" width="8" height="8" style="fill:' + charHex(cid) + '"/>'; });
      var lens = o.lenses.map(lensShort).filter(Boolean).join(' ');
      if (lens) h += '<text class="dg-lens" x="' + (n.x + n.w - DG.pad) + '" y="' + (py + 8) + '" text-anchor="end">' + esc(lens) + '</text>';
      h += '</g>';
    });
    // Arrows, drawn last so they stay visible; a dashed arrow has no
    // rationale yet. The number sits just above the source box.
    lay.edges.forEach(function (e) {
      var no = arrowNo(s, e.id), d = edgePath(e);
      // Gold and orange are darkened on arrows, for contrast on white.
      var src = outcomeById(s, e.from), col = src ? pathwayColour(s, src.pathway) : '#2A1F18';
      col = { '#D4A020': '#7A5800', '#CC6830': '#9A4A1A', '#C85218': '#9A4A1A' }[col] || col;
      h += '<g class="dg-arrow' + (e.rationale ? '' : ' dg-norat') + '"' + btn('dg-open', e.id, 'Arrow ' + no + ': ' + nodeName(s, e.from) + ' leads to ' + nodeName(s, e.to) + (e.rationale ? '' : ', rationale missing')) + '>' +
        '<path class="dg-hit" d="' + d + '"/>' +
        '<path class="dg-line" d="' + d + '" style="stroke:' + col + '" marker-end="url(#dg-head' + (live ? '' : '-p') + ')"/>' +
        '<rect class="dg-badge" x="' + (e.x1 - 9) + '" y="' + (e.y1 - 22) + '" width="18" height="15"/>' +
        '<text class="dg-badge-t" x="' + e.x1 + '" y="' + (e.y1 - 11) + '" text-anchor="middle">' + no + '</text></g>';

  }
  function diagramLegend(s) {
    var p = pathwayList(s);
