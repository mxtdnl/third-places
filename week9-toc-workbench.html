      return '<li><span class="sw" style="background:' + pathwayColour(s, name) + '"></span>' + esc(name) + '</li>';
    }).join('') + '<li><span class="sw dashed"></span>Dashed arrow: no rationale yet</li><li><span class="sw loose"></span>Dashed box: not yet connected</li></ul>';
  }

  // ==========================================================================
  // Outputs: registries. Later stages add sections and card types here; the
  // report, Copy as text and the A6 printer read only these lists.
  //   OUTPUT_SECTIONS: { id, week, title, colour, has(s), html(s), text(s) }
  //   CARD_TYPES:      { id, title, ready(s), cards(s) -> [card] }
  //   card = { eyebrow, colour, text, details: [string], foot }
  // ==========================================================================
  function dash(v) { var t = String(v == null ? '' : v).trim(); return t || '—'; }
  function repItem(k, v) { return '<div class="rep-item"><div class="k">' + esc(k) + '</div><div>' + esc(dash(v)) + '</div></div>'; }
  function claimLabel(id) { var d = CONFIG.declineClaims.filter(function (c) { return c.id === id; })[0]; return d ? d.label.toUpperCase() : id; }
  function ceilingLabel(id) { var d = CONFIG.ceilingPositions.filter(function (c) { return c.id === id; })[0]; return d ? d.label : ''; }
  function levelLabel(id) { var d = CONFIG.levels.filter(function (c) { return c.id === id; })[0]; return d ? d.label : ''; }
  function yesNo(v) { return v === 'yes' ? 'Yes' : v === 'no' ? 'No' : ''; }
  function chainText(s) {
    var ct = s.clientTheory, out = [];
    ct.order.forEach(function (id, i) {
      var c = claimById(s, id);
      if (!c) return;
      out.push((i + 1) + '. ' + dash(c.text) + ' (slide ' + dash(c.slide) + ')');
      var next = ct.order[i + 1];
      if (next) {
        var m = ct.linkEvidence[id + '>' + next];
        out.push('   ↓ ' + (m === 'given' ? 'evidence given in the brief' : m === 'not' ? 'evidence not given' : 'not marked'));
      }
    });
    var unplaced = ct.claims.filter(function (c) { return ct.order.indexOf(c.id) === -1; });
    unplaced.forEach(function (c) { out.push('(not placed) ' + dash(c.text) + ' (slide ' + dash(c.slide) + ')'); });
    return out;
  }

  function lensLabel(id) { var l = CONFIG.lenses.filter(function (x) { return x.id === id; })[0]; return l ? l.label : ''; }
  function charLabel(id) { var c = CONFIG.characteristics.filter(function (x) { return x.id === id; })[0]; return c ? c.label : ''; }
  function verdictLabel(id) { var v = CONFIG.bodoVerdicts.filter(function (x) { return x.id === id; })[0]; return v ? v.label : ''; }
  function stanceLabel(id) { var v = CONFIG.stances.filter(function (x) { return x.id === id; })[0]; return v ? v.label : ''; }
  function ratingLabel(id) { var v = CONFIG.ratingScale.filter(function (x) { return x.id === id; })[0]; return v ? v.label : ''; }
  function evRefs(s, ids) { return ids.map(function (x) { var e = evidenceById(s, x); return e ? 'E' + (s.evidence.indexOf(e) + 1) : ''; }).filter(Boolean).join(', '); }
  function evSourceText(e) {
    var t = evType(e.type);
    return (t ? t.label : 'Type not chosen') + ': ' + dash(e.source) + (t && t.slide ? ', slide ' + dash(e.slide) : '') + (e.member ? ' (logged by ' + e.member + ')' : '');
  }
  function ratingsText(e) {
    var r = CONFIG.criteria.filter(function (c) { return e.ratings[c.id]; }).map(function (c) { return c.label + ' ' + ratingLabel(e.ratings[c.id]); });
    return r.length ? r.join('; ') : 'Not rated';
  }
  function outcomeLine(s, o) {
    var i = s.outcomes.indexOf(o), lv = CONFIG.outcomeLevels.filter(function (x) { return x.id === o.level; })[0];
    var tags = [lv ? lv.label : 'level not set'].concat(o.lenses.map(lensLabel), o.characteristics.map(charLabel)).filter(Boolean).join('; ');
    var to = inCluster(s, o) ? 'in ' + nodeName(s, o.clusterId) : (o.leadsTo.length ? 'leads to ' + o.leadsTo.map(function (t) { return nodeName(s, t); }).join(', ') : 'not connected');
    return 'Outcome ' + (i + 1) + ': ' + dash(o.text) + ' [' + tags + '] (' + to + ')';
  }
  // The framework as text: the top of the map, each pathway's outcomes,
  // the clusters, then every arrow with its rationale.
  function mapText(s) {
    var out = ['Ultimate goal (above the accountability ceiling): ' + dash(s.lto.ceiling.ultimateGoal), 'Long-term outcome: ' + dash(s.lto.text)];
    var paths = pathwayList(s);
    paths.concat(['']).forEach(function (p) {
      var list = s.outcomes.filter(function (o) { return pathwayIndex(s, o.pathway) === (p ? pathwayIndex(s, p) : -1); });
      if (!list.length) return;
      out.push('Pathway: ' + (p || '(not named)'));
      list.forEach(function (o) { out.push('  ' + outcomeLine(s, o)); });
    });
    s.clusters.forEach(function (k, i) {
      out.push('Cluster ' + (i + 1) + ': ' + dash(k.label) + ' (' + clusterMembers(s, k).map(function (o) { return nodeName(s, o.id); }).join(', ') +
        '; leads to ' + (k.leadsTo.length ? nodeName(s, k.leadsTo[0]) : 'nothing yet') + ')');
    });
    out.push('Arrows and rationales:');
    s.links.forEach(function (l, i) {
      out.push('  ' + (i + 1) + '. \u201C' + nodeText(s, l.from) + '\u201D is needed for \u201C' + nodeText(s, l.to) + '\u201D because ' + dash(l.rationale) +
        (l.evidenceIds.length ? ' [evidence ' + evRefs(s, l.evidenceIds) + ']' : ''));
    });
    if (!s.links.length) out.push('  —');
    return out;
  }
  function registerText(s) {
    var out = ['Assumption register:'];
    s.assumptions.forEach(function (a, i) {
      var l = linkById(s, a.linkId);
      out.push('  A' + (i + 1) + '. ' + dash(a.text) + ' (arrow ' + (l ? arrowNo(s, l.id) + ', ' + linkName(s, l) : 'not chosen') + '; ' + dash(lensLabel(a.lens)) + '; evidence ' + dash(evRefs(s, a.evidenceIds)) + ')');
    });
    if (!s.assumptions.length) out.push('  —');
    out.push('Evidence log:');
    s.evidence.forEach(function (e, i) {
      out.push('  E' + (i + 1) + '. ' + dash(e.summary) + ' (' + evSourceText(e) + '). Ratings: ' + ratingsText(e) + '. Bodø: ' + dash(verdictLabel(e.bodoVerdict)));
    });
    if (!s.evidence.length) out.push('  —');
    out.push('Reverse Import:');
    s.reverseImport.forEach(function (r) {
      var l = linkById(s, r.linkId);
      out.push('  ' + r.member + ': ' + (r.absent ? 'absent' : dash(r.course) + ', ' + dash(r.claim) + ' (' + dash(stanceLabel(r.stance)) + ' arrow ' + (l ? arrowNo(s, l.id) : '—') + ')'));
    });
    out.push('Sorter:');
    s.beliefs.forEach(function (b, i) { out.push('  ' + (i + 1) + '. ' + dash(b.text) + ' → ' + sortLabel(b.sort)); });
    if (!s.beliefs.length) out.push('  —');
    var swept = s.links.filter(function (l) { return s.sweep[l.id]; }).length;
    out.push('Completeness pass: ' + swept + ' of ' + s.links.length + ' arrows checked.');
    return out;
  }

  var OUTPUT_SECTIONS = [
    { id: 'group', week: 9, title: 'Group and roles', colour: '#5C3A96',
      has: function () { return true; },
      text: function (s) {
        var out = ['Group: ' + dash(s.group.name), 'Members: ' + dash(members(s).join(', '))];
        WEEKS.forEach(function (w) {
          var r = s.roles['week' + w], keys = CONFIG.roles.filter(function (x) { return r[x.id]; });
          if (keys.length) out.push('Roles, week ' + w + ': ' + keys.map(function (x) { return x.name + ' ' + r[x.id]; }).join('; '));
        });
        if (s.imported.week7) out.push('Week 7 export loaded: ' + s.imported.week7.sentences.length + ' sentences');

      },
      html: function (s) { return this.text(s).map(function (l) { return '<div class="rep-item">' + esc(l) + '</div>'; }).join(''); } },
    { id: 'client', week: 9, title: 'The client\u2019s intended impact (screen 2)', colour: '#D4A020',
      has: function (s) { return s.clientTheory.claims.length > 0 || !!s.clientTheory.ambition; },
      text: function (s) {
        var ct = s.clientTheory;
        return ['Claims, in causal order:'].concat(chainText(s)).concat([
          'Stated ambition: ' + dash(ct.ambition) + ' (slide ' + dash(ct.ambitionSlide) + ')',
          'Whose community? ' + dash(ct.whoseCommunity)
        ]);
      },
      html: function (s) {
        var ct = s.clientTheory;
        return '<div class="rep-item"><div class="k">Claims, in causal order</div>' + chainText(s).map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('') + '</div>' +
          repItem('Stated ambition (slide ' + dash(ct.ambitionSlide) + ')', ct.ambition) + repItem('Whose community?', ct.whoseCommunity);
      } },
    { id: 'lto', week: 9, title: 'Problem and long-term outcome (screen 3)', colour: '#B52838',
      has: function (s) { return !!(s.problem.statement || s.lto.text); },
      text: function (s) {
        var p = s.problem, l = s.lto, out = [
          'Problem statement: ' + dash(p.statement),

        ];

        out.push('Ultimate goal (above the accountability ceiling): ' + dash(l.ceiling.ultimateGoal));
        out.push('Client\u2019s ambition: ' + dash(ceilingLabel(l.ceiling.ambitionPosition)) + '. Because: ' + dash(l.ceiling.reason));
        return out;
      },
      html: function (s) {
        var p = s.problem, l = s.lto;
        return repItem('Problem statement', p.statement) + repItem('Decline claims', p.claims.map(claimLabel).join(', ')) +
          repItem('Where / for whom', dash(p.where) + ' / ' + dash(p.forWhom)) +
          '<div class="rep-item"><div class="k">Long-term outcome</div><div style="font-size:11pt;font-weight:700">' + esc(dash(l.text)) + '</div></div>' +
          (l.lintReason && !ltoLint(l.text).ok ? repItem('Wording kept because', l.lintReason) : '') +
          l.definitions.map(function (d) { return repItem('Definition: ' + dash(d.term), d.meaning); }).join('') +
          repItem('Ultimate goal (above the accountability ceiling)', l.ceiling.ultimateGoal) +
          repItem('Client\u2019s ambition: ' + dash(ceilingLabel(l.ceiling.ambitionPosition)), l.ceiling.reason);
      } },
    { id: 'stakeholders', week: 9, title: 'Stakeholders (screen 4)', colour: '#7E58A8',
      has: function (s) { return s.stakeholders.length > 0; },
      text: function (s) {
        return s.stakeholders.map(function (x) {
          return '- ' + dash(x.name) + ': affected ' + dash(yesNo(x.affected)) + '; influence ' + dash(levelLabel(x.influence)) +
            '; interest ' + dash(levelLabel(x.interest)) + '; can we ask? ' + dash(yesNo(x.canWeAsk)) +
            (x.fromBrief ? '; from the brief, slide ' + dash(x.slide) : '');
        });

  // ==========================================================================

  var state, els = {};

  function quote(text, ref) { return '<q>' + esc(text) + '</q><cite>' + esc(ref) + '</cite>'; }
  function guide(label, inner) { return '<div class="guide"><span class="k">' + esc(label) + '</span>' + inner + '</div>'; }
  function wcText(id, label, path, value, min, opts) {
    opts = opts || {};
    return '<div class="field"><label for="' + id + '">' + esc(label) + '</label>' +
      (opts.hint ? '<p class="quiet" id="' + id + '-hint">' + esc(opts.hint) + '</p>' : '') +
      '<textarea id="' + id + '" data-f="' + esc(path) + '" data-min="' + min + '" data-label="' + esc(opts.logLabel || label) + '"' +
      (opts.short ? ' class="short"' : '') + (opts.lint ? ' data-lint="' + opts.lint + '"' : '') + (opts.readonly ? ' readonly' : '') +
      ' aria-describedby="' + id + '-wc' + (opts.hint ? ' ' + id + '-hint' : '') + '">' + esc(value) + '</textarea>' +
      '<div class="word-count ' + (wordCheck(value, min).ok ? 'ok' : 'bad') + '" id="' + id + '-wc" aria-live="polite">' + wordLabel(value, min) + '</div>' +
      (opts.lint ? '<div class="warn" id="' + id + '-warn" aria-live="polite">' + (opts.lint === 'outcome' ? outcomeLintHtml(value) : lintHtml(value)) + '</div>' : '') +

  function lintHtml(v) {

  function textInput(id, label, path, value, opts) {

      '<input type="text" id="' + id + '" data-f="' + esc(path) + '" data-label="' + esc(opts.logLabel || label) + '" value="' + esc(value) + '"' +
      (opts.slide ? ' class="slide" inputmode="numeric" autocomplete="off"' : '') + (opts.max ? ' maxlength="' + opts.max + '"' : '') +
      (opts.list ? ' list="' + opts.list + '" autocomplete="off"' : '') + '></div>';

  function choice(name, value, label, checked, colour, type, path, extraCls) {

      (checked ? ' checked' : '') + '><span>' + label + '</span></label>';
  }
  function gateHtml(id, checks, button) {
    var g = gateResult(checks);

  // Only the failing checks, for long screens (the full list in the gate).

      w7.sentences.forEach(function (x, i) {
        h += '<div class="draft"><span class="who">' + esc(x.member || 'Student') + '</span><p>' + esc(x.text) + '</p>' +

      '</div></details>';

    h += '<section class="panel" style="' + panelStyle(sc) + '">';
    h += '<div class="part" style="--part-colour:var(--char-2)"><h3>1. Problem statement</h3><div>' +
      wcText('pr-st', 'Problem statement', 'problem.statement', p.statement, CONFIG.words.problem, { hint: G.statementHelp }) +
      '<fieldset><legend>Decline claim(s) it names</legend><div class="choices">' +
      CONFIG.declineClaims.map(function (d) { return choice('pclaim', d.id, esc(d.label) + '<span class="sr-only">: ' + esc(d.help) + '</span>', p.claims.indexOf(d.id) !== -1, d.colour, 'checkbox'); }).join('') +
      '</div><p class="quiet" style="margin-top:0.35rem">' + CONFIG.declineClaims.map(function (d) { return '<b>' + esc(d.label) + '</b>: ' + esc(d.help); }).join(' ') + '</p></fieldset>' +
      '<div class="two-col">' + textInput('pr-where', 'Where', 'problem.where', p.where, { max: 120 }) + textInput('pr-who', 'For whom', 'problem.forWhom', p.forWhom, { max: 160 }) + '</div>' +
      '</div>' + guide('Problem statement', quote(G.statement, G.statementRef)) + '</div>';

    var lint = ltoLint(l.text);
    h += '<div class="part" style="--part-colour:var(--char-4)"><h3>2. Positive opposite: the long-term outcome</h3><div>' +
      wcText('lto-text', 'Long-term outcome, phrased as a condition', 'lto.text', l.text, CONFIG.words.lto, { short: true, lint: 'lto' }) +
      '<div id="lto-reason-wrap"' + (lint.ok ? ' hidden' : '') + '>' +
      wcText('lto-reason', 'Keeping a flagged word? Say why', 'lto.lintReason', l.lintReason, CONFIG.words.lintReason, { short: true }) + '</div>' +
      '</div>' + guide('Positive opposite', quote(G.opposite, G.oppositeRef)) + '</div>';

    h += '<div class="part" style="--part-colour:var(--char-6)"><h3>3. Shared definitions</h3><div>';
    l.definitions.forEach(function (d, i) {
      h += '<div class="item" style="--item-colour:var(--char-6)"><div class="item-head"><span class="tag">' + (i + 1) + '</span><span class="grow"></span>' +
        '<button type="button" class="btn btn-danger btn-small" data-action="def-remove" data-arg="' + i + '" aria-label="Remove definition ' + (i + 1) + '">Remove</button></div>' +
        textInput('def-t' + i, 'Term ' + (i + 1), 'lto.definitions.' + i + '.term', d.term, { max: 60, logLabel: 'Definition term' }) +
        wcText('def-m' + i, 'What we mean by it, including its boundaries', 'lto.definitions.' + i + '.meaning', d.meaning, CONFIG.words.meaning, { short: true, logLabel: 'Definition meaning' }) + '</div>';
    });
    h += '<button type="button" class="btn btn-accent" data-action="def-add">Add a definition</button></div>' +
      guide('Definitions', quote(G.definitions, G.definitionsRef)) + '</div>';

    var c = l.ceiling;
    h += '<div class="part" style="--part-colour:var(--char-1)"><h3>4. Accountability ceiling</h3><div>' +
      wcText('ce-goal', 'Ultimate goal (above the ceiling: linked to, not held to)', 'lto.ceiling.ultimateGoal', c.ultimateGoal, CONFIG.words.ultimateGoal, { short: true }) +
      '<fieldset role="radiogroup"><legend>Where does the client\u2019s stated ambition sit?</legend><div class="choices">' +
      CONFIG.ceilingPositions.map(function (x) { return choice('ceiling', x.id, '<b>' + esc(x.label) + '</b>&nbsp;· ' + esc(x.help), c.ambitionPosition === x.id, x.colour, 'radio', 'lto.ceiling.ambitionPosition', ' block'); }).join('') +
      '</div></fieldset>' +
      (state.clientTheory.ambition ? '<p class="quiet">Your record of the ambition (screen 2): ' + esc(state.clientTheory.ambition) + '</p>' : '') +
      wcText('ce-reason', 'Why there?', 'lto.ceiling.reason', c.reason, CONFIG.words.ceilingReason) +
      '</div>' + guide('Ceiling', quote(G.ceiling, G.ceilingRef) + '<p style="margin-top:0.4rem">' + quote(G.ceilingQuestion, G.ceilingQuestionRef) + '</p>') + '</div>';
    h += '</section>' + screenGate(3);
    return h;
  }

  // ── Screen 4: stakeholders and the week 9 close ──
  function renderStakeholders(sc) {
    var G = CONFIG.guidance.stakeholders, h = screenHead(sc);
    h += '<p class="notice">' + esc(G.rule) + '</p>';

      '<details class="drawer"><summary>The eight questions (notes optional)</summary><div>' +
      CONFIG.stakeholderQuestions.map(function (q, i) {
        return '<div class="field"><label for="sq' + i + '" style="text-transform:none;letter-spacing:0;font-size:0.9rem;color:var(--text)">' + (i + 1) + '. ' + esc(q) + '</label>' +
          '<input type="text" id="sq' + i + '" data-f="stakeholderQuestions.q' + (i + 1) + '" data-label="Stakeholder question notes" value="' + esc(state.stakeholderQuestions['q' + (i + 1)]) + '"></div>';
      }).join('') + '<p class="quiet">Questions: ' + esc(CONFIG.stakeholderQuestionsRef) + '</p></div></details></div>' +

        '<fieldset role="radiogroup"><legend>Can we ask them?</legend><div class="choices">' +

        choice('st|' + i + '|ask', 'no', 'No', x.canWeAsk === 'no', 'var(--char-2)', 'radio', base + 'canWeAsk') + '</div></fieldset>' +
        '<fieldset role="radiogroup"><legend>Influence</legend><div class="choices">' +
        CONFIG.levels.map(function (lv) { return choice('st|' + i + '|inf', lv.id, lv.label, x.influence === lv.id, 'var(--char-6)', 'radio', base + 'influence'); }).join('') + '</div></fieldset>' +
        '<fieldset role="radiogroup"><legend>Interest</legend><div class="choices">' +
        CONFIG.levels.map(function (lv) { return choice('st|' + i + '|int', lv.id, lv.label, x.interest === lv.id, 'var(--char-8)', 'radio', base + 'interest'); }).join('') + '</div></fieldset>' +
        '</div><div class="row"><label class="choice"><input type="checkbox" data-f="' + base + 'fromBrief"' + (x.fromBrief ? ' checked' : '') + '><span>Named in the client brief</span></label>' +
        (x.fromBrief ? textInput('st-s' + x.id, 'Slide number', base + 'slide', x.slide, { slide: true, max: 3, logLabel: 'Stakeholder slide' }) : '') + '</div>' +
        (x.canWeAsk === 'no' ? '<p class="quiet">Added to Find out first.</p>' : '') + '</div>';
    });
    h += '<button type="button" class="btn btn-accent" data-action="st-add">Add a stakeholder</button></div>' +
      guide('Rating', quote(G.rating, G.ratingRef)) + '</div></section>';

    h += renderClose(9);

  // The close of a week: the week gate, the self-check, then the cards.
  function renderClose(week) {
    var wk = CONFIG.weeks[week], closed = weekClosed(state, week), sc = state.selfChecks['week' + week];
    var h = '<section class="panel" id="close-' + week + '" style="--panel-colour:' + wk.colour + '"><p class="eyebrow panel-eyebrow">Week ' + week + ' close</p>' +
      '<h3>Self-check</h3><p class="quiet">' + esc(CONFIG.guidance.close) + '</p>';
    var wg = gateResult(weekChecks(state, week));
    if (!closed && !wg.ok) {
      h += gateHtml('gate-week' + week, weekChecks(state, week).filter(function (c) { return !c.ok; }));
      h += '<p class="quiet">The self-check opens when every screen of week ' + week + ' is ready.</p></section>';
      return h;
    }
    h += '<div class="guide" style="margin-bottom:0.75rem">' + quote(CONFIG.selfCheck.intro, CONFIG.selfCheck.introRef) + '</div><p>' + esc(CONFIG.selfCheck.lead) + '</p>';
    CONFIG.selfCheck.questions.forEach(function (q) {
      h += '<div class="q-block"><q>' + esc(q.quote) + '</q>' +
        wcText('sc-' + week + '-' + q.id, q.label + ' (' + q.ref + ')', 'selfChecks.week' + week + '.' + q.id, sc[q.id], CONFIG.words.selfCheck, { short: true, readonly: closed }) + '</div>';
    });
    if (closed) {
      h += '<div class="closed-box"><p><b>Week ' + week + ' closed</b> on ' + esc(sc.completedAt.slice(0, 10)) + '. Later edits to its screens go into the revision log.</p>' +
        '<div class="actions">' + (CONFIG.closeActions[week] || []).map(function (a) {
          return '<button type="button" class="btn btn-primary" data-action="' + a.action + '" data-arg="' + esc(a.arg) + '">' + esc(a.label) + '</button>';
        }).join('') + '<button type="button" class="btn btn-ghost" data-action="export">Export JSON</button></div>' +
        (CONFIG.weekCards[week] && CONFIG.weekCards[week].length ? '<div class="card-grid">' + readyCards(state, CONFIG.weekCards[week]).map(a6Html).join('') + '</div>' : '') + '</div>';
    } else {
      h += gateHtml('gate-close' + week, selfCheckChecks(state, week), { action: 'close-week', arg: String(week), label: 'Close week ' + week });
    }
    return h + '</section>';
  }

  // ── Week 10 helpers ──
  // A chip (radio or checkbox) with its own data attributes.
  // Burnt orange is darkened on chips so white text keeps AA contrast.
  function chip(o) {
    var col = o.colour === 'var(--char-3)' ? '#9A4A1A' : o.colour || 'var(--char-1)';
    return '<label class="choice' + (o.cls || '') + '" style="--choice-colour:' + col + ';--choice-ink:' + inkFor(col) + '">' +
      '<input type="' + (o.type || 'checkbox') + '"' + (o.id ? ' id="' + esc(o.id) + '"' : '') + (o.name ? ' name="' + esc(o.name) + '"' : '') +
      ' value="' + esc(o.value) + '"' + (o.attrs || '') + (o.checked ? ' checked' : '') + (o.disabled ? ' disabled' : '') + '><span><span>' + o.label + '</span></span></label>';
  }
  function selectHtml(id, label, attrs, options, value, first) {
    return '<div class="field"><label for="' + id + '">' + esc(label) + '</label><select id="' + id + '"' + attrs + '>' +
      (first ? '<option value="">' + esc(first) + '</option>' : '') +
      options.map(function (o) { return '<option value="' + esc(o.value) + '"' + (o.value === value ? ' selected' : '') + (o.disabled ? ' disabled' : '') + '>' + esc(o.label) + '</option>'; }).join('') +
      '</select></div>';
  }
  function short(t, n) { t = String(t || '').trim().replace(/\s+/g, ' '); return t.length > n ? t.slice(0, n - 1) + '…' : t; }
  function linkOptions(s) {
    return s.links.map(function (l, i) { return { value: l.id, label: (i + 1) + '. ' + short(nodeText(s, l.from), 40) + ' → ' + short(nodeText(s, l.to), 40) }; });
  }
  function otext(id) { return '<span data-otext="' + esc(id) + '">' + esc(short(nodeText(state, id), 90)) + '</span>'; }
  function outcomeLintHtml(v) {
    var w = outcomeLintWarnings(outcomeLint(v));
    return w.length ? '<ul>' + w.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '';
  }
  function capWarning() {
    if (state.outcomes.length <= CONFIG.maxOutcomes) return '';
    return '<div class="warn"><b>' + state.outcomes.length + ' outcomes:</b> more than the guide of ' + CONFIG.maxOutcomes + '. This is a warning, not a block. ' +
      '<q>' + esc(CONFIG.map.proportion) + '</q> ' + esc(CONFIG.map.proportionRef) + '</div>';
  }
  var dgTimer = null;
  function refreshDiagram() {
    clearTimeout(dgTimer);
    dgTimer = setTimeout(function () {
      var w = $('dg-wrap');
      if (!w) return;
      var left = w.scrollLeft;
      w.innerHTML = diagramSvg(state, { interactive: true });
      w.scrollLeft = left;
      var lg = $('dg-legend'); if (lg) lg.innerHTML = diagramLegend(state);
      var cap = $('dg-cap'); if (cap) cap.innerHTML = capWarning();
    }, 120);
  }
  function refreshOtext(id) {
    var list = document.querySelectorAll('[data-otext="' + id + '"]');
    for (var i = 0; i < list.length; i++) list[i].textContent = short(nodeText(state, id), 90);
  }

  // ── Screen 5: backwards map ──
  function outcomeEditor(o, i) {
    var base = 'outcomes.' + i + '.', id = o.id, inK = inCluster(state, o), adj = graph(state), ok = reaches(adj, id, LTO_ID);
    var h = '<div class="item oc" id="oc-' + id + '" style="--item-colour:' + pathwayColour(state, o.pathway) + '"><div class="item-head"><span class="tag">' + (i + 1) + '</span>' +
      '<span class="grow ' + (ok ? 'quiet' : 'loose-note') + '">' + (ok ? 'Reaches the long-term outcome' : 'Not yet connected to the long-term outcome') + '</span>' +
      '<button type="button" class="btn btn-danger btn-small" data-action="oc-remove" data-arg="' + id + '" aria-label="Remove outcome ' + (i + 1) + '">Remove</button></div>';
    h += wcText('oc-text-' + id, 'Outcome ' + (i + 1) + ': a condition, one change', base + 'text', o.text, CONFIG.words.outcome, { short: true, lint: 'outcome', logLabel: 'Outcome text' });
    h += '<div class="two-col">' + textInput('oc-path-' + id, 'Pathway', base + 'pathway', o.pathway, { max: 40, list: 'pathway-list', logLabel: 'Outcome pathway' }) +
      '<fieldset role="radiogroup"><legend>Level</legend><div class="choices">' +
      CONFIG.outcomeLevels.map(function (lv) {
        return chip({ type: 'radio', name: 'oc-lv|' + id, value: lv.id, label: esc(lv.label), checked: o.level === lv.id, colour: 'var(--char-6)', attrs: ' data-f="' + base + 'level" data-label="Outcome level"' });
      }).join('') + '</div></fieldset></div>';
    h += '<fieldset><legend>Lens</legend><div class="choices">' + CONFIG.lenses.map(function (l) {
      return chip({ id: 'oc-lens-' + id + '-' + l.id, value: l.id, label: esc(l.label), checked: o.lenses.indexOf(l.id) !== -1, colour: l.colour, attrs: ' data-toggle="' + base + 'lenses" data-label="Outcome lenses"' });
    }).join('') + '</div></fieldset>';
    h += '<fieldset><legend>Characteristics it concerns (optional)</legend><div class="choices">' + CONFIG.characteristics.map(function (c) {
      return chip({ id: 'oc-ch-' + id + '-' + c.id, value: c.id, label: esc(c.label), checked: o.characteristics.indexOf(c.id) !== -1, colour: c.colour, cls: ' mini', attrs: ' data-toggle="' + base + 'characteristics" data-label="Outcome characteristics"' });
    }).join('') + '</div></fieldset>';
    if (state.clusters.length) {
      h += selectHtml('oc-cl-' + id, 'Cluster', ' data-cluster="' + id + '"', state.clusters.map(function (k, j) {
        return { value: k.id, label: 'Cluster ' + (j + 1) + ': ' + (k.label || 'no label yet'), disabled: k.id !== o.clusterId && wouldCycle(state, id, k.id) };
      }), o.clusterId, 'Not in a cluster');
    }
    if (inK) {
      h += '<p class="quiet">Leads to: the one arrow of ' + esc(nodeName(state, o.clusterId)) + '. Take it out of the cluster to give it arrows of its own.</p>';
    } else {
      var targets = [LTO_ID].concat(state.outcomes.filter(function (x) { return x.id !== id; }).map(function (x) { return x.id; }), state.clusters.map(function (k) { return k.id; }));
      h += '<fieldset><legend>Leads to: what is this outcome needed for?</legend><div class="choices targets">' + targets.map(function (t) {
        var on = o.leadsTo.indexOf(t) !== -1, loop = !on && wouldCycle(state, id, t);
        var nm = nodeName(state, t);
        return chip({ id: 'oc-to-' + id + '-' + t, value: t, checked: on, disabled: loop, colour: 'var(--char-1)', cls: ' block',
          label: '<b>' + esc(nm.charAt(0).toUpperCase() + nm.slice(1)) + '</b>&nbsp;' + otext(t) + (loop ? ' <i>(would make a loop)</i>' : ''),
          attrs: ' data-lead="' + id + '"' });
      }).join('') + '</div></fieldset>';
    }
    return h + '</div>';
  }
  function clusterEditor(k, i) {
    var mem = clusterMembers(state, k), cur = k.leadsTo[0] || '';
    var opts = [{ value: LTO_ID, label: 'The long-term outcome' }]
      .concat(state.outcomes.filter(function (o) { return o.clusterId !== k.id; }).map(function (o) {
        return { value: o.id, label: nodeName(state, o.id) + ': ' + short(o.text, 50), disabled: o.id !== cur && wouldCycle(state, k.id, o.id) };
      }), state.clusters.filter(function (x) { return x.id !== k.id; }).map(function (x) {
        return { value: x.id, label: nodeName(state, x.id) + ': ' + short(x.label, 50), disabled: x.id !== cur && wouldCycle(state, k.id, x.id) };
      }));
    return '<div class="item" id="cl-' + k.id + '" style="--item-colour:var(--char-1)"><div class="item-head"><span class="tag">K' + (i + 1) + '</span><span class="grow"></span>' +
      '<button type="button" class="btn btn-danger btn-small" data-action="cl-remove" data-arg="' + k.id + '" aria-label="Remove cluster ' + (i + 1) + '">Remove</button></div>' +
      textInput('cl-label-' + k.id, 'Cluster ' + (i + 1) + ' label', 'clusters.' + i + '.label', k.label, { max: 60, logLabel: 'Cluster label' }) +
      '<p class="quiet">In this cluster: ' + (mem.length ? esc(mem.map(function (o) { return nodeName(state, o.id); }).join(', ')) : 'nothing yet. Choose the cluster on each outcome above.') + '</p>' +
      selectHtml('cl-to-' + k.id, 'Its one arrow leads to', ' data-cluster-to="' + k.id + '"', opts, cur, 'Choose…') + '</div>';
  }
  function arrowEditor(l, i) {
    var src = outcomeById(state, l.from);
    var h = '<div class="item" id="ar-' + l.id + '" style="--item-colour:' + (src ? pathwayColour(state, src.pathway) : 'var(--char-1)') + '"><div class="item-head"><span class="tag">' + (i + 1) + '</span>' +
      '<span class="grow"><b>Arrow ' + (i + 1) + '</b> · ' + esc(nodeName(state, l.from)) + ' → ' + esc(nodeName(state, l.to)) + '</span></div>' +
      '<p class="stem">\u201C' + otext(l.from) + '\u201D is needed for \u201C' + otext(l.to) + '\u201D because …</p>' +
      wcText('rat-' + l.id, 'Rationale for arrow ' + (i + 1), 'links.' + i + '.rationale', l.rationale, CONFIG.words.rationale, { short: true, logLabel: 'Rationale' });
    if (state.evidence.length) {
      h += '<fieldset><legend>Evidence for this rationale (screen 6)</legend><div class="choices">' + state.evidence.map(function (e, j) {
        return chip({ id: 'ar-ev-' + l.id + '-' + e.id, value: e.id, checked: l.evidenceIds.indexOf(e.id) !== -1, colour: 'var(--char-5)', cls: ' mini', label: 'E' + (j + 1) + ' ' + esc(short(e.summary, 40)), attrs: ' data-attach="link|' + l.id + '" data-label="Evidence attached"' });
      }).join('') + '</div></fieldset>';
    }
    var ri = state.reverseImport.filter(function (r) { return !r.absent && r.linkId === l.id; });
    if (ri.length) h += '<p class="quiet">Reverse Import: ' + esc(ri.map(function (r) { return r.member + ' (' + stanceLabel(r.stance).toLowerCase() + ')'; }).join('; ')) + '</p>';
    return h + '</div>';
  }

  // The sorter: add a belief, then answer the one question. Shown on
  // screens 5 and 6. Choices made before confirming live in sortDraft.
  var sortDraft = {};
  function renderSorter(no) {
    var h = '<div class="sorter">' +
      '<div class="field"><label for="belief-new">Add a belief: something the group thinks must be true for the theory to work</label>' +
      '<textarea id="belief-new" class="short" data-min="' + CONFIG.words.belief + '" aria-describedby="belief-new-wc"></textarea>' +
      '<div class="word-count bad" id="belief-new-wc" aria-live="polite">' + wordLabel('', CONFIG.words.belief) + '</div></div>' +
      '<div class="actions" style="margin-top:0"><button type="button" class="btn btn-accent" data-action="belief-add" data-arg="' + no + '">Add to the sorter</button></div>';
    var pending = state.beliefs.filter(function (b) { return !b.sort; });
    if (!pending.length) h += '<p class="quiet" style="margin-top:0.6rem">No belief waiting. ' + (state.beliefs.length ? plural(state.beliefs.length, 'belief') + ' sorted so far.' : '') + '</p>';
    pending.forEach(function (b) {
      var n = state.beliefs.indexOf(b) + 1, d = sortDraft[b.id] || {};
      h += '<div class="item belief" id="bel-' + b.id + '" style="--item-colour:var(--char-5)"><div class="item-head"><span class="tag">B' + n + '</span><span class="grow"><b>' + esc(b.text) + '</b></span>' +
        '<button type="button" class="btn btn-danger btn-small" data-action="belief-remove" data-arg="' + b.id + '" aria-label="Remove belief ' + n + '">Remove</button></div>' +
        '<fieldset role="radiogroup"><legend class="sorter-q">' + esc(CONFIG.sorter.question) + '</legend><div class="choices">' +
        CONFIG.sorter.answers.map(function (a) {
          return chip({ type: 'radio', id: 'sd-' + b.id + '-' + a.id, name: 'sd|' + b.id, value: a.id, checked: d.answer === a.id, colour: a.colour, cls: ' block', label: '<b>' + esc(a.label) + '</b>&nbsp;· ' + esc(a.help), attrs: ' data-sd="' + b.id + '|answer"' });
        }).join('') + '</div></fieldset>';
      if (d.answer === 'assumption') {
        h += '<div class="two-col">' + selectHtml('sd-link-' + b.id, 'The arrow it supports', ' data-sd="' + b.id + '|linkId"', linkOptions(state), d.linkId || '', state.links.length ? 'Choose an arrow…' : 'No arrows on the map yet') +

          CONFIG.sweepAnswers.map(function (a) {
            return chip({ type: 'radio', name: 'sweep|' + l.id, value: a.id, label: esc(a.label), checked: state.sweep[l.id] === a.id, colour: a.id === 'none' ? 'var(--correct)' : 'var(--char-5)', attrs: ' data-f="sweep.' + l.id + '" data-label="Completeness pass"' });

  function diagramPrintHtml() {

  // Refresh the live parts after typing, without rebuilding the inputs.
  function refreshLive(el) {
    if (el && el.dataset.min) {
      var wc = $(el.id + '-wc'), min = +el.dataset.min;
      if (wc) { wc.textContent = wordLabel(el.value, min); wc.className = 'word-count ' + (wordCheck(el.value, min).ok ? 'ok' : 'bad'); }
    }
    if (el && el.dataset.lint === 'outcome') {
      var ow = $(el.id + '-warn'); if (ow) ow.innerHTML = outcomeLintHtml(el.value);
    }
    if (el && el.dataset.lint === 'lto') {
      var warn = $(el.id + '-warn'); if (warn) warn.innerHTML = lintHtml(el.value);
      var wrap = $('lto-reason-wrap'); if (wrap) wrap.hidden = ltoLint(el.value).ok;
    }
    var no = state.ui.screen, g = $('gate-' + no);
    if (g && SCREEN_CHECKS[no]) {
      var tmp = document.createElement('div');
      tmp.innerHTML = screenGate(no);
      g.parentNode.replaceChild(tmp.firstChild, g);
    }
    refreshClose(SCREEN[no].week);
    var cg = $('gate-close' + SCREEN[no].week);
    if (cg && !weekClosed(state, SCREEN[no].week)) {
      var w = SCREEN[no].week, t2 = document.createElement('div');
      t2.innerHTML = gateHtml('gate-close' + w, selfCheckChecks(state, w), { action: 'close-week', arg: String(w), label: 'Close week ' + w });
      cg.parentNode.replaceChild(t2.firstChild, cg);
    }
    if (no === 5) refreshDiagram();
    renderRail();
  }

  // Member names feed the roles panel and the side panel. Rebuild those (not
  // the input being typed in) shortly after the list of names changes.
  var membersKey = '', membersTimer = null;
  function membersChanged() {
    clearTimeout(membersTimer);
    membersTimer = setTimeout(function () {
      var key = members(state).join('|');
      if (key === membersKey) return;
      membersKey = key;
      var rp = $('roles-panel'); if (rp) rp.innerHTML = renderRoles(+(rp.getAttribute('data-week') || 9));
      renderSide();
    }, 350);
  }
  // Rebuild a week's close panel when its gate opens or closes while typing.
  function refreshClose(week) {
    var panel = $('close-' + week);
    if (!panel || weekClosed(state, week)) return;
    var ok = gateResult(weekChecks(state, week)).ok;
    var shows = !!$('gate-close' + week);
    if (ok !== shows || (!ok && $('gate-week' + week))) {
      var t = document.createElement('div');
      t.innerHTML = renderClose(week);
      panel.parentNode.replaceChild(t.firstChild, panel);
    }
  }

  function setPath(path, value) {
    var parts = path.split('.'), o = state;
    for (var i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = value;
  }
  function edited(el) {
    if (el.dataset.label) logEdit(state, state.ui.screen, el.dataset.label);
  }
  function refocus(id) { var e = id && $(id); if (e) e.focus(); }

  function download(name, obj) {
    var blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }
  function slug(s) { return String(s || 'group').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'group'; }
  function readJsonFile(input, cb) {
    var f = input.files && input.files[0];
    input.value = '';
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { var obj; try { obj = JSON.parse(r.result); } catch (e) { setStatus('That file is not valid JSON. Nothing was changed.'); return; } cb(obj); };
    r.onerror = function () { setStatus('The file could not be read. Nothing was changed.'); };
    r.readAsText(f);
  }
  function copyText(t) {
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      setStatus(ok ? 'Copied as text.' : 'Copy failed: use Print instead.');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { setStatus('Copied as text.'); }, fallback);
    else fallback();
  }
  // mode 'report' = the A4 report followed by every ready card; otherwise a
  // card type id, printed alone.
  var printMode = 'report';
  function preparePrint() {
    var meta = dash(state.group.name) + ' · ' + members(state).join(', ');
    $('tw-print-meta').textContent = meta;
    var dia = printMode.indexOf('diagram-') === 0;
    document.body.classList.toggle('print-cards', printMode !== 'report' && !dia);
    document.body.classList.toggle('print-diagram', dia);
    document.body.classList.toggle('print-a3', printMode === 'diagram-a3');
    $('page-size').textContent = dia ? '@page { size: ' + (printMode === 'diagram-a3' ? 'A3' : 'A4') + ' landscape; margin: 8mm; }' : '';
    $('print-area').innerHTML = printMode === 'report' ? buildReportHtml(state) + buildA6Html(readyCards(state)) :
      dia ? diagramPrintHtml() : buildA6Html(readyCards(state, [printMode]));
  }
  // The mode is reset after printing (afterprint), so a later beforeprint
  // keeps it while the print dialog is open.
  function printNow(mode) { printMode = mode || 'report'; preparePrint(); window.print(); }
  function exportNow() {
    download('toc-workbench-' + slug(state.group.name) + '.json', buildExport(state));
    setStatus('Exported.');
  }
  function goto(no) {
    if (!screenEnabled(state, no)) return;
    state.ui.screen = no;
    if (SCREEN[no].built) state.ui.reached = Math.max(state.ui.reached, no);
    save(); render(true); window.scrollTo(0, 0);
  }

  function init() {
    els.status = $('status'); els.rail = $('rail'); els.main = $('main'); els.side = $('side');
    $('tw-eyebrow').textContent = CONFIG.text.eyebrow;
    $('tw-title').textContent = CONFIG.text.title;
    $('tw-lede').textContent = CONFIG.text.lede;
    state = load();
    var app = $('tw-app');

    app.addEventListener('input', function (ev) {
      var el = ev.target;
      if (el.id === 'fof-new' || el.id === 'belief-new') { refreshLive(el); return; }
      if (!el.dataset || !el.dataset.f || el.type === 'radio' || el.type === 'checkbox' || el.tagName === 'SELECT') return;
      setPath(el.dataset.f, el.value);
      edited(el);
      if (/^stakeholders\.\d+\.name$/.test(el.dataset.f)) { syncStakeholderFof(state); renderSide(); }
      if (el.dataset.f === 'group.name' || el.dataset.f.indexOf('group.members.') === 0) membersChanged();
      var om = el.dataset.f.match(/^(outcomes|clusters)\.(\d+)\.(text|label)$/);
      if (om) refreshOtext(state[om[1]][+om[2]].id);
      save(); refreshLive(el);
    });
    app.addEventListener('change', function (ev) {
      var el = ev.target, sNo = state.ui.screen, err;
      // Week 10: arrows, clusters, tags, evidence, the sorter's choices.
      if (el.dataset.lead) {
        var fromId = el.dataset.lead, link = state.links.filter(function (l) { return l.from === fromId && l.to === el.value; })[0];
        if (!el.checked && link && String(link.rationale).trim() && !window.confirm('Remove this arrow? Its rationale will be lost.')) { el.checked = true; return; }
        err = setLeadsTo(state, fromId, el.value, el.checked);
        if (err) { setStatus(err); el.checked = !el.checked; return; }
        logEdit(state, sNo, 'Arrows'); save(); render(); refocus(el.id); return;
      }
      if (el.dataset.cluster) {
        var o = outcomeById(state, el.dataset.cluster);
        if (el.value && o && o.leadsTo.length && !window.confirm('In a cluster, this outcome\u2019s own arrows are replaced by the cluster\u2019s one arrow. Continue?')) { el.value = o.clusterId; return; }
        err = setCluster(state, el.dataset.cluster, el.value);
        if (err) { setStatus(err); render(); return; }
        logEdit(state, sNo, 'Clusters'); save(); render(); refocus(el.id); return;
      }
      if (el.dataset.clusterTo) {
        err = el.value ? setLeadsTo(state, el.dataset.clusterTo, el.value, true) : '';
        if (!el.value) { var k = clusterById(state, el.dataset.clusterTo); if (k) { k.leadsTo = []; syncLinks(state); } }
        if (err) { setStatus(err); render(); return; }
        logEdit(state, sNo, 'Clusters'); save(); render(); refocus(el.id); return;
      }
      if (el.dataset.toggle) {
        var parts = el.dataset.toggle.split('.'), arr = state[parts[0]][+parts[1]][parts[2]];
        var keep = arr.filter(function (x) { return x !== el.value; });
        if (el.checked) keep.push(el.value);
        var order = (parts[2] === 'lenses' ? CONFIG.lenses : CONFIG.characteristics).map(function (x) { return x.id; });
        state[parts[0]][+parts[1]][parts[2]] = order.filter(function (id) { return keep.indexOf(id) !== -1; });
        logEdit(state, sNo, el.dataset.label || 'Tags'); save(); refreshLive(null); return;
      }
      if (el.dataset.attach) {
        var at = el.dataset.attach.split('|');
        attachEvidence(state, el.value, at[0], at[1], el.checked);
        logEdit(state, sNo, 'Evidence attached'); save(); refreshLive(null); return;
      }
      if (el.dataset.fact) {
        setEvidenceFact(state, el.dataset.fact, el.value);
        logEdit(state, sNo, 'Evidence summary'); save(); render(); refocus(el.id); return;
      }
      if (el.dataset.sd) {
        var sd = el.dataset.sd.split('|'), d = sortDraft[sd[0]] = sortDraft[sd[0]] || { evidenceIds: [] };
        d[sd[1]] = el.value;
        render(); refocus(el.id); return;
      }
      if (el.dataset.sde) {
        var dd = sortDraft[el.dataset.sde] = sortDraft[el.dataset.sde] || { evidenceIds: [] };
        dd.evidenceIds = dd.evidenceIds.filter(function (x) { return x !== el.value; });
        if (el.checked) dd.evidenceIds.push(el.value);
        return;
      }
      if (el.tagName === 'SELECT' && el.dataset.f) {
        setPath(el.dataset.f, el.value); edited(el); save(); render(); refocus(el.id); return;
      }
      if (el.type === 'checkbox' && el.dataset.f && el.dataset.label) {
        setPath(el.dataset.f, el.checked); edited(el); save(); render(); refocus(el.id); return;
      }
      if (el.type === 'checkbox' && el.name === 'pclaim') {
        var arr = state.problem.claims.filter(function (x) { return x !== el.value; });
        if (el.checked) arr.push(el.value);
        state.problem.claims = CONFIG.declineClaims.map(function (d) { return d.id; }).filter(function (id) { return arr.indexOf(id) !== -1; });
        logEdit(state, state.ui.screen, 'Decline claims'); save(); refreshLive(null); return;
      }
      if (el.type === 'checkbox' && el.dataset.f) {
        setPath(el.dataset.f, el.checked); logEdit(state, state.ui.screen, 'Stakeholder from the brief'); save(); render();
        var again = document.querySelector('[data-f="' + el.dataset.f + '"]'); if (again) again.focus();
        return;
      }
      if (el.type === 'radio') {
        if (el.name.indexOf('link|') === 0) {
          state.clientTheory.linkEvidence[el.name.slice(5)] = el.value;
          logEdit(state, state.ui.screen, 'Link evidence'); save(); refreshLive(null); return;
        }
        if (el.dataset.f) {
          setPath(el.dataset.f, el.value);
          logEdit(state, state.ui.screen, el.dataset.label || (el.name.indexOf('st|') === 0 ? 'Stakeholder ratings' : 'Ceiling placement'));
          if (/canWeAsk$/.test(el.dataset.f)) { syncStakeholderFof(state); save(); renderSide(); }
          save(); refreshLive(null);
          if (/canWeAsk$/.test(el.dataset.f)) { render(); var r = document.querySelector('input[name="' + el.name + '"][value="' + el.value + '"]'); if (r) r.focus(); }
        }
      }
    });
    app.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-action]');
      if (!b || b.disabled) return;
      var act = b.dataset.action, arg = b.dataset.arg, sNo = state.ui.screen, log = function (c) { logEdit(state, sNo, c); };
      if (act === 'goto') goto(+arg);
      else if (act === 'next') { if (gateResult(screenChecks(state, sNo)).ok) goto(+arg); }
      else if (act === 'suggest-roles') {
        var w = +arg, list = members(state);
        state.roles['week' + w] = suggestRoles(list, w > 9 ? state.roles['week' + (w - 1)] : null);
        log('Roles, week ' + w); save(); render(); refocus('role-' + w + '-facilitator');
        setStatus('Roles suggested for week ' + w + '. Change any you like.');
      }
      else if (act === 'claim-add') { var c = addClaim(state); log('Client claims added or removed'); save(); render(); refocus('cl-' + c.id); }
      else if (act === 'claim-remove') { if (window.confirm('Remove this claim?')) { removeClaim(state, arg); log('Client claims added or removed'); save(); render(); } }
      else if (act === 'claim-place') { placeClaim(state, arg); log('Client chain order'); save(); render(); refocus('up-' + arg); }
      else if (act === 'claim-unplace') { unplaceClaim(state, arg); log('Client chain order'); save(); render(); }
      else if (act === 'claim-up' || act === 'claim-down') {
        moveClaim(state, arg, act === 'claim-up' ? -1 : 1); log('Client chain order'); save(); render();
        var btn = $((act === 'claim-up' ? 'up-' : 'down-') + arg); if (btn && btn.disabled) btn = $((act === 'claim-up' ? 'down-' : 'up-') + arg); if (btn) btn.focus();
      }
      else if (act === 'def-add') { state.lto.definitions.push({ term: '', meaning: '' }); log('Definitions added or removed'); save(); render(); refocus('def-t' + (state.lto.definitions.length - 1)); }
      else if (act === 'def-remove') { if (window.confirm('Remove this definition?')) { state.lto.definitions.splice(+arg, 1); log('Definitions added or removed'); save(); render(); } }
      else if (act === 'st-add') {
        var x = { id: uid('s'), name: '', fromBrief: false, slide: '', affected: '', influence: '', interest: '', canWeAsk: '' };
        state.stakeholders.push(x); log('Stakeholders added or removed'); save(); render(); refocus('st-n' + x.id);
      }
      else if (act === 'st-remove') {
        if (window.confirm('Remove this stakeholder?')) { state.stakeholders = state.stakeholders.filter(function (s) { return s.id !== arg; }); syncStakeholderFof(state); log('Stakeholders added or removed'); save(); render(); }
      }
      else if (act === 'use-draft') {
        var d = state.imported.week7 && state.imported.week7.sentences[+arg];
        if (d && (!String(state.problem.statement).trim() || window.confirm('Replace your problem statement with this draft?'))) {
          state.problem.statement = d.text; log('Problem statement'); save(); render(); refocus('pr-st');
        }
      }
      else if (act === 'fof-add') {
        var t = $('fof-new'), wc = wordCheck(t.value, CONFIG.words.fof);
        if (!wc.ok) { setStatus('Find out first: the item ' + wc.msg + '.'); t.focus(); return; }
        addFof(state, t.value.trim(), 'manual', String(sNo)); save(); renderSide(); setStatus('Added to Find out first.');
      }
      else if (act === 'fof-remove') { removeFof(state, arg); save(); renderSide(); }
      else if (act === 'close-week') {
        var probs = closeWeek(state, +arg);
        if (probs.length) setStatus('Not closed yet: ' + probs[0]);
        else { save(); render(); refocus('close-' + arg); setStatus('Week ' + arg + ' closed. Print your card and export.'); }
      }
      else if (act === 'print-cards') printNow(arg);
      else if (act === 'print-diagram') printNow('diagram-' + arg);
      else if (act === 'dg-open') openEditor(arg);
      else if (act === 'oc-add') { var no = addOutcome(state); log('Outcomes added or removed'); save(); render(); refocus('oc-text-' + no.id); }
      else if (act === 'oc-remove') {
        if (window.confirm('Remove this outcome, and every arrow to and from it?')) { removeOutcome(state, arg); log('Outcomes added or removed'); save(); render(); }
      }
      else if (act === 'cl-add') { var nk = addCluster(state); log('Clusters'); save(); render(); refocus('cl-label-' + nk.id); }
      else if (act === 'cl-remove') {
        if (window.confirm('Remove this cluster? Its outcomes stay on the map without arrows.')) { removeCluster(state, arg); log('Clusters'); save(); render(); }
      }
      else if (act === 'belief-add') {
        var bt = $('belief-new'), bw = wordCheck(bt.value, CONFIG.words.belief);
        if (!bw.ok) { setStatus('Belief: ' + bw.msg + '.'); bt.focus(); return; }
        var nb = addBelief(state, bt.value, +arg || sNo); log('Beliefs'); save(); render();
        refocus('sd-' + nb.id + '-assumption'); setStatus('Belief added. Now answer: ' + CONFIG.sorter.question);
      }
      else if (act === 'belief-remove') {
        if (window.confirm('Remove this belief before sorting it?')) { removeBelief(state, arg); delete sortDraft[arg]; log('Beliefs'); save(); render(); }
      }
      else if (act === 'belief-sort') {
        var res = sortBelief(state, arg, (sortDraft[arg] || {}).answer, sortDraft[arg]);
        if (!res.ok) { setStatus('Not sorted yet: ' + res.errors.join(' ')); return; }
        delete sortDraft[arg]; log('Sorter'); save(); render();
        var b2 = beliefById(state, arg);
        setStatus(b2.sort === 'assumption' ? 'Added to the assumption register as A' + state.assumptions.length + '.' :
          b2.sort === 'precondition' ? 'Added to the map as ' + nodeName(state, b2.refId) + ': give it a level, a pathway and an arrow on screen 5.' : 'Added to Find out first.');
        if (b2.sort === 'precondition' && sNo === 5) refocus('oc-text-' + b2.refId); else refocus('belief-new');
      }
      else if (act === 'as-remove') {
        if (window.confirm('Remove this assumption from the register?')) { state.assumptions = state.assumptions.filter(function (a) { return a.id !== arg; }); log('Assumptions'); save(); render(); }
      }
      else if (act === 'ev-add') { var ne = addEvidence(state); log('Evidence added or removed'); save(); render(); refocus('ev-type-' + ne.id); }
      else if (act === 'ev-remove') {
        if (window.confirm('Remove this evidence item? It is detached from every arrow and assumption.')) { removeEvidence(state, arg); log('Evidence added or removed'); save(); render(); }
      }
      else if (act === 'export') exportNow();
      else if (act === 'week7-load') $('week7-file').click();
      else if (act === 'week7-clear') { if (window.confirm('Remove the week 7 sentences from this workbench?')) { state.imported.week7 = null; save(); render(); } }
    });

    // Diagram boxes and arrows are SVG elements with role="button": Enter
    // and Space open their editor.
    app.addEventListener('keydown', function (ev) {
      var el = ev.target;
      if ((ev.key === 'Enter' || ev.key === ' ') && el.getAttribute && el.getAttribute('role') === 'button' && el.dataset && el.dataset.action && !(el instanceof HTMLElement)) {
        ev.preventDefault();
        openEditor(el.dataset.arg);
      }
    });
    $('week7-file').addEventListener('change', function () {
      readJsonFile(this, function (obj) {
        var errs = validateWeek7(obj);
        if (errs.length) { setStatus(errs[0] + ' Nothing was changed.'); return; }
        state.imported.week7 = week7Summary(obj); save(); render();
        setStatus('Week 7 export loaded: ' + plural(state.imported.week7.sentences.length, 'locked sentence') + ', shown on screen 3.');
      });
    });
    $('btn-export').addEventListener('click', exportNow);
    $('btn-import').addEventListener('click', function () { $('import-file').click(); });
    $('import-file').addEventListener('change', function () {
      readJsonFile(this, function (obj) {
        var errs = validateImport(obj);
        if (errs.length) { setStatus(errs[0] + ' Nothing was changed.'); return; }
        var who = isObj(obj.group) && obj.group.name ? obj.group.name : 'this group';
        if (!window.confirm('Replace the work on this device with the work of ' + who + ' from this file?')) return;
        state = migrate(clone(obj.state)); save(); render();
        setStatus('Imported the work of ' + (state.group.name || 'this group') + '.');
      });
    });
    $('btn-copy').addEventListener('click', function () { copyText(buildText(state)); });
    $('btn-print').addEventListener('click', function () { printNow('report'); });
    $('btn-reset').addEventListener('click', function () {
      if (!window.confirm('Reset clears all of this group\u2019s work on this device, for every week. Export first if you want to keep it. Reset now?')) return;
      state = defaultState();
      try { window.localStorage.removeItem(CONFIG.storageKey); } catch (e) { /* storage unavailable */ }
      render(); setStatus('Reset.');
    });
    window.addEventListener('beforeprint', preparePrint);
    window.addEventListener('afterprint', function () { printMode = 'report'; $('page-size').textContent = ''; document.body.classList.remove('print-diagram', 'print-a3'); });
    render();
  }

  // Test hook: pure functions and CONFIG exposed for test.html.
  window.TW = {
    CONFIG: CONFIG,
    SCREEN: SCREEN,
    wordCount: wordCount,
    wordCheck: wordCheck,
    validSlide: validSlide,
    lintActivity: lintActivity,
    lintNegative: lintNegative,
    lintAnd: lintAnd,
    ltoLint: ltoLint,
    defaultState: defaultState,
    migrate: migrate,
    members: members,
    rolesFor: rolesFor,
    suggestRoles: suggestRoles,
    rotationRepeats: rotationRepeats,
    gateResult: gateResult,
    screenChecks: screenChecks,
    weekChecks: weekChecks,
    selfCheckChecks: selfCheckChecks,
    closeWeek: closeWeek,
    weekClosed: weekClosed,
    screenEnabled: screenEnabled,
    currentWeek: currentWeek,
    addFof: addFof,
    removeFof: removeFof,
    syncStakeholderFof: syncStakeholderFof,
    logEdit: logEdit,
    addClaim: addClaim,
    removeClaim: removeClaim,
    placeClaim: placeClaim,
    moveClaim: moveClaim,
    chainLinks: chainLinks,
    validateWeek7: validateWeek7,
    week7Summary: week7Summary,
    buildExport: buildExport,
    validateImport: validateImport,
    OUTPUT_SECTIONS: OUTPUT_SECTIONS,
    CARD_TYPES: CARD_TYPES,
    buildReportHtml: buildReportHtml,
    buildText: buildText,
    readyCards: readyCards,
    buildA6Html: buildA6Html,
    // week 10
    LTO_ID: LTO_ID,
    mapEdges: mapEdges,
    graph: graph,
    reaches: reaches,
    unconnected: unconnected,
    mapConnected: mapConnected,
    wouldCycle: wouldCycle,
    findCycle: findCycle,
    syncLinks: syncLinks,
    normaliseMap: normaliseMap,
    addOutcome: addOutcome,
    removeOutcome: removeOutcome,
    addCluster: addCluster,
    removeCluster: removeCluster,
    setLeadsTo: setLeadsTo,
    setCluster: setCluster,
    pathwayList: pathwayList,
    outcomeLint: outcomeLint,
    addBelief: addBelief,
    sortBelief: sortBelief,
    addEvidence: addEvidence,
    removeEvidence: removeEvidence,
    setEvidenceFact: setEvidenceFact,
    attachEvidence: attachEvidence,
    syncReverse: syncReverse,
    designChecks: designChecks,
    designGate: designGate,
    layoutMap: layoutMap,
    layoutOverlaps: layoutOverlaps,
    diagramSvg: diagramSvg,
    mapText: mapText,
    registerText: registerText
  };

  if (document.getElementById('tw-app')) init();
})();
</script>
