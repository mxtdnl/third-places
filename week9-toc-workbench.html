  WEEKS 9-13 - BODØ THEORY OF CHANGE (WORKBENCH)
  Social Phenomena Challenge, INTERVENE phase (weeks 9-13). Activity 15.

  One workbench, used by each group on one device for five weeks. It builds the
  Theory of Change behind the group's recommendation to the client: that the
  club create a community third place in its new stadium. Plan:
  toc_buildplan.md. Build prompts: toc_build_prompts.md.

  BUILD STAGE: 1 of 5 (core and week 9 screens). Screens 5-14 show "Arrives in
  week N" with their reading until their stage is built. Later stages add
  screens, output sections and A6 card types; they do not change the state
  shape below except by adding defaults through migrate().

  Core reading (page numbers refer to the course PDFs):
    [TC]  Taplin, D. H. & Clark, H. (2012). Theory of Change Basics: A Primer
          on Theory of Change. New York: ActKnowledge. Course copy ToCBasics.pdf
    [GAF] Government Analysis Function, Evaluation Support Team. The Theory of
          Change Process - Guidance for Outcome Delivery Plans. Course copy
          ToCgov.pdf (saved 17 September 2026). Online:
          https://analysisfunction.civilservice.gov.uk/policy-store/the-analysis-function-theory-of-change-toolkit/
    [A7]  Course deck "Theory of Change" (Activity 7): theory-of-change.html

  THE CLIENT BRIEF IS CONFIDENTIAL. It is never stored in this file, quoted,
  summarised or embedded. The tool refers to it only as "the client brief (on
  the VLE)". Students type what they use from it, in their own words, with the
  slide number; every brief-derived entry requires a slide number.

  No scores. The gates check that each part is complete; they never judge
  whether an answer is right.

  ============================================================================
  RUN SHEET, WEEK 9 (90 minutes, groups of 3-5, one device per group)
  ============================================================================
   0-12  Deck (week9-toc-deck.html). Screen 1: group, members, week 9 roles;
         load the week 7 export if you have it.
  12-30  Screen 2: the client's intended impact, with the brief open.
  30-50  Screen 3: problem statement, then the long-term outcome.
  50-60  Screen 3: definitions and the accountability ceiling.
  60-83  Screen 4: stakeholders.
  83-90  Week 9 close: self-check, print the long-term outcome card, export.

  EXPORT JSON  (tool "toc-workbench", schemaVersion 1)
  ============================================================================
  {
    "tool": "toc-workbench",                     REQUIRED, constant
    "schemaVersion": 1,                          REQUIRED
    "exportedAt": "ISO 8601 timestamp",
    "exportId": "string",                        = state.meta.exportId; fixed
                                                 for the life of the group's work
    "group": { "name": "string", "members": ["string", ...] }   cleaned copy
    "state": {                                   REQUIRED; used verbatim on
                                                 re-import, after migrate()
      "meta":   { "exportId": "string", "createdAt": "ISO" },
      "group":  { "name": "string", "members": ["string" x up to 5, as typed] },
      "roles":  { "week9".."week13": { "<roleId>": "memberName" } }
                roleId = facilitator | scribe | sceptic | evidence | timekeeper.
                Keyed by role, so one member may hold two roles in a group of 3.
      "imported": { "week7": null | { "group": "string", "exportedAt": "ISO",
                    "importedAt": "ISO", "sentences": [ { "member", "text" } ] } },
      "clientTheory": {                          screen 2 (week 9)
        "claims": [ { "id", "text", "slide" } ], slide = string of digits
        "ambition": "string", "ambitionSlide": "string",
        "order": [ "claimId", ... ],             the causal chain, first to last
        "linkEvidence": { "<fromId>><toId>": "given" | "not" },
        "whoseCommunity": "string" },
      "problem": { "statement", "claims": ["SUPPLY"|"USE"|"QUALITY"|"OUTCOME"],
                   "where", "forWhom" },         screen 3
      "lto": { "text", "lintReason",             lintReason = why a flagged
               "definitions": [ { "term", "meaning" } ],    word is kept
               "ceiling": { "ultimateGoal", "ambitionPosition": ""|"above"|"at"|"below",
                            "reason" } },
      "stakeholderQuestions": { "q1".."q8": "string" },     optional notes
      "stakeholders": [ { "id", "name", "fromBrief": bool, "slide",
                          "affected": ""|"yes"|"no", "influence": ""|"low"|"medium"|"high",
                          "interest": ""|"low"|"medium"|"high",
                          "canWeAsk": ""|"yes"|"no" } ],    screen 4
      LATER STAGES (present and empty from week 9 onwards):
      "outcomes": [ { "id", "text", "level", "pathway", "clusterId",
                      "lenses": [], "characteristics": [], "leadsTo": [] } ],
      "clusters": [ { "id", "label", "leadsTo": [] } ],
      "links": [ { "id", "from", "to", "rationale", "evidenceIds": [] } ],
      "assumptions": [ { "id", "linkId", "text", "lens", "evidenceIds": [],

      "findOutFirst": [ { "id", "text",
                          "source": "stakeholder"|"sorter"|"baseline"|"manual",

      "evidence": [ { "id", "summary", "source", "type", "slide",

      "reverseImport": [ { "member", "course", "claim", "linkId", "stance" } ],
      "options": [ { "id", "summary", "location", "plausible", "doable",

      "interventions": [ { "id", "name", "activities": [], "linkIds": [],

      "risks": [ { "id", "text", "internal", "likelihood", "mitigation", "interventionId" } ],
      "stressTest": { "<charId>": { "threat", "protectedBy" } },
      "indicators": [ { "id", "outcomeId", "owner", "howMany", "who", "level",

                        "frequency", "responsible", "reporting" } ],
      "reviews": { "given": [], "received": [ { "fromGroup",

      links: [],
      assumptions: [],
      findOutFirst: [],
      evidence: [],
      reverseImport: [],
      options: [],
      interventions: [],
      risks: [],
      stressTest: {},
      indicators: [],

      diagrams: { clientOutcomeIds: [], clientLinkIds: [] },
      narrative: { execSummary: '', sections: {} },
      valuesCheck: [],

    'outcomes': { id: '', text: '', level: '', pathway: '', clusterId: '', lenses: [], characteristics: [], leadsTo: [] },
    'clusters': { id: '', label: '', leadsTo: [] },

    'assumptions': { id: '', linkId: '', text: '', lens: '', evidenceIds: [], sort: 'assumption' },
    'findOutFirst': { id: '', text: '', source: 'manual', refId: '' },
    'evidence': { id: '', summary: '', source: '', type: '', slide: '', ratings: { causal: '', scope: '', implications: '', method: '' }, bodoVerdict: '', member: '' },
    'reverseImport': { member: '', course: '', claim: '', linkId: '', stance: '' },
    'options': { id: '', summary: '', location: '', plausible: '', doable: '', testable: '', chosen: false, whyNot: '' },
    'interventions': { id: '', name: '', activities: [], linkIds: [], characteristics: [], inputs: [] },

  // Objects whose keys are chosen at run time (kept as they are, if objects).

    s.group.members = s.group.members.map(function (m) { return typeof m === 'string' ? m : ''; });

  function screen3Checks(s) {

      check(wordsOk(p.forWhom, 'forWhom'), 'Say for whom (at least ' + plural(CONFIG.words.forWhom, 'word') + ').'),

  function screen4Checks(s) {

  // ==========================================================================

  // ==========================================================================

  // ==========================================================================

      exportedAt: String(obj.exportedAt || ''),

      sentences: obj.sentences.filter(function (x) { return isObj(x) && x.locked && String(x.final || '').trim(); })

  function validateImport(obj) {
    if (!isObj(obj)) return ['This file is not a workbench export.'];
    if (obj.tool === CONFIG.week7ToolId) return ['This is a week 7 file. Load it on screen 1 with \u201CLoad week 7 export\u201D.'];
    if (obj.tool !== CONFIG.toolId) return ['This file is not a Bodø Theory of Change export.'];
    if (typeof obj.schemaVersion !== 'number') return ['This file has no schema version.'];
    if (obj.schemaVersion > CONFIG.schemaVersion) return ['This file was made by a newer version of the workbench.'];
    if (!isObj(obj.state)) return ['The saved work in this file is missing.'];
    if (obj.state.group !== undefined && !isObj(obj.state.group)) return ['The saved work in this file is damaged (group).'];
    return [];

  // ==========================================================================

  function dash(v) { var t = String(v == null ? '' : v).trim(); return t || '—'; }
  function repItem(k, v) { return '<div class="rep-item"><div class="k">' + esc(k) + '</div><div>' + esc(dash(v)) + '</div></div>'; }
  function claimLabel(id) { var d = CONFIG.declineClaims.filter(function (c) { return c.id === id; })[0]; return d ? d.label.toUpperCase() : id; }
  function ceilingLabel(id) { var d = CONFIG.ceilingPositions.filter(function (c) { return c.id === id; })[0]; return d ? d.label : ''; }
  function levelLabel(id) { var d = CONFIG.levels.filter(function (c) { return c.id === id; })[0]; return d ? d.label : ''; }
  function yesNo(v) { return v === 'yes' ? 'Yes' : v === 'no' ? 'No' : ''; }
  function chainText(s) {
    var ct = s.clientTheory, out = [];

      var next = ct.order[i + 1];

      }
    });
    var unplaced = ct.claims.filter(function (c) { return ct.order.indexOf(c.id) === -1; });
    unplaced.forEach(function (c) { out.push('(not placed) ' + dash(c.text) + ' (slide ' + dash(c.slide) + ')'); });
    return out;
  }

    { id: 'fof', week: 9, title: 'Find out first', colour: '#7A5828',

      html: function (s) { return s.findOutFirst.map(function (f) { return repItem(CONFIG.fofSources[f.source], f.text); }).join(''); } },
    { id: 'selfchecks', week: 9, title: 'Self-checks', colour: '#2A7A42',
      has: function (s) { return WEEKS.some(function (w) { return weekClosed(s, w); }); },

  var CARD_TYPES = [

  function buildReportHtml(s) {

  }
  function buildText(s) {
    var out = [CONFIG.text.title.toUpperCase(), ''];
    OUTPUT_SECTIONS.filter(function (sec) { return sec.has(s); }).forEach(function (sec) {
      out.push(sec.title.toUpperCase());
      out = out.concat(sec.text(s));
      out.push('');
    });
    return out.join('\n');
  }
  // Every card that is ready, optionally only of the given type ids.
  function readyCards(s, typeIds) {
    var out = [];
    CARD_TYPES.forEach(function (t) {
      if ((!typeIds || typeIds.indexOf(t.id) !== -1) && t.ready(s)) out = out.concat(t.cards(s));

  }
  function a6Html(c) {

      '<div class="a6-foot">' + esc(c.foot) + '</div></div>';

  // A6 cards, four to an A4 sheet; dashed borders are the cut lines.

  // ==========================================================================
  // Rendering (browser only)
  // ==========================================================================
  var state, els = {};
  var $ = function (id) { return document.getElementById(id); };

  function save() {
    try { window.localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); } catch (e) { /* storage unavailable: work continues unsaved */ }
  }
  function load() {
    try {
      var raw = window.localStorage.getItem(CONFIG.storageKey);
      if (raw) return migrate(JSON.parse(raw));
    } catch (e) { /* corrupt or unavailable: start afresh */ }
    return defaultState();
  }
  function setStatus(msg) { els.status.textContent = msg || ''; }

  function quote(text, ref) { return '<q>' + esc(text) + '</q><cite>' + esc(ref) + '</cite>'; }
  function guide(label, inner) { return '<div class="guide"><span class="k">' + esc(label) + '</span>' + inner + '</div>'; }
  function wcText(id, label, path, value, min, opts) {
    opts = opts || {};
    return '<div class="field"><label for="' + id + '">' + esc(label) + '</label>' +
      (opts.hint ? '<p class="quiet" id="' + id + '-hint">' + esc(opts.hint) + '</p>' : '') +
      '<textarea id="' + id + '" data-f="' + esc(path) + '" data-min="' + min + '" data-label="' + esc(opts.logLabel || label) + '"' +
      (opts.short ? ' class="short"' : '') + (opts.lint ? ' data-lint="' + opts.lint + '"' : '') + (opts.readonly ? ' readonly' : '') +
      ' aria-describedby="' + id + '-wc' + (opts.hint ? ' ' + id + '-hint' : '') + '">' + esc(value) + '</textarea>' +
      '<div class="word-count ' + (wordCheck(value, min).ok ? 'ok' : 'bad') + '" id="' + id + '-wc" aria-live="polite">' + wordLabel(value, min) + '</div>' +
      (opts.lint ? '<div class="warn" id="' + id + '-warn" aria-live="polite">' + lintHtml(value) + '</div>' : '') +
      '</div>';
  }
  function lintHtml(v) {

  }
  function textInput(id, label, path, value, opts) {
    opts = opts || {};

      '<input type="text" id="' + id + '" data-f="' + esc(path) + '" data-label="' + esc(opts.logLabel || label) + '" value="' + esc(value) + '"' +
      (opts.slide ? ' class="slide" inputmode="numeric" autocomplete="off"' : '') + (opts.max ? ' maxlength="' + opts.max + '"' : '') + '></div>';
  }
  function choice(name, value, label, checked, colour, type, path, extraCls) {

  function gateHtml(id, checks, button) {

    h += '<div class="part" style="--part-colour:var(--char-2)"><h3>2. Put them in causal order</h3><div>';
    if (!ct.order.length) h += '<p class="quiet">Place the claim the client says comes first, then the next, up to its ambition.</p>';
    h += '<ol class="chain">';
    ct.order.forEach(function (id, i) {
      var c = claimById(state, id), num = ct.claims.indexOf(c) + 1;
      h += '<li><div class="chain-card"><div><span class="meta">Step ' + (i + 1) + ' · claim ' + num + ' · slide ' + esc(dash(c.slide)) + '</span><span class="txt">' + esc(dash(c.text)) + '</span></div>' +
        '<div class="ctl"><button type="button" class="btn btn-ghost btn-small" id="up-' + id + '" data-action="claim-up" data-arg="' + id + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="Move step ' + (i + 1) + ' up">↑</button>' +
        '<button type="button" class="btn btn-ghost btn-small" id="down-' + id + '" data-action="claim-down" data-arg="' + id + '"' + (i === ct.order.length - 1 ? ' disabled' : '') + ' aria-label="Move step ' + (i + 1) + ' down">↓</button>' +
        '<button type="button" class="btn btn-ghost btn-small" data-action="claim-unplace" data-arg="' + id + '" aria-label="Take step ' + (i + 1) + ' out of the chain">Out</button></div></div>';
      var next = ct.order[i + 1];
      if (next) {
        var key = id + '>' + next, nm = 'link|' + key;
        h += '<div class="chain-link" role="radiogroup" aria-label="Link from step ' + (i + 1) + ' to step ' + (i + 2) + '"><div class="label">Link ' + (i + 1) + ' → ' + (i + 2) + ': does the brief give evidence for it?</div><div class="choices">' +
          choice(nm, 'given', 'Evidence given in the brief', ct.linkEvidence[key] === 'given', 'var(--correct)') +
          choice(nm, 'not', 'Not given', ct.linkEvidence[key] === 'not', 'var(--char-2)') + '</div></div>';
      }
      h += '</li>';
    });
    h += '</ol>';
    var unplaced = ct.claims.filter(function (c) { return ct.order.indexOf(c.id) === -1; });
    if (unplaced.length) {
      h += '<div class="unplaced"><p class="eyebrow">Not yet placed</p>';
      unplaced.forEach(function (c) {
        var num = ct.claims.indexOf(c) + 1;
        h += '<div class="row" style="margin:0.4rem 0"><span class="grow">' + num + '. ' + esc(dash(c.text)) + '</span>' +
          '<button type="button" class="btn btn-primary btn-small" data-action="claim-place" data-arg="' + c.id + '">Add to chain</button></div>';
      });
      h += '</div>';
    }
    h += '</div>' + guide('Evidence', quote(G.evidenceQuote, G.evidenceRef) + '<p style="margin-top:0.4rem">Mark a link \u201Cgiven\u201D only if the brief itself offers evidence for it.</p>') + '</div>';

    h += '<div class="part" style="--part-colour:var(--char-1)"><h3>3. Ambition and community</h3><div>' +
      wcText('ct-amb', 'The client\u2019s stated ambition, in your own words', 'clientTheory.ambition', ct.ambition, CONFIG.words.ambition, { short: true }) +
      textInput('ct-amb-s', 'Slide number', 'clientTheory.ambitionSlide', ct.ambitionSlide, { slide: true, max: 3, logLabel: 'Ambition slide' }) +
      wcText('ct-whose', 'Whose community?', 'clientTheory.whoseCommunity', ct.whoseCommunity, CONFIG.words.whoseCommunity, { hint: G.whose }) +
      '</div>' + guide('Oldenburg', '<p>Third places serve informal sociability among individuals: neutral ground, where the leveller sets status aside. A club\u2019s community may be a different thing. Say which you think the client means, and who that leaves out.</p>') + '</div>';
    h += '</section>' + screenGate(2);
    return h;
  }

  // ── Screen 3: problem and long-term outcome ──
  function renderProblem(sc) {
    var p = state.problem, l = state.lto, G = CONFIG.guidance.problem, h = screenHead(sc);
    h += '<div class="guide" style="margin-bottom:1rem;border-left-color:var(--char-2)">' + quote(G.lead, G.leadRef) + '</div>';
    var w7 = state.imported.week7;
    if (w7 && w7.sentences.length) {
      h += '<details class="drawer" open><summary>Draft problem statements from week 7 (' + w7.sentences.length + ')</summary><div>';
      w7.sentences.forEach(function (x, i) {
        h += '<div class="draft"><span class="who">' + esc(x.member || 'Student') + '</span><p>' + esc(x.text) + '</p>' +
          '<button type="button" class="btn btn-ghost btn-small" data-action="use-draft" data-arg="' + i + '">Use as starting point</button></div>';
      });
      h += '</div></details>';
    }
    h += '<details class="drawer"><summary>Bodø facts from week 7 (sourced)</summary><div>' +
      CONFIG.facts.map(function (f) { return '<div class="fact"><b>' + esc(f.title) + ' · ' + esc(CONFIG.scopeLabels[f.scope]) + '</b>' + esc(f.text) + '<span class="src"> Source: ' + esc(f.source) + '</span></div>'; }).join('') +
      '</div></details>';

    h += '<section class="panel" style="' + panelStyle(sc) + '">';
    h += '<div class="part" style="--part-colour:var(--char-2)"><h3>1. Problem statement</h3><div>' +
      wcText('pr-st', 'Problem statement', 'problem.statement', p.statement, CONFIG.words.problem, { hint: G.statementHelp }) +
      '<fieldset><legend>Decline claim(s) it names</legend><div class="choices">' +
      CONFIG.declineClaims.map(function (d) { return choice('pclaim', d.id, esc(d.label) + '<span class="sr-only">: ' + esc(d.help) + '</span>', p.claims.indexOf(d.id) !== -1, d.colour, 'checkbox'); }).join('') +
      '</div><p class="quiet" style="margin-top:0.35rem">' + CONFIG.declineClaims.map(function (d) { return '<b>' + esc(d.label) + '</b>: ' + esc(d.help); }).join(' ') + '</p></fieldset>' +
      '<div class="two-col">' + textInput('pr-where', 'Where', 'problem.where', p.where, { max: 120 }) + textInput('pr-who', 'For whom', 'problem.forWhom', p.forWhom, { max: 160 }) + '</div>' +
      '</div>' + guide('Problem statement', quote(G.statement, G.statementRef)) + '</div>';

    var lint = ltoLint(l.text);
    h += '<div class="part" style="--part-colour:var(--char-4)"><h3>2. Positive opposite: the long-term outcome</h3><div>' +
      wcText('lto-text', 'Long-term outcome, phrased as a condition', 'lto.text', l.text, CONFIG.words.lto, { short: true, lint: 'lto' }) +
      '<div id="lto-reason-wrap"' + (lint.ok ? ' hidden' : '') + '>' +
      wcText('lto-reason', 'Keeping a flagged word? Say why', 'lto.lintReason', l.lintReason, CONFIG.words.lintReason, { short: true }) + '</div>' +
      '</div>' + guide('Positive opposite', quote(G.opposite, G.oppositeRef)) + '</div>';

    h += '<div class="part" style="--part-colour:var(--char-6)"><h3>3. Shared definitions</h3><div>';
    l.definitions.forEach(function (d, i) {
      h += '<div class="item" style="--item-colour:var(--char-6)"><div class="item-head"><span class="tag">' + (i + 1) + '</span><span class="grow"></span>' +
        '<button type="button" class="btn btn-danger btn-small" data-action="def-remove" data-arg="' + i + '" aria-label="Remove definition ' + (i + 1) + '">Remove</button></div>' +
        textInput('def-t' + i, 'Term ' + (i + 1), 'lto.definitions.' + i + '.term', d.term, { max: 60, logLabel: 'Definition term' }) +
        wcText('def-m' + i, 'What we mean by it, including its boundaries', 'lto.definitions.' + i + '.meaning', d.meaning, CONFIG.words.meaning, { short: true, logLabel: 'Definition meaning' }) + '</div>';
    });
    h += '<button type="button" class="btn btn-accent" data-action="def-add">Add a definition</button></div>' +
      guide('Definitions', quote(G.definitions, G.definitionsRef)) + '</div>';

    var c = l.ceiling;
    h += '<div class="part" style="--part-colour:var(--char-1)"><h3>4. Accountability ceiling</h3><div>' +
      wcText('ce-goal', 'Ultimate goal (above the ceiling: linked to, not held to)', 'lto.ceiling.ultimateGoal', c.ultimateGoal, CONFIG.words.ultimateGoal, { short: true }) +
      '<fieldset role="radiogroup"><legend>Where does the client\u2019s stated ambition sit?</legend><div class="choices">' +
      CONFIG.ceilingPositions.map(function (x) { return choice('ceiling', x.id, '<b>' + esc(x.label) + '</b>&nbsp;· ' + esc(x.help), c.ambitionPosition === x.id, x.colour, 'radio', 'lto.ceiling.ambitionPosition', ' block'); }).join('') +
      '</div></fieldset>' +
      (state.clientTheory.ambition ? '<p class="quiet">Your record of the ambition (screen 2): ' + esc(state.clientTheory.ambition) + '</p>' : '') +
      wcText('ce-reason', 'Why there?', 'lto.ceiling.reason', c.reason, CONFIG.words.ceilingReason) +
      '</div>' + guide('Ceiling', quote(G.ceiling, G.ceilingRef) + '<p style="margin-top:0.4rem">' + quote(G.ceilingQuestion, G.ceilingQuestionRef) + '</p>') + '</div>';
    h += '</section>' + screenGate(3);

  // ── Screen 4: stakeholders and the week 9 close ──
  function renderStakeholders(sc) {
    var G = CONFIG.guidance.stakeholders, h = screenHead(sc);

      '<details class="drawer"><summary>The eight questions (notes optional)</summary><div>' +
      CONFIG.stakeholderQuestions.map(function (q, i) {
        return '<div class="field"><label for="sq' + i + '" style="text-transform:none;letter-spacing:0;font-size:0.9rem;color:var(--text)">' + (i + 1) + '. ' + esc(q) + '</label>' +
          '<input type="text" id="sq' + i + '" data-f="stakeholderQuestions.q' + (i + 1) + '" data-label="Stakeholder question notes" value="' + esc(state.stakeholderQuestions['q' + (i + 1)]) + '"></div>';

        '<button type="button" class="btn btn-danger btn-small" data-action="st-remove" data-arg="' + x.id + '" aria-label="Remove stakeholder ' + n + '">Remove</button></div>' +

        '<div class="two-col">' +
        '<fieldset role="radiogroup"><legend>Affected?</legend><div class="choices">' +
        choice('st|' + i + '|affected', 'yes', 'Yes', x.affected === 'yes', 'var(--char-1)', 'radio', base + 'affected') +
        choice('st|' + i + '|affected', 'no', 'No', x.affected === 'no', 'var(--char-5)', 'radio', base + 'affected') + '</div></fieldset>' +
        '<fieldset role="radiogroup"><legend>Can we ask them?</legend><div class="choices">' +
        choice('st|' + i + '|ask', 'yes', 'Yes', x.canWeAsk === 'yes', 'var(--correct)', 'radio', base + 'canWeAsk') +
        choice('st|' + i + '|ask', 'no', 'No', x.canWeAsk === 'no', 'var(--char-2)', 'radio', base + 'canWeAsk') + '</div></fieldset>' +
        '<fieldset role="radiogroup"><legend>Influence</legend><div class="choices">' +
        CONFIG.levels.map(function (lv) { return choice('st|' + i + '|inf', lv.id, lv.label, x.influence === lv.id, 'var(--char-6)', 'radio', base + 'influence'); }).join('') + '</div></fieldset>' +
        '<fieldset role="radiogroup"><legend>Interest</legend><div class="choices">' +
        CONFIG.levels.map(function (lv) { return choice('st|' + i + '|int', lv.id, lv.label, x.interest === lv.id, 'var(--char-8)', 'radio', base + 'interest'); }).join('') + '</div></fieldset>' +
        '</div><div class="row"><label class="choice"><input type="checkbox" data-f="' + base + 'fromBrief"' + (x.fromBrief ? ' checked' : '') + '><span>Named in the client brief</span></label>' +
        (x.fromBrief ? textInput('st-s' + x.id, 'Slide number', base + 'slide', x.slide, { slide: true, max: 3, logLabel: 'Stakeholder slide' }) : '') + '</div>' +
        (x.canWeAsk === 'no' ? '<p class="quiet">Added to Find out first.</p>' : '') + '</div>';
    });
    h += '<button type="button" class="btn btn-accent" data-action="st-add">Add a stakeholder</button></div>' +
      guide('Rating', quote(G.rating, G.ratingRef)) + '</div></section>';
    h += screenGate(4);
    h += renderClose(9);
    return h;

  // The close of a week: the week gate, the self-check, then the cards.
  function renderClose(week) {
    var wk = CONFIG.weeks[week], closed = weekClosed(state, week), sc = state.selfChecks['week' + week];
    var h = '<section class="panel" id="close-' + week + '" style="--panel-colour:' + wk.colour + '"><p class="eyebrow panel-eyebrow">Week ' + week + ' close</p>' +
      '<h3>Self-check</h3><p class="quiet">' + esc(CONFIG.guidance.close) + '</p>';
    var wg = gateResult(weekChecks(state, week));
    if (!closed && !wg.ok) {
      h += gateHtml('gate-week' + week, weekChecks(state, week).filter(function (c) { return !c.ok; }));
      h += '<p class="quiet">The self-check opens when every screen of week ' + week + ' is ready.</p></section>';
      return h;
    }
    h += '<div class="guide" style="margin-bottom:0.75rem">' + quote(CONFIG.selfCheck.intro, CONFIG.selfCheck.introRef) + '</div><p>' + esc(CONFIG.selfCheck.lead) + '</p>';
    CONFIG.selfCheck.questions.forEach(function (q) {
      h += '<div class="q-block"><q>' + esc(q.quote) + '</q>' +
        wcText('sc-' + week + '-' + q.id, q.label + ' (' + q.ref + ')', 'selfChecks.week' + week + '.' + q.id, sc[q.id], CONFIG.words.selfCheck, { short: true, readonly: closed }) + '</div>';
    });
    if (closed) {
      h += '<div class="closed-box"><p><b>Week ' + week + ' closed</b> on ' + esc(sc.completedAt.slice(0, 10)) + '. Later edits to its screens go into the revision log.</p>' +
        '<div class="actions"><button type="button" class="btn btn-primary" data-action="print-cards" data-arg="lto">Print the long-term outcome card</button>' +
        '<button type="button" class="btn btn-ghost" data-action="export">Export JSON</button></div>' +
        '<div class="card-grid">' + readyCards(state, ['lto']).map(a6Html).join('') + '</div></div>';
    } else {
      h += gateHtml('gate-close' + week, selfCheckChecks(state, week), { action: 'close-week', arg: String(week), label: 'Close week ' + week });
    }
    return h + '</section>';
  }

  function renderLater(sc) {
    var h = screenHead(sc, sc.summary);
    h += '<div class="later-box" style="' + panelStyle(sc) + '"><p class="big">Arrives in week ' + sc.week + '</p>' +
      (sc.instructor ? '<p><b>Instructor screen.</b></p>' : '') +
      '<p>' + esc(CONFIG.text.laterLead) + '</p><ul class="plain refs">' +
      sc.reading.map(function (r) { return '<li><b>' + esc(CONFIG.readings[r.ref].label + ' ' + r.pages) + '</b> ' + esc(r.what) + '</li>'; }).join('') + '</ul></div>';
    return h;
  }

  var RENDER = { 1: renderSetup, 2: renderClient, 3: renderProblem, 4: renderStakeholders };

  function renderSide() {
    var sc = SCREEN[state.ui.screen], week = sc.week, sChk = state.selfChecks['week' + week], list = members(state);
    var h = '<details class="side-sec" open style="--sec-colour:var(--char-1);--sec-ink:var(--char-1)"><summary>Reading · screen ' + sc.no + '</summary><div><ul class="plain refs">' +
      sc.reading.map(function (r) { return '<li><b>' + esc(CONFIG.readings[r.ref].label + ' ' + r.pages) + '</b> ' + esc(r.what) + '</li>'; }).join('') +
      '</ul><p class="quiet" style="margin-top:0.4rem">' + Object.keys(CONFIG.readings).map(function (k) { return esc(CONFIG.readings[k].label + ' ' + CONFIG.readings[k].full); }).join('. ') + '.</p></div></details>';
    var roles = state.roles['week' + week], held = CONFIG.roles.filter(function (r) { return roles[r.id]; });
    h += '<details class="side-sec" open style="--sec-colour:var(--char-5);--sec-ink:var(--char-5)"><summary>Roles · week ' + week + '</summary><div>' +
      (held.length ? '<ul class="plain roles-now">' + held.map(function (r) { return '<li><b>' + esc(r.name) + '</b>' + esc(roles[r.id]) + '</li>'; }).join('') + '</ul>' :
        '<p class="quiet">' + (list.length ? 'Not assigned yet.' : 'Enter members on screen 1.') + '</p>') + '</div></details>';
    h += '<details class="side-sec" style="--sec-colour:var(--char-2);--sec-ink:var(--char-2)"><summary>Self-check · week ' + week + (weekClosed(state, week) ? ' ✓' : '') + '</summary><div>' +
      '<p><q>' + esc(CONFIG.selfCheck.intro) + '</q> ' + esc(CONFIG.selfCheck.introRef) + '</p><ul class="plain refs">' +
      CONFIG.selfCheck.questions.map(function (q) {
        return '<li><b>' + esc(q.label) + '</b> ' + (wordCheck(sChk[q.id], CONFIG.words.selfCheck).ok ? '✓ answered' : 'not yet answered') + '<br><span class="quiet">' + esc(q.quote) + '</span></li>';
      }).join('') + '</ul><p class="quiet">Answer it at the close of week ' + week + (week === 9 ? ' (end of screen 4)' : '') + '.</p></div></details>';
    h += '<details class="side-sec" style="--sec-colour:var(--char-8);--sec-ink:var(--char-8)"><summary>Find out first <span class="count-badge">' + state.findOutFirst.length + '</span></summary><div>';
    state.findOutFirst.forEach(function (f) {
      h += '<div class="fof-item"><div><span class="src">' + esc(CONFIG.fofSources[f.source]) + (f.source === 'manual' && f.refId ? ' · screen ' + esc(f.refId) : '') + '</span>' + esc(f.text) + '</div>' +
        (f.source === 'manual' ? '<button type="button" class="btn btn-danger btn-small" data-action="fof-remove" data-arg="' + f.id + '" aria-label="Remove this item">×</button>' : '<span></span>') + '</div>';
    });
    if (!state.findOutFirst.length) h += '<p class="quiet">Nothing yet. Things you cannot know without access to residents go here.</p>';
    h += '<div class="field" style="margin-top:0.6rem"><label for="fof-new">Add something to find out</label><textarea id="fof-new" class="short" data-min="' + CONFIG.words.fof + '" aria-describedby="fof-new-wc"></textarea>' +
      '<div class="word-count bad" id="fof-new-wc" aria-live="polite">' + wordLabel('', CONFIG.words.fof) + '</div></div>' +
      '<button type="button" class="btn btn-ghost" data-action="fof-add">Add</button></div></details>';
    h += '<details class="side-sec" style="--sec-colour:var(--char-6);--sec-ink:var(--char-6)"><summary>Glossary</summary><div><p class="quiet">This course uses [TC]\u2019s terms; the [GAF] equivalent follows.</p><dl class="gloss">' +
      CONFIG.glossary.map(function (g) { return '<dt>' + esc(g.term) + '</dt><dd><span class="gaf">[GAF]: ' + esc(g.gaf) + '</span>' + (g.note ? '<br>' + esc(g.note) : '') + '</dd>'; }).join('') + '</dl></div></details>';
    els.side.innerHTML = h;
  }

  function render(focusMain) {
    var sc = SCREEN[state.ui.screen];
    renderRail();
    els.main.innerHTML = sc.built && RENDER[sc.no] ? RENDER[sc.no](sc) : renderLater(sc);
    renderSide();
    if (focusMain) els.main.focus();
  }

  // Refresh the live parts after typing, without rebuilding the inputs.
  function refreshLive(el) {
    if (el && el.dataset.min) {
      var wc = $(el.id + '-wc'), min = +el.dataset.min;
      if (wc) { wc.textContent = wordLabel(el.value, min); wc.className = 'word-count ' + (wordCheck(el.value, min).ok ? 'ok' : 'bad'); }
    }
    if (el && el.dataset.lint === 'lto') {
      var warn = $(el.id + '-warn'); if (warn) warn.innerHTML = lintHtml(el.value);
      var wrap = $('lto-reason-wrap'); if (wrap) wrap.hidden = ltoLint(el.value).ok;
    }
    var no = state.ui.screen, g = $('gate-' + no);
    if (g && SCREEN_CHECKS[no]) {
      var tmp = document.createElement('div');
      tmp.innerHTML = screenGate(no);
      g.parentNode.replaceChild(tmp.firstChild, g);
    }
    refreshClose(SCREEN[no].week);
    var cg = $('gate-close' + SCREEN[no].week);
    if (cg && !weekClosed(state, SCREEN[no].week)) {
      var w = SCREEN[no].week, t2 = document.createElement('div');
      t2.innerHTML = gateHtml('gate-close' + w, selfCheckChecks(state, w), { action: 'close-week', arg: String(w), label: 'Close week ' + w });
      cg.parentNode.replaceChild(t2.firstChild, cg);
    }
    renderRail();
  }

  // Member names feed the roles panel and the side panel. Rebuild those (not
  // the input being typed in) shortly after the list of names changes.
  var membersKey = '', membersTimer = null;
  function membersChanged() {
    clearTimeout(membersTimer);
    membersTimer = setTimeout(function () {
      var key = members(state).join('|');
      if (key === membersKey) return;
      membersKey = key;
      var rp = $('roles-panel'); if (rp) rp.innerHTML = renderRoles(9);
      renderSide();
    }, 350);
  }
  // Rebuild a week's close panel when its gate opens or closes while typing.
  function refreshClose(week) {
    var panel = $('close-' + week);
    if (!panel || weekClosed(state, week)) return;
    var ok = gateResult(weekChecks(state, week)).ok;
    var shows = !!$('gate-close' + week);
    if (ok !== shows || (!ok && $('gate-week' + week))) {
      var t = document.createElement('div');
      t.innerHTML = renderClose(week);
      panel.parentNode.replaceChild(t.firstChild, panel);
    }
  }

  function setPath(path, value) {
    var parts = path.split('.'), o = state;
    for (var i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = value;
  }
  function edited(el) {
    if (el.dataset.label) logEdit(state, state.ui.screen, el.dataset.label);
  }
  function refocus(id) { var e = id && $(id); if (e) e.focus(); }

  function download(name, obj) {
    var blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }
  function slug(s) { return String(s || 'group').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'group'; }
  function readJsonFile(input, cb) {
    var f = input.files && input.files[0];
    input.value = '';
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { var obj; try { obj = JSON.parse(r.result); } catch (e) { setStatus('That file is not valid JSON. Nothing was changed.'); return; } cb(obj); };
    r.onerror = function () { setStatus('The file could not be read. Nothing was changed.'); };
    r.readAsText(f);
  }
  function copyText(t) {
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      setStatus(ok ? 'Copied as text.' : 'Copy failed: use Print instead.');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { setStatus('Copied as text.'); }, fallback);
    else fallback();
  }
  // mode 'report' = the A4 report followed by every ready card; otherwise a
  // card type id, printed alone.
  var printMode = 'report';
  function preparePrint() {
    var meta = dash(state.group.name) + ' · ' + members(state).join(', ');
    $('tw-print-meta').textContent = meta;
    document.body.classList.toggle('print-cards', printMode !== 'report');
    $('print-area').innerHTML = printMode === 'report' ? buildReportHtml(state) + buildA6Html(readyCards(state)) : buildA6Html(readyCards(state, [printMode]));
  }
  // The mode is reset after printing (afterprint), so a later beforeprint
  // keeps it while the print dialog is open.
  function printNow(mode) { printMode = mode || 'report'; preparePrint(); window.print(); }
  function exportNow() {
    download('toc-workbench-' + slug(state.group.name) + '.json', buildExport(state));
    setStatus('Exported.');
  }
  function goto(no) {
    if (!screenEnabled(state, no)) return;
    state.ui.screen = no;
    if (SCREEN[no].built) state.ui.reached = Math.max(state.ui.reached, no);
    save(); render(true); window.scrollTo(0, 0);
  }

  function init() {
    els.status = $('status'); els.rail = $('rail'); els.main = $('main'); els.side = $('side');
    $('tw-eyebrow').textContent = CONFIG.text.eyebrow;
    $('tw-title').textContent = CONFIG.text.title;
    $('tw-lede').textContent = CONFIG.text.lede;
    $('tw-runsheet').innerHTML = '<summary>How week 9 runs (90 minutes)</summary><ol>' +
      CONFIG.runSheet.map(function (r) { return '<li><span class="t">' + esc(r.t) + '</span><span>' + esc(r.what) + '</span></li>'; }).join('') + '</ol>';
    state = load();
    var app = $('tw-app');

    app.addEventListener('input', function (ev) {
      var el = ev.target;
      if (el.id === 'fof-new') { refreshLive(el); return; }
      if (!el.dataset || !el.dataset.f || el.type === 'radio' || el.type === 'checkbox' || el.tagName === 'SELECT') return;
      setPath(el.dataset.f, el.value);
      edited(el);
      if (/^stakeholders\.\d+\.name$/.test(el.dataset.f)) { syncStakeholderFof(state); renderSide(); }
      if (el.dataset.f === 'group.name' || el.dataset.f.indexOf('group.members.') === 0) membersChanged();
      save(); refreshLive(el);
    });
    app.addEventListener('change', function (ev) {
      var el = ev.target;
      if (el.tagName === 'SELECT' && el.dataset.f) {
        setPath(el.dataset.f, el.value); edited(el); save(); render(); refocus(el.id); return;
      }
      if (el.type === 'checkbox' && el.name === 'pclaim') {
        var arr = state.problem.claims.filter(function (x) { return x !== el.value; });
        if (el.checked) arr.push(el.value);
        state.problem.claims = CONFIG.declineClaims.map(function (d) { return d.id; }).filter(function (id) { return arr.indexOf(id) !== -1; });
        logEdit(state, state.ui.screen, 'Decline claims'); save(); refreshLive(null); return;
      }
      if (el.type === 'checkbox' && el.dataset.f) {
        setPath(el.dataset.f, el.checked); logEdit(state, state.ui.screen, 'Stakeholder from the brief'); save(); render();
        var again = document.querySelector('[data-f="' + el.dataset.f + '"]'); if (again) again.focus();
        return;
      }
      if (el.type === 'radio') {
        if (el.name.indexOf('link|') === 0) {
          state.clientTheory.linkEvidence[el.name.slice(5)] = el.value;
          logEdit(state, state.ui.screen, 'Link evidence'); save(); refreshLive(null); return;
        }
        if (el.dataset.f) {
          setPath(el.dataset.f, el.value);
          logEdit(state, state.ui.screen, el.name.indexOf('st|') === 0 ? 'Stakeholder ratings' : 'Ceiling placement');
          if (/canWeAsk$/.test(el.dataset.f)) { syncStakeholderFof(state); save(); renderSide(); }
          save(); refreshLive(null);
          if (/canWeAsk$/.test(el.dataset.f)) { render(); var r = document.querySelector('input[name="' + el.name + '"][value="' + el.value + '"]'); if (r) r.focus(); }
        }
      }
    });
    app.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-action]');
      if (!b || b.disabled) return;
      var act = b.dataset.action, arg = b.dataset.arg, sNo = state.ui.screen, log = function (c) { logEdit(state, sNo, c); };
      if (act === 'goto') goto(+arg);
      else if (act === 'next') { if (gateResult(screenChecks(state, sNo)).ok) goto(+arg); }
      else if (act === 'suggest-roles') {
        var w = +arg, list = members(state);
        state.roles['week' + w] = suggestRoles(list, w > 9 ? state.roles['week' + (w - 1)] : null);
        log('Roles, week ' + w); save(); render(); refocus('role-' + w + '-facilitator');
        setStatus('Roles suggested for week ' + w + '. Change any you like.');
      }
      else if (act === 'claim-add') { var c = addClaim(state); log('Client claims added or removed'); save(); render(); refocus('cl-' + c.id); }
      else if (act === 'claim-remove') { if (window.confirm('Remove this claim?')) { removeClaim(state, arg); log('Client claims added or removed'); save(); render(); } }
      else if (act === 'claim-place') { placeClaim(state, arg); log('Client chain order'); save(); render(); refocus('up-' + arg); }
      else if (act === 'claim-unplace') { unplaceClaim(state, arg); log('Client chain order'); save(); render(); }
      else if (act === 'claim-up' || act === 'claim-down') {
        moveClaim(state, arg, act === 'claim-up' ? -1 : 1); log('Client chain order'); save(); render();
        var btn = $((act === 'claim-up' ? 'up-' : 'down-') + arg); if (btn && btn.disabled) btn = $((act === 'claim-up' ? 'down-' : 'up-') + arg); if (btn) btn.focus();
      }
      else if (act === 'def-add') { state.lto.definitions.push({ term: '', meaning: '' }); log('Definitions added or removed'); save(); render(); refocus('def-t' + (state.lto.definitions.length - 1)); }
      else if (act === 'def-remove') { if (window.confirm('Remove this definition?')) { state.lto.definitions.splice(+arg, 1); log('Definitions added or removed'); save(); render(); } }
      else if (act === 'st-add') {
        var x = { id: uid('s'), name: '', fromBrief: false, slide: '', affected: '', influence: '', interest: '', canWeAsk: '' };
        state.stakeholders.push(x); log('Stakeholders added or removed'); save(); render(); refocus('st-n' + x.id);
      }
      else if (act === 'st-remove') {
        if (window.confirm('Remove this stakeholder?')) { state.stakeholders = state.stakeholders.filter(function (s) { return s.id !== arg; }); syncStakeholderFof(state); log('Stakeholders added or removed'); save(); render(); }
      }
      else if (act === 'use-draft') {
        var d = state.imported.week7 && state.imported.week7.sentences[+arg];
        if (d && (!String(state.problem.statement).trim() || window.confirm('Replace your problem statement with this draft?'))) {
          state.problem.statement = d.text; log('Problem statement'); save(); render(); refocus('pr-st');
        }
      }
      else if (act === 'fof-add') {
        var t = $('fof-new'), wc = wordCheck(t.value, CONFIG.words.fof);
        if (!wc.ok) { setStatus('Find out first: the item ' + wc.msg + '.'); t.focus(); return; }
        addFof(state, t.value.trim(), 'manual', String(sNo)); save(); renderSide(); setStatus('Added to Find out first.');
      }
      else if (act === 'fof-remove') { removeFof(state, arg); save(); renderSide(); }
      else if (act === 'close-week') {
        var probs = closeWeek(state, +arg);
        if (probs.length) setStatus('Not closed yet: ' + probs[0]);
        else { save(); render(); refocus('close-' + arg); setStatus('Week ' + arg + ' closed. Print your card and export.'); }
      }
      else if (act === 'print-cards') printNow(arg);
      else if (act === 'export') exportNow();
      else if (act === 'week7-load') $('week7-file').click();
      else if (act === 'week7-clear') { if (window.confirm('Remove the week 7 sentences from this workbench?')) { state.imported.week7 = null; save(); render(); } }
    });

    $('week7-file').addEventListener('change', function () {
      readJsonFile(this, function (obj) {
        var errs = validateWeek7(obj);
        if (errs.length) { setStatus(errs[0] + ' Nothing was changed.'); return; }
        state.imported.week7 = week7Summary(obj); save(); render();
        setStatus('Week 7 export loaded: ' + plural(state.imported.week7.sentences.length, 'locked sentence') + ', shown on screen 3.');
      });
    });
    $('btn-export').addEventListener('click', exportNow);
    $('btn-import').addEventListener('click', function () { $('import-file').click(); });
    $('import-file').addEventListener('change', function () {
      readJsonFile(this, function (obj) {
        var errs = validateImport(obj);
        if (errs.length) { setStatus(errs[0] + ' Nothing was changed.'); return; }
        var who = isObj(obj.group) && obj.group.name ? obj.group.name : 'this group';
        if (!window.confirm('Replace the work on this device with the work of ' + who + ' from this file?')) return;
        state = migrate(clone(obj.state)); save(); render();
        setStatus('Imported the work of ' + (state.group.name || 'this group') + '.');
      });
    });
    $('btn-copy').addEventListener('click', function () { copyText(buildText(state)); });
    $('btn-print').addEventListener('click', function () { printNow('report'); });
    $('btn-reset').addEventListener('click', function () {
      if (!window.confirm('Reset clears all of this group\u2019s work on this device, for every week. Export first if you want to keep it. Reset now?')) return;
      state = defaultState();
      try { window.localStorage.removeItem(CONFIG.storageKey); } catch (e) { /* storage unavailable */ }
      render(); setStatus('Reset.');
    });
    window.addEventListener('beforeprint', preparePrint);
    window.addEventListener('afterprint', function () { printMode = 'report'; });
    render();
  }

  // Test hook: pure functions and CONFIG exposed for test.html.
  window.TW = {
    CONFIG: CONFIG,
    SCREEN: SCREEN,
    wordCount: wordCount,
    wordCheck: wordCheck,
    validSlide: validSlide,
    lintActivity: lintActivity,
    lintNegative: lintNegative,
    lintAnd: lintAnd,
    ltoLint: ltoLint,
    defaultState: defaultState,
    migrate: migrate,
    members: members,
    rolesFor: rolesFor,
    suggestRoles: suggestRoles,
    rotationRepeats: rotationRepeats,
    gateResult: gateResult,
    screenChecks: screenChecks,
    weekChecks: weekChecks,
    selfCheckChecks: selfCheckChecks,
    closeWeek: closeWeek,
    weekClosed: weekClosed,
    screenEnabled: screenEnabled,
    currentWeek: currentWeek,
    addFof: addFof,
    removeFof: removeFof,
    syncStakeholderFof: syncStakeholderFof,
    logEdit: logEdit,
    addClaim: addClaim,
    removeClaim: removeClaim,
    placeClaim: placeClaim,
    moveClaim: moveClaim,
    chainLinks: chainLinks,
    validateWeek7: validateWeek7,
    week7Summary: week7Summary,
    buildExport: buildExport,
    validateImport: validateImport,
    OUTPUT_SECTIONS: OUTPUT_SECTIONS,
    CARD_TYPES: CARD_TYPES,
    buildReportHtml: buildReportHtml,
    buildText: buildText,
    readyCards: readyCards,
    buildA6Html: buildA6Html
  };

  if (document.getElementById('tw-app')) init();
})();
</script>
