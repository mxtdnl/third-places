<!--
  WEEK 7 - WHY BODØ? (TRAVELS, BENDS OR BREAKS)
  Social Phenomena Challenge, ADJUDICATE phase (week 7). Follows the week 6
  Claim Wall Sort.

  Learning outcome: each student, individually, can say in one sentence why
  third places in Bodø might be declining, and which fact about Bodø makes
  that cause matter there.

  The game, on one device per group:
    1. Shortlist: the group picks four causes from its claim row of the class
       wall and puts each in its own words (merging duplicate cards).
    2. Fact rounds: the tool deals five sourced Bodø fact cards face down, one
       per round. The group flips the card and judges every cause still
       standing: TRAVELS (works the same in Bodø), BENDS (works, but
       differently), BREAKS (unlikely in Bodø) or NO BEARING. Each judgement
       other than No bearing needs a short reason. Two Breaks and a cause is
       knocked out.
    3. Your sentence: the survivors go on a podium. Each student picks one,
       picks a fact it survived, and completes
         "Third places in Bodø may be [claim] because [cause].
          This matters in Bodø because [fact]."
       then runs the swap test (read it with "London" for "Bodø") and locks it.
    4. Cards: one A6 card per student for the wall.
    5. Class reveal (instructor): load every group's export to see which
       causes survived where, and which facts broke the most causes.

  The sentence says "may be": nothing in the course materials establishes that
  third places in Bodø ARE declining. There is no score and no correct
  verdict. The tool never asks what should be done; phrasing that sounds like
  an intervention ("should", "we recommend", "the club could") triggers a soft
  warning.

  ============================================================================
  RUN SHEET (90 minutes, groups of 3-5, one device per group)
  ============================================================================
   0-5   Group names; each group takes one claim row.
   5-15  1. Shortlist four causes.
  15-50  2. Five fact rounds, about seven minutes each.
  50-65  3. Sentences: pass the device round; swap test with a neighbour.
  65-72  Print the A6 cards, pin them on the Bodø strip; export JSON.
  72-90  Class reveal on the projector, then discussion.

  ============================================================================

  ============================================================================

  ============================================================================
  {

    "schemaVersion": 2,                          REQUIRED (1 = the earlier
                                                 assumption-audit version,
                                                 which this version does not open)
    "exportedAt": "ISO 8601 timestamp",
    "group": { "name": "string", "members": ["string", ...] },
    "claimRow": 1|2|3|4|null,
    "causes": [                                  in shortlist order
      { "id": "c1", "text": "string", "cards": ["cardId", ...],
        "travels": n, "bends": n, "breaks": n, "out": true|false } ],
    "rounds": [                                  dealt rounds, in order
      { "factId": "string", "done": true|false,
        "verdicts": [ { "causeId": "c1", "verdict": "travels|bends|breaks|none",
                        "reason": "string" } ] } ],
    "sentences": [                               one per member, in member order
      { "member": "string", "causeId": "c1|null", "factId": "string|null",
        "characteristic": "id|null", "final": "string", "locked": true|false } ],
    "state": { ...the full internal state; used verbatim on re-import... }
  }
  Re-import accepts any schemaVersion 2 file whose "tool" is
  "week7-bodo-decline" and whose "state" object is present, after a confirm
  step. The class reveal reads "causes", "rounds" and "sentences" only.

<style>
  :root {
    --bg: #F2DFBE;
    --bg-card: #FFFAF2;
    --bg-deep: #E8D2A8;
    --text: #2A1F18;
    --text-muted: #6A5A48;
    --border: #D8C8A8;

    --char-1: #5C3A96;
    --char-2: #B52838;
    --char-3: #C85218;
    --char-4: #D4A020;
    --char-5: #7A5828;
    --char-6: #B83068;
    --char-7: #CC6830;
    --char-8: #7E58A8;

    --correct: #2A7A42;
    --correct-bg: #E6F4EA;
    --incorrect: #B82828;
    --incorrect-bg: #FDEEEE;
    --ambiguous: #B98A10;
    --ambiguous-bg: #FFF3D6;
    --card-ink: #2A1F18;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
  }
  :focus-visible { outline: 3px solid var(--char-1); outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  .app-wrap { max-width: 1080px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }

  h1 {
    font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 800; letter-spacing: 0.06em;
    text-transform: uppercase; line-height: 1.1; margin-bottom: 0.5rem;
  }
  h2 {
    font-size: clamp(1.2rem, 2.4vw, 1.6rem); font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.05em; line-height: 1.2; margin-bottom: 0.5rem;
  }
  h3 { font-size: 0.95rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
  p { margin-bottom: 0.6rem; }
  .eyebrow { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); }
  .lede { font-size: 1.02rem; color: var(--text-muted); max-width: 760px; margin-bottom: 0.25rem; }
  .quiet { color: var(--text-muted); font-size: 0.88rem; }

  /* ── Page header with house geometry ── */
  .page-header {
    position: relative; overflow: hidden;
    padding: 1.5rem 2rem 1.25rem 0; margin-bottom: 1rem;
    border-bottom: 6px solid var(--char-1);
  }
  .page-header > * { position: relative; z-index: 1; }
  .page-header::before {
    content: ''; position: absolute; width: 230px; height: 230px;
    background: var(--char-1); border-radius: 50%; opacity: 0.08;
    top: -80px; right: -40px; z-index: 0;
  }
  .page-header::after {
    content: ''; position: absolute; width: 64px; height: 64px;
    background: var(--char-4); opacity: 0.16;
    bottom: 14px; right: 160px; transform: rotate(25deg); z-index: 0;
  }
  .page-header .deco-bar {
    position: absolute; z-index: 0; pointer-events: none;
    width: 160px; height: 10px; background: var(--char-2);
    top: 28px; right: 250px; transform: rotate(-8deg);
  }
  .page-header .deco-ring {
    position: absolute; z-index: 0; pointer-events: none;
    width: 84px; height: 84px; border: 6px solid var(--char-3); border-radius: 50%;
    bottom: -30px; right: 40px; opacity: 0.3;
  }

  /* ── Run sheet ── */
  .runsheet {
    background: var(--bg-card); border: 2px solid var(--border); border-left: 6px solid var(--char-5);
    margin-bottom: 0.75rem;
  }
  .runsheet summary {
    cursor: pointer; padding: 0.65rem 1rem; min-height: 44px; display: flex; align-items: center;
    font-size: 0.74rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--char-5);
  }
  .runsheet ol { list-style: none; padding: 0 1rem 0.75rem; }
  .runsheet li { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: 0.75rem; padding: 0.35rem 0; border-top: 2px solid var(--border); font-size: 0.9rem; }
  .runsheet .t { font-weight: 800; color: var(--char-5); }

  /* ── Toolbar and status ── */

    interventionWarning: 'This sounds like a proposal for what should be done. This week explains causes; save proposals for the intervene weeks.',

    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function isObj(o) { return !!o && typeof o === 'object' && !Array.isArray(o); }
  function wordCount(s) {
    var m = String(s || '').match(/[A-Za-z0-9À-ɏ]+(?:['\u2019\-][A-Za-z0-9À-ɏ]+)*/g);
    return m ? m.length : 0;
  }
  function membersList(s) {
    var seen = {};
    return String(s || '').split(/[,;\n]/).map(function (x) { return x.trim().replace(/\s+/g, ' '); })

  }
  // Problems with a text against a word limit from CONFIG.words.
  function wordProblem(text, key) {
    var lim = CONFIG.words[key], n = wordCount(text);
    if (n < lim.min) return 'needs at least ' + lim.min + ' words (' + n + ' so far)';
    if (lim.max && n > lim.max) return 'must be ' + lim.max + ' words or fewer (' + n + ' now)';
    return '';
  }
  function wordsOk(text, key) { return !wordProblem(text, key); }
  function wordLabel(text, key) {
    var lim = CONFIG.words[key], n = wordCount(text);
    if (lim.max) return n + ' / ' + lim.max + ' words (at least ' + lim.min + ')';
    return n + ' words (at least ' + lim.min + ')';
  }
  function interventionWarning(text) { return INTERVENTION_RE.test(String(text || '')) ? CONFIG.interventionWarning : ''; }
  function cardTextHtml(t) { return esc(t).replace(/\[[^\]]*\]/g, function (m) { return '<span class="ins">' + m + '</span>'; }); }
  function claimName(no) { var c = CLAIM[no]; return c ? 'Claim ' + c.no + ' · ' + c.label + ' (' + c.course.toLowerCase() + ')' : ''; }
  function causeColour(i) { return CONFIG.causeColours[i % CONFIG.causeColours.length]; }
  function factLabel(id) { var f = FACT[id]; return f ? f.title + (f.scope === 'norway' ? ' (' + CONFIG.scopeLabels.norway + ')' : '') : ''; }
  function trimEnd(s) { return String(s || '').trim().replace(/[\s.!?;,]+$/, ''); }
  function shorten(s, n) { s = String(s || '').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

  // A small seeded shuffle, so that each group's deal is fixed and repeatable.
  function hashString(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function seededShuffle(list, seedText) {
    var a = list.slice(), seed = hashString(seedText) || 1;
    function rnd() { seed = (Math.imul(seed ^ (seed >>> 15), 1 | seed) + 0x6D2B79F5) >>> 0; return ((seed ^ (seed >>> 14)) >>> 0) / 4294967296; }
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  // State
  // ==========================================================================
  function roundCount() { return Math.min(CONFIG.rounds, CONFIG.facts.length); }
  function blankCause(i) { return { id: 'c' + (i + 1), text: '', card1: '', card2: '' }; }

  }

  // Cards on the wall, by id (starting cards plus any new cards from the class wall).
  function cardById(state, id) {
    if (START[id]) return START[id];
    var n = state.wall.newCards || [];
    for (var i = 0; i < n.length; i++) if (n[i].id === id) return { id: n[i].id, claim: n[i].claim, lens: n[i].lens, uncertain: false, text: n[i].text, isNew: true };
    return null;
  }
  function startingCells() {
    var cells = { hold: [] };
    CONFIG.claims.forEach(function (c) { CONFIG.lenses.forEach(function (l) { cells['c' + c.no + '-' + l.id] = []; }); });
    CONFIG.cards.forEach(function (c) { cells['c' + c.claim + '-' + c.lens].push(c.id); });
    return cells;
  }
  function cells(state) { return state.wall.cells || startingCells(); }
  // Cards currently in a claim row, with the lens column they sit in.
  function rowCards(state, row) {
    var out = [], cs = cells(state);
    if (!CLAIM[row]) return out;
    CONFIG.lenses.forEach(function (l) {
      (cs['c' + row + '-' + l.id] || []).forEach(function (id) {
        var c = cardById(state, id);
        if (c) out.push({ id: id, lens: l.id, text: c.text, uncertain: c.uncertain, isNew: !!c.isNew });
      });
    });
    return out;
  }
  // Every card on the wall, in wall order (rows, then holding area).
  function allCards(state) {
    var out = [], cs = cells(state);
    CONFIG.claims.forEach(function (c) { out = out.concat(rowCards(state, c.no).map(function (x) { x.claim = c.no; return x; })); });
    (cs.hold || []).forEach(function (id) {
      var c = cardById(state, id);
      if (c) out.push({ id: id, lens: c.lens, claim: 0, text: c.text, uncertain: c.uncertain, isNew: !!c.isNew });
    });
    return out;
  }
  function memberState(state, name) {
    if (!state.individual[name]) state.individual[name] = blankMember();
    return state.individual[name];
  }
  function causeById(state, id) { return state.causes.filter(function (c) { return c.id === id; })[0] || null; }
  function causeIndex(state, id) { return state.causes.map(function (c) { return c.id; }).indexOf(id); }
  function causeCards(c) { return [c.card1, c.card2].filter(Boolean); }

  // ==========================================================================
  // The game (pure)
  // ==========================================================================
  // Fix the order of the deck the first time a card is dealt.
  function deal(state) {
    if (state.deck.length) return state.deck;
    var ids = CONFIG.facts.map(function (f) { return f.id; });
    if (CONFIG.dealOrder !== 'fixed') ids = seededShuffle(ids, String(state.group.name || '').trim().toLowerCase() + '|' + state.claimRow);
    state.deck = ids.slice(0, roundCount());
    return state.deck;
  }
  function roundFact(state, r) { return FACT[state.deck[r]] || null; }
  // Breaks a cause collected in the rounds before round r.
  function breaksBefore(state, causeId, r) {
    var n = 0;
    for (var i = 0; i < r && i < state.rounds.length; i++) {
      var v = state.rounds[i].verdicts[causeId];
      if (v && v.verdict === 'breaks') n++;
    }
    return n;
  }
  // Causes still standing when round r is played.
  function liveAt(state, r) {
    return state.causes.filter(function (c) { return breaksBefore(state, c.id, r) < CONFIG.knockoutBreaks; });
  }
  function roundErrors(state, r) {
    var R = state.rounds[r], e = [], judged = 0, p;
    if (!R || !roundFact(state, r)) return ['Deal the card first.'];
    if (!R.flipped) return ['Flip the card.'];
    liveAt(state, r).forEach(function (c) {
      var v = R.verdicts[c.id], tag = 'Cause ' + (causeIndex(state, c.id) + 1) + ': ';
      if (!v || !VERDICT[v.verdict]) { e.push(tag + 'choose Travels, Bends, Breaks or No bearing.'); return; }
      if (v.verdict !== 'none') judged++;
      if (VERDICT[v.verdict].reason && (p = wordProblem(v.reason, 'reason'))) e.push(tag + 'the reason ' + p + '.');
    });
    if (!e.length && !judged) e.push('Which cause does this fact speak to most? Judge at least one cause Travels, Bends or Breaks.');
    return e;
  }
  function roundDone(state, r) { return !roundErrors(state, r).length; }
  // The first round not yet complete (or the round count when all are done).
  function currentRound(state) {
    for (var r = 0; r < state.rounds.length; r++) if (!roundDone(state, r)) return r;
    return state.rounds.length;
  }
  // A cause's record across the rounds it played in.
  function record(state, causeId) {
    var out = { travels: 0, bends: 0, breaks: 0, none: 0, marks: [], out: false, outRound: 0 };
    for (var r = 0; r < state.rounds.length; r++) {
      if (breaksBefore(state, causeId, r) >= CONFIG.knockoutBreaks) { out.marks.push(''); continue; }
      var v = state.rounds[r].verdicts[causeId], k = v && VERDICT[v.verdict] ? v.verdict : '';
      if (k) out[k]++;
      out.marks.push(k);
    }
    out.out = breaksBefore(state, causeId, state.rounds.length) >= CONFIG.knockoutBreaks;
    if (out.out) for (var i = 1; i <= state.rounds.length; i++) if (breaksBefore(state, causeId, i) >= CONFIG.knockoutBreaks) { out.outRound = i; break; }
    return out;
  }
  // Causes in podium order: standing first, then fewest Breaks, most Travels,
  // most Bends, then shortlist order. This orders the group's own verdicts;
  // it is not a grade.
  function standings(state) {
    return state.causes.map(function (c, i) { return { cause: c, i: i, rec: record(state, c.id) }; })
      .sort(function (a, b) {
        return (a.rec.out - b.rec.out) || (a.rec.breaks - b.rec.breaks) || (b.rec.travels - a.rec.travels) || (b.rec.bends - a.rec.bends) || (a.i - b.i);
      });
  }
  // Facts a cause survived (Travels or Bends), in the order dealt.
  function survivedFacts(state, causeId) {
    var out = [];
    state.rounds.forEach(function (R, r) {
      var v = R.verdicts[causeId];
      if (R.flipped && v && (v.verdict === 'travels' || v.verdict === 'bends') && breaksBefore(state, causeId, r) < CONFIG.knockoutBreaks) out.push(state.deck[r]);
    });
    return out;
  }
  function flippedFacts(state) { return state.deck.filter(function (id, r) { return state.rounds[r] && state.rounds[r].flipped; }); }

  // ==========================================================================
  // Completeness (pure)
  // ==========================================================================
  function setupErrors(state) {
    var e = [];
    if (!String(state.group.name || '').trim()) e.push('Enter your group name.');
    if (!membersList(state.group.members).length) e.push('Enter at least one member name.');
    if (!CLAIM[state.claimRow]) e.push('Choose your claim row.');
    return e;
  }
  function causeErrors(state, i) {
    var c = state.causes[i], e = [], tag = 'Cause ' + (i + 1) + ': ', p;
    if (!c.card1 || !cardById(state, c.card1)) e.push(tag + 'choose the wall card it comes from.');
    if (c.card2 && c.card2 === c.card1) e.push(tag + 'the second card must be a different card.');
    if ((p = wordProblem(c.text, 'cause'))) e.push(tag + 'your own words ' + p + '.');
    return e;
  }
  function causesErrors(state) {
    var e = [];
    for (var i = 0; i < state.causes.length; i++) e = e.concat(causeErrors(state, i));
    return e;
  }
  function roundsErrors(state) {
    var r = currentRound(state);
    return r < state.rounds.length ? ['Finish round ' + (r + 1) + ' of ' + state.rounds.length + '.'] : [];
  }
  // The member's sentence, assembled from the frame and the two slots.
  function assembleSentence(state, m) {
    var c = CLAIM[state.claimRow];
    return CONFIG.sentenceStart + ' ' + (c ? c.phrase : '…') + ' because ' + (trimEnd(m.because) || '…') + '. ' +
      CONFIG.sentenceMiddle + ' ' + (trimEnd(m.bodo) || '…') + '.';
  }
  function draftErrors(state, m) {
    var e = [], p;
    if (!causeById(state, m.causeId)) e.push('Choose the cause your sentence explains.');
    if (flippedFacts(state).indexOf(m.factId) === -1) e.push('Choose the Bodø fact that makes it matter there.');
    if ((p = wordProblem(m.because, 'because'))) e.push('The "because" part ' + p + '.');
    if ((p = wordProblem(m.bodo, 'bodo'))) e.push('The "matters in Bodø" part ' + p + '.');
    if (!e.length && (p = wordProblem(assembleSentence(state, m), 'sentence'))) e.push('The whole sentence ' + p + '.');
    return e;
  }
  function lockErrors(state, m) {
    var e = draftErrors(state, m);
    if (m.swap === 'fail') e.push(CONFIG.swapTest.failHelp);
    else if (m.swap !== 'pass') e.push('Run the swap test.');
    return e;
  }
  function stepErrors(state, id) {
    if (id === 'setup') return setupErrors(state);
    if (id === 'causes') return causesErrors(state);
    if (id === 'rounds') return roundsErrors(state);
    if (id === 'mine') {
      var ms = membersList(state.group.members);
      var open = ms.filter(function (n) { return !(state.individual[n] && state.individual[n].locked); });
      return open.length ? ['Not locked yet: ' + open.join(', ') + '.'] : [];
    }
    return [];
  }
  function stepEnabled(state, id) {
    if (!CONFIG.gateSteps || id === 'class') return true;
    for (var i = 0; i < STEPS.length && STEPS[i].id !== id; i++) {

      if (id === 'cards' && STEPS[i].id !== 'setup') continue;

    return true;
  }
  function lockMember(state, name) {

    if (!e.length) m.locked = true;
    return e;
  }
  function lockedSentences(state) {
    return membersList(state.group.members).filter(function (n) { return state.individual[n] && state.individual[n].locked; })
      .map(function (n) { var m = state.individual[n]; return { member: n, m: m, text: assembleSentence(state, m) }; });
  }

  // ==========================================================================
  // Class wall import (from week6-claim-wall-sort.html)
  // ==========================================================================
  function validateWall(obj) {
    if (!isObj(obj) || obj.tool !== CONFIG.wallToolId) {
      return ['This file is not a Claim Wall Sort export' + (isObj(obj) && (obj.tool || obj.schema) ? ' (it comes from "' + String(obj.tool || obj.schema) + '")' : '') + '.'];
    }
    if (obj.cardSet !== CONFIG.cardSet) return ['This wall uses a different card set (' + String(obj.cardSet) + ').'];
    if (!isObj(obj.cells) || !Array.isArray(obj.newCards)) return ['The card positions are missing.'];
    var e = [], expected = Object.keys(startingCells());
    expected.forEach(function (k) { if (!Array.isArray(obj.cells[k])) e.push('The wall layout does not match (missing ' + k + ').'); });
    if (e.length) return e;
    var known = {};
    obj.newCards.forEach(function (c) { if (isObj(c) && typeof c.id === 'string' && typeof c.text === 'string') known[c.id] = true; });
    expected.forEach(function (k) {
      obj.cells[k].forEach(function (id) { if (!START[id] && !known[id]) e.push('Card ' + String(id) + ' is not part of this wall.'); });
    });
    return e.filter(function (x, i, a) { return a.indexOf(x) === i; });
  }
  function applyWall(state, obj) {
    var keep = {};
    Object.keys(startingCells()).forEach(function (k) { keep[k] = obj.cells[k].slice(); });
    state.wall = {
      source: 'import',
      from: isObj(obj.group) ? String(obj.group.name || '') : '',
      exportedAt: String(obj.exportedAt || ''),
      cells: keep,
      newCards: obj.newCards.filter(function (c) { return isObj(c) && typeof c.id === 'string'; }).map(function (c) {
        return { id: c.id, text: String(c.text), claim: +c.claim || 0, lens: String(c.lens || ''), group: String(c.group || '') };
      })
    };
    return state;
  }

  // ==========================================================================
  // Export, import (own files)
  // ==========================================================================
  function buildExport(state, now) {
    var s = clone(state);
    return {
      tool: CONFIG.toolId,
      schemaVersion: CONFIG.schemaVersion,
      exportedAt: now || new Date().toISOString(),
      group: { name: String(s.group.name || '').trim(), members: membersList(s.group.members) },
      claimRow: CLAIM[s.claimRow] ? +s.claimRow : null,
      causes: s.causes.map(function (c) {
        var rec = record(s, c.id);
        return { id: c.id, text: String(c.text || '').trim(), cards: causeCards(c), travels: rec.travels, bends: rec.bends, breaks: rec.breaks, out: rec.out };
      }),
      rounds: s.deck.map(function (id, r) {
        var R = s.rounds[r] || blankRound();
        return {
          factId: id, done: roundDone(s, r),
          verdicts: liveAt(s, r).filter(function (c) { return R.verdicts[c.id] && VERDICT[R.verdicts[c.id].verdict]; }).map(function (c) {
            var v = R.verdicts[c.id];
            return { causeId: c.id, verdict: v.verdict, reason: String(v.reason || '').trim() };
          })
        };
      }).filter(function (x, r) { return s.rounds[r] && s.rounds[r].flipped; }),
      sentences: membersList(s.group.members).map(function (n) {
        var m = s.individual[n] || blankMember();
        return {
          member: n, causeId: m.causeId || null, factId: m.factId || null,
          characteristic: CHAR[m.characteristic] ? m.characteristic : null,
          final: m.locked ? assembleSentence(s, m) : '', locked: !!m.locked
        };
      }),
      state: s
    };
  }
  function validateImport(obj) {
    if (!isObj(obj) || obj.tool !== CONFIG.toolId) return ['This file is not a "Why Bodø?" export.'];
    if (obj.schemaVersion === 1) return ['This file comes from the earlier version of "Why Bodø?" and cannot be opened here.'];
    if (typeof obj.schemaVersion !== 'number' || obj.schemaVersion > CONFIG.schemaVersion) return ['This file was made by a newer version of this tool.'];
    var s = obj.state;
    if (!isObj(s) || !isObj(s.group) || !isObj(s.wall) || !Array.isArray(s.causes) || !Array.isArray(s.deck) || !Array.isArray(s.rounds) || !isObj(s.individual)) return ['The saved work in this file is incomplete.'];
    return [];
  }
  // Fill any missing fields so old or partial state never breaks rendering.
  function normalise(s) {
    var b = blankState();
    var out = Object.assign(b, s);
    out.group = Object.assign({ name: '', members: '' }, s.group || {});
    out.wall = Object.assign(blankState().wall, s.wall || {});
    if (!Array.isArray(out.wall.newCards)) out.wall.newCards = [];
    out.causes = [];
    for (var i = 0; i < CONFIG.causeCount; i++) {
      var c = Object.assign(blankCause(i), (s.causes || [])[i] || {});
      c.id = 'c' + (i + 1);
      out.causes.push(c);
    }
    out.deck = (Array.isArray(s.deck) ? s.deck : []).filter(function (id) { return FACT[id]; }).slice(0, roundCount());
    if (out.deck.length && out.deck.length < roundCount()) out.deck = [];
    out.rounds = [];
    for (var r = 0; r < roundCount(); r++) {
      var R = Object.assign(blankRound(), (s.rounds || [])[r] || {});
      R.flipped = !!R.flipped && !!out.deck[r];
      R.verdicts = isObj(R.verdicts) ? R.verdicts : {};
      out.rounds.push(R);
    }
    out.individual = {};
    Object.keys(isObj(s.individual) ? s.individual : {}).forEach(function (n) {
      out.individual[n] = Object.assign(blankMember(), s.individual[n]);
    });
    out.round = Math.max(0, Math.min(+out.round || 0, out.rounds.length - 1));
    if (!STEPS.some(function (x) { return x.id === out.step; })) out.step = 'setup';
    return out;
  }

  // ==========================================================================
  // Class reveal (pure): reads several group exports
  // ==========================================================================
  function validateClassFile(obj) {
    var e = validateImport(obj);
    if (e.length) return e;
    if (!Array.isArray(obj.causes) || !Array.isArray(obj.rounds) || !Array.isArray(obj.sentences)) return ['This export has no game results.'];
    return [];
  }
  // Add a group's export to the class list, replacing an earlier file from
  // the same group (matched on group name, ignoring case).
  function addClassFile(list, obj) {
    var key = String(isObj(obj.group) ? obj.group.name : '').trim().toLowerCase();
    var out = list.filter(function (x) { return String(x.group.name || '').trim().toLowerCase() !== key; });
    out.push({ group: { name: String(obj.group.name || ''), members: Array.isArray(obj.group.members) ? obj.group.members.slice() : [] }, claimRow: obj.claimRow, causes: clone(obj.causes), rounds: clone(obj.rounds), sentences: clone(obj.sentences) });
    return out;
  }
  // For each fact: how many groups were dealt it, and the verdicts given.
  function factTally(list) {
    var t = {};
    CONFIG.facts.forEach(function (f) { t[f.id] = { id: f.id, groups: 0, travels: 0, bends: 0, breaks: 0, none: 0 }; });
    list.forEach(function (g) {
      g.rounds.forEach(function (R) {
        if (!t[R.factId]) return;
        t[R.factId].groups++;
        (R.verdicts || []).forEach(function (v) { if (VERDICT[v.verdict]) t[R.factId][v.verdict]++; });
      });
    });
    return CONFIG.facts.map(function (f) { return t[f.id]; }).filter(function (x) { return x.groups; })
      .sort(function (a, b) { return (b.breaks - a.breaks) || (b.bends - a.bends) || (a.travels - b.travels); });
  }

  // ==========================================================================
  // Text and print output
  // ==========================================================================
  function marksText(rec) { return rec.marks.map(function (k) { return k ? VERDICT_LETTER[k] : '·'; }).join(' '); }
  function buildText(state) {
    var L = [], name = String(state.group.name || '').trim() || '(no group name)';
    L.push('WHY BODØ? — ' + name);
    L.push('Members: ' + (membersList(state.group.members).join(', ') || '(none)'));
    L.push('Claim row: ' + (claimName(state.claimRow) || '(not chosen)'));
    L.push('Wall: ' + (state.wall.source === 'import' ? 'class wall' + (state.wall.from ? ' "' + state.wall.from + '"' : '') : 'original S1 cards'));
    L.push('');
    L.push('SENTENCES');
    var locked = lockedSentences(state);
    if (!locked.length) L.push('(none locked yet)');
    locked.forEach(function (x) {
      L.push('- ' + x.member + ': ' + x.text);
      L.push('  [Fact: ' + factLabel(x.m.factId) + (CHAR[x.m.characteristic] ? ' · ' + CHAR[x.m.characteristic].name : '') + ']');
    });
    L.push('');
    L.push('CAUSES (T = travels, B = bends, X = breaks, – = no bearing)');
    standings(state).forEach(function (x) {
      L.push('- Cause ' + (x.i + 1) + (x.rec.out ? ' (OUT)' : '') + ': ' + String(x.cause.text || '').trim());
      L.push('  From: ' + causeCards(x.cause).join(', ') + ' · Record: ' + marksText(x.rec));
    });
    L.push('');
    L.push('FACT ROUNDS');
    state.deck.forEach(function (id, r) {
      var R = state.rounds[r];
      if (!R || !R.flipped) return;
      L.push('Round ' + (r + 1) + ': ' + factLabel(id) + ' — ' + FACT[id].text);
      liveAt(state, r).forEach(function (c) {
        var v = R.verdicts[c.id];
        if (!v || !VERDICT[v.verdict]) return;
        L.push('  Cause ' + (causeIndex(state, c.id) + 1) + ': ' + VERDICT[v.verdict].label + (v.reason && v.verdict !== 'none' ? ' — ' + String(v.reason).trim() : ''));
      });
    });
    return L.join('\n');
  }
  function buildClassText(list) {
    var L = ['WHY BODØ? — CLASS REVEAL', ''];
    L.push('TOUGHEST FACTS (breaks / bends / travels / no bearing, across groups)');
    factTally(list).forEach(function (t) {
      L.push('- ' + factLabel(t.id) + ': ' + t.breaks + ' / ' + t.bends + ' / ' + t.travels + ' / ' + t.none + ' (' + t.groups + ' group' + (t.groups === 1 ? '' : 's') + ')');
    });
    L.push('');
    L.push('CAUSES BY GROUP');
    list.forEach(function (g) {
      L.push(g.group.name + ' · ' + claimName(g.claimRow));
      g.causes.forEach(function (c) { L.push('  ' + (c.out ? '[OUT] ' : '[STANDING] ') + c.text); });
    });
    L.push('');
    L.push('SENTENCES');
    list.forEach(function (g) { g.sentences.forEach(function (s) { if (s.locked) L.push('- ' + s.member + ' (' + g.group.name + '): ' + s.final); }); });
    return L.join('\n');
  }

  function a6Card(state, x) {
    var m = x.m, cl = CLAIM[state.claimRow], ch = CHAR[m.characteristic], f = FACT[m.factId], ci = causeIndex(state, m.causeId);
    var c = causeById(state, m.causeId);
    return '<div class="a6">' +
      '<div class="a6-eyebrow">Why Bodø? · ' + esc(String(state.group.name || '').trim()) + '</div>' +
      '<div class="a6-bars"><span style="background:' + (cl ? cl.colour : 'var(--border)') + '"></span><span style="background:' + (f ? CONFIG.factKinds[f.kind].colour : 'var(--border)') + '"></span>' +
      (ch ? '<span style="background:' + ch.colour + '"></span>' : '') + '</div>' +
      '<div class="a6-tags">' + esc(cl ? cl.label + ' (' + cl.course.toLowerCase() + ')' : '') + (ch ? ' · ' + esc(ch.name) : '') + '</div>' +
      '<div class="a6-text">' + esc(x.text) + '</div>' +
      '<div class="a6-foot">' + esc(x.member) + ' · Fact: ' + esc(factLabel(m.factId)) +
      (c ? ' · Cause ' + (ci + 1) + ' from ' + esc(causeCards(c).join(', ')) : '') + '</div>' +
      '</div>';
  }
  function buildA6Html(state) {
    var cards = lockedSentences(state).map(function (x) { return a6Card(state, x); });
    var h = '';
    for (var i = 0; i < cards.length; i += 4) h += '<section class="a6-sheet">' + cards.slice(i, i + 4).join('') + '</section>';
    return h;
  }
  function recordHtml(rec) {
    return '<span class="record" aria-label="Record: ' + esc(rec.marks.map(function (k) { return k ? VERDICT[k].label : 'not played'; }).join(', ')) + '">' +
      rec.marks.map(function (k) { return '<span class="' + k + '" aria-hidden="true">' + (k ? VERDICT_LETTER[k] : '') + '</span>'; }).join('') + '</span>';
  }
  function buildReportHtml(state) {
    var h = '';
    var locked = lockedSentences(state);
    h += '<section class="rep-section" style="--rep-colour:#B83068"><h2>Sentences</h2>';
    if (!locked.length) h += '<p>None locked yet.</p>';
    locked.forEach(function (x) {
      h += '<div class="rep-item"><div class="k">' + esc(x.member) + ' · Fact: ' + esc(factLabel(x.m.factId)) + (CHAR[x.m.characteristic] ? ' · ' + esc(CHAR[x.m.characteristic].name) : '') + '</div><div class="rep-sentence">' + esc(x.text) + '</div></div>';
    });
    h += '</section>';

    h += '</section>';

    h += '</section>';

  }

  function renderSetup() {
    var h = '<section class="panel" style="--panel-colour:var(--char-5)"><p class="eyebrow panel-eyebrow">Step 0</p><h2>Your group</h2>';
    h += '<div class="two-col"><div class="field"><label for="g-name">Group name</label><input type="text" id="g-name" data-f="group.name" maxlength="60" autocomplete="off" value="' + esc(state.group.name) + '"></div>' +
      '<div class="field"><label for="g-members">Members (separate with commas)</label><input type="text" id="g-members" data-f="group.members" maxlength="300" autocomplete="off" value="' + esc(state.group.members) + '"></div></div>';

  function renderCauses() {
    var row = rowCards(state, state.claimRow);

    var h = '<div class="banner" style="--panel-colour:var(--char-1)"><h2>1 · Pick your contenders</h2><p>Choose the ' + CONFIG.causeCount + ' causes in your row you think are strongest. Put each one in your own words: what changed, and how does it keep people away from third places? Two cards saying the same thing make one cause.</p></div>';
    h += '<section class="panel" style="--panel-colour:var(--char-1)"><p class="eyebrow panel-eyebrow">' + esc(claimName(state.claimRow)) + '</p>';
    h += '<details class="wall-cards" open><summary>The ' + row.length + ' cards in your row</summary><div class="wall-grid">' + row.map(function (c) { return cardPaper(state, c); }).join('') + '</div></details>';

    state.causes.forEach(function (c, i) {
      h += '<div class="cause-slot" style="--cause-colour:' + causeColour(i) + '"><h3>' + causeTag(i) + 'Cause ' + (i + 1) + '</h3><div class="two-col">' +

  function factFace(f, r) {
    var k = CONFIG.factKinds[f.kind];
    return '<article class="fact-card' + (justFlipped === r ? ' flipped' : '') + '" style="--fact-colour:' + k.colour + ';--fact-ink:' + inkFor(k.colour) + '" aria-labelledby="fact-title">' +
      '<div class="fact-kind">Round ' + (r + 1) + ' · ' + esc(k.label) + '</div>' +
      '<div class="fact-scope">' + esc(CONFIG.scopeLabels[f.scope]) + '</div>' +
      '<h3 class="fact-title" id="fact-title">' + esc(f.title) + '</h3>' +
      '<p class="fact-text">' + esc(f.text) + '</p>' +
      '<p class="fact-src">Source: ' + esc(f.source) + '</p></article>';
  }
  function factBack(r) {
    return '<div class="fact-card fact-back"><div class="shapes" aria-hidden="true"><span class="s1"></span><span class="s2"></span><span class="s3"></span></div>' +
      '<div class="round-no">' + (r + 1) + '</div><div class="fact-kind">Bodø fact card</div>' +
      '<button type="button" class="btn btn-accent btn-big" data-action="flip">Flip the card</button></div>';
  }
  function renderRounds() {
    deal(state);
    var cur = currentRound(state), r = Math.min(state.round, cur, state.rounds.length - 1);
    state.round = r;
    var h = '<div class="banner" style="--panel-colour:var(--char-2)"><h2>2 · Travels, bends or breaks?</h2><p>' + esc(CONFIG.text.rules) + '</p></div>';
    h += '<section class="panel" style="--panel-colour:var(--char-2)">';
    h += '<div class="round-strip" role="group" aria-label="Rounds">';
    state.rounds.forEach(function (R, i) {
      var done = roundDone(state, i);
      h += '<button type="button" class="round-pip' + (done ? ' done' : '') + '" data-action="round" data-round="' + i + '" aria-pressed="' + (i === r) + '"' + (i > cur ? ' disabled' : '') + '>R' + (i + 1) + '<span class="sr-only">' + (done ? ' (done)' : '') + '</span></button>';
    });
    h += '</div>';
    var R = state.rounds[r], f = roundFact(state, r);

    } else {

      h += legendHtml();
      liveAt(state, r).forEach(function (c) {
        var i = causeIndex(state, c.id), v = R.verdicts[c.id] || { verdict: '', reason: '' };

          '<fieldset><legend class="sr-only">Cause ' + (i + 1) + ' in Bodø</legend><div class="choices">';
        CONFIG.verdicts.forEach(function (vd) {
          h += choice('verdict|' + r + '|' + c.id, vd.id, esc(vd.label), v.verdict === vd.id, vd.colour, 'radio', '', 'v-' + r + '-' + c.id + '-' + vd.id);

        }
        h += '</div>';
      });
      var outs = state.causes.filter(function (c) { return breaksBefore(state, c.id, r) >= CONFIG.knockoutBreaks; });

          return '<div class="out-item"><span class="out-stamp">Out</span>' + causeTag(causeIndex(state, c.id)) + '<span>' + esc(shorten(c.text, 90)) + '</span></div>';
        }).join('') + '</div>';
      }
      var errs = roundErrors(state, r), last = r === state.rounds.length - 1;

  function renderMine() {

    ms.forEach(function (n) {
      var m = state.individual[n];

    h += '<h3>' + esc(n) + '\u2019s sentence</h3>';

    if (FACT[m.factId]) h += '<p class="quiet"><strong>' + esc(FACT[m.factId].title) + ':</strong> ' + esc(FACT[m.factId].text) + '</p>';
    var cl = CLAIM[state.claimRow];
    h += '<p class="frame">' + esc(CONFIG.sentenceStart) + ' <em>' + esc(cl ? cl.phrase : '') + '</em> because <em>[your cause]</em>. ' + esc(CONFIG.sentenceMiddle) + ' <em>[your Bodø fact]</em>.</p>';
    h += '<p class="model">Model, about a made-up town: ' + esc(CONFIG.model) + '</p>';
    h += textField('m-because', '…because', m.because, 'because', { path: p + 'because', big: true });
    h += textField('m-bodo', CONFIG.sentenceMiddle + '…', m.bodo, 'bodo', { path: p + 'bodo', big: true });

    h += '<div class="actions"><button type="button" class="btn btn-accent" data-action="lock">Lock my sentence</button></div><div id="lock-errors"></div>';
    return h + '</section>';
  }

  function renderCards() {

    return h + '</section>';

  function buildClassHtml(list) {

    tally.forEach(function (t) {
      var tot = t.travels + t.bends + t.breaks + t.none || 1;
      h += '<span><strong>' + esc(factLabel(t.id)) + '</strong></span><span class="tally-bar" aria-hidden="true">' +

        '<span>' + t.breaks + ' X · ' + t.bends + ' B · ' + t.travels + ' T<span class="sr-only"> (' + t.none + ' no bearing, ' + t.groups + ' groups)</span></span>';

  function renderClass() {
    var h = '<div class="banner" style="--panel-colour:var(--char-3)"><h2>5 · Class reveal</h2><p>For the instructor. Load every group\u2019s exported JSON (choose several files at once). Which causes survived in every group? Which facts broke the most causes, and why?</p></div>';
    h += '<section class="panel" style="--panel-colour:var(--char-3)">';
    h += '<div class="actions"><button type="button" class="btn btn-primary" data-action="class-load">Load group files</button>' +
      '<button type="button" class="btn btn-ghost" data-action="class-copy"' + (classFiles.length ? '' : ' disabled') + '>Copy class summary</button>' +
      '<button type="button" class="btn btn-danger" data-action="class-clear"' + (classFiles.length ? '' : ' disabled') + '>Clear class view</button></div>';
    h += '<p class="progress">' + classFiles.length + ' group file' + (classFiles.length === 1 ? '' : 's') + ' loaded' + (classFiles.length ? ': ' + esc(classFiles.map(function (g) { return g.group.name; }).join(', ')) : '') + '.</p>';
    if (classFiles.length) h += buildClassHtml(classFiles);
    return h + '</section>';
  }

  function render(focusPanel) {
    if (!stepEnabled(state, state.step)) state.step = 'setup';
    renderSteps();
    var r = { setup: renderSetup, causes: renderCauses, rounds: renderRounds, mine: renderMine, cards: renderCards, class: renderClass }[state.step];
    els.panel.innerHTML = r();
    justFlipped = -1;
    if (focusPanel) els.panel.focus();
  }

  // Light refresh after typing: word counts, warnings, the sentence preview,
  // step tabs and the next-button state, without rebuilding the field.
  function refreshLive(el) {
    if (el && el.dataset.words) {
      var key = el.dataset.words, wc = $(el.id + '-wc');
      if (wc) { wc.textContent = wordLabel(el.value, key); wc.className = 'word-count ' + (wordsOk(el.value, key) ? 'ok' : 'bad'); }
      var w = $(el.id + '-warn');
      if (w) w.textContent = interventionWarning(el.value);
    }
    renderSteps();
    var errBox = $('step-errors');
    if (errBox) {
      var errs = stepErrors(state, state.step);
      errBox.innerHTML = errorList(errs);
      var btn = errBox.previousElementSibling && errBox.previousElementSibling.querySelector('button');
      if (btn) btn.disabled = !!(errs.length && CONFIG.gateSteps);
    }
    var rBox = $('round-errors');
    if (rBox && state.step === 'rounds') {
      var re = roundErrors(state, state.round);
      rBox.innerHTML = errorList(re);
      var rb = rBox.previousElementSibling && rBox.previousElementSibling.querySelector('button');
      if (rb) rb.disabled = !!re.length;
    }
    if (state.step === 'mine' && state.member) {
      var whole = assembleSentence(state, memberState(state, state.member)), pv = $('m-preview'), pw = $('m-preview-wc');
      if (pv) pv.textContent = whole;
      if (pw) { pw.textContent = wordLabel(whole, 'sentence'); pw.className = 'word-count ' + (wordsOk(whole, 'sentence') ? 'ok' : 'bad'); }
    }
    save();
  }

  // Set a value by dotted path. Member names (which may contain dots) follow
  // "individual."; round verdicts are "rounds.<r>.verdicts.<causeId>.reason".
  function setPath(path, value) {
    var parts = path.split('.');
    if (parts[0] === 'individual') {
      var m = memberState(state, state.member), key = parts[parts.length - 1];
      // Changing the Bodø half means the swap test has to be run again.
      if (key === 'bodo' && m.swap && value !== m.bodo) {
        m.swap = '';
        ['swap-pass', 'swap-fail'].forEach(function (id) { var x = $(id); if (x) x.checked = false; });
      }
      m[key] = value;
      return;
    }
    if (parts[0] === 'rounds') {
      var R = state.rounds[+parts[1]], cid = parts[3];
      if (!R.verdicts[cid]) R.verdicts[cid] = { verdict: '', reason: '' };
      R.verdicts[cid][parts[4]] = value;
      return;
    }
    var o = state;
    for (var i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = value;
  }

  function download(name, obj) {
    var blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }
  function slug(s) { return String(s || 'group').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'group'; }
  function readJsonFile(input, cb) {
    var f = input.files && input.files[0];
    input.value = '';
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { var obj; try { obj = JSON.parse(r.result); } catch (e) { setStatus('That file is not valid JSON. Nothing was changed.'); return; } cb(obj); };
    r.onerror = function () { setStatus('The file could not be read. Nothing was changed.'); };
    r.readAsText(f);
  }
  function copyText(t) {
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      setStatus(ok ? 'Copied as text.' : 'Copy failed: use Print instead.');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { setStatus('Copied as text.'); }, fallback);
    else fallback();
  }
  function preparePrint() {
    if (state.step === 'class') {
      $('w7-print-meta').textContent = 'Class reveal · ' + classFiles.length + ' groups';
      $('print-area').innerHTML = '<section class="rep-section">' + buildClassHtml(classFiles) + '</section>';
      return;
    }
    $('w7-print-meta').textContent = (String(state.group.name || '').trim() || '(no group name)') + ' · ' + membersList(state.group.members).join(', ') + ' · ' + claimName(state.claimRow);
    $('print-area').innerHTML = buildReportHtml(state) + buildA6Html(state);
  }
  function exportNow() {
    download('why-bodo-' + slug(state.group.name) + '.json', buildExport(state));
    setStatus('Exported.');
  }

  function init() {
    els.status = $('status'); els.steps = $('steps'); els.panel = $('panel');
    $('w7-eyebrow').textContent = CONFIG.text.eyebrow;
    $('w7-title').textContent = CONFIG.text.title;
    $('w7-lede').textContent = CONFIG.text.lede;
    document.title = CONFIG.text.title;
    $('w7-runsheet').innerHTML = '<summary>How this session runs (90 minutes)</summary><ol>' +
      CONFIG.runSheet.map(function (r) { return '<li><span class="t">' + esc(r.t) + '</span><span>' + esc(r.what) + '</span></li>'; }).join('') + '</ol>';
    state = load();
    classFiles = loadClass();

    els.panel.addEventListener('input', function (ev) {
      var el = ev.target;
      if (el.dataset && el.dataset.f && el.tagName !== 'SELECT') {
        setPath(el.dataset.f, el.value);
        refreshLive(el);
      }
    });
    els.panel.addEventListener('change', function (ev) {
      var el = ev.target;
      if (el.tagName === 'SELECT' && el.dataset.f) {
        setPath(el.dataset.f, el.value);
        save(); render();
        var again = $(el.id); if (again) again.focus();
        return;
      }
      if (el.type === 'radio') {
        var nm = el.name.split('|');
        if (nm[0] === 'claimRow') { state.claimRow = +el.value; refreshLive(null); }
        else if (nm[0] === 'verdict') {
          var R = state.rounds[+nm[1]];
          if (!R.verdicts[nm[2]]) R.verdicts[nm[2]] = { verdict: '', reason: '' };
          R.verdicts[nm[2]].verdict = el.value;
          save(); render();
          var v = $(el.id); if (v) v.focus();
        }
        else if (nm[0] === 'swap') {
          memberState(state, state.member).swap = el.value;
          save(); render();
          var s = $(el.id); if (s) s.focus();
        }
      }
    });
    els.panel.addEventListener('focusout', function (ev) {
      // Membership and group name feed other steps: re-render when they settle.
      if (ev.target.id === 'g-members' || ev.target.id === 'g-name') { save(); renderSteps(); }
    });
    document.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-action]');
      if (!b || b.disabled) return;
      var act = b.dataset.action;
      if (act === 'goto') { if (stepEnabled(state, b.dataset.step)) { state.step = b.dataset.step; save(); render(true); window.scrollTo(0, 0); } }
      else if (act === 'round') { state.round = +b.dataset.round; save(); render(); }
      else if (act === 'flip') {
        deal(state); state.rounds[state.round].flipped = true; justFlipped = state.round;
        save(); render(); var t = $('fact-title'); if (t) { t.setAttribute('tabindex', '-1'); t.focus(); }
      }
      else if (act === 'next-round') {
        if (roundDone(state, state.round)) { state.round = Math.min(state.round + 1, state.rounds.length - 1); save(); render(true); window.scrollTo(0, 0); }
      }
      else if (act === 'member') { state.member = b.dataset.member; save(); render(); }
      else if (act === 'lock') {
        var errs = lockMember(state, state.member);
        if (errs.length) { $('lock-errors').innerHTML = errorList(errs); setStatus('Not locked yet: see the list below the button.'); }
        else { save(); render(); setStatus(state.member + '\u2019s sentence is locked.'); }
      }
      else if (act === 'unlock') { memberState(state, state.member).locked = false; save(); render(); }
      else if (act === 'print') { preparePrint(); window.print(); }
      else if (act === 'copy') copyText(buildText(state));
      else if (act === 'export') exportNow();
      else if (act === 'class-load') $('class-file').click();
      else if (act === 'class-copy') copyText(buildClassText(classFiles));
      else if (act === 'class-clear') {
        if (window.confirm('Clear every group file from the class view on this device?')) { classFiles = []; saveClass(); render(); setStatus('Class view cleared.'); }
      }
    });

    $('class-file').addEventListener('change', function () {
      var files = Array.prototype.slice.call(this.files || []), input = this, done = 0, added = 0, problems = [];
      input.value = '';
      files.forEach(function (f) {
        var rd = new FileReader();
        rd.onload = function () {
          var obj = null;
          try { obj = JSON.parse(rd.result); } catch (e) { problems.push(f.name + ': not valid JSON'); }
          if (obj) {
            var errs = validateClassFile(obj);
            if (errs.length) problems.push(f.name + ': ' + errs[0]);
            else { classFiles = addClassFile(classFiles, obj); added++; }
          }
          finish();
        };
        rd.onerror = function () { problems.push(f.name + ': could not be read'); finish(); };
        rd.readAsText(f);
      });
      function finish() {
        if (++done < files.length) return;
        saveClass(); render();
        setStatus('Loaded ' + added + ' group file' + (added === 1 ? '' : 's') + '.' + (problems.length ? ' Skipped: ' + problems.join('; ') + '.' : ''));
      }
    });
    $('btn-wall').addEventListener('click', function () { $('wall-file').click(); });
    $('wall-file').addEventListener('change', function () {
      readJsonFile(this, function (obj) {
        var errs = validateWall(obj);
        if (errs.length) { setStatus(errs[0] + ' Nothing was changed.'); return; }
        applyWall(state, obj); save(); render();
        setStatus('Class wall loaded: ' + allCards(state).length + ' cards.');
      });
    });
    $('btn-export').addEventListener('click', exportNow);
    $('btn-import').addEventListener('click', function () { $('import-file').click(); });
    $('import-file').addEventListener('change', function () {
      readJsonFile(this, function (obj) {
        var errs = validateImport(obj);
        if (errs.length) { setStatus(errs[0] + ' Nothing was changed.'); return; }
        if (!window.confirm('Replace the work on this device with the work in this file?')) return;
        state = normalise(clone(obj.state)); save(); render();
        setStatus('Imported work for ' + (state.group.name || 'this group') + '.');
      });
    });
    $('btn-copy').addEventListener('click', function () { copyText(state.step === 'class' ? buildClassText(classFiles) : buildText(state)); });
    $('btn-print').addEventListener('click', function () { preparePrint(); window.print(); });
    $('btn-reset').addEventListener('click', function () {
      if (!window.confirm('Reset clears all of this group\u2019s work on this device, including the deal. Export first if you want to keep it. Reset now?')) return;
      state = blankState();
      try { window.localStorage.removeItem(CONFIG.storageKey); } catch (e) { /* storage unavailable */ }
      render(); setStatus('Reset.');
    });
    window.addEventListener('beforeprint', preparePrint);
    render();
  }

  // Test hook: pure functions and CONFIG exposed for test.html.
  window.W7 = {
    CONFIG: CONFIG,
    blankState: blankState,
    normalise: normalise,
    wordCount: wordCount,
    wordProblem: wordProblem,
    membersList: membersList,
    rowCards: rowCards,
    allCards: allCards,
    memberState: memberState,
    setupErrors: setupErrors,
    causesErrors: causesErrors,
    deal: deal,
    liveAt: liveAt,
    roundErrors: roundErrors,
    currentRound: currentRound,
    record: record,
    standings: standings,
    survivedFacts: survivedFacts,
    assembleSentence: assembleSentence,
    draftErrors: draftErrors,
    lockErrors: lockErrors,
    lockMember: lockMember,
    stepErrors: stepErrors,
    stepEnabled: stepEnabled,
    validateWall: validateWall,
    applyWall: applyWall,
    buildExport: buildExport,
    validateImport: validateImport,
    validateClassFile: validateClassFile,
    addClassFile: addClassFile,
    factTally: factTally,
    buildText: buildText,
    buildClassText: buildClassText,
    buildA6Html: buildA6Html,
    interventionWarning: interventionWarning
  };

  if (document.getElementById('w7-app')) init();
})();
</script>
