<!--
  WEEK 7 - WHY BODØ?
  Social Phenomena Challenge, ADJUDICATE phase (week 7). Follows the week 6
  Claim Wall Sort.

  Learning outcome: each student, individually, writes ONE clear, short
  sentence explaining what causes the decline of third places in Bodø. To get
  there, the group first interrogates the claim wall:
    1. Assumption audit: what does each card in the group's claim row assume
       (place, provider, population, period, missing step)?
    2. Granularity ladder: two vague cards are rewritten as
       driver -> mechanism -> characteristic -> claim -> observable sign.
    3. Relocate to Bodø: does each ladder transfer, transfer in modified form,
       reverse, or is there no basis to judge? Which assumption decides it?
    4. Your sentence: each member writes their own sentence (15 to 40 words),
       a partner tests it (assumption, granularity, specificity), and the
       member redrafts and locks it. One A6 card per student goes on the wall.

  The sentence is conditional ("If ... is declining in Bodø, it is because
  ..."): nothing in the course materials establishes that third places in
  Bodø ARE declining, and students cannot check locally.

  This tool never asks what should be done. Phrasing that sounds like an
  intervention ("should", "we recommend", "the club could") triggers a soft
  warning. There is no scoring and no correct transfer judgement.

  The only material about Bodø is CONFIG.contextPack, which the instructor
  supplies. Every factual entry there is marked PLACEHOLDER until replaced
  with sourced text. Do not add facts about Bodø, Norway or the club without
  a source.

  ============================================================================
  RUN SHEET (90 minutes, groups of 3-5, one device per group)
  ============================================================================
   0-5   Re-open the merged class wall; each group takes one claim row.
   5-25  1. Assumption audit (group).
  25-45  2. Granularity ladder (group).
  45-55  3. Relocate to Bodø (group).
  55-68  4. Write your own sentence (individual, silent; pass the device).
  68-82  5. Sharpen in pairs: partner fills in the three tests; redraft; lock.
  82-90  Print the A6 cards; pin them on a new "Bodø" strip under each claim.

  ============================================================================
  INPUT: CLASS WALL (optional)
  ============================================================================
  "Load class wall" accepts an export from week6-claim-wall-sort.html
  (tool "week6-claim-wall-sort", schemaVersion 1): it reads "cells" (card
  positions by "c<claim>-<lens>" or "hold") and "newCards". Without it, the
  39 S1 cards are used at their original places.

  ============================================================================
  EXPORT JSON  (tool "week7-bodo-decline", schemaVersion 1)
  ============================================================================
  {
    "tool": "week7-bodo-decline",               REQUIRED, constant
    "schemaVersion": 1,                          REQUIRED
    "exportedAt": "ISO 8601 timestamp",
    "group": { "name": "string", "members": ["string", ...] },
    "claimRow": 1|2|3|4|null,                    the group's claim row
    "sentences": [                               one per member, in member order
      { "member": "string", "claim": 1-4|null, "characteristic": "id|null",
        "cards": ["cardId", ...], "conditionSource": "id|null",
        "final": "string", "locked": true|false } ],
    "state": { ...the full internal state; used verbatim on re-import... }
  }
  Re-import accepts any file whose "tool" is "week7-bodo-decline" and whose
  "state" object is present, after a confirm step.
  ============================================================================
-->
<style>
  :root {
    --bg: #F2DFBE;
    --bg-card: #FFFAF2;
    --bg-deep: #E8D2A8;
    --text: #2A1F18;
    --text-muted: #6A5A48;
    --border: #D8C8A8;

    --char-1: #5C3A96;
    --char-2: #B52838;
    --char-3: #C85218;
    --char-4: #D4A020;
    --char-5: #7A5828;
    --char-6: #B83068;
    --char-7: #CC6830;
    --char-8: #7E58A8;

    --correct: #2A7A42;
    --correct-bg: #E6F4EA;
    --incorrect: #B82828;
    --incorrect-bg: #FDEEEE;
    --ambiguous: #B98A10;
    --ambiguous-bg: #FFF3D6;
    --card-ink: #2A1F18;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
  }
  :focus-visible { outline: 3px solid var(--char-1); outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  .app-wrap { max-width: 1080px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }

  h1 {
    font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 800; letter-spacing: 0.06em;
    text-transform: uppercase; line-height: 1.1; margin-bottom: 0.5rem;
  }
  h2 {
    font-size: clamp(1.2rem, 2.4vw, 1.6rem); font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.05em; line-height: 1.2; margin-bottom: 0.5rem;
  }
  h3 { font-size: 0.95rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
  p { margin-bottom: 0.6rem; }
  .eyebrow { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); }
  .lede { font-size: 1.02rem; color: var(--text-muted); max-width: 760px; margin-bottom: 0.25rem; }
  .quiet { color: var(--text-muted); font-size: 0.88rem; }

  /* ── Page header with house geometry ── */
  .page-header {
    position: relative; overflow: hidden;
    padding: 1.5rem 2rem 1.25rem 0; margin-bottom: 1rem;
    border-bottom: 6px solid var(--char-1);
  }
  .page-header > * { position: relative; z-index: 1; }
  .page-header::before {
    content: ''; position: absolute; width: 230px; height: 230px;
    background: var(--char-1); border-radius: 50%; opacity: 0.08;
    top: -80px; right: -40px; z-index: 0;
  }
  .page-header::after {
    content: ''; position: absolute; width: 64px; height: 64px;
    background: var(--char-4); opacity: 0.16;
    bottom: 14px; right: 160px; transform: rotate(25deg); z-index: 0;
  }
  .page-header .deco-bar {
    position: absolute; z-index: 0; pointer-events: none;
    width: 160px; height: 10px; background: var(--char-2);
    top: 28px; right: 250px; transform: rotate(-8deg);
  }
  .page-header .deco-ring {
    position: absolute; z-index: 0; pointer-events: none;
    width: 84px; height: 84px; border: 6px solid var(--char-3); border-radius: 50%;
    bottom: -30px; right: 40px; opacity: 0.3;
  }

  /* ── Run sheet ── */
  .runsheet {
    background: var(--bg-card); border: 2px solid var(--border); border-left: 6px solid var(--char-5);
    margin-bottom: 0.75rem;
  }
  .runsheet summary {
    cursor: pointer; padding: 0.65rem 1rem; min-height: 44px; display: flex; align-items: center;
    font-size: 0.74rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--char-5);
  }
  .runsheet ol { list-style: none; padding: 0 1rem 0.75rem; }
  .runsheet li { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: 0.75rem; padding: 0.35rem 0; border-top: 2px solid var(--border); font-size: 0.9rem; }
  .runsheet .t { font-weight: 800; color: var(--char-5); }

  /* ── Toolbar and status ── */
  .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; }
  .toolbar .sep { width: 2px; align-self: stretch; background: var(--border); margin: 0 0.15rem; }
  .status {
    min-height: 1.6rem; font-size: 0.88rem; font-weight: 600; margin-bottom: 0.5rem;
    padding-left: 0.6rem; border-left: 4px solid var(--char-4);
  }
  .status:empty { border-left-color: transparent; }

  /* ── Buttons ── */
  .btn {
    font: inherit; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    min-height: 44px; padding: 0.55rem 1rem; border: 2px solid transparent; border-radius: 0;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
    transition: background-color 0.15s ease, color 0.15s ease, transform 0.15s ease, border-color 0.2s ease;
  }
  .btn:active { transform: translateY(0); }
  .btn-primary { background: var(--char-1); color: #fff; }
  .btn-primary:hover { background: var(--char-2); transform: translateY(-2px); }
  .btn-accent { background: var(--char-3); color: #fff; }
  .btn-accent:hover { background: var(--char-2); transform: translateY(-2px); }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--text); }
  .btn-ghost:hover { background: var(--text); color: var(--bg); transform: translateY(-2px); }
  .btn-danger { background: transparent; color: var(--incorrect); border-color: var(--incorrect); }
  .btn-danger:hover { background: var(--incorrect); color: #fff; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn:disabled:hover { background: var(--char-1); }
  .btn-ghost:disabled:hover { background: transparent; color: var(--text); }

  /* ── Step tabs ── */
  .steps { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 2px solid var(--border); margin: 0.5rem 0 1rem; }
  .step-tab {
    font: inherit; background: transparent; border: 0; border-bottom: 3px solid transparent; border-radius: 0;
    min-height: 44px; padding: 0.5rem 0.8rem; cursor: pointer; color: var(--text-muted);
    font-size: 0.74rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 0.45rem;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .step-tab .num {
    display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
    background: var(--bg-deep); color: var(--text); font-size: 0.7rem;
  }
  .step-tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--tab-colour); }
  .step-tab[aria-selected="true"] .num, .step-tab.done .num { background: var(--tab-colour); color: var(--tab-ink, #fff); }
  .step-tab:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Panels ── */
  .panel {
    position: relative; overflow: hidden;
    background: var(--bg-card); border: 2px solid var(--border); border-top: 6px solid var(--panel-colour, var(--char-1));
    padding: 1.25rem 1.5rem; margin-bottom: 1rem;
  }
  .panel::after {
    content: ''; position: absolute; width: 150px; height: 150px; border-radius: 50%;
    background: var(--panel-colour, var(--char-1)); opacity: 0.07; right: -40px; bottom: -50px; pointer-events: none;
  }
  .panel > * { position: relative; z-index: 1; }
  .panel-eyebrow { color: var(--panel-colour, var(--char-1)); margin-bottom: 0.2rem; }
  .banner {
    background: var(--panel-colour, var(--char-1)); color: #fff; padding: 1rem 1.5rem; margin-bottom: 1rem;
  }
  .banner h2 { color: #fff; margin: 0; }
  .banner p { margin: 0.3rem 0 0; }

  .field { margin-bottom: 0.85rem; }
  .field > label, .field .label, fieldset legend {
    display: block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em;

<script>
(function () {
  'use strict';

  // ==========================================================================
  // CONFIG: everything a non-developer may want to edit lives here.
  // Text starting "PLACEHOLDER:" must be replaced before class.
  // Never add study findings, statistics or facts about real places without
  // a source.
  // ==========================================================================
  var CONFIG = {
    // Identity of exports. Files from any other tool are rejected on import.
    toolId: 'week7-bodo-decline',
    schemaVersion: 1,
    // Autosave key, namespaced per tool and version.
    storageKey: 'week7-bodo-decline-v1',
    // The class wall file this tool reads (from week6-claim-wall-sort.html).
    wallToolId: 'week6-claim-wall-sort',
    cardSet: 'S1',

    // Lock each step until the previous one is complete. Set to false to let
    // groups move freely between steps (for example if time runs short).
    gateSteps: true,

    // Word limits. min = fewest words accepted; max = most (0 = no maximum).
    // The sentence is deliberately short: the outcome is one clear, concise
    // sentence, so it has a maximum as well as a minimum.
    words: {
      assumes:   { min: 12, max: 0 },   // "This card assumes that..."
      driver:    { min: 6,  max: 0 },   // ladder: what changed
      mechanism: { min: 12, max: 0 },   // ladder: how it reaches people
      sign:      { min: 8,  max: 0 },   // ladder: observable sign
      why:       { min: 15, max: 0 },   // Bodø: why this transfer judgement
      sentence:  { min: 15, max: 40 },  // the individual sentence (draft and final)
      testReason:{ min: 5,  max: 0 },   // partner's reason for each test
      changeNote:{ min: 5,  max: 0 }    // "What changed and why"
    },
    // How many cards in the claim row must be audited before step 2
    // (or every card, if the row has fewer).
    auditMinCards: 6,

    // Interface copy.
    text: {
      eyebrow: 'Week 7 · Adjudicate · From the claim wall',
      title: 'Why Bodø?',
      lede: 'The cards on the claim wall were written about third places in general. Expose what they assume, break the vague ones down to a mechanism, test whether they hold in Bodø, and then each write one sharp sentence of your own.'
    },

    // The run sheet shown in the collapsible "How this session runs" panel.
    runSheet: [
      { t: '0–5', what: 'Re-open the merged class wall. Each group takes one claim row (with five or more groups, two groups share a row).' },
      { t: '5–25', what: '1. Assumption audit (group): what does each card in your row take for granted?' },
      { t: '25–45', what: '2. Granularity ladder (group): break the two vaguest cards down to a mechanism.' },
      { t: '45–55', what: '3. Relocate to Bodø (group): does each ladder still hold there?' },
      { t: '55–68', what: '4. Your sentence (individual, silent): pass the device round; everyone writes their own.' },
      { t: '68–82', what: '5. Sharpen in pairs: your partner fills in the three tests; redraft and lock.' },
      { t: '82–90', what: 'Print the A6 cards and pin them on a new Bodø strip under each claim. Read two or three aloud.' }
    ],

    // The four claim rows, in the wall's own order and wording (from S1).
    // course = the course's name for the claim.
    claims: [
      { no: 1, label: 'Quantity', course: 'Supply', text: 'The # of third places is declining (quantity)', colour: 'var(--char-1)' },
      { no: 2, label: 'Usage', course: 'Use', text: 'People use third places less than they did before (usage)', colour: 'var(--char-4)' },
      { no: 3, label: 'Outcomes', course: 'Outcome', text: 'Outcomes of third places are worsening for social/community (outcomes)', colour: 'var(--char-2)' },
      { no: 4, label: 'Quality', course: 'Quality', text: 'Remaining places exhibit fewer third-place characteristics (quality)', colour: 'var(--char-6)' }
    ],
    // The three lens columns, in the wall's order. bg = the card stock
    // colour on the physical wall (same values as the Claim Wall Sort).
    lenses: [
      { id: 'psychology', name: 'Psychology', bg: '#F4A99B' },
      { id: 'economics', name: 'Economics', bg: '#F2CC5B' },
      { id: 'politics', name: 'Politics', bg: '#F59A4A' }
    ],

    // Oldenburg's eight characteristics (wording as in the week 5 field visit).
    characteristics: [
      { id: 'ng', name: 'Neutral ground', colour: 'var(--char-1)' },
      { id: 'lv', name: 'The leveller', colour: 'var(--char-2)' },
      { id: 'cv', name: 'Conversation is the main activity', colour: 'var(--char-3)' },
      { id: 'ac', name: 'Accessibility and accommodation', colour: 'var(--char-4)' },
      { id: 'rg', name: 'The regulars', colour: 'var(--char-5)' },
      { id: 'lp', name: 'A low profile', colour: 'var(--char-6)' },
      { id: 'pm', name: 'The mood is playful', colour: 'var(--char-7)' },
      { id: 'ha', name: 'A home away from home', colour: 'var(--char-8)' }
    ],

    // Step 1: the five kinds of hidden assumption.
    assumptionTags: [
      { id: 'place', label: 'Place', prompt: 'What kind of country, city or neighbourhood does the card take for granted?' },
      { id: 'provider', label: 'Provider', prompt: 'Who does it assume runs third places: the market, the state, clubs or volunteers?' },
      { id: 'population', label: 'Population', prompt: 'Who does it assume the people are (age, income, work, background)?' },
      { id: 'period', label: 'Period', prompt: 'What does it assume changed, and when?' },
      { id: 'missing', label: 'Missing step', prompt: 'Which link in the causal chain is left out?' }
    ],

    // Step 2: the rungs of the granularity ladder (the card itself is rung 0).
    rungs: [
      { id: 'driver', label: 'Driver: what changed?', hint: 'A specific change, not a label. "Rents rose", not "economics".' },
      { id: 'mechanism', label: 'Mechanism: how does that change reach people?', hint: 'The steps between the change and what people do or feel.' },
      { id: 'characteristic', label: 'Characteristic eroded', hint: 'Which one of the eight does it weaken?' },
      { id: 'claim', label: 'Claim affected', hint: 'Which decline claim does this explain?' },
      { id: 'sign', label: 'Observable sign: what would we see if this were happening?', hint: 'Something that could be noticed or counted.' }
    ],
    ladderCount: 2,

    // Step 3: transfer judgements. None is the right answer.
    transferJudgements: [
      { id: 'transfers', label: 'Transfers', help: 'The mechanism should work much the same way in Bodø.', colour: 'var(--correct)' },
      { id: 'modified', label: 'Transfers in modified form', help: 'It works in Bodø only if part of it changes.', colour: 'var(--ambiguous)' },
      { id: 'reverses', label: 'Reverses', help: 'In Bodø the same driver could work the other way.', colour: 'var(--char-2)' },
      { id: 'nobasis', label: 'No basis to judge', help: 'Nothing in the context pack lets us decide.', colour: 'var(--text-muted)' }
    ],

    // The ONLY material about Bodø in this tool. Instructor: replace every
    // PLACEHOLDER with sourced text, and give the source. The three
    // dimensions are questions, not facts (from the claim wall analysis
    // protocol): keep them as questions unless you add evidence.
    contextPack: {
      intro: 'Students have no access to people in Bodø. Use only what is here. Anything else you say about Bodø is an assumption, and your card will say so.',
      dimensions: [
        { id: 'welfare', title: 'Welfare state', text: 'Question: in a welfare state, which costs of leisure and meeting fall on individuals, and which are carried publicly?' },
        { id: 'smallcity', title: 'Small-city dynamics', text: 'Question: in a small city, how do distance, choice of places and who you are likely to meet differ from a large city?' },
        { id: 'clubs', title: 'Club-based civil society', text: 'Question: where much social life is organised through clubs, does it happen in places open to anyone, or to members?' }
      ],
      facts: [
        { id: 'f1', title: 'PLACEHOLDER: Fact 1', text: 'PLACEHOLDER: a sourced fact about Bodø (for example population or where the new stadium sits).', source: 'PLACEHOLDER: source' },
        { id: 'f2', title: 'PLACEHOLDER: Fact 2', text: 'PLACEHOLDER: a sourced fact about Bodø (for example climate and daylight across the year).', source: 'PLACEHOLDER: source' },
        { id: 'f3', title: 'PLACEHOLDER: Fact 3', text: 'PLACEHOLDER: a sourced fact about Bodø (for example existing places where people meet).', source: 'PLACEHOLDER: source' }
      ]
    },

    // Step 4: the sentence template and a worked model. The model uses no
    // real place so that it does not plant an answer about Bodø.
    sentenceTemplate: 'If <em>[claim]</em> is declining in Bodø, it is because <em>[driver]</em> leads to <em>[mechanism]</em>, eroding <em>[characteristic]</em>, which bites in Bodø because <em>[condition]</em>.',
    modelSentence: 'PLACEHOLDER: If use is declining in Town X, it is because longer shifts leave workers no free weekday evenings, so they stop dropping in, eroding the regulars; this bites in Town X because most jobs there run on shifts.',

    // Step 5: the three tests a partner applies.
    tests: [
      { id: 'assumption', label: 'Assumption', question: 'Is an assumption from somewhere else still hidden in the sentence?' },
      { id: 'granularity', label: 'Granularity', question: 'Is any part still a bare label ("inflation", "polarisation") rather than a step?' },
      { id: 'specificity', label: 'Specificity', question: 'Swap "Bodø" for "London". Is the sentence still just as true? If so, it is not yet specific.' }
    ],

    // Soft warning for intervention phrasing. Week 7 explains; it does not
    // propose what should be done.
    interventionPattern: '\\b(should|ought to|we recommend|recommend|the club could|the club can|needs? to build|must build)\\b',
    interventionWarning: 'This sounds like a proposal for what should be done. This week explains causes; save proposals for the intervene weeks.',
    noBodoWarning: 'The sentence does not mention Bodø. Does it say why the cause bites there?',
    unverifiedLabel: 'Assumption, unverified',

    // The 39 starting cards, verbatim from claim-wall/analysis/S1.json
    // (entry_id, card_text, claim_no, discipline), at their original places.
    // Square brackets are transcriber insertions. Do not edit the text: the
    // test suite checks it against S1.json.
    cards: [
      { id: "S1-001", claim: 1, lens: "psychology", uncertain: false, text: "People don't want to be in crowded spaces." },
      { id: "S1-002", claim: 1, lens: "psychology", uncertain: false, text: "Social media isolation (bad reputation given by influencers)" },
      { id: "S1-003", claim: 1, lens: "economics", uncertain: false, text: "They aren't economically viable. The don't make enough revenue. They don't break even, harder to stay in business." },
      { id: "S1-004", claim: 1, lens: "economics", uncertain: false, text: "Lack of funding because of corruption or bad location." },
      { id: "S1-005", claim: 1, lens: "economics", uncertain: false, text: "Decrease in budget: relocation of money to other sectors. Also politics." },
      { id: "S1-006", claim: 1, lens: "economics", uncertain: false, text: "High cost of living means need to work instead of socilise." },
      { id: "S1-007", claim: 1, lens: "economics", uncertain: false, text: "More recognized brands like Starbucks receive more money than the local brands." },
      { id: "S1-008", claim: 1, lens: "politics", uncertain: false, text: "Conservative governments have underinvested in third places." },

  // ==========================================================================
  // Constants and small helpers
  // ==========================================================================
  var STEPS = [
    { id: 'setup', num: 0, label: 'Group', colour: 'var(--char-5)' },
    { id: 'audit', num: 1, label: 'Assumptions', colour: 'var(--char-1)' },
    { id: 'ladder', num: 2, label: 'Ladder', colour: 'var(--char-4)' },
    { id: 'bodo', num: 3, label: 'Bodø', colour: 'var(--char-2)' },
    { id: 'mine', num: 4, label: 'Your sentence', colour: 'var(--char-6)' },
    { id: 'cards', num: 5, label: 'Cards', colour: 'var(--char-8)' }
  ];
  var LADDER_COLOURS = ['var(--char-4)', 'var(--char-8)'];
  // Text colour on an accent fill: dark on the light accents, white otherwise
  // (keeps WCAG AA for small bold text).
  function inkFor(colour) { return /char-4|char-7|ambiguous/.test(String(colour)) ? '#2A1F18' : '#fff'; }
  var CLAIM = {}; CONFIG.claims.forEach(function (c) { CLAIM[c.no] = c; });
  var LENS = {}; CONFIG.lenses.forEach(function (l) { LENS[l.id] = l; });
  var CHAR = {}; CONFIG.characteristics.forEach(function (c) { CHAR[c.id] = c; });
  var TAG = {}; CONFIG.assumptionTags.forEach(function (t) { TAG[t.id] = t; });
  var JUDGE = {}; CONFIG.transferJudgements.forEach(function (j) { JUDGE[j.id] = j; });
  var START = {}; CONFIG.cards.forEach(function (c) { START[c.id] = c; });
  var INTERVENTION_RE = new RegExp(CONFIG.interventionPattern, 'i');

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function isObj(o) { return !!o && typeof o === 'object' && !Array.isArray(o); }
  function wordCount(s) {
    var m = String(s || '').match(/[A-Za-z0-9À-ɏ]+(?:['\u2019\-][A-Za-z0-9À-ɏ]+)*/g);
    return m ? m.length : 0;
  }
  function membersList(s) {
    var seen = {};
    return String(s || '').split(/[,;\n]/).map(function (x) { return x.trim().replace(/\s+/g, ' '); })
      .filter(function (x) { var k = x.toLowerCase(); if (!x || seen[k]) return false; seen[k] = true; return true; });
  }
  // Problems with a text against a word limit from CONFIG.words.
  function wordProblem(text, key) {
    var lim = CONFIG.words[key], n = wordCount(text);
    if (n < lim.min) return 'needs at least ' + lim.min + ' words (' + n + ' so far)';
    if (lim.max && n > lim.max) return 'must be ' + lim.max + ' words or fewer (' + n + ' now)';
    return '';
  }
  function wordsOk(text, key) { return !wordProblem(text, key); }
  function wordLabel(text, key) {
    var lim = CONFIG.words[key], n = wordCount(text);
    if (lim.max) return n + ' / ' + lim.max + ' words (at least ' + lim.min + ')';
    return n + ' words (at least ' + lim.min + ')';
  }
  function interventionWarning(text) { return INTERVENTION_RE.test(String(text || '')) ? CONFIG.interventionWarning : ''; }
  function mentionsBodo(text) { return /bod[øo]/i.test(String(text || '')); }
  function cardTextHtml(t) { return esc(t).replace(/\[[^\]]*\]/g, function (m) { return '<span class="ins">' + m + '</span>'; }); }
  function claimName(no) { var c = CLAIM[no]; return c ? 'Claim ' + c.no + ' · ' + c.label + ' (' + c.course.toLowerCase() + ')' : ''; }
  function conditionSources() {
    var p = CONFIG.contextPack, out = [];
    p.dimensions.forEach(function (d) { out.push({ id: d.id, label: d.title }); });
    p.facts.forEach(function (f) { out.push({ id: f.id, label: f.title }); });
    out.push({ id: 'unverified', label: CONFIG.unverifiedLabel });
    return out;
  }
  function conditionLabel(id) {
    var s = conditionSources().filter(function (x) { return x.id === id; })[0];
    return s ? s.label : '';
  }

  // ==========================================================================
  // State
  // ==========================================================================
  function blankLadder() { return { cardId: '', driver: '', mechanism: '', characteristic: '', claim: '', sign: '' }; }
  function blankTransfer() { return { judgement: '', assumption: '', why: '' }; }
  function blankMember() {
    return {
      claim: '', characteristic: '', card1: '', card2: '', draft: '', conditionSource: '',
      partner: '', tests: { assumption: { verdict: '', reason: '' }, granularity: { verdict: '', reason: '' }, specificity: { verdict: '', reason: '' } },
      final: '', changeNote: '', locked: false
    };
  }
  function blankState() {
    var s = {
      v: 1, step: 'setup', member: '',
      group: { name: '', members: '' }, claimRow: '',
      wall: { source: 'embedded', from: '', exportedAt: '', cells: null, newCards: [] },
      audit: {}, ladders: [], transfer: [], individual: {}
    };
    for (var i = 0; i < CONFIG.ladderCount; i++) { s.ladders.push(blankLadder()); s.transfer.push(blankTransfer()); }
    return s;
  }

  // Cards on the wall, by id (starting cards plus any new cards from the class wall).
  function cardById(state, id) {
    if (START[id]) return START[id];
    var n = state.wall.newCards || [];
    for (var i = 0; i < n.length; i++) if (n[i].id === id) return { id: n[i].id, claim: n[i].claim, lens: n[i].lens, uncertain: false, text: n[i].text, isNew: true };
    return null;
  }
  function startingCells() {
    var cells = { hold: [] };
    CONFIG.claims.forEach(function (c) { CONFIG.lenses.forEach(function (l) { cells['c' + c.no + '-' + l.id] = []; }); });
    CONFIG.cards.forEach(function (c) { cells['c' + c.claim + '-' + c.lens].push(c.id); });
    return cells;
  }
  function cells(state) { return state.wall.cells || startingCells(); }
  // Cards currently in a claim row, with the lens column they sit in.
  function rowCards(state, row) {
    var out = [], cs = cells(state);
    if (!CLAIM[row]) return out;
    CONFIG.lenses.forEach(function (l) {
      (cs['c' + row + '-' + l.id] || []).forEach(function (id) {
        var c = cardById(state, id);
        if (c) out.push({ id: id, lens: l.id, text: c.text, uncertain: c.uncertain, isNew: !!c.isNew });
      });
    });
    return out;
  }
  // Every card on the wall, in wall order (rows, then holding area).
  function allCards(state) {
    var out = [], cs = cells(state);
    CONFIG.claims.forEach(function (c) { out = out.concat(rowCards(state, c.no).map(function (x) { x.claim = c.no; return x; })); });
    (cs.hold || []).forEach(function (id) {
      var c = cardById(state, id);
      if (c) out.push({ id: id, lens: c.lens, claim: 0, text: c.text, uncertain: c.uncertain, isNew: !!c.isNew });
    });
    return out;
  }
  function memberState(state, name) {
    if (!state.individual[name]) state.individual[name] = blankMember();
    return state.individual[name];
  }

  // ==========================================================================
  // Completeness (pure)
  // ==========================================================================
  function setupErrors(state) {
    var e = [];
    if (!String(state.group.name || '').trim()) e.push('Enter your group name.');
    if (!membersList(state.group.members).length) e.push('Enter at least one member name.');
    if (!CLAIM[state.claimRow]) e.push('Choose your claim row.');
    return e;
  }
  function auditDone(state, id) {
    var a = state.audit[id];
    return !!a && a.tags.length > 0 && wordsOk(a.assumes, 'assumes');
  }
  function auditNeeded(state) { return Math.min(CONFIG.auditMinCards, rowCards(state, state.claimRow).length); }
  function auditCount(state) { return rowCards(state, state.claimRow).filter(function (c) { return auditDone(state, c.id); }).length; }
  function auditErrors(state) {
    var need = auditNeeded(state), have = auditCount(state);
    return have >= need ? [] : ['Audit at least ' + need + ' cards in your row (' + have + ' done). Each needs a tag and a sentence of at least ' + CONFIG.words.assumes.min + ' words.'];
  }
  function ladderErrors(state, i) {
    var L = state.ladders[i], e = [], tag = 'Ladder ' + (i + 1) + ': ';
    if (!L.cardId) return [tag + 'choose a card.'];
    if (state.ladders.some(function (o, j) { return j !== i && o.cardId === L.cardId; })) e.push(tag + 'choose a different card from the other ladder.');
    var p;
    if ((p = wordProblem(L.driver, 'driver'))) e.push(tag + 'the driver ' + p + '.');
    if ((p = wordProblem(L.mechanism, 'mechanism'))) e.push(tag + 'the mechanism ' + p + '.');
    if (!CHAR[L.characteristic]) e.push(tag + 'choose the characteristic eroded.');
    if (!CLAIM[L.claim]) e.push(tag + 'choose the claim affected.');
    if ((p = wordProblem(L.sign, 'sign'))) e.push(tag + 'the observable sign ' + p + '.');
    return e;
  }
  function laddersErrors(state) {
    var e = [];
    for (var i = 0; i < state.ladders.length; i++) e = e.concat(ladderErrors(state, i));
    return e;
  }
  function transferErrors(state) {
    var e = [];
    state.transfer.forEach(function (t, i) {
      var tag = 'Ladder ' + (i + 1) + ': ', p;
      if (!JUDGE[t.judgement]) e.push(tag + 'choose a transfer judgement.');
      if (!TAG[t.assumption]) e.push(tag + 'choose the assumption that decides it.');
      if ((p = wordProblem(t.why, 'why'))) e.push(tag + 'the reason ' + p + '.');
    });
    return e;
  }
  function draftErrors(m) {
    var e = [], p;
    if (!CLAIM[m.claim]) e.push('Choose the claim your sentence explains.');
    if (!CHAR[m.characteristic]) e.push('Choose the characteristic it erodes.');
    if (!m.card1) e.push('Choose the wall card you built it from.');
    if (!m.conditionSource) e.push('Say where your Bodø condition comes from.');
    if ((p = wordProblem(m.draft, 'sentence'))) e.push('The draft ' + p + '.');
    return e;
  }
  function lockErrors(m) {
    var e = draftErrors(m), p;
    if (!String(m.partner || '').trim()) e.push('Choose who tested your sentence.');
    CONFIG.tests.forEach(function (t) {
      var r = m.tests[t.id];
      if (r.verdict !== 'pass' && r.verdict !== 'fail') e.push(t.label + ' test: choose passes or fails.');
      if ((p = wordProblem(r.reason, 'testReason'))) e.push(t.label + ' test: the reason ' + p + '.');
    });
    if ((p = wordProblem(m.final, 'sentence'))) e.push('The final sentence ' + p + '.');
    if ((p = wordProblem(m.changeNote, 'changeNote'))) e.push('"What changed and why" ' + p + '.');
    return e;
  }
  function stepErrors(state, id) {
    if (id === 'setup') return setupErrors(state);
    if (id === 'audit') return auditErrors(state);
    if (id === 'ladder') return laddersErrors(state);
    if (id === 'bodo') return transferErrors(state);
    if (id === 'mine') {
      var ms = membersList(state.group.members);
      var open = ms.filter(function (n) { return !(state.individual[n] && state.individual[n].locked); });
      return open.length ? ['Not locked yet: ' + open.join(', ') + '.'] : [];
    }
    return [];
  }
  function stepEnabled(state, id) {
    if (!CONFIG.gateSteps) return true;
    for (var i = 0; i < STEPS.length && STEPS[i].id !== id; i++) {
      // The cards step opens once the setup is done: cards print for whoever has locked.
      if (id === 'cards' && STEPS[i].id !== 'setup') continue;
      if (stepErrors(state, STEPS[i].id).length) return false;
    }
    return true;
  }
  function lockMember(state, name) {
    var m = memberState(state, name), e = lockErrors(m);
    if (!e.length) m.locked = true;
    return e;
  }
  function lockedSentences(state) {
    return membersList(state.group.members).filter(function (n) { return state.individual[n] && state.individual[n].locked; })
      .map(function (n) { return { member: n, m: state.individual[n] }; });
  }

  // ==========================================================================
  // Class wall import (from week6-claim-wall-sort.html)
  // ==========================================================================
  function validateWall(obj) {
    if (!isObj(obj) || obj.tool !== CONFIG.wallToolId) {
      return ['This file is not a Claim Wall Sort export' + (isObj(obj) && (obj.tool || obj.schema) ? ' (it comes from "' + String(obj.tool || obj.schema) + '")' : '') + '.'];
    }
    if (obj.cardSet !== CONFIG.cardSet) return ['This wall uses a different card set (' + String(obj.cardSet) + ').'];
    if (!isObj(obj.cells) || !Array.isArray(obj.newCards)) return ['The card positions are missing.'];
    var e = [], expected = Object.keys(startingCells());
    expected.forEach(function (k) { if (!Array.isArray(obj.cells[k])) e.push('The wall layout does not match (missing ' + k + ').'); });
    if (e.length) return e;
    var known = {};
    obj.newCards.forEach(function (c) { if (isObj(c) && typeof c.id === 'string' && typeof c.text === 'string') known[c.id] = true; });
    expected.forEach(function (k) {
      obj.cells[k].forEach(function (id) { if (!START[id] && !known[id]) e.push('Card ' + String(id) + ' is not part of this wall.'); });
    });
    return e.filter(function (x, i, a) { return a.indexOf(x) === i; });
  }
  function applyWall(state, obj) {
    var keep = {};
    Object.keys(startingCells()).forEach(function (k) { keep[k] = obj.cells[k].slice(); });
    state.wall = {
      source: 'import',
      from: isObj(obj.group) ? String(obj.group.name || '') : '',
      exportedAt: String(obj.exportedAt || ''),
      cells: keep,
      newCards: obj.newCards.filter(function (c) { return isObj(c) && typeof c.id === 'string'; }).map(function (c) {
        return { id: c.id, text: String(c.text), claim: +c.claim || 0, lens: String(c.lens || ''), group: String(c.group || '') };
      })
    };
    return state;
  }

  // ==========================================================================
  // Export, import (own files)
  // ==========================================================================
  function buildExport(state, now) {
    var s = clone(state);
    return {
      tool: CONFIG.toolId,
      schemaVersion: CONFIG.schemaVersion,
      exportedAt: now || new Date().toISOString(),
      group: { name: String(s.group.name || '').trim(), members: membersList(s.group.members) },
      claimRow: CLAIM[s.claimRow] ? +s.claimRow : null,
      sentences: membersList(s.group.members).map(function (n) {
        var m = s.individual[n] || blankMember();
        return {
          member: n, claim: CLAIM[m.claim] ? +m.claim : null, characteristic: CHAR[m.characteristic] ? m.characteristic : null,
          cards: [m.card1, m.card2].filter(Boolean), conditionSource: m.conditionSource || null,
          final: m.locked ? m.final : '', locked: !!m.locked
        };
      }),
      state: s
    };
  }
  function validateImport(obj) {
    if (!isObj(obj) || obj.tool !== CONFIG.toolId) return ['This file is not a "Why Bodø?" export.'];
    if (typeof obj.schemaVersion !== 'number' || obj.schemaVersion > CONFIG.schemaVersion) return ['This file was made by a newer version of this tool.'];
    var s = obj.state;
    if (!isObj(s) || !isObj(s.group) || !isObj(s.wall) || !isObj(s.audit) || !Array.isArray(s.ladders) || !Array.isArray(s.transfer) || !isObj(s.individual)) return ['The saved work in this file is incomplete.'];
    return [];
  }
  // Fill any missing fields so old or partial state never breaks rendering.
  function normalise(s) {
    var b = blankState();
    var out = Object.assign(b, s);
    out.group = Object.assign({ name: '', members: '' }, s.group || {});
    out.wall = Object.assign(blankState().wall, s.wall || {});
    if (!Array.isArray(out.wall.newCards)) out.wall.newCards = [];
    out.audit = isObj(s.audit) ? s.audit : {};
    Object.keys(out.audit).forEach(function (k) {
      var a = out.audit[k];
      out.audit[k] = { tags: Array.isArray(a && a.tags) ? a.tags.filter(function (t) { return TAG[t]; }) : [], assumes: String((a && a.assumes) || '') };
    });
    out.ladders = []; out.transfer = [];
    for (var i = 0; i < CONFIG.ladderCount; i++) {
      out.ladders.push(Object.assign(blankLadder(), (s.ladders || [])[i] || {}));
      out.transfer.push(Object.assign(blankTransfer(), (s.transfer || [])[i] || {}));
    }
    out.individual = {};
    Object.keys(isObj(s.individual) ? s.individual : {}).forEach(function (n) {
      var m = Object.assign(blankMember(), s.individual[n]);
      var t = blankMember().tests;
      CONFIG.tests.forEach(function (x) { t[x.id] = Object.assign(t[x.id], (s.individual[n].tests || {})[x.id] || {}); });
      m.tests = t;
      out.individual[n] = m;
    });
    if (!STEPS.some(function (x) { return x.id === out.step; })) out.step = 'setup';
    return out;
  }

  // ==========================================================================
  // Text and print output
  // ==========================================================================
  function buildText(state) {
    var L = [], name = String(state.group.name || '').trim() || '(no group name)';
    L.push('WHY BODØ? — ' + name);
    L.push('Members: ' + (membersList(state.group.members).join(', ') || '(none)'));
    L.push('Claim row: ' + (claimName(state.claimRow) || '(not chosen)'));
    L.push('Wall: ' + (state.wall.source === 'import' ? 'class wall' + (state.wall.from ? ' "' + state.wall.from + '"' : '') : 'original S1 cards'));
    L.push('');
    L.push('INDIVIDUAL SENTENCES');
    var locked = lockedSentences(state);
    if (!locked.length) L.push('(none locked yet)');
    locked.forEach(function (x) {
      L.push('- ' + x.member + ': ' + x.m.final.trim());
      L.push('  [' + (CLAIM[x.m.claim] ? CLAIM[x.m.claim].label : '') + ' · ' + (CHAR[x.m.characteristic] ? CHAR[x.m.characteristic].name : '') + ' · Bodø condition: ' + conditionLabel(x.m.conditionSource) + ']');
    });
    L.push('');
    L.push('1. ASSUMPTION AUDIT');
    rowCards(state, state.claimRow).forEach(function (c) {
      var a = state.audit[c.id];
      if (!a || (!a.assumes && !a.tags.length)) return;
      L.push('- ' + c.id + ' "' + c.text + '"');
      L.push('  Tags: ' + (a.tags.map(function (t) { return TAG[t].label; }).join(', ') || '(none)'));
      L.push('  Assumes that: ' + a.assumes.trim());
    });
    L.push('');
    L.push('2. GRANULARITY LADDERS');
    state.ladders.forEach(function (ld, i) {
      var c = cardById(state, ld.cardId);
      L.push('Ladder ' + (i + 1) + ': ' + (c ? c.id + ' "' + c.text + '"' : '(no card)'));
      L.push('  Driver: ' + ld.driver.trim());
      L.push('  Mechanism: ' + ld.mechanism.trim());
      L.push('  Characteristic: ' + (CHAR[ld.characteristic] ? CHAR[ld.characteristic].name : ''));
      L.push('  Claim: ' + claimName(ld.claim));
      L.push('  Observable sign: ' + ld.sign.trim());
      var t = state.transfer[i];
      L.push('  Bodø: ' + (JUDGE[t.judgement] ? JUDGE[t.judgement].label : '(not judged)') + (TAG[t.assumption] ? ' — decided by ' + TAG[t.assumption].label : ''));
      if (t.why.trim()) L.push('  Why: ' + t.why.trim());
    });
    L.push('');
    L.push('4–5. HOW EACH SENTENCE CHANGED');
    membersList(state.group.members).forEach(function (n) {
      var m = state.individual[n];
      if (!m || !m.draft.trim()) return;
      L.push('- ' + n + (m.locked ? '' : ' (not locked)'));
      L.push('  Draft: ' + m.draft.trim());
      if (m.partner) L.push('  Tested by: ' + m.partner);
      CONFIG.tests.forEach(function (t) {
        var r = m.tests[t.id];
        if (r.verdict) L.push('  ' + t.label + ': ' + (r.verdict === 'pass' ? 'passes' : 'fails') + ' — ' + r.reason.trim());
      });
      if (m.final.trim()) L.push('  Final: ' + m.final.trim());
      if (m.changeNote.trim()) L.push('  What changed: ' + m.changeNote.trim());
    });
    return L.join('\n');
  }

  function a6Card(state, x) {
    var m = x.m, cl = CLAIM[m.claim], ch = CHAR[m.characteristic];
    var unv = m.conditionSource === 'unverified';
    return '<div class="a6">' +
      '<div class="a6-eyebrow">Why Bodø? · ' + esc(String(state.group.name || '').trim()) + '</div>' +

      '<div class="a6-tags">' + esc(cl ? cl.label + ' (' + cl.course.toLowerCase() + ')' : '') + ' · ' + esc(ch ? ch.name : '') + '</div>' +
      '<div class="a6-text">' + esc(m.final.trim()) + '</div>' +
      '<div class="a6-foot">' + esc(x.member) + ' · Bodø condition: <span class="' + (unv ? 'unv' : '') + '">' + esc(conditionLabel(m.conditionSource)) + '</span>' +
      ' · From ' + esc([m.card1, m.card2].filter(Boolean).join(', ')) + '</div>' +
      '</div>';
  }
  function buildA6Html(state) {
    var cards = lockedSentences(state).map(function (x) { return a6Card(state, x); });

  }
  function buildReportHtml(state) {

    var locked = lockedSentences(state);
    h += '<section class="rep-section" style="--rep-colour:#B83068"><h2>Individual sentences</h2>';
    if (!locked.length) h += '<p>None locked yet.</p>';
    locked.forEach(function (x) {
      h += '<div class="rep-item"><div class="k">' + esc(x.member) + ' · ' + esc(CLAIM[x.m.claim] ? CLAIM[x.m.claim].label : '') + ' · ' + esc(CHAR[x.m.characteristic] ? CHAR[x.m.characteristic].name : '') + ' · Bodø condition: ' + esc(conditionLabel(x.m.conditionSource)) + '</div><div class="rep-sentence">' + esc(x.m.final.trim()) + '</div>' +
        '<div>Draft: ' + esc(x.m.draft.trim()) + '</div><div>What changed: ' + esc(x.m.changeNote.trim()) + '</div></div>';

    });
    h += '</section>';
    h += '<section class="rep-section" style="--rep-colour:#D4A020"><h2>2–3. Ladders and Bodø</h2>';
    state.ladders.forEach(function (ld, i) {
      var c = cardById(state, ld.cardId), t = state.transfer[i];
      h += '<div class="rep-item"><div class="k">Ladder ' + (i + 1) + (c ? ' · ' + esc(c.id) : '') + '</div>' +
        '<div>' + esc(c ? '"' + c.text + '"' : '') + '</div>' +
        '<div>Driver: ' + esc(ld.driver.trim()) + '</div><div>Mechanism: ' + esc(ld.mechanism.trim()) + '</div>' +
        '<div>Characteristic: ' + esc(CHAR[ld.characteristic] ? CHAR[ld.characteristic].name : '') + ' · ' + esc(claimName(ld.claim)) + '</div>' +
        '<div>Observable sign: ' + esc(ld.sign.trim()) + '</div>' +
        '<div><strong>Bodø: ' + esc(JUDGE[t.judgement] ? JUDGE[t.judgement].label : '') + '</strong>' + esc(TAG[t.assumption] ? ' (decided by ' + TAG[t.assumption].label + ')' : '') + ' ' + esc(t.why.trim()) + '</div></div>';
    });

    return h;
  }

  // ==========================================================================
  // Rendering (browser only)

  var state, els = {};
  var $ = function (id) { return document.getElementById(id); };

  function save() {
    try { window.localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); } catch (e) { /* storage unavailable: work continues unsaved */ }
  }
  function load() {
    try {
      var raw = window.localStorage.getItem(CONFIG.storageKey);

    return blankState();
  }
  function setStatus(msg) { els.status.textContent = msg || ''; }

      '<input type="' + (type || 'radio') + '" name="' + esc(name) + '" value="' + esc(value) + '"' + (checked ? ' checked' : '') + '>' +
      '<span>' + label + '</span></label>';
  }
  function textField(id, label, value, key, opts) {
    opts = opts || {};
    return '<div class="field"><label for="' + id + '">' + esc(label) + '</label>' +
      (opts.hint ? '<p class="quiet">' + esc(opts.hint) + '</p>' : '') +
      '<textarea id="' + id + '" data-f="' + esc(opts.path) + '" data-words="' + key + '"' + (opts.big ? ' class="big"' : '') + (opts.readonly ? ' readonly' : '') + ' aria-describedby="' + id + '-wc">' + esc(value) + '</textarea>' +
      '<div class="word-count ' + (wordsOk(value, key) ? 'ok' : 'bad') + '" id="' + id + '-wc" aria-live="polite">' + wordLabel(value, key) + '</div>' +

  function selectField(id, label, value, options, path, placeholder) {
    var h = '<div class="field"><label for="' + id + '">' + esc(label) + '</label><select id="' + id + '" data-f="' + esc(path) + '">';

  function cardPaper(state, c) {

  function nextButton(id) {

  function renderSteps() {
    var h = '';

      var sel = state.step === s.id, en = stepEnabled(state, s.id), done = s.id !== 'cards' && !stepErrors(state, s.id).length;

        (en ? '' : ' disabled') + ' data-action="goto" data-step="' + s.id + '"><span class="num">' + s.num + '</span><span class="lbl">' + esc(s.label) + '</span></button>';

  function renderSetup() {
    var h = '<section class="panel" style="--panel-colour:var(--char-5)"><p class="eyebrow panel-eyebrow">Step 0</p><h2>Your group</h2>';
    h += '<div class="two-col"><div class="field"><label for="g-name">Group name</label><input type="text" id="g-name" data-f="group.name" maxlength="60" autocomplete="off" value="' + esc(state.group.name) + '"></div>' +
      '<div class="field"><label for="g-members">Members (separate with commas)</label><input type="text" id="g-members" data-f="group.members" maxlength="300" autocomplete="off" value="' + esc(state.group.members) + '"></div></div>';

  function renderAudit() {
    var row = rowCards(state, state.claimRow);
    var h = '<div class="banner" style="--panel-colour:var(--char-1)"><h2>1 · What does each card assume?</h2><p>The cards were written about third places in general. Most quietly assume a particular kind of place, provider, people and history.</p></div>';
    h += '<section class="panel" style="--panel-colour:var(--char-1)"><p class="eyebrow panel-eyebrow">' + esc(claimName(state.claimRow)) + '</p>';
    h += '<p class="progress" id="audit-progress">' + auditCount(state) + ' of ' + row.length + ' cards audited (at least ' + auditNeeded(state) + ' needed; aim for all).</p>';
    h += '<p class="quiet">' + CONFIG.assumptionTags.map(function (t) { return '<strong>' + esc(t.label) + ':</strong> ' + esc(t.prompt); }).join(' ') + '</p>';
    if (!row.length) h += '<p>This row has no cards.</p>';
    row.forEach(function (c, i) {
      var a = state.audit[c.id] || { tags: [], assumes: '' };
      h += '<div class="audit-item' + (auditDone(state, c.id) ? ' done' : '') + '" id="ai-' + esc(c.id) + '"><div>' + cardPaper(state, c) + '</div><div>';
      h += '<fieldset class="field"><legend>Hidden assumption (choose any)</legend><div class="choices">';
      CONFIG.assumptionTags.forEach(function (t) {
        h += choice('tag|' + c.id, t.id, esc(t.label), a.tags.indexOf(t.id) !== -1, 'var(--char-1)', 'checkbox');

  function renderLadder() {

    var h = '<div class="banner" style="--panel-colour:var(--char-4);color:var(--text)"><h2 style="color:var(--text)">2 · Break it down</h2><p>Pick the two vaguest cards in your row (a bare label like "Inflation" first) and rebuild each as a chain of steps.</p></div>';
    h += '<section class="panel" style="--panel-colour:var(--char-4)">';
    state.ladders.forEach(function (L, i) {
      var col = LADDER_COLOURS[i % LADDER_COLOURS.length];
      h += '<div class="ladder" style="--ladder-colour:' + col + '"><h3>Ladder ' + (i + 1) + '</h3>';
      h += selectField('ld-card-' + i, 'Rung 0 · The card (its label)', L.cardId, opts, 'ladders.' + i + '.cardId', 'Choose a card from your row…');
      if (L.cardId && cardById(state, L.cardId)) h += '<div class="field">' + cardPaper(state, { id: L.cardId }) + '</div>';

        } else if (r.id === 'claim') {
          h += selectField('ld-' + r.id + '-' + i, r.label, L.claim, CONFIG.claims.map(function (c) { return { value: c.no, label: claimName(c.no) }; }), 'ladders.' + i + '.claim');
        } else {
          h += textField('ld-' + r.id + '-' + i, r.label, L[r.id], r.id, { path: 'ladders.' + i + '.' + r.id, hint: r.hint });

        h += '</div>';
      });
      h += '</div>';

  function packHtml() {
    var p = CONFIG.contextPack;

    p.facts.forEach(function (f) { h += '<li><strong>' + esc(f.title) + '</strong>' + esc(f.text) + '<span class="src">Source: ' + esc(f.source) + '</span></li>'; });
    return h + '</ul></aside>';
  }
  function renderBodo() {
    var h = '<div class="banner" style="--panel-colour:var(--char-2)"><h2>3 · Does it hold in Bodø?</h2><p>For each ladder, decide whether the mechanism carries over, and which hidden assumption decides it. There is no right answer; there are better and worse reasons.</p></div>';
    h += '<section class="panel" style="--panel-colour:var(--char-2)"><div class="bodo-layout"><div>';

      var t = state.transfer[i], col = LADDER_COLOURS[i % LADDER_COLOURS.length], a = state.audit[L.cardId];

      h += '<p class="summary-line">' + esc(L.driver.trim()) + ' → ' + esc(L.mechanism.trim()) + ' → ' + esc(CHAR[L.characteristic] ? CHAR[L.characteristic].name : '') + ' → ' + esc(claimName(L.claim)) + '</p>';
      if (a && a.assumes.trim()) h += '<p class="quiet">Your audit: this card assumes that ' + esc(a.assumes.trim()) + '</p>';
      h += '<fieldset class="field"><legend>In Bodø, this mechanism…</legend><div class="choices">';
      CONFIG.transferJudgements.forEach(function (j) {
        h += choice('judge|' + i, j.id, '<span><strong>' + esc(j.label) + '</strong><br>' + esc(j.help) + '</span>', t.judgement === j.id, j.colour, 'radio', ' block');

  function renderMine() {
    var ms = membersList(state.group.members);
    if (ms.indexOf(state.member) === -1) state.member = ms[0] || '';
    var h = '<div class="banner" style="--panel-colour:var(--char-6)"><h2>4 · Your own sentence</h2><p>Pass the device round. Everyone writes their own sentence, silently, from any card on the wall. Then a partner tests it and you redraft.</p></div>';
    h += '<section class="panel" style="--panel-colour:var(--char-6)">';
    h += '<div class="member-tabs" role="group" aria-label="Group members">';
    ms.forEach(function (n) {
      var m = state.individual[n];
      h += '<button type="button" class="member-tab" data-action="member" data-member="' + esc(n) + '" aria-pressed="' + (n === state.member) + '"><span class="pip' + (m && m.locked ? ' on' : '') + '" aria-hidden="true"></span>' + esc(n) + (m && m.locked ? '<span class="sr-only"> (locked)</span>' : '') + '</button>';
    });
    h += '</div>';
    if (!state.member) return h + '<p>Add member names in step 0.</p></section>';
    var n = state.member, m = memberState(state, n), p = 'individual.' + n + '.';
    if (m.locked) {
      h += '<div class="locked-box"><p class="eyebrow">' + esc(n) + ' · locked</p><p class="sentence">' + esc(m.final.trim()) + '</p>' +
        '<p class="quiet">' + esc(CLAIM[m.claim] ? CLAIM[m.claim].label : '') + ' · ' + esc(CHAR[m.characteristic] ? CHAR[m.characteristic].name : '') + ' · Bodø condition: ' + esc(conditionLabel(m.conditionSource)) + '</p>' +
        '<button type="button" class="btn btn-ghost" data-action="unlock">Unlock to edit</button></div>';
      return h + nextButton('mine') + '</section>';
    }
    h += '<div class="template"><strong>Template.</strong> ' + CONFIG.sentenceTemplate + '<br><span class="quiet">Model: ' + esc(CONFIG.modelSentence) + '</span></div>';
    var cardOpts = allCards(state).map(function (c) { return { value: c.id, label: c.id + ' — ' + (c.text.length > 60 ? c.text.slice(0, 57) + '…' : c.text) }; });
    h += '<h3>Draft</h3><div class="two-col">' +
      selectField('m-claim', 'Claim it explains', m.claim, CONFIG.claims.map(function (c) { return { value: c.no, label: claimName(c.no) }; }), p + 'claim') +
      selectField('m-char', 'Characteristic it erodes', m.characteristic, CONFIG.characteristics.map(function (c) { return { value: c.id, label: c.name }; }), p + 'characteristic') +
      selectField('m-card1', 'Built from wall card', m.card1, cardOpts, p + 'card1') +
      selectField('m-card2', 'Second card (optional)', m.card2, cardOpts, p + 'card2', 'None') +
      '</div>';
    h += selectField('m-cond', 'Where does your Bodø condition come from?', m.conditionSource, conditionSources().map(function (s) { return { value: s.id, label: s.label }; }), p + 'conditionSource');
    h += textField('m-draft', 'Your draft sentence', m.draft, 'sentence', { path: p + 'draft', big: true, warn: true, warnText: sentenceWarnings(m.draft) });
    var draftOk = !draftErrors(m).length;
    h += '<fieldset id="m-tests"' + (draftOk ? '' : ' disabled') + '><legend class="sr-only">Partner tests</legend>';
    h += '<h3>Partner tests</h3>' + (draftOk ? '' : '<p class="quiet">Finish the draft first.</p>');
    var others = ms.filter(function (x) { return x !== n; }).map(function (x) { return { value: x, label: x }; });
    others.push({ value: 'Someone from another group', label: 'Someone from another group' });
    h += selectField('m-partner', 'Tested by', m.partner, others, p + 'partner');
    CONFIG.tests.forEach(function (t) {
      var r = m.tests[t.id];
      h += '<div class="test-row"><fieldset class="field"><legend>' + esc(t.label) + ' — ' + esc(t.question) + '</legend><div class="choices">' +
        choice('test|' + t.id, 'pass', 'Passes', r.verdict === 'pass', 'var(--correct)') +

    h += '<div class="actions"><button type="button" class="btn btn-primary" data-action="copy-draft">Copy draft into final</button>' +
      '<button type="button" class="btn btn-accent" data-action="lock">Lock my sentence</button></div>';
    h += '</fieldset><div id="lock-errors"></div>';
    return h + '</section>';
  }
  function sentenceWarnings(t) {
    if (!wordCount(t)) return '';
    return [interventionWarning(t), mentionsBodo(t) ? '' : CONFIG.noBodoWarning].filter(Boolean).join(' ');
  }

  function renderCards() {
    var locked = lockedSentences(state), ms = membersList(state.group.members);
    var h = '<div class="banner" style="--panel-colour:var(--char-8)"><h2>Cards for the wall</h2><p>One A6 card per locked sentence, four to an A4 page with cut lines. Pin them on a Bodø strip under each claim.</p></div>';
    h += '<section class="panel" style="--panel-colour:var(--char-8)">';
    h += '<p class="progress">' + locked.length + ' of ' + ms.length + ' sentences locked.</p>';
    if (locked.length) h += '<div class="card-grid">' + locked.map(function (x) { return a6Card(state, x); }).join('') + '</div>';
    h += '<div class="actions"><button type="button" class="btn btn-primary" data-action="print">Print report and cards</button><button type="button" class="btn btn-ghost" data-action="copy">Copy as text</button></div>';
    return h + '</section>';
  }

  function render(focusPanel) {
    if (!stepEnabled(state, state.step)) state.step = 'setup';
    renderSteps();
    var r = { setup: renderSetup, audit: renderAudit, ladder: renderLadder, bodo: renderBodo, mine: renderMine, cards: renderCards }[state.step];
    els.panel.innerHTML = r();
    if (focusPanel) els.panel.focus();
  }

  // Light refresh after typing: word counts, warnings, step tabs and the
  // next-button state, without rebuilding the field being typed in.
  function refreshLive(el) {
    if (el && el.dataset.words) {
      var key = el.dataset.words, wc = $(el.id + '-wc');
      if (wc) { wc.textContent = wordLabel(el.value, key); wc.className = 'word-count ' + (wordsOk(el.value, key) ? 'ok' : 'bad'); }
      var w = $(el.id + '-warn');
      if (w) w.textContent = sentenceWarnings(el.value);
    }
    renderSteps();
    var errBox = $('step-errors');
    if (errBox) {
      var errs = stepErrors(state, state.step);
      errBox.innerHTML = errorList(errs);
      var btn = errBox.previousElementSibling && errBox.previousElementSibling.querySelector('button');
      if (btn) btn.disabled = !!(errs.length && CONFIG.gateSteps);
    }
    if (state.step === 'audit') {
      var pr = $('audit-progress');
      if (pr) pr.textContent = auditCount(state) + ' of ' + rowCards(state, state.claimRow).length + ' cards audited (at least ' + auditNeeded(state) + ' needed; aim for all).';
      if (el && el.dataset.f) {
        var id = el.dataset.f.split('.')[1], item = $('ai-' + id);
        if (item) item.classList.toggle('done', auditDone(state, id));
      }
    }
    if (state.step === 'mine') {
      var m = state.individual[state.member], fs = $('m-tests');
      if (m && fs) {
        var ok = !draftErrors(m).length;
        if (fs.disabled === ok) { save(); render(); var again = el && $(el.id); if (again) { again.focus(); try { again.setSelectionRange(again.value.length, again.value.length); } catch (e) { /* select elements */ } } return; }
      }
    }
    save();
  }

  // Set a value by dotted path, where member names (which may contain dots)
  // follow "individual." and card ids follow "audit.".
  function setPath(path, value) {
    var parts = path.split('.');
    if (parts[0] === 'individual') {
      var m = memberState(state, state.member), rest = parts.slice(-1)[0];
      if (path.indexOf('.tests.') !== -1) { var tp = parts.slice(-2); m.tests[tp[0]][tp[1]] = value; }
      else m[rest] = value;
      return;
    }
    if (parts[0] === 'audit') {
      var id = parts[1];
      if (!state.audit[id]) state.audit[id] = { tags: [], assumes: '' };
      state.audit[id][parts[2]] = value;
      return;
    }
    var o = state;
    for (var i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = value;
  }

  function download(name, obj) {
    var blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }
  function slug(s) { return String(s || 'group').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'group'; }
  function readJsonFile(input, cb) {
    var f = input.files && input.files[0];
    input.value = '';
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { var obj; try { obj = JSON.parse(r.result); } catch (e) { setStatus('That file is not valid JSON. Nothing was changed.'); return; } cb(obj); };
    r.onerror = function () { setStatus('The file could not be read. Nothing was changed.'); };
    r.readAsText(f);
  }
  function copyText(t) {
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      setStatus(ok ? 'Copied as text.' : 'Copy failed: use Print instead.');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { setStatus('Copied as text.'); }, fallback);
    else fallback();
  }
  function preparePrint() {
    $('w7-print-meta').textContent = (String(state.group.name || '').trim() || '(no group name)') + ' · ' + membersList(state.group.members).join(', ') + ' · ' + claimName(state.claimRow);
    $('print-area').innerHTML = buildReportHtml(state) + buildA6Html(state);
  }

  function init() {
    els.status = $('status'); els.steps = $('steps'); els.panel = $('panel');
    $('w7-eyebrow').textContent = CONFIG.text.eyebrow;
    $('w7-title').textContent = CONFIG.text.title;
    $('w7-lede').textContent = CONFIG.text.lede;
    document.title = CONFIG.text.title;
    $('w7-runsheet').innerHTML = '<summary>How this session runs (90 minutes)</summary><ol>' +
      CONFIG.runSheet.map(function (r) { return '<li><span class="t">' + esc(r.t) + '</span><span>' + esc(r.what) + '</span></li>'; }).join('') + '</ol>';
    state = load();

    els.panel.addEventListener('input', function (ev) {
      var el = ev.target;
      if (el.dataset && el.dataset.f && el.tagName !== 'SELECT') {
        setPath(el.dataset.f, el.value);
        refreshLive(el);
      }
    });
    els.panel.addEventListener('change', function (ev) {
      var el = ev.target;
      if (el.tagName === 'SELECT' && el.dataset.f) {
        setPath(el.dataset.f, el.value);
        save(); render();
        var again = $(el.id); if (again) again.focus();
        return;
      }
      if (el.type === 'radio' || el.type === 'checkbox') {
        var nm = el.name.split('|');
        if (nm[0] === 'claimRow') state.claimRow = +el.value;
        else if (nm[0] === 'tag') {
          var a = state.audit[nm[1]] || (state.audit[nm[1]] = { tags: [], assumes: '' });
          a.tags = CONFIG.assumptionTags.map(function (t) { return t.id; }).filter(function (t) {
            return t === el.value ? el.checked : a.tags.indexOf(t) !== -1;
          });
          refreshLive({ dataset: { f: 'audit.' + nm[1] + '.tags' } });
          return;
        }
        else if (nm[0] === 'judge') state.transfer[+nm[1]].judgement = el.value;
        else if (nm[0] === 'assume') state.transfer[+nm[1]].assumption = el.value;
        else if (nm[0] === 'test') memberState(state, state.member).tests[nm[1]].verdict = el.value;
        refreshLive(null);
      }
    });
    els.panel.addEventListener('focusout', function (ev) {
      // Membership and group name feed other steps: re-render when they settle.
      if (ev.target.id === 'g-members' || ev.target.id === 'g-name') { save(); renderSteps(); }
    });
    document.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-action]');
      if (!b || b.disabled) return;
      var act = b.dataset.action;
      if (act === 'goto') { if (stepEnabled(state, b.dataset.step)) { state.step = b.dataset.step; save(); render(true); window.scrollTo(0, 0); } }
      else if (act === 'member') { state.member = b.dataset.member; save(); render(); }
      else if (act === 'copy-draft') {
        var m0 = memberState(state, state.member);
        if (!m0.final.trim() || window.confirm('Replace your final sentence with the draft?')) { m0.final = m0.draft; save(); render(); }
      }
      else if (act === 'lock') {
        var errs = lockMember(state, state.member);
        if (errs.length) { $('lock-errors').innerHTML = errorList(errs); setStatus('Not locked yet: see the list below the button.'); }
        else { save(); render(); setStatus(state.member + '\u2019s sentence is locked.'); }
      }
      else if (act === 'unlock') { memberState(state, state.member).locked = false; save(); render(); }
      else if (act === 'print') { preparePrint(); window.print(); }
      else if (act === 'copy') copyText(buildText(state));
    });

    $('btn-wall').addEventListener('click', function () { $('wall-file').click(); });
    $('wall-file').addEventListener('change', function () {
      readJsonFile(this, function (obj) {
        var errs = validateWall(obj);
        if (errs.length) { setStatus(errs[0] + ' Nothing was changed.'); return; }
        applyWall(state, obj); save(); render();
        setStatus('Class wall loaded: ' + allCards(state).length + ' cards.');
      });
    });
    $('btn-export').addEventListener('click', function () {
      download('why-bodo-' + slug(state.group.name) + '.json', buildExport(state));
      setStatus('Exported.');
    });
    $('btn-import').addEventListener('click', function () { $('import-file').click(); });
    $('import-file').addEventListener('change', function () {
      readJsonFile(this, function (obj) {
        var errs = validateImport(obj);
        if (errs.length) { setStatus(errs[0] + ' Nothing was changed.'); return; }
        if (!window.confirm('Replace the work on this device with the work in this file?')) return;
        state = normalise(clone(obj.state)); save(); render();
        setStatus('Imported work for ' + (state.group.name || 'this group') + '.');
      });
    });
    $('btn-copy').addEventListener('click', function () { copyText(buildText(state)); });
    $('btn-print').addEventListener('click', function () { preparePrint(); window.print(); });
    $('btn-reset').addEventListener('click', function () {
      if (!window.confirm('Reset clears all of this group\u2019s work on this device. Export first if you want to keep it. Reset now?')) return;
      state = blankState();
      try { window.localStorage.removeItem(CONFIG.storageKey); } catch (e) { /* storage unavailable */ }
      render(); setStatus('Reset.');
    });
    window.addEventListener('beforeprint', preparePrint);
    render();
  }

  // Test hook: pure functions and CONFIG exposed for test.html.
  window.W7 = {
    CONFIG: CONFIG,
    blankState: blankState,
    normalise: normalise,
    wordCount: wordCount,
    wordProblem: wordProblem,
    membersList: membersList,
    rowCards: rowCards,
    allCards: allCards,
    memberState: memberState,
    setupErrors: setupErrors,
    auditErrors: auditErrors,
    ladderErrors: ladderErrors,
    transferErrors: transferErrors,
    draftErrors: draftErrors,
    lockErrors: lockErrors,
    lockMember: lockMember,
    stepErrors: stepErrors,
    stepEnabled: stepEnabled,
    validateWall: validateWall,
    applyWall: applyWall,
    buildExport: buildExport,
    validateImport: validateImport,
    buildText: buildText,
    buildA6Html: buildA6Html,
    interventionWarning: interventionWarning,
    mentionsBodo: mentionsBodo
  };

  if (document.getElementById('w7-app')) init();
})();
</script>
