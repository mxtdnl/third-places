    var fid = active && active.id;
    var sel = null;
    if (active && active.tagName === 'INPUT' && active.type === 'text') { try { sel = [active.selectionStart, active.selectionEnd]; } catch (e) { sel = null; } }
    $('screen').innerHTML = R[S.screen]();
    var idx = SCREENS.indexOf(S.screen);
    $('phasebar').innerHTML = C.text.phases.map(function (p, i) {
      return '<li class="' + (i < idx ? 'done' : i === idx ? 'now' : '') + '"' + (i === idx ? ' aria-current="step"' : '') + '><span class="sr">' + esc(p) + (i === idx ? ' (current)' : '') + '</span></li>';
    }).join('');
    var q = Q();
    $('meta').innerHTML = '<b>' + esc(C.text.phases[idx]) + '</b><br>Seed <span class="num">' + esc(S.seed) + '</span>' + (q && idx >= 3 ? ' &middot; ' + esc(q.name) : '');
    if (S.screen === 'reveal' && !revealPlayed) { revealPlayed = true; S.revealed = true; }
    S.popFlash = null;
    save();
    if (focusHeading) {
      var h = $('screen-h');
      if (h) h.focus({ preventScroll: true });
      window.scrollTo(0, 0);
    } else if (fid && $(fid)) {
      var el = $(fid);
      if (el.disabled) { var alt = el.parentNode && el.parentNode.querySelector('button:not(:disabled)'); if (alt) alt.focus({ preventScroll: true }); }
      else { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) { try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* not a text input */ } } }
    }
  }
  function go(screen) { S.screen = screen; render(true); }
  function say(msg) { $('status').textContent = msg; }

  /* ======================================================================
     Actions
     ==================================================================== */
  var A = {};
  A.go = function (el) { go(el.getAttribute('data-to')); };
  A['new-seed'] = function () { S.seed = pickSeed(); render(); };
  A.sort = function (el) { S.sort[el.getAttribute('data-card')] = el.getAttribute('data-bin'); render(); };
  A.quest = function (el) {
    var id = el.getAttribute('data-quest');
    if (S.quest !== id) { S.quest = id; S.dash = emptyDash(); S.mentor = []; S.mentorPick = ''; S.attempts = []; S.allocs = []; S.reviews = {}; S.draft = {}; S.flipped = {}; S.revealed = false; revealPlayed = false; }
    go('build');
  };
  A.slot = function (el) {
    var ind = ST.indicator(Q(), el.getAttribute('data-ind'));
    if (ind.side === 'lag') S.dash.lag = ind.id;
    else {
      var i = S.dash.leads.indexOf(null);
      if (i < 0) return;
      S.dash.leads[i] = ind.id;
      S.dash.targets[ind.id] = ind.target.def;
    }
    render();
  };
  A.unslot = function (el) {
    var s = el.getAttribute('data-slot');
    if (s === 'lag') S.dash.lag = null;
    else { var id = S.dash.leads[+s]; delete S.dash.targets[id]; S.dash.leads[+s] = null; }
    render();
    var h = $('screen-h'); if (h) h.focus({ preventScroll: true });
  };
  A.mentor = function () {
    var id = S.mentorPick;
    if (!id || !mentorLeft() || S.mentor.indexOf(id) >= 0 || !pendingReview() || S.allocs.length < C.mentor.fromWeek) return;
    S.mentor.push(id); S.mentorPick = '';
    render();
    say('The mentor has rated ' + ST.indicator(Q(), id).name + '.');
    var next = $('mentor-pick') || $('review-done'); if (next) next.focus({ preventScroll: true });
  };
  A.target = function (el) {
    var ind = ST.indicator(Q(), el.getAttribute('data-ind'));
    var ctx = el.getAttribute('data-ctx');
    var bag = ctx === 'r' ? S.reviewDraft.targets : S.dash.targets;
    var v = bag[ind.id] + (+el.getAttribute('data-d')) * ind.target.step;
    bag[ind.id] = ST.round(Math.max(ind.target.min, Math.min(ind.target.max, v)), 2);
    render();
  };
  A.start = function () { go('brief'); };
  A.enter = function () {
    S.allocs = []; S.reviews = {}; S.draft = {}; S.reviewDraft = null; S.mentor = []; S.mentorPick = ''; S.flipped = {}; S.revealed = false; revealPlayed = false; lastCommitted = 0;
    go('season');
  };
  A.alloc = function (el) { moveToken(el.getAttribute('data-d') === '1' ? 'pool' : el.getAttribute('data-act'), el.getAttribute('data-d') === '1' ? el.getAttribute('data-act') : 'pool'); };
  A['clear-alloc'] = function () { S.draft = {}; render(); };
  A.commit = function () {
    var run = currentRun();
    var ctx = ST.weekContext(run);
    clampDraft(ctx);
    S.allocs.push(Object.assign({}, S.draft));
    lastCommitted = S.allocs.length;
    if (pendingReview()) {
      var r2 = currentRun();
      S.reviewDraft = { targets: Object.assign({}, r2.dash.targets), from: '', to: '' };
    }
    render();
    var w = S.allocs.length;
    say(w >= W ? 'Season complete.' : pendingReview() ? 'Review stop after week ' + w + '.' : 'Week ' + w + ' committed.');
    var target = $('commit') || $('review-done') || $('lift');
    if (target) target.focus({ preventScroll: true });
  };
  A['review-done'] = function () {
    var rd = S.reviewDraft;
    var change = { targets: rd.targets };
    if (rd.from && rd.to) change.swap = { from: rd.from, to: rd.to };
    S.reviews[S.allocs.length] = change;
    S.reviewDraft = null;
    // keep the build-screen dashboard in step so a later swap is reflected everywhere
    render();
    var c = $('commit'); if (c) c.focus({ preventScroll: true });
  };
  A.flip = function (el) {
    var id = el.getAttribute('data-ind');
    S.flipped[id] = !S.flipped[id];
    render();
    var next = $((S.flipped[id] ? 'unflip-' : 'flip-') + id);
    if (next) next.focus({ preventScroll: true });
  };
  A.rerun = function () {
    var run = currentRun();
    var sum = ST.SCORE.summary(run);
    S.attempts.push({ dash: runDash(), dashQ: sum.dashQ, finalC: sum.finalC, archetype: sum.archetype });
    S.allocs = []; S.reviews = {}; S.draft = {}; S.mentor = []; S.mentorPick = ''; S.flipped = {}; S.revealed = false; revealPlayed = false;
    go('build');
  };
  A.check = function (el) {
    var f = el.getAttribute('data-field'), c = el.getAttribute('data-crit');
    S.transfer.checks[f] = S.transfer.checks[f] || {};
    S.transfer.checks[f][c] = !S.transfer.checks[f][c];
    render();
  };
  A['copy-results'] = function () {
    var q = Q(), run = currentRun(), sum = ST.SCORE.summary(run), g = ST.ghosts(S.seed, S.quest);
    var lines = ['Signal Tower results' + (S.name ? ' - ' + S.name : ''), 'Quest: ' + q.goal + ' (seed ' + S.seed + ')', 'Vision: ' + q.vision,
      'Title: ' + C.archetypes[sum.archetype].title, 'Real tower: ' + Math.round(sum.finalC) + '/100. Passive ghost ' + Math.round(g.passive.state.C) + ', expert ghost ' + Math.round(g.expert.state.C) + '.',
      'Dashboard quality: ' + sum.dashQ + '/100. Burnouts: ' + sum.burnouts + '.', 'Windows:'];
    [run.dash.lag].concat(run.dash.leads).filter(Boolean).forEach(function (id) {
      var ind = ST.indicator(q, id);
      lines.push('- ' + ind.name + ' [' + KIND_LABEL[ind.kind] + '; P' + ind.ratings[0] + ' C' + ind.ratings[1] + ' T' + ind.ratings[2] + ' H' + ind.ratings[3] + ']: ' + ind.tells);
    });
    lines.push('', ST.SCORE.dataLine(run, g));
    copy(lines.join('\n'));
  };
  A['copy-transfer'] = function () {
    var ch = function (id) { var c = S.transfer.checks[id] || {}; var on = C.transfer.criteria.filter(function (k) { return c[k]; }); return on.length ? ' [' + on.join(', ') + ']' : ''; };
    var lines = ['My dashboard' + (S.name ? ' - ' + S.name : ''),
      'Wider vision: ' + tval('vision'),
      'Goal: ' + tval('goal'),
      'Lagging indicator: ' + tval('lag') + ch('lag') + ', checked ' + tval('lagWhen'),
      'Leading indicator 1: ' + tval('lead1') + ' - ' + tval('lead1N') + ' ' + tval('lead1U') + ' per week' + ch('lead1'),
      'Leading indicator 2: ' + tval('lead2') + ' - ' + tval('lead2N') + ' ' + tval('lead2U') + ' per week' + ch('lead2'),
      'Guardrail: ' + tval('guard') + ch('guard') + '; warning level: ' + tval('guardLevel'),
      'If ' + tval('ifLead') + ' is below ' + tval('ifX') + ' for two weeks, then I will ' + tval('ifThen') + '.',
      'Review day: ' + tval('reviewDay')];
    copy(lines.join('\n'));
  };
  A.print = function () { window.print(); };
  A['reset-ask'] = function () {
    $('reset-wrap').innerHTML = '<span class="row"><span class="small"><b>Erase everything?</b></span><button type="button" class="danger" data-action="reset-yes" id="reset-yes">Yes, reset</button><button type="button" data-action="reset-no" id="reset-no">Cancel</button></span>';
    $('reset-no').focus();
  };
  A['reset-no'] = function () { restoreReset(); $('reset-btn').focus(); };
  A['reset-yes'] = function () { clearSaved(); S = freshState(); lastCommitted = 0; revealPlayed = false; restoreReset(); go('intro'); say('Reset. A fresh session has started.'); };
  function restoreReset() { $('reset-wrap').innerHTML = '<button type="button" class="ghost" data-action="reset-ask" id="reset-btn">Reset</button>'; }
  A['export'] = function () {
    var blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'signal-tower-' + S.seed.replace(/[^A-Za-z0-9-]/g, '') + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    say('Exported.');
  };
  A['import'] = function () { $('import-file').click(); };

  function copy(text) {
    var done = function () { say('Copied to the clipboard.'); };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      say(ok ? 'Copied to the clipboard.' : 'Copy failed: select the text and copy it by hand.');
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  function moveToken(from, to) {
    if (S.screen !== 'season' || pendingReview() || S.allocs.length >= W) return;
    var run = currentRun();
    var ctx = ST.weekContext(run);
    clampDraft(ctx);
    var used = Object.keys(S.draft).reduce(function (s, k) { return s + S.draft[k]; }, 0);
    if (from === to) return;
    if (from === 'pool') { if (used >= ctx.energy) return; }
    else { if (!S.draft[from]) return; S.draft[from]--; }
    if (to !== 'pool') {
      if (to === ctx.blocked) { if (from !== 'pool') S.draft[from]++; return; }
      S.draft[to] = (S.draft[to] || 0) + 1;
      var a = ST.action(Q(), to);
      if (a && a.pop) S.popFlash = to;
    }
    render();
  }

  /* ---- delegated events ------------------------------------------------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    var fn = A[el.getAttribute('data-action')];
    if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener('input', function (e) {
    var el = e.target, b = el.getAttribute && el.getAttribute('data-bind');
    if (!b) return;
    if (b === 'seed') { S.seed = el.value.trim().slice(0, 40) || pickSeed(); save(); $('meta').innerHTML = '<b>Cold open</b><br>Seed <span class="num">' + esc(S.seed) + '</span>'; return; }
    if (b === 'name') { S.name = el.value.slice(0, 80); save(); return; }
    if (b.indexOf('t:') === 0) {
      var id = b.slice(2);
      S.transfer.f[id] = el.value;
      save();
      var f = fieldDef(id);
      var wc = $('wc-' + id);
      if (wc && f) { var n = words(el.value); wc.textContent = n + ' / ' + f.minWords + ' words'; wc.className = 'wc ' + (n >= f.minWords ? 'ok' : 'short'); }
      var st = $('t-status');
      if (st) st.textContent = transferComplete() ? 'Every field is complete.' : 'Fill every field to its minimum word count.';
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target, b = el.getAttribute && el.getAttribute('data-bind');
    if (b === 'swap-from') { S.reviewDraft.from = el.value; S.reviewDraft.to = ''; render(); }
    else if (b === 'swap-to') { S.reviewDraft.to = el.value; render(); }
    else if (b === 'mentor-pick') { S.mentorPick = el.value; render(); }
    else if (el.id === 'import-file' && el.files && el.files[0]) {
      var reader = new FileReader();
      reader.onload = function () {
        var ok = false;
        try { ok = adopt(JSON.parse(reader.result)); } catch (err) { ok = false; }
        if (ok) { go(S.screen); say('Imported.'); } else say('That file is not a Signal Tower export.');
        el.value = '';
      };
      reader.readAsText(el.files[0]);
    }
  });

  /* ---- pointer drag (tokens and sort cards); buttons are the keyboard path */
  var drag = null;
  document.addEventListener('pointerdown', function (e) {
    var src = e.target.closest('[data-drag]');
    if (!src || e.button > 0) return;
    e.preventDefault();
    var r = src.getBoundingClientRect();
    var ghost = src.cloneNode(true);
    ghost.classList.add('ghost-drag');
    ghost.style.width = r.width + 'px';
    ghost.style.left = r.left + 'px'; ghost.style.top = r.top + 'px';
    document.body.appendChild(ghost);
    drag = { src: src.getAttribute('data-drag'), ghost: ghost, dx: e.clientX - r.left, dy: e.clientY - r.top, over: null, moved: false };
  });
  document.addEventListener('pointermove', function (e) {
    if (!drag) return;
    drag.moved = true;
    drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
    drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
    drag.ghost.style.display = 'none';
    var under = document.elementFromPoint(e.clientX, e.clientY);
    drag.ghost.style.display = '';
    var zone = under && under.closest('[data-drop]');
    if (drag.over && drag.over !== zone) drag.over.classList.remove('over');
    if (zone && zone.getAttribute('data-drop')) { zone.classList.add('over'); drag.over = zone; } else drag.over = null;
  });
  function endDrag(e) {
    if (!drag) return;
    var d = drag; drag = null;
    d.ghost.remove();
    if (d.over) d.over.classList.remove('over');
    if (!d.over || !d.moved) return;
    var to = d.over.getAttribute('data-drop');
    if (d.src.indexOf('sort:') === 0 && to.indexOf('bin:') === 0) { S.sort[d.src.slice(5)] = to.slice(4); render(); }
    else if (d.src.indexOf('tok:') === 0) {
      var from = d.src.slice(4);
      var dest = to === 'pool' ? 'pool' : to.indexOf('act:') === 0 ? to.slice(4) : null;
      if (dest) moveToken(from, dest);
    }
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', function () { if (drag) { drag.ghost.remove(); if (drag.over) drag.over.classList.remove('over'); drag = null; } });

  /* ---- ?test=1 ---------------------------------------------------------- */
  function runTests() {
    $('screen').innerHTML = '<section class="screen"><header><h2 id="screen-h" tabindex="-1">Model tests</h2><p class="lede">Running&hellip;</p></header></section>';
    setTimeout(function () {
      var r = ST.selfTest({ seeds: 50 });
      $('screen').innerHTML = '<section class="screen"><header><h2 id="screen-h" tabindex="-1">Model tests</h2>' +
        '<p class="lede" id="test-summary">' + r.passed + ' passed, ' + r.failed + ' failed</p></header><ol class="tests">' +
        r.results.map(function (t) { return '<li class="' + (t.ok ? 'pass' : 'fail') + '"><b>' + (t.ok ? 'pass' : 'FAIL') + '</b> ' + esc(t.name) + ' <span class="small muted">' + esc(t.detail) + '</span></li>'; }).join('') +
        '</ol><p><a href="signal-tower.html">Back to the game</a></p></section>';
    }, 30);
  }

  /* ---- boot ------------------------------------------------------------- */
  if (/[?&]test=1\b/.test(location.search)) { runTests(); return; }
  load();
  if ((S.screen === 'season' || S.screen === 'reveal' || S.screen === 'build' || S.screen === 'brief') && !S.quest) S.screen = 'quest';
  if (S.screen === 'brief' && !S.dash.lag) S.screen = 'build';
  if ((S.screen === 'reveal' || S.screen === 'transfer') && S.allocs.length < W) S.screen = S.quest ? 'season' : 'intro';
  if (S.screen === 'season' && pendingReview() && !S.reviewDraft) S.reviewDraft = { targets: Object.assign({}, currentRun().dash.targets), from: '', to: '' };
  render();
})();
</script>
</body>
