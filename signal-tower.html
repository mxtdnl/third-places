<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Tower</title>
<!--
  Signal Tower - a 10-15 minute single-player simulation about leading and
  lagging indicators. One self-contained file: no build step, no network.

  Scripts
    script#model         CONFIG (all editable content and tuning) and the
                         pure engine ST: RNG, MODEL, OBSERVE, BOTS, SCORE,
                         selfTest. No DOM access; tests/signal-tower.mjs runs
                         it in node.
    script#ui            the screen state machine:
                         intro -> sort -> quest -> build -> brief (how the
                         tower works) -> season -> reveal -> transfer, with
                         rerun returning to build on the same seed.

  Saved state (localStorage key CONFIG.storageKey, and the Export JSON file)
  holds inputs only - seed, quest, dashboard, weekly allocations, review
  changes - and the season is replayed from them, so an export always
  reproduces the same season.

  ?test=1 runs the model suite in the browser.
-->
<style>
/* ===========================================================================
   Signal Tower - Bauhaus in six colours (spec 8.1). Shape carries meaning:
   triangle = leading, circle = lagging, square = action or energy,
   red diagonal bar = disruption. Sentence case throughout.
   =========================================================================== */
:root {
  --ochre: #C9922E;     /* leading indicators (triangles) */
  --purple: #4E2A63;    /* lagging indicators (circles) */
  --brown: #6A4028;     /* actions, effort, tower blocks (squares) */
  --red: #B8322A;       /* events, warnings, burnout, vanity exposed */
  --red-text: #A32A22;  /* red deepened for small text on or in red (AA) */
  --paper: #E6DDC8;     /* ground */
  --card: #F3EEE2;      /* raised paper for cards and panels */
  --ink: #1A1612;       /* text, rules, fog hatching */
  --rule: 4px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: Jost, Futura, "Century Gothic", "Avenir Next", Avenir, "Trebuchet MS", sans-serif;
  font-size: 17px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}
h1, h2, h3, h4 { font-weight: 700; line-height: 1.05; margin: 0; }
h2 { font-size: clamp(1.9rem, 5vw, 3.2rem); letter-spacing: -0.01em; }
h3 { font-size: clamp(1.15rem, 2.4vw, 1.45rem); }
p { margin: 0 0 0.8em; max-width: 64ch; }
a { color: var(--purple); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 0; background: var(--ink); color: var(--paper); padding: 10px 16px; z-index: 50; }
.skip:focus { left: 16px; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; box-shadow: 0 0 0 7px var(--ochre); }
.shell { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }
.muted { opacity: 0.8; }
.small { font-size: 0.86rem; }
.num { font-variant-numeric: tabular-nums; }
.angled { display: inline-block; transform: rotate(-4deg); transform-origin: left bottom; }

/* ---- shapes (inline markers) -------------------------------------------- */
.tri { display: inline-block; width: 0; height: 0; border-left: 0.5em solid transparent; border-right: 0.5em solid transparent; border-bottom: 0.86em solid var(--ochre); vertical-align: -0.05em; }
.cir { display: inline-block; width: 0.9em; height: 0.9em; border-radius: 50%; background: var(--purple); vertical-align: -0.1em; }
.sq { display: inline-block; width: 0.8em; height: 0.8em; background: var(--brown); vertical-align: -0.05em; }
.bar-red { display: inline-block; width: 1.3em; height: 0.35em; background: var(--red); transform: rotate(-25deg); vertical-align: 0.15em; }

/* ---- masthead ----------------------------------------------------------- */
.masthead { position: relative; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; padding: 14px 0 10px; border-bottom: var(--rule) solid var(--ink); }
.masthead h1 { font-size: 1.5rem; }
.masthead h1 .tri { margin-right: 6px; }
.phasebar { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; list-style: none; margin: 0; padding: 0; }
.phasebar li { height: 8px; background: rgba(26,22,18,0.14); }
.phasebar li.done { background: var(--brown); }
.phasebar li.now { background: var(--ochre); outline: 2px solid var(--ink); }
.meta { text-align: right; font-size: 0.86rem; line-height: 1.3; }
.meta b { font-size: 1rem; }

/* ---- buttons ------------------------------------------------------------ */
button, .btn {
  font: inherit; font-weight: 700; letter-spacing: 0.01em;
  background: var(--card); color: var(--ink);
  border: 3px solid var(--ink); border-radius: 0;
  padding: 8px 16px; min-height: 44px; min-width: 44px; cursor: pointer;
  transition: transform 0.12s ease, background-color 0.15s ease, color 0.15s ease;
}
button:hover:not(:disabled), .btn:hover { transform: translateY(-2px); }
button:active:not(:disabled) { transform: translateY(0); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary { background: var(--purple); color: var(--paper); border-color: var(--purple); }
button.primary:hover:not(:disabled) { background: var(--brown); border-color: var(--brown); }
button.go { background: var(--ochre); color: var(--ink); }
button.ghost { background: transparent; }
button.danger { background: var(--red-text); color: var(--paper); border-color: var(--red-text); }
button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
label { font-weight: 700; display: block; margin-bottom: 4px; }
input[type="text"], input[type="number"], select, textarea {
  font: inherit; color: var(--ink); background: var(--card);
  border: 3px solid var(--ink); border-radius: 0; padding: 8px 10px; min-height: 44px; width: 100%;
}

/* ---- screens ------------------------------------------------------------ */
.screen { padding-top: 22px; }
.screen > header { position: relative; margin-bottom: 18px; padding-top: 18px; }
.screen > header h2 { outline: none; }
.lede { font-size: 1.12rem; max-width: 60ch; }
.panel { background: var(--card); border: 3px solid var(--ink); padding: 16px; position: relative; }
.eyebrow { font-weight: 700; font-size: 0.86rem; letter-spacing: 0.04em; margin-bottom: 4px; }
.band { height: 10px; background: var(--ink); margin: 26px 0; position: relative; }
.band::after { content: ''; position: absolute; left: 12%; top: -8px; width: 26px; height: 26px; background: var(--ochre); transform: rotate(18deg); }

/* ---- intro -------------------------------------------------------------- */
.intro-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 28px; align-items: center; }
.intro-grid .tower-wrap { max-width: 380px; }
.poster-line { font-size: clamp(1.7rem, 4.4vw, 2.9rem); font-weight: 700; line-height: 1.08; margin: 0 0 18px; transform: rotate(-3deg); transform-origin: left; max-width: 16ch; }
.poster-line span { background: var(--ink); color: var(--paper); padding: 0 0.15em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.setup { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 560px; margin: 14px 0 18px; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; margin: 10px 0 18px; font-size: 0.95rem; }

/* ---- sort --------------------------------------------------------------- */
.bins { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
.bin { border: 3px dashed var(--ink); padding: 14px; min-height: 96px; display: grid; grid-template-columns: 70px 1fr; gap: 12px; align-items: center; background: rgba(243,238,226,0.6); }
.bin.over { background: var(--card); border-style: solid; }
.bin .big-tri { width: 0; height: 0; border-left: 34px solid transparent; border-right: 34px solid transparent; border-bottom: 60px solid var(--ochre); }
.bin .big-cir { width: 64px; height: 64px; border-radius: 50%; background: var(--purple); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.scard { background: var(--card); border: 3px solid var(--ink); padding: 12px; display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; }
.scard .grip { cursor: grab; touch-action: none; font-weight: 700; user-select: none; }
.scard .fb { font-size: 0.92rem; border-left: 6px solid var(--brown); padding-left: 8px; }
.scard.trap .fb { border-left-color: var(--red); }
.scard.trap::after { content: ''; position: absolute; right: -16px; top: 10px; width: 90px; height: 10px; background: var(--red); transform: rotate(35deg); pointer-events: none; }
.scard.placed-lead { border-left: 10px solid var(--ochre); }
.scard.placed-lag { border-left: 10px solid var(--purple); }

/* ---- quest -------------------------------------------------------------- */
.quests { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.qcard { text-align: left; display: flex; flex-direction: column; gap: 8px; padding: 18px; min-height: 190px; position: relative; overflow: hidden; }
.qcard .qgoal { font-size: 1.35rem; line-height: 1.1; }
.qcard .qname { font-size: 0.9rem; }
.qcard::after { content: ''; position: absolute; right: -24px; bottom: -24px; width: 90px; height: 90px; background: var(--c, var(--ochre)); transform: rotate(20deg); opacity: 0.9; }
.qcard:nth-child(2)::after { border-radius: 50%; }
.qcard:nth-child(3)::after { background: transparent; width: 0; height: 0; border-left: 50px solid transparent; border-right: 50px solid transparent; border-bottom: 86px solid var(--c); transform: rotate(-12deg); }
.qcard span { position: relative; z-index: 1; font-weight: 500; }
.qcard .qgoal { font-weight: 700; }

/* ---- build -------------------------------------------------------------- */
.dashframe { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; margin-bottom: 18px; }
.slot { border: 3px dashed var(--ink); padding: 12px; min-height: 150px; display: flex; flex-direction: column; gap: 8px; background: rgba(243,238,226,0.6); }
.slot.filled { border-style: solid; background: var(--card); }
.slot.lag.filled { border-color: var(--purple); border-width: 4px; }
.slot.lead.filled { border-color: var(--ochre); border-width: 4px; }
.slot .sname { font-weight: 700; line-height: 1.2; }
.stepper { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.stepper button { padding: 4px 0; width: 44px; }
.stepper output { min-width: 3.2ch; text-align: center; font-weight: 700; font-size: 1.15rem; }
.deck-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin: 12px 0 10px; }
.deck { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.icard { background: var(--card); border: 3px solid var(--ink); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.icard.side-lag { border-top: 10px solid var(--purple); }
.icard.side-lead { border-top: 10px solid var(--ochre); }
.icard.chosen { outline: 3px solid var(--brown); outline-offset: -8px; }
.icard .iname { font-weight: 700; line-height: 1.2; }
.icard .imeta { font-size: 0.86rem; }
.pips { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 0.86rem; align-items: center; }
.pips .p { display: inline-flex; gap: 3px; }
.pip { width: 12px; height: 12px; display: inline-block; border: 2px solid var(--ink); }
.pip.cir { border-radius: 50%; }
.pip.on { background: var(--ink); }
.pip.tri { border: 0; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 12px solid rgba(26,22,18,0.2); background: none; }
.pip.tri.on { border-bottom-color: var(--ink); }
.mentor { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
.mentor .tok { width: 22px; height: 22px; background: var(--purple); border-radius: 50%; }
.mentor .tok.used { background: transparent; border: 3px solid var(--purple); }
.note { border-left: 8px solid var(--ochre); padding: 8px 12px; background: var(--card); margin: 12px 0; }
.mentor-box { border-top: 3px solid var(--ink); margin-top: 14px; padding-top: 10px; }
.mentor-box .rated { border-left: 6px solid var(--purple); padding: 6px 10px; margin: 8px 0; background: var(--paper); }

/* ---- vision ladder (build) ---------------------------------------------- */
.ladder { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; margin-bottom: 14px; border: 3px solid var(--ink); }
.rung { padding: 12px 16px; position: relative; }
.rung .eyebrow { margin-bottom: 2px; }
.rung.vision { grid-column: 1 / -1; background: var(--purple); color: var(--paper); overflow: hidden; }
.rung.vision::after { content: ''; position: absolute; right: -18px; top: -18px; width: 70px; height: 70px; border-radius: 50%; border: 10px solid var(--ochre); pointer-events: none; }
.rung.vision .vtext { font-size: 1.2rem; font-weight: 700; line-height: 1.2; max-width: 52ch; position: relative; }
.rung.goal { grid-column: 1 / -1; background: var(--ochre); color: var(--ink); border-top: 3px solid var(--ink); }
.rung.goal .gtext { font-size: 1.1rem; font-weight: 700; }
.rung.how { background: var(--card); border-top: 3px solid var(--ink); font-size: 0.95rem; }
.rung.how + .rung.how { border-left: 3px solid var(--ink); }
.rung .arrow { font-weight: 700; }

/* ---- brief: how the tower works ----------------------------------------- */
.brief { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 22px; align-items: start; }
.brief .tower-panel svg { max-height: 460px; }
.rules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; list-style: none; margin: 0; padding: 0; counter-reset: rule; }
.rules li { background: var(--card); border: 3px solid var(--ink); padding: 10px 12px 10px 14px; position: relative; counter-increment: rule; }
.rules li::before { content: counter(rule); position: absolute; top: -3px; right: -3px; background: var(--ink); color: var(--paper); font-weight: 700; font-size: 0.8rem; padding: 2px 7px; }
.rules li h3 { font-size: 1.05rem; margin: 0 26px 4px 0; display: flex; gap: 8px; align-items: center; }
.rules li p { margin: 0; font-size: 0.95rem; }
.rules li.r-tower { border-left: 10px solid var(--brown); }
.rules li.r-lead { border-left: 10px solid var(--ochre); }
.rules li.r-lag { border-left: 10px solid var(--purple); }
.rules li.r-energy { border-left: 10px solid var(--brown); }
.rules li.r-fatigue { border-left: 10px solid var(--red); }
.rules li.r-review { border-left: 10px solid var(--purple); }
.timeline { margin-top: 16px; }
.timeline .weeks span.cp { background: var(--purple); color: var(--paper); border-color: var(--purple); }
.timeline .weeks span.end { background: var(--ink); color: var(--paper); }
.note.warn { border-left-color: var(--red); }

/* ---- season ------------------------------------------------------------- */
.season { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 6fr); grid-template-areas: "tower dash" "tower energy" "strip strip"; gap: 14px; }
.season .tower-panel { grid-area: tower; }
.season .dash-panel { grid-area: dash; }
.season .energy-panel { grid-area: energy; }
.season .strip { grid-area: strip; }
.tower-panel { padding: 8px; background: var(--card); border: 3px solid var(--ink); display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.tower-key { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.84rem; padding: 4px 6px 2px; border-top: 3px solid var(--ink); }
.tower-key .hatch { display: inline-block; width: 16px; height: 12px; vertical-align: -1px; background: repeating-linear-gradient(45deg, var(--ink) 0 2px, var(--paper) 2px 5px); }
.tower-key .strain { display: inline-block; width: 16px; height: 12px; vertical-align: -1px; background: repeating-linear-gradient(-60deg, var(--red) 0 3px, var(--card) 3px 7px); }
.tower-panel svg { width: 100%; height: auto; display: block; max-height: 560px; }
.lead-row { display: grid; grid-template-columns: 22px minmax(0, 1.4fr) 150px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 0; border-bottom: 2px solid rgba(26,22,18,0.15); }
.lead-row:last-child { border-bottom: 0; }
.lead-row .val { font-weight: 700; font-size: 1.15rem; }
.lead-row .tgt { font-size: 0.84rem; }
.metpip { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--ink); margin-right: 5px; vertical-align: -1px; }
.metpip.on { background: var(--ink); }
.spark { width: 150px; height: 42px; display: block; }
.lag-row { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; padding-top: 10px; margin-top: 6px; border-top: 3px solid var(--ink); }
.iris { width: 70px; height: 70px; }
.iris .blade { transition: transform 0.5s ease; transform-origin: 35px 35px; }
.energy-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.pool { display: flex; flex-wrap: wrap; gap: 5px; min-height: 30px; padding: 6px; border: 3px dashed var(--brown); }
.pool.over { background: rgba(106,64,40,0.12); }
.token { width: 22px; height: 22px; background: var(--brown); display: inline-block; touch-action: none; cursor: grab; }
.token.pop-burst { animation: burst 0.5s ease; }
@keyframes burst { 0% { transform: scale(1); } 40% { transform: scale(1.35) rotate(20deg); background: var(--ochre); } 100% { transform: scale(1); } }
.act { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 6px; border: 2px solid transparent; }
.act.over { border-color: var(--brown); background: rgba(106,64,40,0.08); }
.act .aname { font-weight: 700; line-height: 1.2; }
.act .atoks { display: flex; flex-wrap: wrap; gap: 4px; min-height: 22px; margin-top: 4px; }
.act.blocked { position: relative; opacity: 0.6; }
.act.blocked::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 6px; background: var(--red); transform: rotate(-3deg); pointer-events: none; }
.act.rest .token { background: var(--paper); border: 3px solid var(--brown); }
.strip { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: 14px; align-items: stretch; }
.weeks { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; align-self: center; }
.weeks span { height: 34px; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; }
.weeks span.done { background: var(--brown); color: var(--paper); border-color: var(--brown); }
.weeks span.now { background: var(--ochre); }
.weeks span.cp { border-radius: 50%; }
.ev { border: 3px solid var(--ink); padding: 10px 14px; background: var(--card); position: relative; overflow: hidden; }
.ev h4 { font-size: 1.05rem; margin-bottom: 2px; }
.ev.bad { background: var(--red-text); color: var(--paper); border-color: var(--red-text); }
.ev.bad::after { content: ''; position: absolute; right: -10px; top: 12px; width: 80px; height: 10px; background: var(--paper); transform: rotate(-30deg); opacity: 0.85; }
.ev.bad .bar-red { background: var(--paper); }
.ev.good { border-left: 12px solid var(--ochre); }
.ev + .ev { margin-top: 8px; }
.commit { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.review { border: 4px solid var(--purple); }
.review .rhead { background: var(--purple); color: var(--paper); margin: -16px -16px 12px; padding: 12px 16px; }
.new-block { animation: drop 0.45s cubic-bezier(.3,1.4,.6,1); transform-box: fill-box; }
@keyframes drop { from { transform: translateY(-40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ---- reveal ------------------------------------------------------------- */
.arch { background: var(--purple); color: var(--paper); padding: 22px 24px; position: relative; overflow: hidden; margin-bottom: 18px; }
.arch h2 { transform: rotate(-3deg); transform-origin: left; display: inline-block; }
.arch p { margin: 12px 0 0; font-size: 1.08rem; }
.arch::after { content: ''; position: absolute; right: 30px; top: -30px; width: 140px; height: 140px; border-radius: 50%; border: 14px solid var(--ochre); }
.reveal-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.stat { border: 3px solid var(--ink); padding: 10px 12px; background: var(--card); }
.stat b { display: block; font-size: 1.7rem; line-height: 1.1; }
.stat.you { border-color: var(--brown); border-left-width: 12px; }
.chart { width: 100%; height: auto; display: block; }
.mults { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.mult { border: 3px solid var(--ink); background: var(--card); padding: 10px; }
.mult.vanity, .mult.badlag { border-color: var(--red-text); }
.flips { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.flip { perspective: 900px; min-height: 250px; }
.flip-inner { position: relative; width: 100%; height: 100%; min-height: 250px; transition: transform 0.6s ease; transform-style: preserve-3d; }
.flip.flipped .flip-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 3px solid var(--ink); background: var(--card); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.face.back { transform: rotateY(180deg); }
.face.back.k-vanity, .face.back.k-badlag { border-color: var(--red-text); border-width: 4px; }
.kind { font-weight: 700; font-size: 0.9rem; padding: 2px 8px; align-self: flex-start; }
.kind.k-lead, .kind.k-guardrail { background: var(--ochre); color: var(--ink); }
.kind.k-lag { background: var(--purple); color: var(--paper); }
.kind.k-vanity, .kind.k-badlag { background: var(--red-text); color: var(--paper); }
.kind.k-weak { background: var(--brown); color: var(--paper); }
.dataline { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.82rem; background: var(--ink); color: var(--paper); padding: 10px 12px; overflow-wrap: anywhere; }
table.attempts { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
table.attempts th, table.attempts td { text-align: left; padding: 6px 8px; border-bottom: 2px solid rgba(26,22,18,0.2); }
.fog-band { animation: fogout 0.7s ease forwards; }
@keyframes fogout { to { opacity: 0; transform: translateY(-14px); } }
.painted-fall { animation: fall 1.1s ease-in forwards; transform-box: fill-box; transform-origin: center; }
@keyframes fall { 0% { transform: none; } 30% { transform: rotate(-4deg); } 100% { transform: translateY(160px) rotate(14deg); opacity: 0; } }
.stand { animation: stand 0.8s ease; transform-box: fill-box; transform-origin: bottom; }
@keyframes stand { from { transform: scaleY(0.92); } to { transform: none; } }

/* ---- transfer ----------------------------------------------------------- */
.tcard { background: var(--card); border: 4px solid var(--ink); padding: 18px; position: relative; overflow: hidden; }
.tcard::before { content: ''; position: absolute; right: -40px; top: -40px; width: 130px; height: 130px; background: var(--ochre); transform: rotate(24deg); opacity: 0.9; }
.tcard > * { position: relative; }
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
.tfield { display: flex; flex-direction: column; gap: 4px; }
.tfield.wide { grid-column: 1 / -1; }
.tfield .hint { font-size: 0.84rem; }
.wc { font-size: 0.8rem; font-weight: 700; }
.wc.ok { color: var(--brown); }
.wc.short { color: var(--red-text); }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks button { min-height: 44px; padding: 4px 10px; font-size: 0.86rem; }
.sharpen { display: grid; grid-template-columns: minmax(0, 2fr) 90px minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.rule-line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rule-line input { width: auto; flex: 1 1 140px; }
.print-only { display: none; }

/* ---- footer ------------------------------------------------------------- */
.foot { border-top: var(--rule) solid var(--ink); margin-top: 36px; padding-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.status { min-height: 1.5em; font-weight: 700; }
.tests li { margin: 4px 0; }
.tests .fail { color: var(--red-text); font-weight: 700; }

/* ---- drag ghost --------------------------------------------------------- */
.ghost-drag { position: fixed; pointer-events: none; z-index: 100; opacity: 0.9; }

/* ---- responsive --------------------------------------------------------- */
@media (max-width: 900px) {
  .season { grid-template-columns: 1fr; grid-template-areas: "tower" "dash" "energy" "strip"; }
  .tower-panel svg { max-height: 240px; }
  .strip { grid-template-columns: 1fr; }
  .dashframe { grid-template-columns: 1fr 1fr; }
  .reveal-grid { grid-template-columns: 1fr; }
  .intro-grid { grid-template-columns: 1fr; }
  .intro-grid .tower-wrap { max-width: 260px; }
  .brief { grid-template-columns: 1fr; }
  .brief .tower-panel svg { max-height: 240px; }
}
@media (max-width: 600px) {
  body { font-size: 16px; }
  .masthead { grid-template-columns: 1fr auto; }
  .masthead .phasebar { grid-column: 1 / -1; grid-row: 2; }
  .setup, .bins, .tgrid, .rules, .ladder { grid-template-columns: 1fr; }
  .rung.how + .rung.how { border-left: 0; }
  .dashframe { grid-template-columns: 1fr; }
  .lead-row { grid-template-columns: 22px minmax(0, 1fr) minmax(0, 1fr); }
  .lead-row .spark-cell { grid-column: 2 / -1; grid-row: 2; }
  .bin { grid-template-columns: 50px 1fr; }
  .sharpen { grid-template-columns: 1fr 80px; }
  .weeks span { height: 28px; font-size: 0.7rem; }
}

/* ---- reduced motion ----------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  button:hover:not(:disabled), .btn:hover { transform: none; }
  .fog-band { opacity: 0; }
  .painted-fall { opacity: 0; }
}

/* ---- print (A4) --------------------------------------------------------- */
@media print {
  @page { size: A4; margin: 14mm; }
  body { background: #FFFFFF; font-size: 11pt; }
  .masthead .phasebar, .foot, .skip, button, .no-print, .ghost-drag { display: none !important; }
  .panel, .tcard, .stat, .mult, .face, .icard { background: #FFFFFF; box-shadow: none; }
  .print-only { display: block; }
  .tfield .hint, .wc, .checks { display: none !important; }
  input::placeholder { color: transparent; }
  .tcard { border-width: 3px; page-break-inside: avoid; }
  input[type="text"], input[type="number"] { border: 0; border-bottom: 1.5px solid #000; background: #FFFFFF; padding: 2px 0; min-height: 0; }
  .flip .flip-inner { transform: none !important; }
  .flip .face.front { display: none; }
  .flip .face.back { position: static; transform: none; }
  .flip, .flip-inner { min-height: 0; }
  .arch, .kind, .dataline, .tcard::before, .rung.vision, .rung.goal, .tri, .cir, .sq, .pip, .metpip, .weeks span, .token, svg { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .fog-band, .painted-fall { animation: none; }
}
</style>

/* ==========================================================================
   Engine. Nothing below touches the DOM: tests/signal-tower.mjs evaluates
   this script in node and the page runs the same code at ?test=1.
   ======================================================================== */
const ST = (function () {
  const M = CONFIG.model;
  const W = CONFIG.weeks;

  /* ---- RNG: seeded mulberry32 ----------------------------------------- */
  function hashStr(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995) >>> 0; h ^= h >>> 15;
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Separate streams: events come from the seed alone; measurement noise is
  // keyed by seed + indicator + week, so the dashboard never changes events.
  function unit(seed, key, week) { return mulberry32(hashStr(seed + '|' + key + '|' + week))(); }
  function gauss(seed, key, week) {
    const r = mulberry32(hashStr(seed + '|n|' + key + '|' + week));
    const u = Math.max(r(), 1e-9), v = r();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  const RNG = { hashStr: hashStr, mulberry32: mulberry32, unit: unit, gauss: gauss };

  /* ---- content lookups ------------------------------------------------ */
  function quest(id) { return CONFIG.quests.find(function (q) { return q.id === id; }); }
  function action(q, id) { return q.actions.find(function (a) { return a.id === id; }); }
  function indicator(q, id) { return q.indicators.find(function (i) { return i.id === id; }); }
  function eventDef(id) { return CONFIG.events.find(function (e) { return e.id === id; }); }
  function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
  function round(x, dp) { const k = Math.pow(10, dp || 0); return Math.round(x * k) / k; }

  /* ---- event schedule (seed only) -------------------------------------- */
  function schedule(seed) {
    const r = mulberry32(hashStr(seed + '|events'));
    const deck = CONFIG.events;
    const total = deck.reduce(function (s, e) { return s + e.weight; }, 0);
    const out = [];
    let plateauAt = 0;
    for (let w = 1; w <= W; w++) {
      const roll = r(), pick = r() * total;
      let id = 'none';
      if (roll < M.eventChance) {
        let acc = 0;
        for (let i = 0; i < deck.length; i++) { acc += deck[i].weight; if (pick < acc) { id = deck[i].id; break; } }
      }
      // one plateau per season, starting in a week that is not a checkpoint
      // and early enough for its effect to show before the season ends
      if (id === 'plateau' && (plateauAt || CONFIG.checkpoints.indexOf(w) >= 0 || w < 2 || w > W - 2)) id = 'none';
      if (id === 'plateau') plateauAt = w;
      out.push(id);
    }
    if (!plateauAt) {
      const options = [4, 5];
      plateauAt = options[Math.floor(r() * options.length)];
      out[plateauAt - 1] = 'plateau';
    }
    return { events: out, plateauAt: plateauAt };
  }

  /* ---- MODEL ---------------------------------------------------------- */
  function initState(q) {
    const acc = {};
    q.indicators.forEach(function (ind) { if (ind.read.t === 'acc') acc[ind.id] = 0; });
    return { week: 0, C: M.start.C, H: M.start.H, F: M.start.F, Chist: [M.start.C], acc: acc,
      burnoutLast: false, injuryLast: false, burnouts: 0, injuries: 0 };
  }

  // Which actions feed an indicator (token terms, multiplier and precondition).
  function feeds(ind) {
    const out = [];
    const rd = ind.read;
    if (rd.tok) Object.keys(rd.tok).forEach(function (k) { out.push(k); });
    if (rd.mul) out.push(rd.mul);
    if (ind.requires) out.push(ind.requires.action);
    return out;
  }

  function energyFor(state, eventId, pendingCost) {
    const ev = eventDef(eventId) || {};
    let E = M.baseEnergy + (ev.energy || 0);
    if (state.burnoutLast) E -= M.burnoutEnergy;
    if (state.injuryLast) E -= (state.injuryEnergy || 0);
    E -= pendingCost || 0;
    return Math.max(M.minEnergy, E);
  }

  function sat(n) { return Math.min(n, M.saturation) + 0.5 * Math.max(0, n - M.saturation); }

  // Effective (pre-multiplier) effort per action for an allocation.
  function efforts(q, alloc, ctx) {
    const out = {};
    q.actions.forEach(function (a) {
      if (a.rest) return;
      const n = alloc[a.id] || 0;
      let eff = sat(n) * a.e;
      if (ctx.attended && ctx.attended[a.id]) eff *= M.attention;
      if (a.synergy && n >= a.synergy.min && (alloc[a.synergy.partner] || 0) >= a.synergy.min) eff *= a.synergy.mult;
      if (ctx.boost && a.id === q.feedback) eff *= ctx.boost;
      out[a.id] = eff;
    });
    return out;
  }

  function attendedSet(q, dash) {
    const set = {};
    (dash.leads || []).forEach(function (id) {
      const ind = indicator(q, id);
      if (ind && dash.targets && dash.targets[id] !== undefined) feeds(ind).forEach(function (a) { set[a] = true; });
    });
    return set;
  }

  // Clean an allocation: integers, no blocked action, total within energy.
  function sanitise(q, alloc, energy, blocked) {
    const out = {};
    let left = energy;
    q.actions.forEach(function (a) {
      let n = Math.max(0, Math.floor(alloc[a.id] || 0));
      if (a.id === blocked) n = 0;
      n = Math.min(n, left);
      left -= n;
      out[a.id] = n;
    });
    return out;
  }

  /* step(q, state, alloc, ctx) -> { state, log }  (pure: state is copied) */
  function step(q, state, alloc, ctx) {
    const ev = eventDef(ctx.event) || {};
    const s = { week: state.week + 1, C: state.C, H: state.H, F: state.F, Chist: state.Chist.slice(),
      acc: Object.assign({}, state.acc), burnoutLast: false, injuryLast: false, injuryEnergy: 0,
      burnouts: state.burnouts, injuries: state.injuries };
    const blocked = ev.block ? q.strongest : null;
    const a = sanitise(q, alloc, ctx.energy, blocked);
    const eff = efforts(q, a, { attended: ctx.attended, boost: ev.boost });
    let sum = 0, productive = 0, fat = 0, rest = 0;
    q.actions.forEach(function (act) {
      const n = a[act.id];
      if (act.rest) { rest += n; return; }
      sum += eff[act.id];
      if (act.e >= M.productiveE) productive += n;
      fat += n * act.f;
    });
    const plateau = ctx.plateau ? M.plateauMult : 1;
    const gain = sum * (1 + M.habitGain * state.H) * (1 - state.F) * (1 - state.C / M.capacity) * M.gainScale * plateau;
    const decay = productive < 3 ? M.decay : 0;
    s.C = clamp(state.C + gain - decay, 0, 100);

    // injury risk (running): speed work on tired legs
    let injury = false;
    q.actions.forEach(function (act) {
      const rk = act.risk;
      if (!rk || !a[act.id] || state.F <= rk.overF) return;
      const p = Math.max(0, rk.p - rk.per * (a[rk.guard] || 0));
      if (unit(ctx.seed, 'injury', s.week) < p) {
        injury = true; s.C = clamp(s.C - rk.cLoss, 0, 100); s.injuryLast = true; s.injuryEnergy = rk.energy; s.injuries++;
      }
    });

    s.F = clamp(state.F + M.fatigueScale * fat + (ev.fatigue || 0) - M.fatigueRecover - M.restRecover * rest, 0, 1);
    let burnout = false;
    if (s.F > M.burnoutAt) { burnout = true; s.burnouts++; s.burnoutLast = true; s.F = clamp(s.F - M.burnoutCrash, 0, 1); }

    // accumulating indicators (followers, streaks, connection counts)
    q.indicators.forEach(function (ind) {
      const rd = ind.read;
      if (rd.t !== 'acc') return;
      let inc = rd.base || 0;
      Object.keys(rd.tok || {}).forEach(function (k) {
        let n = a[k] || 0;
        if (ev.shiny && k === q.shiny) n *= ev.shiny;
        inc += rd.tok[k] * n;
      });
      if (rd.cap) inc = Math.min(inc, rd.cap.perWeek);
      if (rd.noise) inc += rd.noise * gauss(ctx.seed, 'walk:' + ind.id, s.week);
      s.acc[ind.id] = s.acc[ind.id] + inc;
    });

    const readings = {};
    q.indicators.forEach(function (ind) { readings[ind.id] = OBSERVE.read(q, ind, s, a, ev, ctx.seed); });

    // habit: every tracked lead target met this week
    const tracked = (ctx.dash && ctx.dash.leads) || [];
    const met = {};
    let allMet = tracked.length > 0;
    tracked.forEach(function (id) {
      const ind = indicator(q, id);
      const r = readings[id], t = ctx.dash.targets[id];
      const ok = r !== null && r !== undefined && t !== undefined && (ind.better === 'down' ? r <= t : r >= t);
      met[id] = ok;
      if (!ok) allMet = false;
    });
    s.H = clamp(state.H + (allMet ? M.habitUp : -M.habitDown), 0, 1);

    return { state: s, log: { week: s.week, alloc: a, event: ctx.event, energy: ctx.energy, blocked: blocked,
      plateau: !!ctx.plateau, gain: gain, decay: decay, C: s.C, F: s.F, H: s.H, burnout: burnout, injury: injury,
      readings: readings, met: met, allMet: allMet } };

  /* ---- OBSERVE -------------------------------------------------------- */
  const OBSERVE = {
    due: function (ind, week) {
      if (ind.cadence === 'w') return true;
      if (ind.cadence === 'end') return week === W;
      return CONFIG.checkpoints.indexOf(week) >= 0;
    },
    // Returns a number, null (no data this week) or undefined (not due).
    read: function (q, ind, s, a, ev, seed) {
      if (!OBSERVE.due(ind, s.week)) return undefined;
      if (ind.requires && (a[ind.requires.action] || 0) < ind.requires.min) return null;
      const rd = ind.read;
      const z = gauss(seed, ind.id, s.week);
      const flatter = ind.kind === 'vanity' || ind.kind === 'badlag';
      let v;
      if (rd.t === 'steps') {
        const c = s.C + (rd.noise || 0) * z;
        v = rd.steps.filter(function (x) { return c >= x; }).length;
        return v;
      }
      if (rd.t === 'acc') {
        v = (rd.start || 0) + s.acc[ind.id];
      } else {
        const Ct = s.Chist[Math.max(0, s.Chist.length - 1 - (rd.lag || 0))];
        v = (rd.a || 0) + (rd.C || 0) * Ct + (rd.F || 0) * (1 - s.F);
        Object.keys(rd.tok || {}).forEach(function (k) {
          let n = a[k] || 0;
          if (flatter && ev.shiny && k === q.shiny) n *= ev.shiny;
          v += rd.tok[k] * n;
        });
        if (rd.mul) v *= (a[rd.mul] || 0);
        v += (rd.noise || 0) * z;
        if (rd.scale) v *= rd.scale;
      }
      if (rd.min !== undefined) v = Math.max(rd.min, v);
      if (rd.max !== undefined) v = Math.min(rd.max, v);
      return round(v, rd.dp || 0);
    },
    // Everything the player may see: chosen indicators' readings plus the
    // visible event. Fatigue only appears through a chosen guardrail.
    view: function (run) {
      const ids = [run.dash.lag].concat(run.dash.leads).filter(Boolean);
      return run.log.map(function (l) {
        const r = {};
        ids.forEach(function (id) { if (l.readings[id] !== undefined) r[id] = l.readings[id]; });
        return { week: l.week, event: l.event === 'plateau' ? 'none' : l.event, burnout: l.burnout, injury: l.injury, readings: r, met: l.met };
      });
    }
  };

  /* ---- run: a season in progress -------------------------------------- */
  function newRun(seed, questId, dash) {
    const q = quest(questId);
    const sch = schedule(seed);
    return { seed: seed, quest: questId, events: sch.events, plateauAt: sch.plateauAt,
      dash: { lag: dash.lag || null, leads: (dash.leads || []).slice(), targets: Object.assign({}, dash.targets || {}) },
      state: initState(q), log: [], pendingCost: 0, swaps: [] };
  }
  function weekContext(run) {
    const q = quest(run.quest);

    const ev = run.events[week - 1];
    const def = eventDef(ev) || {};
    return { week: week, event: ev, energy: energyFor(run.state, ev, run.pendingCost),
      blocked: def.block ? q.strongest : null, boost: def.boost ? q.feedback : null,
      plateau: run.plateauAt && (week === run.plateauAt || week === run.plateauAt + M.plateauWeeks - 1) };
  }
  function playWeek(run, alloc) {
    const q = quest(run.quest);
    const c = weekContext(run);
    const res = step(q, run.state, alloc, { seed: run.seed, event: c.event, energy: c.energy, plateau: c.plateau,
      attended: attendedSet(q, run.dash), dash: run.dash });
    res.log.dash = { lag: run.dash.lag, leads: run.dash.leads.slice(), targets: Object.assign({}, run.dash.targets) };
    run.state = res.state;
    run.log.push(res.log);
    run.pendingCost = 0;
    return res.log;
  }
  // Review stop: new targets, and optionally swap one indicator (costs energy).
  function review(run, change) {
    if (change.targets) Object.assign(run.dash.targets, change.targets);
    if (change.swap && change.swap.from && change.swap.to && change.swap.from !== change.swap.to) {
      const q = quest(run.quest);
      const to = indicator(q, change.swap.to);
      if (run.dash.lag === change.swap.from && to.side === 'lag') run.dash.lag = to.id;
      else {
        const i = run.dash.leads.indexOf(change.swap.from);
        if (i >= 0 && to.side === 'lead') {
          run.dash.leads[i] = to.id;
          delete run.dash.targets[change.swap.from];
          if (run.dash.targets[to.id] === undefined) run.dash.targets[to.id] = to.target.def;
        }
      }
      run.swaps.push({ week: run.state.week, from: change.swap.from, to: change.swap.to });
      run.pendingCost = M.swapCost;
    }
  }
  // Replays a saved season from its inputs only: seed, quest, dashboard,
  // allocations and review changes. Used for autosave and import.
  function replay(save) {
    const run = newRun(save.seed, save.quest, save.dash);
    (save.allocs || []).forEach(function (al, i) {
      playWeek(run, al);
      const rv = (save.reviews || {})[i + 1];
      if (rv) review(run, rv);
    });
    return run;
  }

  /* ---- BOTS and calibration policies ---------------------------------- */
  function lastReading(run, id) {
    for (let i = run.log.length - 1; i >= 0; i--) {
      const v = run.log[i].readings[id];
      if (v !== undefined && v !== null) return v;
    }
    return undefined;
  }
  // Fatigue estimate from a fatigue-reading guardrail (invert a + F(1 - F)).
  function fatigueEstimate(run, q) {
    const g = run.dash.leads.map(function (id) { return indicator(q, id); })
      .find(function (ind) { return ind.kind === 'guardrail' && ind.read.F; });
    if (!g) return null;
    const r = lastReading(run, g.id);
    if (r === undefined) return M.start.F;
    return clamp(1 - (r - (g.read.a || 0)) / g.read.F, 0, 1);
  }
  function tokensForTarget(q, ind, target) {
    const rd = ind.read;
    if (rd.t !== 'lin' || !rd.tok || rd.C || rd.F) {
      return ind.requires ? { action: ind.requires.action, n: ind.requires.min } : null;
    }
    const k = Object.keys(rd.tok)[0];
    return { action: k, n: Math.ceil(target / rd.tok[k] - 1e-9) };
  }
  function totalEff(q, alloc, ctx) {
    const e = efforts(q, alloc, ctx);
    return Object.keys(e).reduce(function (s, k) { return s + e[k]; }, 0);
  }
  function fatigueOf(q, alloc) {
    return q.actions.reduce(function (s, a) { return s + (a.rest ? 0 : (alloc[a.id] || 0) * a.f); }, 0);
  }
  // Greedy fill: meet tracked token targets first, then add each token where
  // it buys the most effort net of a fatigue shadow price (mu).
  function greedy(q, run, n, blocked, mu, extra) {
    const alloc = {};
    q.actions.forEach(function (a) { alloc[a.id] = 0; });
    const ctx = { attended: attendedSet(q, run.dash) };
    let left = n;
    run.dash.leads.forEach(function (id) {
      const ind = indicator(q, id);
      const need = tokensForTarget(q, ind, run.dash.targets[id]);
      if (!need || need.action === 'rest' || need.action === blocked) return;
      const act = action(q, need.action);
      if (act.e < M.productiveE && !extra) return;
      const add = Math.max(0, Math.min(left, need.n - alloc[need.action]));
      alloc[need.action] += add; left -= add;
    });
    while (left > 0) {
      let best = null, bv = -Infinity;
      const base = totalEff(q, alloc, ctx);
      q.actions.forEach(function (a) {
        if (a.rest || a.id === blocked) return;
        alloc[a.id]++;
        const v = totalEff(q, alloc, ctx) - base - mu * M.fatigueScale * a.f;
        alloc[a.id]--;
        if (v > bv) { bv = v; best = a.id; }
      });
      alloc[best]++; left--;
    }
    return alloc;
  }
  const BOTS = {
    // 2 tokens on each of the five levers, no dashboard.
    passive: function (run, c) {
      const q = quest(run.quest);
      const levers = q.actions.filter(function (a) { return !a.rest; });
      const alloc = {};
      let left = c.energy;
      for (let round = 0; round < 2; round++) {
        levers.forEach(function (a) { if (left > 0 && a.id !== c.blocked) { alloc[a.id] = (alloc[a.id] || 0) + 1; left--; } });
      }
      return alloc;
    },
    // Best dashboard; greedy toward high-e leads; rests to hold fatigue down
    // as read through its guardrail.
    expert: function (run, c) {
      const q = quest(run.quest);
      const Fe = fatigueEstimate(run, q);
      const F0 = Fe === null ? run.state.F : Fe;
      const evF = (eventDef(c.event) || {}).fatigue || 0;
      let pick = null;
      for (let r = 0; r <= c.energy; r++) {
        const al = greedy(q, run, c.energy - r, c.blocked, M.expertMu);
        const Fn = F0 + M.fatigueScale * fatigueOf(q, al) + evF - M.fatigueRecover - M.restRecover * r;
        pick = { al: al, r: r };
        if (Fn <= M.expertF) break;
      }
      pick.al.rest = pick.r;
      return pick.al;
    },
    // Calibration: good dashboard, sensible but imperfect play.
    sensible: function (run, c) {
      const q = quest(run.quest);
      const Fe = fatigueEstimate(run, q);
      const r = (Fe !== null && Fe > 0.5) ? 3 : 1;
      const al = BOTS.lagOnly(run, { energy: c.energy - r, blocked: c.blocked, noBurnoutRest: true, pops: 2 });
      al.rest = r;
      return al;
    },
    // Calibration: lag-only dashboard, sensible allocation, blind to fatigue
    // until a burnout card lands.
    lagOnly: function (run, c) {
      const q = quest(run.quest);
      const prod = q.actions.filter(function (a) { return !a.rest && a.e >= M.productiveE && a.id !== c.blocked; })
        .sort(function (x, y) { return y.e - x.e; });
      const pops = q.actions.filter(function (a) { return a.pop; }).slice(0, c.pops || 1);
      const last = run.log[run.log.length - 1];
      const al = {};
      const r = (!c.noBurnoutRest && last && last.burnout) ? 3 : 0;
      let left = c.energy - r - pops.length;
      pops.forEach(function (p) { al[p.id] = 1; });
      al.rest = r;
      // 3/3/2/2 down the effectiveness order; hard sessions (f >= 0.1) get one
      const shares = [3, 3, 2, 2];
      for (let i = 0, guard = 0; left > 0 && guard < 50; i = (i + 1) % prod.length, guard++) {
        const cap = prod[i].f >= 0.1 ? 1 : 99;
        const k = Math.min(left, shares[i] || 1, Math.max(0, cap - (al[prod[i].id] || 0)));
        al[prod[i].id] = (al[prod[i].id] || 0) + k; left -= k;
      }
      if (left > 0) al.rest += left;
      return al;
    },
    // Calibration: vanity-heavy dashboard, chasing its flattering readings.
    vanity: function (run, c) {
      const q = quest(run.quest);
      const pops = q.actions.filter(function (a) { return a.pop; });
      const prod = q.actions.filter(function (a) { return !a.rest && !a.pop && a.id !== c.blocked; })
        .sort(function (x, y) { return y.e - x.e; });
      const al = {};
      let left = c.energy;
      pops.forEach(function (a) { const k = Math.min(left, 3); al[a.id] = k; left -= k; });
      for (let i = 0; left > 0; i = (i + 1) % prod.length) { al[prod[i].id] = (al[prod[i].id] || 0) + 1; left--; }
      return al;
    },
    // Calibration: all tokens on one action every week.
    spam: function (id) {
      return function (run, c) {
        const al = {}; const q = quest(run.quest);
        al[id === c.blocked ? q.actions.find(function (a) { return !a.rest && a.id !== c.blocked; }).id : id] = c.energy;
        return al;
      };
    }
  };
  function dashFor(questId, style) {
    const q = quest(questId);
    const ex = q.expert;
    if (style === 'expert' || style === 'sensible') return { lag: ex.lag, leads: ex.leads.slice(), targets: Object.assign({}, ex.targets) };
    if (style === 'lagOnly') return { lag: ex.lag, leads: [], targets: {} };
    if (style === 'vanity') {
      const v = q.indicators.filter(function (i) { return i.side === 'lead' && (i.kind === 'vanity' || i.kind === 'weak'); }).slice(0, 3);
      const bad = q.indicators.find(function (i) { return i.kind === 'badlag'; });
      const t = {}; v.forEach(function (i) { t[i.id] = i.target.def; });
      return { lag: bad.id, leads: v.map(function (i) { return i.id; }), targets: t };
    }

  function playSeason(seed, questId, dash, policy) {

  }
  function ghosts(seed, questId) {
    return {
      passive: playSeason(seed, questId, dashFor(questId, 'passive'), BOTS.passive),
      expert: playSeason(seed, questId, dashFor(questId, 'expert'), BOTS.expert)
    };
  }

  /* ---- SCORE ---------------------------------------------------------- */
  const SCORE = {
    dashboard: function (questId, dash) {
      const q = quest(questId);
      const S = CONFIG.score;
      const chosen = [dash.lag].concat(dash.leads).filter(Boolean).map(function (id) { return indicator(q, id); });
      if (!chosen.length) return 0;
      let sum = 0, cnt = 0;
      chosen.forEach(function (i) { i.ratings.forEach(function (r) { sum += r; cnt++; }); });
      let score = ((sum / cnt) - 1) / 2 * S.ratingWeight;
      const lag = dash.lag && indicator(q, dash.lag);
      if (lag && lag.kind === 'lag') score += S.validLag;
      const ctrl = chosen.filter(function (i) {
        if (i.side !== 'lead' || i.ratings[1] < 3) return false;
        return feeds(i).some(function (a) { const act = action(q, a); return act && act.e >= 0.9; });
      }).length;
      if (ctrl >= 2) score += S.controllableLeads;
      if (chosen.some(function (i) { return i.kind === 'guardrail'; })) score += S.guardrail;
      score -= S.vanityPenalty * chosen.filter(function (i) { return i.kind === 'vanity'; }).length;
      return Math.round(clamp(score, 0, 100));
    },
    // dashboard used for scoring is the one in place for most of the season
    finalDash: function (run) { return run.dash; },
    summary: function (run) {
      const q = quest(run.quest);
      const S = CONFIG.score;
      let low = 0, all = 0;
      run.log.forEach(function (l) {
        q.actions.forEach(function (a) { if (a.rest) return; const n = l.alloc[a.id] || 0; all += n; if (a.e < M.productiveE) low += n; });
      });
      const dash = run.dash;
      const chosen = [dash.lag].concat(dash.leads).filter(Boolean).map(function (id) { return indicator(q, id); });
      const vanity = chosen.filter(function (i) { return i.kind === 'vanity'; }).length;
      const lag = dash.lag && indicator(q, dash.lag);
      const ctrl = chosen.filter(function (i) {
        return i.side === 'lead' && i.ratings[1] >= 3 && feeds(i).some(function (a) { const act = action(q, a); return act && act.e >= 0.9; });
      }).length;
      const dashQ = SCORE.dashboard(run.quest, dash);
      const C = run.state.C;
      const busyShare = all ? low / all : 0;
      let arch = 'steady';
      if (run.state.burnouts >= S.burnouts) arch = 'burnout';
      else if (vanity >= 2) arch = 'vanity';
      else if (busyShare >= S.busyShare) arch = 'busy';
      else if (dashQ < S.lowDash && C >= S.goodOutcome) arch = 'lucky';
      else if (dashQ >= S.highDash && C >= S.highOutcome) arch = 'reader';
      else if (lag && lag.kind === 'lag' && ctrl < 2) arch = 'rearview';
      return { finalC: C, dashQ: dashQ, vanity: vanity, burnouts: run.state.burnouts, busyShare: busyShare,
        controllable: ctrl, archetype: arch };
    },
    dataLine: function (run, g) {
      const s = SCORE.summary(run);
      return ['DATA', 'quest=' + run.quest, 'seed=' + run.seed, 'dashQ=' + s.dashQ, 'finalC=' + round(s.finalC, 1),
        'passiveC=' + round(g.passive.state.C, 1), 'expertC=' + round(g.expert.state.C, 1), 'archetype=' + s.archetype,
        'vanity=' + s.vanity, 'burnouts=' + s.burnouts, 'lag=' + (run.dash.lag || '-'), 'leads=' + run.dash.leads.join('+'),
        'swaps=' + run.swaps.length].join('|');
    }
  };

  /* ---- colour contrast (WCAG 2.x) ------------------------------------- */
  function luminance(hex) {
    const v = [1, 3, 5].map(function (i) {
      const c = parseInt(hex.substr(i, 2), 16) / 255;
      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  }
  function contrast(a, b) {
    const x = luminance(a), y = luminance(b);
    return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
  }

  /* ==========================================================================
     Self test. The same suite runs in node (tests/signal-tower.mjs) and in
     the browser at ?test=1.
     ======================================================================== */
  function selfTest(opts) {
    opts = opts || {};
    const N = opts.seeds || 50;
    const out = [];
    function t(name, fn) {
      try { const d = fn(); out.push({ name: name, ok: true, detail: d || '' }); }
      catch (e) { out.push({ name: name, ok: false, detail: e.message }); }
    }
    function ok(cond, msg) { if (!cond) throw new Error(msg); return msg; }
    function mean(a) { return a.reduce(function (s, x) { return s + x; }, 0) / a.length; }
    function sd(a) { const m = mean(a); return Math.sqrt(mean(a.map(function (x) { return (x - m) * (x - m); }))); }
    function seeds() { const s = []; for (let i = 0; i < N; i++) s.push('cal' + i); return s; }
    const fixed = function (al) { return function () { return al; }; };

    /* --- content integrity -------------------------------------------- */
    t('content: every quest is complete and internally consistent', function () {
      CONFIG.quests.forEach(function (q) {
        ok(q.actions.length === 6, q.id + ' needs 6 actions');
        ok(q.actions.filter(function (a) { return a.rest; }).length === 1, q.id + ' needs one rest action');
        [q.strongest, q.feedback, q.shiny].forEach(function (id) { ok(action(q, id), q.id + ': unknown action ' + id); });
        ok(typeof q.vision === 'string' && q.vision.length > 10, q.id + ' needs a wider vision');
        q.indicators.forEach(function (ind) {
          feeds(ind).forEach(function (a) { ok(action(q, a), ind.id + ' feeds unknown action ' + a); });
          ok(ind.ratings.length === 4 && ind.ratings.every(function (r) { return r >= 1 && r <= 3; }), ind.id + ' ratings');
          ok(ind.side === 'lag' ? ind.cadence !== 'w' : ind.cadence === 'w', ind.id + ' cadence does not match its side');
          if (ind.side === 'lead') ok(ind.target && ind.target.def >= ind.target.min && ind.target.def <= ind.target.max, ind.id + ' target');
          ok(typeof ind.tells === 'string' && ind.tells.length > 10, ind.id + ' needs a card-flip sentence');
        });
        ['lag', 'badlag', 'vanity', 'guardrail'].forEach(function (k) {
          ok(q.indicators.some(function (i) { return i.kind === k; }), q.id + ' has no ' + k + ' indicator');
        });
        const ex = q.expert;
        ok(indicator(q, ex.lag).side === 'lag', q.id + ' expert lag');
        ex.leads.forEach(function (id) { ok(indicator(q, id).side === 'lead', q.id + ' expert lead ' + id); });
      });
      ok(CONFIG.sortCards.length === 8, 'eight sort cards');
      ok(CONFIG.checkpoints[CONFIG.checkpoints.length - 1] === W, 'the last checkpoint is the last week');
      CONFIG.reviews.forEach(function (w) { ok(CONFIG.checkpoints.indexOf(w) >= 0 && w < W, 'review stop ' + w + ' is not a checkpoint before the end'); });
      ok(CONFIG.reviews.some(function (w) { return w >= CONFIG.mentor.fromWeek; }), 'no review stop where mentor tokens can be spent');
      ok(CONFIG.sortCards.some(function (c) { return c.answer === 'trap' && /streak/i.test(c.text); }), 'the app-streak trap card');
      return CONFIG.quests.length + ' quests';
    });

    /* --- spec 11: acceptance checks ----------------------------------- */
    t('same seed and same allocations produce identical results', function () {
      const al = { rehearse: 3, volunteer: 2, review: 2, watch: 1, rest: 2 };
      const d = dashFor('speaking', 'expert');
      const a = playSeason('twin', 'speaking', d, fixed(al));
      const b = playSeason('twin', 'speaking', d, fixed(al));
      ok(JSON.stringify(a.log) === JSON.stringify(b.log), 'logs differ');
      return 'final C ' + round(a.state.C, 2);
    });
    t('swapping indicators leaves the event sequence unchanged', function () {
      CONFIG.quests.forEach(function (q) {
        const a = playSeason('swap', q.id, dashFor(q.id, 'expert'), BOTS.expert);
        const b = playSeason('swap', q.id, dashFor(q.id, 'vanity'), BOTS.vanity);
        ok(JSON.stringify(a.log.map(function (l) { return l.event; })) === JSON.stringify(b.log.map(function (l) { return l.event; })), q.id + ' events differ');
      });
      return 'events come from the seed alone';
    });
    t('measurement noise does not depend on the dashboard', function () {
      const al = { rehearse: 2, volunteer: 2, review: 2, watch: 2, slides: 1, rest: 1 };
      const a = playSeason('noise', 'speaking', { lag: 'rating', leads: [], targets: {} }, fixed(al));
      const b = playSeason('noise', 'speaking', { lag: 'followers', leads: [], targets: {} }, fixed(al));
      ok(JSON.stringify(a.log.map(function (l) { return l.readings; })) === JSON.stringify(b.log.map(function (l) { return l.readings; })), 'readings differ');
      return 'separate streams';
    });
    t('a replayed save reproduces the season exactly', function () {
      const d = dashFor('network', 'expert');
      const live = newRun('replay', 'network', d);
      const allocs = [];
      for (let w = 1; w <= W; w++) { const al = BOTS.expert(live, weekContext(live)); allocs.push(al); playWeek(live, al); }
      const again = replay(JSON.parse(JSON.stringify({ seed: 'replay', quest: 'network', dash: d, allocs: allocs, reviews: {} })));
      ok(JSON.stringify(again.log) === JSON.stringify(live.log), 'replay drifted');
      return 'final C ' + round(again.state.C, 2);
    });
    t('a vanity indicator can rise while true C is flat', function () {
      const r = playSeason('vain', 'speaking', dashFor('speaking', 'vanity'), fixed({ watch: 4, slides: 4, rest: 2 }));
      // first two lag checkpoints
      const i = CONFIG.checkpoints[0] - 1, j = CONFIG.checkpoints[1] - 1;
      const ca = r.log[i].C, cb = r.log[j].C;
      const fa = r.log[i].readings.followers, fb = r.log[j].readings.followers;
      const h1 = r.log[0].readings.watched, hb = r.log[j].readings.watched;
      ok(cb <= ca + 1, 'C rose from ' + ca + ' to ' + cb);
      ok(fb > fa, 'followers did not rise: ' + fa + ' -> ' + fb);
      ok(hb >= r.dash.targets.watched && h1 >= r.dash.targets.watched, 'hours watched missed its target');
      return 'C ' + round(ca, 1) + ' -> ' + round(cb, 1) + ', followers ' + fa + ' -> ' + fb;
    });
    t('fatigue is invisible without a guardrail indicator', function () {
      CONFIG.quests.forEach(function (q) {
        q.indicators.forEach(function (ind) {
          if (ind.read.F) ok(ind.kind === 'guardrail', ind.id + ' reads fatigue but is not a guardrail');
        });
        const d = { lag: q.expert.lag, leads: q.expert.leads.filter(function (id) { return indicator(q, id).kind !== 'guardrail'; }), targets: {} };
        const run = playSeason('fog', q.id, d, BOTS.passive);
        OBSERVE.view(run).forEach(function (v) {
          Object.keys(v.readings).forEach(function (id) { ok(!indicator(q, id).read.F, id + ' leaked fatigue'); });
          ok(v.F === undefined && v.H === undefined && v.C === undefined, 'hidden state leaked into the view');
        });
      });
      return 'only a chosen guardrail shows F';
    });
    t('the plateau flattens good leads before the next lag checkpoint', function () {
      const leads = { speaking: 'filler', spanish: 'newWords', network: 'meaningful' };
      const bits = [];
      Object.keys(leads).forEach(function (qid) {
        const q = quest(qid), ind = indicator(q, leads[qid]);
        const sign = ind.better === 'down' ? -1 : 1;
        const flat = [], normal = [];
        seeds().forEach(function (sd0) {
          const run = playSeason(sd0, qid, dashFor(qid, 'sensible'), BOTS.sensible);
          const p = run.plateauAt;
          const next = CONFIG.checkpoints.find(function (c) { return c > p; });
          ok(next !== undefined && p < next, 'plateau at ' + p + ' has no later checkpoint');
          // noise-free expected reading: coefficient on C, times tokens when multiplied
          const slope = function (w) {
            const l = run.log[w - 1], prev = run.log[w - 2];
            const k = ind.read.mul ? (l.alloc[ind.read.mul] || 0) : 1;
            return sign * ind.read.C * k * (l.C - prev.C);

          flat.push(slope(p));
          if (p >= 3) normal.push(slope(p - 1));

        const mf = mean(flat), mn = mean(normal);
        ok(mf < 0.6 * mn, qid + ': plateau week moved ' + round(mf, 2) + ' vs ' + round(mn, 2) + ' the week before');
        bits.push(qid + ' ' + round(mf / mn * 100, 0) + '%');
      });
      return 'plateau-week movement as share of the week before: ' + bits.join(', ');
    });

    /* --- spec 10: calibration ----------------------------------------- */

    const calib = {};
    CONFIG.quests.forEach(function (q) {
      calib[q.id] = {};
      Object.keys(bands).forEach(function (p) {
        calib[q.id][p] = seeds().map(function (s) { return playSeason(s, q.id, dashFor(q.id, p), BOTS[p]).state.C; });

      return CONFIG.quests.map(function (q) {
        const e = SCORE.dashboard(q.id, dashFor(q.id, 'expert'));
        const l = SCORE.dashboard(q.id, dashFor(q.id, 'lagOnly'));
        const v = SCORE.dashboard(q.id, dashFor(q.id, 'vanity'));
        ok(e > l && l > v, q.id + ' ' + e + '/' + l + '/' + v);
        ok(e >= CONFIG.score.highDash, q.id + ' expert dashboard ' + e + ' is not "high"');
        return q.id + ' ' + e + '/' + l + '/' + v;
      }).join(', ');
    });
    t('archetypes: expert reads signals, vanity curates, passive burns out', function () {
      const e = SCORE.summary(playSeason('arch', 'speaking', dashFor('speaking', 'expert'), BOTS.expert));
      const v = SCORE.summary(playSeason('arch', 'speaking', dashFor('speaking', 'vanity'), fixed({ rehearse: 2, review: 1, watch: 3, slides: 3, rest: 1 })));
      const p = SCORE.summary(playSeason('arch', 'speaking', dashFor('speaking', 'passive'), BOTS.passive));
      ok(e.archetype === 'reader', 'expert got ' + e.archetype);
      ok(v.archetype === 'vanity', 'vanity got ' + v.archetype);
      ok(p.archetype === 'burnout', 'passive got ' + p.archetype);
      return e.archetype + ' / ' + v.archetype + ' / ' + p.archetype;
    });
    t('the DATA line carries every documented field', function () {
      const run = playSeason('data', 'running', dashFor('running', 'expert'), BOTS.expert);
      const line = SCORE.dataLine(run, ghosts('data', 'running'));
      ['quest=', 'seed=', 'dashQ=', 'finalC=', 'passiveC=', 'expertC=', 'archetype=', 'vanity=', 'burnouts='].forEach(function (k) {
        ok(line.indexOf('|' + k) > 0, 'missing ' + k);
      });
      return line;

      const run = newRun('rev', 'speaking', dashFor('speaking', 'expert'));

    });

      const P = CONFIG.palette;

        return pr[0] + '/' + pr[1] + ' ' + round(c, 1);

    return { results: out, passed: out.filter(function (r) { return r.ok; }).length, failed: out.filter(function (r) { return !r.ok; }).length };

  /* ---- small charts ----------------------------------------------------- */
